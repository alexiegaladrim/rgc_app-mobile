    + draw('base' + site.code + courseIndex + offset) * 0.14
    + draw('slot' + site.code + courseIndex + offset + minutes) * 0.05
    + (isWeekend(offset) ? 0.12 : 0);
  if(factor < 0) factor = 0;
  if(factor > 1) factor = 1;

  var amount = range[0] + (range[1] - range[0]) * factor;
  amount = amount * SLOT_VARIANTS[variant].factor;
  return Math.round(amount);
}

/* Tarif non-licencié : le tarif de référence majoré. Un joueur sans licence
   renseignée le paie, avec la raison affichée sous son nom — la surprise
   tarifaire est la première cause de réclamation au desk (brief, étape 5). */
function visitorPrice(base){ return Math.round(base * VISITOR_UPLIFT); }

/* Prix affiché sur la ligne de créneau à l'étape 4 : celui que paiera le
   titulaire du compte, licence au dossier ou non. */
function slotPrice(site, courseIndex, offset, minutes, variant){
  var base = slotBasePrice(site, courseIndex, offset, minutes, variant);
  return hasLicence() ? base : visitorPrice(base);
}

function slotKey(offset, minutes){ return offset + '-' + minutes; }

/* Une plage de la feuille : matin ou après-midi. */
function slotsOfBlock(site, courseIndex, offset, block){
  var out = [];
  for(var t = block.from; t < block.to; t += TEE_STEP){
    var variant = slotVariant(site, courseIndex, offset, t);
    out.push({
      key:slotKey(offset, t),
      minutes:t,
      time:hhmm(t),
      seats:slotSeats(site, courseIndex, offset, t),
      variant:variant,
      badge:SLOT_VARIANTS[variant].badge,
      price:slotPrice(site, courseIndex, offset, t, variant)
    });
  }
  return out;
}

/* --- Lecture du brouillon ------------------------------------------------ */

function draftSite(){
  var code = STATE.draft.siteCode;
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) return SITES[i]; }
  return null;
}
function draftCourse(){
  var site = draftSite();
  if(!site || STATE.draft.courseIndex === null) return null;
  return site.courses[STATE.draft.courseIndex] || null;
}

/* Sites de l'étape 1 : le rattachement épinglé en tête, le reste par distance
   croissante. */
function sitesByProximity(){
  var home = currentSite();
  var rest = [];
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code !== home.code) rest.push(SITES[i]); }
  rest.sort(function(a, b){ return siteDistance(a) - siteDistance(b); });
  return [home].concat(rest);
}


/* =========================================================================
   2c. Joueurs, tarifs, options et paiement — lot 2, étapes 5 à 8
       Une seule chaîne de calcul : le créneau donne un tarif de référence,
       chaque joueur en dérive le sien avec sa raison, les options s'ajoutent,
       le paiement ne porte que sur le reste. Aucun écran ne recalcule un
       montant pour son propre compte.
   ========================================================================= */

/* Le créneau retenu, relu depuis le brouillon. Toutes les étapes suivantes
   partent d'ici : le prix ne se recopie pas d'un écran à l'autre. */
function draftSlot(){
  var d = STATE.draft;
  var site = draftSite();
  if(!site || d.courseIndex === null || !d.slotKey) return null;
  var parts = d.slotKey.split('-');
  var offset = parseInt(parts[0], 10);
  var minutes = parseInt(parts[1], 10);
  var variant = slotVariant(site, d.courseIndex, offset, minutes);
  return {
    site:site,
    course:site.courses[d.courseIndex],
    offset:offset,
    minutes:minutes,
    time:hhmm(minutes),
    variant:variant,
    badge:SLOT_VARIANTS[variant].badge,
    seats:slotSeats(site, d.courseIndex, offset, minutes),
    base:slotBasePrice(site, d.courseIndex, offset, minutes, variant)
  };
}

/* --- Les joueurs ---------------------------------------------------------- */

/* Le titulaire est toujours joueur 1 et n'est pas supprimable. Il est posé à
   l'entrée de l'étape 5, jamais avant : le brouillon d'un tunnel abandonné à
   l'étape 2 ne doit pas porter de joueur. */
function ensurePlayers(){
  var d = STATE.draft;
  if(d.players.length) return d.players;
  var p = profile();
  d.players = [{
    id:'holder',
    kind:'holder',
    firstName:p.firstName,
    lastName:p.lastName,
    licence:hasLicence()
  }];
  /* Lot 9e, « Réserver un départ avec » : le proche choisi au profil est
     placé d'office, s'il est encore dans la liste et que le départ a la place. */
  var rel = d.withId ? relativeById(d.withId) : null;
  if(rel && !relativeTaken(rel.id) && partyMax() > 1){
    d.players.push(playerFrom(rel, rel.id, 'relative'));
  }
  /* Lot 11 (booking engine v3) : autant de places que de joueurs cherchés à
     l'étape Départ. Les places vides sont des « Joueur N », invités sans
     compte au prix public, qu'on rattache ensuite. */
  if(isGroup()){
    var caps = flightCaps(), f = 0, inF = 1;
    d.players[0].f = 0;
    for(var k=1;k<d.players.length;k++){ d.players[k].f = 0; inF += 1; }
    while(d.players.length < d.party && f < caps.length){
      if(inF >= caps[f]){ f += 1; inF = 0; continue; }
      var sl = newSlot();
      sl.f = f;
      d.players.push(sl);
      inF += 1;
    }
    return d.players;
  }
  while(d.players.length < Math.min(d.party, partyMax())) d.players.push(newSlot());
  return d.players;
}

/* Une place vide du départ : « Joueur N », invité·e sans compte, prix
   public. Elle se rattache à un proche, une licence ou un nom. */
function newSlot(){
  STATE.draft.slotSeq = (STATE.draft.slotSeq || 0) + 1;
  return { id:'slot-' + STATE.draft.slotSeq, kind:'guest', slot:true,
           firstName:'Joueur', lastName:String(STATE.draft.players.length + 1),
           incomplete:true, licence:false,
           member:false, invited:false, payer:'self' };
}
function addSlot(){
  var d = STATE.draft;
  if(partyFull()) return false;
  var sl = newSlot();
  if(isGroup()){
    /* Premier départ qui a encore une place. */
    for(var f=0;f<d.flights.length;f++){
      var n = 0;
      for(var i=0;i<d.players.length;i++){ if((d.players[i].f || 0) === f) n += 1; }
      if(n < Math.min(PARTY_MAX, flightSlot(d.flights[f]).seats)){ sl.f = f; break; }
    }
  }
  d.players.push(sl);
  trimOptions();
  refresh();
  return true;
}
function slotLabel(p, index){ return playerName(p); }
/* Les places vides se renumérotent quand un joueur est retiré. */
function renumberSlots(){
  var list = STATE.draft.players;
  for(var i=0;i<list.length;i++){ if(list[i].slot) list[i].lastName = String(i + 1); }
}

/* Places disponibles sur ce départ : jamais plus de quatre, jamais plus que
   ce que la feuille de départs annonce encore. */
function partyMax(){
  if(isGroup()){ var c = flightCaps(), n = 0; for(var i=0;i<c.length;i++) n += Math.min(PARTY_MAX, flightSlot(STATE.draft.flights[i]).seats); return n; }
  var slot = draftSlot();
  if(!slot) return PARTY_MAX;
  return Math.min(PARTY_MAX, slot.seats);
}
function partyFull(){ return STATE.draft.players.length >= partyMax(); }

/* Les proches viennent du compte, que le profil du lot 6 édite. Le tunnel les
   consomme sans savoir d'où ils sortent — c'est ce que le brief demande quand
   il écrit que les proches sont « réutilisés dans le tunnel de réservation ». */
function relativesOf(){ return STATE.account.relatives; }
function relativeAdded(id){
  var list = STATE.draft.players;
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return true; }
  return false;
}
/* Lot 9e : le proche dont on rejoint le départ y est déjà, de son côté. */
function relativeTaken(id){
  var joined = joinedRelative();
  return relativeAdded(id) || !!(joined && joined.id === id);
}
function relativesLeft(){
  var list = relativesOf();
  var n = 0;
  for(var i=0;i<list.length;i++){ if(!relativeTaken(list[i].id)) n += 1; }
  return n;
}
function playerName(p){
  return (p.firstName + ' ' + p.lastName).replace(/^\s+|\s+$/g, '');
}
function initials(p){
  return (p.firstName.charAt(0) + p.lastName.charAt(0)).toUpperCase();
}

/* --- Invitations ---------------------------------------------------------- */

/* Quota annuel du membre Passion. Le solde d'ouverture vient du jeu de
   données ; les invités du brouillon en cours s'y ajoutent, de sorte que le
   décompte affiché à l'étape 5 est celui qui restera après la réservation. */
function inviteQuota(){
  var inv = profile().invitations;
  if(!inv) return null;
  return { total:inv.total, usedBefore:inv.used };
}
function invitesLeftBefore(){
  var q = inviteQuota();
  return q ? Math.max(0, q.total - q.usedBefore) : 0;
}

/* --- Tarif d'un joueur ---------------------------------------------------- */

/* Une seule fonction produit toutes les lignes joueurs, dans l'ordre, parce
   que le tarif d'un invité dépend de ce qui a été consommé avant lui. Chaque
   ligne porte son montant, sa raison, et le cas échéant la mention du
   changement de tarif : le brief exige que la raison soit affichée. */
function playerLines(){
  var slot = draftSlot();
  var d = STATE.draft;
  var lines = [];
  if(!slot) return lines;

  var covered = passCoversSite(slot.site);
  var left = invitesLeftBefore();

  for(var i=0;i<d.players.length;i++){
    var p = d.players[i];
    var ps = playerSlot(p) || slot;
    var applicable = p.licence ? ps.base : visitorPrice(ps.base);
    var why = p.licence ? 'Tarif licencié' : 'Non-licencié, tarif visiteur';
    var price = applicable;
    var warn = null;
    var invited = false;

    if(p.kind === 'holder'){
      if(isPassion() && covered){
        price = 0;
        why = 'Inclus dans votre abonnement';
      } else if(isPassion()){
        why = 'Hors périmètre de votre abonnement';
      }
    } else if(isPassion()){
      /* Le quota reste une borne, même quand l'invitation a été demandée : il
         ne peut pas y en avoir plus que ce que la cotisation en ouvre. Et un
         joueur qui n'a pas d'invitation faute de quota doit lire pourquoi —
         sans invitation par choix, il n'y a rien à expliquer. */
      if(p.invited && left > 0){
        left -= 1;
        invited = true;
        var off = p.licence ? INVITE_OFF.licence : INVITE_OFF.visitor;
        price = Math.round(applicable * (1 - off));
        why = 'Invitation membre -' + Math.round(off * 100) + ' %'
            + (p.licence ? '' : ', tarif non-licencié');
      } else if(left === 0){
        warn = 'Vos invitations sont utilisées, ce joueur est au tarif normal.';
      }
    }
    /* Lot 9e : un invité sans nom complet se présente à l'accueil. */
    if(!warn && p.incomplete){
      warn = 'Se présente à l\'accueil avant de partir.';
    }

    lines.push({
      player:p,
      index:i,
      price:price,
      why:why,
      warn:warn,
      invited:invited,
      /* Qui règle cette place. Une place réglée par le joueur lui-même sort du
         total du titulaire : c'est le sens de la distinction. */
      /* Lot 10, arbitrage d'Alexie du 21/10 (point du 20/10) : on ne paie pas
         pour un autre joueur dans l'app. Chacun règle sa part, par lien de
         paiement ou à l'accueil ; le titulaire ne porte que la sienne. */
      byHolder:(p.kind === 'holder')
    });
  }
  return lines;
}

/* Ce que le titulaire règle, et ce que les autres règlent de leur côté. */
function holderLines(){
  var all = playerLines();
  var out = [];
  for(var i=0;i<all.length;i++){ if(all[i].byHolder) out.push(all[i]); }
  return out;
}
function selfPaidLines(){
  var all = playerLines();
  var out = [];
  for(var i=0;i<all.length;i++){ if(!all[i].byHolder) out.push(all[i]); }
  return out;
}

/* Un joueur qui règle sa place le fait depuis l'application s'il a un compte
   au club, à l'accueil sinon. C'est ce que la ligne doit dire, sans jargon. */
/* Lot 10 (point du 20/10) : un joueur qui règle sa part le fait par le lien
   de paiement, qu'il ait un compte ou non — la page est publique. */
function payerText(line){
  if(line.byHolder) return null;
  return line.player.payer === 'desk'
    ? 'Règlera sa part à l\'accueil du golf'
    : 'Règlera sa part par lien de paiement';
}
/* Les parts réglées par lien : ce sont elles que l'empreinte garantit. Une
   part réglée à l'accueil se paie à l'arrivée du joueur. HYPOTHÈSE : elle
   n'est pas débitée sur la carte du titulaire. */
function linkPaidLines(){
  var out = [];
  var all = selfPaidLines();
  for(var i=0;i<all.length;i++){ if(all[i].player.payer !== 'desk') out.push(all[i]); }
  return out;
}
function anyLinkPaid(){ return linkPaidLines().length > 0; }

/* L'empreinte bancaire, dite en clair (point du 20/10) : la réservation est
   validée dès votre paiement ; ce que les autres n'ont pas réglé la veille à
   20 h est débité sur votre carte. */
function guaranteeText(){
  return 'Vous réglez votre part maintenant. Vos partenaires reçoivent un lien de '
       + 'paiement&nbsp;; ce qui n\'est pas réglé la veille à 20 h est débité sur '
       + 'votre carte, enregistrée en garantie.';
}

/* Une invitation ne peut être proposée que si la cotisation en ouvre encore.
   Le joueur en cours de réglage garde la sienne : sans quoi ouvrir sa feuille
   la lui retirerait. */
function inviteAvailableFor(index){
  if(!isPassion()) return false;
  var d = STATE.draft;
  var used = 0;
  for(var i=0;i<d.players.length;i++){
    if(i !== index && d.players[i].invited) used += 1;
  }
  return used < invitesLeftBefore();
}

function invitesUsedInDraft(){
  var lines = playerLines();
  var n = 0;
  for(var i=0;i<lines.length;i++){ if(lines[i].invited) n += 1; }
  return n;
}
function anySelfPaid(){ return selfPaidLines().length > 0; }
function invitesLeftAfter(){
  return Math.max(0, invitesLeftBefore() - invitesUsedInDraft());
}

/* --- Options -------------------------------------------------------------- */

/* Une option incluse dans l'abonnement s'affiche à zéro, avec sa mention.
   Le périmètre compte : hors de sa région, le membre Passion paie tout. */
function optionIncluded(opt){
  var slot = draftSlot();
  if(!opt.includedForPass) return false;
  return isPassion() && !!slot && passCoversSite(slot.site);
}
function optionQty(id){ return STATE.draft.options[id] || 0; }
/* Une par joueur, sauf l'option qui porte son propre plafond (le seau). */
function optionMax(opt){
  if(opt && opt.max) return opt.max;
  return Math.max(1, STATE.draft.players.length);
}
/* Unités offertes : une voiturette par abonné, pour le titulaire. */
function optionIncludedUnits(opt){ return optionIncluded(opt) ? 1 : 0; }
/* Unités prises sur un carnet : le seau, tant que le carnet de seaux en a.
   Le carnet qui expire en premier est entamé d'abord (point du 19/10). */
function optionPotUnits(opt, qty){
  if(!opt.fromPot) return 0;
  var left = potValue(opt.fromPot) || 0;
  return Math.min(qty, Math.max(0, left));
}

function optionLines(){
  var out = [];
  for(var i=0;i<GF_OPTIONS.length;i++){
    var o = GF_OPTIONS[i];
    var qty = optionQty(o.id);
    if(!qty) continue;
    var incl = Math.min(qty, optionIncludedUnits(o));
    var pot = optionPotUnits(o, qty - incl);
    var paid = qty - incl - pot;
    out.push({ option:o, qty:qty, included:incl, fromPot:pot,
               unit:o.price, ref:o.price * qty, price:o.price * paid });
  }
  return out;
}

/* --- Totaux --------------------------------------------------------------- */

/* Le total est toujours la somme des lignes joueurs et des lignes options.
   C'est un critère d'acceptation du brief : aucun écran n'a le droit de
   composer son propre total. */
function playersTotal(){
  var lines = holderLines();
  var sum = 0;
  for(var i=0;i<lines.length;i++) sum += lines[i].price;
  return sum;
}

/* Ce que les autres joueurs règlent de leur côté. Informatif : il n'entre
   jamais dans le total du titulaire, mais le taire donnerait à croire que
   leur place est gratuite. */
function othersTotal(){
  var lines = selfPaidLines();
  var sum = 0;
  for(var i=0;i<lines.length;i++) sum += lines[i].price;
  return sum;
}
function optionsTotal(){
  var lines = optionLines();
  var sum = 0;
  for(var i=0;i<lines.length;i++) sum += lines[i].price;
  return sum;
}
function grandTotal(){ return playersTotal() + optionsTotal(); }

/* L'étape 7 n'existe que s'il reste quelque chose à payer. */
function paymentNeeded(){ return grandTotal() > 0; }

/* --- Crédits green-fee et modes de paiement ------------------------------- */

/* Le membre Passion n'a pas de compteur green-fee : son accès est illimité,
   il n'a donc pas de crédit à débiter. Le licencié externe en a un, dont le
   solde est pilotable depuis la barre de contrôle. */
function gfCreditBalance(){
  if(isPassion()) return 0;
  var v = GF_CREDIT_DEMO[STATE.demoCredits];
  return typeof v === 'number' ? v : GF_CREDIT_DEMO.full;
}

/* Un crédit couvre une place, quel que soit son tarif. Les places gratuites
   n'en consomment pas ; les options ne sont jamais couvertes par un crédit
   green-fee — c'est un crédit de départ, pas un moyen de paiement général.
   Les places les plus chères sont couvertes d'abord : à nombre de crédits
   égal, c'est ce qui laisse le moins à payer. */
function creditPlan(){
  var balance = gfCreditBalance();
  var lines = holderLines();
  var payable = [];
  for(var i=0;i<lines.length;i++){ if(lines[i].price > 0) payable.push(lines[i].price); }
  payable.sort(function(a, b){ return b - a; });

  var use = Math.min(balance, payable.length);
  var covered = 0;
  for(var j=0;j<use;j++) covered += payable[j];

  return {
    balance:balance,
    use:use,
    covered:covered,
    cash:Math.max(0, grandTotal() - covered),
    mixed:(use > 0 && grandTotal() - covered > 0)
  };
}

/* Les deux options empilées de l'étape 7. Aucune n'est présélectionnée : le
   choix doit être explicite (brief). Quand le solde ne couvre pas tout le
   monde, l'option de crédit ne disparaît pas — elle devient le paiement
   mixte, qui est le cas le plus fréquent. */
function paymentChoices(){
  var plan = creditPlan();
  var out = [];
  if(plan.balance > 0 && plan.use > 0){
    out.push({
      id:'credits',
      icon:'ticket',
      title:plan.mixed
        ? 'Utiliser ' + creditsLabel(plan.use) + ' et payer ' + amount(plan.cash) + ' par carte'
        : 'Utiliser ' + creditsLabel(plan.use),
      balanceFrom:plan.balance,
      balanceTo:plan.balance - plan.use,
      cash:plan.cash,
      mixed:plan.mixed
    });
  }
  /* Retour du 22/10 : l'e-wallet règle aussi un départ. Lot 12 : pas
     quand il est bloqué. */
  var w = profile().wallet || 0;
  if(w > 0 && !ewalletBlocked('golf')){
    out.push({
      id:'wallet', icon:'wallet',
      title:'Payer ' + amount(grandTotal()) + ' avec votre e-wallet golf',
      balanceFrom:null, balanceTo:null,
      walletFrom:w, walletTo:w - grandTotal(), disabled:w < grandTotal(),
      cash:grandTotal(), mixed:false
    });
  }
  var gc = giftChoice(grandTotal());
  if(gc){ gc.mixed = false; gc.balanceFrom = null; gc.balanceTo = null; out.push(gc); }
  out.push({
    id:'card',
    icon:'credit-card',
    title:'Payer ' + amount(grandTotal()) + ' par carte',
    balanceFrom:null,
    balanceTo:null,
    cash:grandTotal(),
    mixed:false
  });
  /* Lot 10, point du 19/10 : Apple Pay, à valider côté faisabilité. */
  out.push({
    id:'applepay',
    icon:'brand-apple',
    title:'Payer ' + amount(grandTotal()) + ' avec Apple Pay',
    balanceFrom:null,
    balanceTo:null,
    cash:grandTotal(),
    mixed:false
  });
  return out;
}
function creditsLabel(n){
  return n + (n > 1 ? ' crédits green-fee' : ' crédit green-fee');
}
function chosenPayment(){
  var list = paymentChoices();
  for(var i=0;i<list.length;i++){ if(list[i].id === STATE.draft.payment) return list[i]; }
  return null;
}

/* --- Numéro de réservation ------------------------------------------------ */

/* Tiré du même PRNG que le reste : même départ, même numéro d'une exécution à
   l'autre. Il est figé au brouillon à la confirmation, pour qu'un ajout de
   joueur imaginaire ne puisse pas le faire changer sous les yeux du joueur. */
function makeReference(){
  var slot = draftSlot();
  if(!slot) return null;
  var n = Math.floor(draw('ref' + slot.site.code + STATE.draft.courseIndex
                          + STATE.draft.slotKey) * 90000) + 10000;
  return slot.site.code + '-' + n;
}

/* Politique d'annulation — décision 5 du brief : gratuite jusqu'à J-1 18 h,
   remboursement toujours en crédit. La date est celle de la veille du
   départ. */
function cancelDeadline(){
  var d = STATE.draft;
  if(d.dayOffset === null) return null;
  if(d.dayOffset <= 0) return { sameDay:true, label:null };
  return { sameDay:false, label:longDate(d.dayOffset - 1) };
}

/* =========================================================================
   2d. Cours — équipe d'enseignement, planning, séances collectives, tarifs
       Lot 3. Même principe qu'au §2b : tout ce qui varie est tiré du PRNG,
       indexé par ce qu'il décrit, donc reproductible d'une exécution à
       l'autre. Le catalogue produits donne la durée et le tarif ; le
       planning ne dit que la disponibilité.
   ========================================================================= */

/* --- Équipe d'enseignement d'un site -------------------------------------- */

/* Le brief ne rattache aucun pro à un golf. Le prototype tire une équipe
   stable par site dans le vivier : même site, même équipe d'une exécution à
   l'autre, et changer de site de rattachement change l'équipe. HYPOTHÈSE, à
   remplacer par le référentiel client. */
function prosOfSite(site){
  var pool = PROS.slice();
  var out = [];
  var n = Math.min(PROS_PER_SITE, pool.length);
  for(var i=0;i<n;i++){
    var pick = Math.floor(draw('team' + site.code + i) * pool.length) % pool.length;
    out.push(pool.splice(pick, 1)[0]);
  }
  return out;
}
function proById(id){
  for(var i=0;i<PROS.length;i++){ if(PROS[i].id === id) return PROS[i]; }
  return null;
}
function durationById(id){
  for(var i=0;i<LESSON_DURATIONS.length;i++){
    if(LESSON_DURATIONS[i].id === id) return LESSON_DURATIONS[i];
  }
  return LESSON_DURATIONS[LESSON_DURATIONS.length - 1];
}
function proName(pro){ return pro.firstName + ' ' + pro.lastName; }

/* Le tarif vient du catalogue produits, jamais du planning — brief lot 3. */
function proRate(pro, durationId){ return pro.prices[durationId]; }
function proFromRate(pro){
  var low = pro.prices[LESSON_DURATIONS[0].id];
  for(var i=1;i<LESSON_DURATIONS.length;i++){
    var p = pro.prices[LESSON_DURATIONS[i].id];
    if(p < low) low = p;
  }
  return low;
}

/* --- Durées lisibles ------------------------------------------------------ */

/* « 30 min », « 1 h », « 1 h 30 ». Le carnet de cours se compte en heures, le
   planning en minutes : un seul libellé pour les deux évite qu'un même solde
   s'écrive de deux façons à deux écrans d'écart. */
function minutesLabel(total){
  var h = Math.floor(total / 60);
  var m = total % 60;
  if(h === 0) return m + ' min';
  if(m === 0) return h + ' h';
  return h + ' h ' + pad2(m);
}
function hoursLabel(hours){ return minutesLabel(Math.round(hours * 60)); }

/* --- Planning d'un pro ---------------------------------------------------- */

/* Un jour de repos par semaine, propre à chaque pro et jamais le week-end :
   c'est là que les joueurs prennent leurs cours. */
function proRestDay(pro){ return 1 + Math.floor(draw('rest' + pro.id) * 5); }

function proWorksOn(pro, offset){
  if(offset < 0 || offset > BOOK_HORIZON) return false;
  return dateAt(offset).getDay() !== proRestDay(pro);
}

/* Une unité de planning d'une demi-heure, libre ou déjà prise. */
function proUnitFree(pro, offset, minutes){
  return draw('unit' + pro.id + offset + minutes) > 0.42;
}

/* Les créneaux réellement réservables pour la durée demandée : une heure
   demande deux unités contiguës, à l'intérieur d'une même plage. */
function proSlots(pro, offset, durationId){
  var out = [];
  if(!pro || !proWorksOn(pro, offset)) return out;
  var dur = durationById(durationId);
  var units = Math.round(dur.minutes / LESSON_UNIT);
  for(var b=0;b<LESSON_BLOCKS.length;b++){
    var block = LESSON_BLOCKS[b];
    for(var t=block.from; t + dur.minutes <= block.to; t += LESSON_UNIT){
      var free = true;
      for(var u=0;u<units;u++){
        if(!proUnitFree(pro, offset, t + u * LESSON_UNIT)){ free = false; break; }
      }
      if(!free) continue;
      out.push({ key:slotKey(offset, t), minutes:t, time:hhmm(t), block:block.id });
    }
  }
  return out;
}
function proDayHasSlots(pro, offset, durationId){
  return proSlots(pro, offset, durationId).length > 0;
}

/* Premier jour ouvrable du pro pour cette durée : le planning s'ouvre déjà
   sur une journée qui a quelque chose à montrer. */
function firstProDay(pro, durationId){
  for(var i=0;i<=BOOK_HORIZON;i++){
    if(proDayHasSlots(pro, i, durationId)) return i;
  }
  return null;
}

/* --- Séances collectives -------------------------------------------------- */

/* Une séance par thème et par jour au plus, sur des horaires ronds : un cours
   collectif s'annonce à l'avance, il ne se pose pas au fil du planning.
   Les places restantes sont la seule information de remplissage produite ici
   — la règle RGPD retenue interdit les noms des inscrits, le référentiel du
   prototype ne les porte donc pas. */
function groupSessionsOf(site, offset){
  var out = [];
  if(offset < 0 || offset > BOOK_HORIZON) return out;
  var team = prosOfSite(site);
  for(var i=0;i<GROUP_THEMES.length;i++){
    var th = GROUP_THEMES[i];
    var tag = site.code + offset + th.id;
    if(draw('grp' + tag) > 0.42) continue;
    var start = GROUP_STARTS[Math.floor(draw('gst' + tag) * GROUP_STARTS.length)];
    var pro = team[Math.floor(draw('gpr' + tag) * team.length)];
    var r = draw('gse' + tag);
    out.push({
      id:th.id,
      theme:th,
      pro:pro,
      minutes:start,
      time:hhmm(start),
      seats:(r < 0.20 ? 0 : 1 + Math.floor(r * 4)),
      price:th.price
    });
  }
  out.sort(function(a, b){ return a.minutes - b.minutes; });
  return out;
}
function dayHasGroup(site, offset){ return groupSessionsOf(site, offset).length > 0; }
function firstGroupDay(site){
  for(var i=0;i<=BOOK_HORIZON;i++){ if(dayHasGroup(site, i)) return i; }
  return null;
}
function groupSessionById(site, offset, id){
  var list = groupSessionsOf(site, offset);
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}

/* Places restantes, jamais les noms : c'est la règle RGPD retenue au brief
   lot 3, et elle tient dans ce seul libellé. */
function groupSeatsLabel(seats){
  if(seats === 0) return 'Complet';
  return seats + (seats > 1 ? ' places restantes' : ' place restante');
}

/* --- Filtres de la liste du jour ------------------------------------------ */

function filteredSessions(site, offset){
  var l = STATE.lesson;
  var all = groupSessionsOf(site, offset);
  var out = [];
  for(var i=0;i<all.length;i++){
    var s = all[i];
    if(l.filterPro !== 'all' && s.pro.id !== l.filterPro) continue;
    if(l.filterTheme !== 'all' && s.theme.id !== l.filterTheme) continue;
    if(l.filterWhen === 'am' && s.minutes >= 13 * 60) continue;
    if(l.filterWhen === 'pm' && s.minutes < 13 * 60) continue;
    out.push(s);
  }
  return out;
}
function anyFilterOn(){
  var l = STATE.lesson;
  return l.filterPro !== 'all' || l.filterTheme !== 'all' || l.filterWhen !== 'all';
}

/* --- La séance retenue ---------------------------------------------------- */

/* Les deux entrées se rejoignent ici : le paiement, la confirmation et le
   récapitulatif ne connaissent qu'un seul objet, quelle que soit la porte par
   laquelle le joueur est passé. */
function pickedLesson(){
  var l = STATE.lesson;
  var site = currentSite();

  if(l.mode === 'solo'){
    if(!l.proId || l.dayOffset === null || !l.slotKey) return null;
    var pro = proById(l.proId);
    var dur = durationById(l.durationId);
    if(!pro) return null;
    return {
      kind:'solo',
      title:'Cours particulier',
      pro:pro,
      site:site,
      theme:null,
      offset:l.dayOffset,
      minutes:parseInt(l.slotKey.split('-')[1], 10),
      duration:dur.minutes,
      price:proRate(pro, dur.id),
      seats:null
    };
  }

  if(l.mode === 'group'){
    if(l.dayOffset === null || !l.sessionId) return null;
    var s = groupSessionById(site, l.dayOffset, l.sessionId);
    if(!s) return null;
    return {
      kind:'group',
      title:s.theme.label,
      pro:s.pro,
      site:site,
      theme:s.theme,
      offset:l.dayOffset,
      minutes:s.minutes,
      duration:s.theme.minutes,
      price:s.price,
      seats:s.seats
    };
  }
  return null;
}

function lessonTotal(){
  var picked = pickedLesson();
  return picked ? picked.price : 0;
}

/* Le lieu se déduit du contenu de la séance, pas d'une saisie : un parcours
   accompagné ne se donne pas au practice. Les baies Trackman du brief §1 sont
   nommées là où elles existent. */
function lessonPlace(site, theme){
  if(theme && theme.onCourse) return 'Départ du 1, ' + site.name;
  return (site.trackman ? 'Baies Trackman, ' : 'Practice, ') + site.name;
}

/* --- Carnet de cours et modes de règlement -------------------------------- */

/* Solde du carnet, en heures. « Du profil » reprend le jeu de données du
   brief §6 ; les deux autres positions de la barre de contrôle servent à
   montrer le carnet insuffisant et le carnet vide. */
function lessonCreditBalance(){
  var v = LESSON_CREDIT_DEMO[STATE.demoLessons];
  if(v === null || v === undefined) return profile().credits.lessons.value;
  return v;
}

/* Une séance ne se coupe pas en deux : le carnet la couvre entièrement, ou
   il ne la couvre pas. HYPOTHÈSE — le brief prévoit le paiement mixte pour
   un départ à plusieurs joueurs, ce qui n'a pas d'équivalent ici : il n'y a
   qu'une place, et une demi-séance ne se réserve pas. À faire trancher. */
function lessonCreditPlan(){
  var picked = pickedLesson();
  var balance = lessonCreditBalance();
  var need = picked ? picked.duration / 60 : 0;
  return {
    balance:balance,
    need:need,
    covers:(need > 0 && balance >= need),
    after:balance - need
  };
}

function lessonPaymentChoices(){
  var plan = lessonCreditPlan();
  var out = [];
  if(plan.covers){
    out.push({
      id:'credits',
      title:'Utiliser ' + hoursLabel(plan.need) + ' de votre carnet',
      balanceFrom:plan.balance,
      balanceTo:plan.after,
      cash:0
    });
  }
  /* Retour du 22/10 : l'e-wallet règle aussi un cours. */
  var w = profile().wallet || 0;
  var gcl = giftChoice(lessonTotal());
  if(gcl){ gcl.balanceFrom = null; gcl.balanceTo = null; }
  if(w > 0 && !ewalletBlocked('golf')){
    out.push({
      id:'wallet',
      title:'Payer ' + amount(lessonTotal()) + ' avec votre e-wallet golf',
      balanceFrom:null, balanceTo:null,
      walletFrom:w, walletTo:w - lessonTotal(),
      disabled:w < lessonTotal(),
      cash:lessonTotal()
    });
  }
  if(gcl) out.push(gcl);
  out.push({
    id:'card',
    title:'Payer ' + amount(lessonTotal()) + ' par carte',
    balanceFrom:null,
    balanceTo:null,
    cash:lessonTotal()
  });
  out.push({ id:'applepay', title:'Payer ' + amount(lessonTotal()) + ' avec Apple Pay',
             balanceFrom:null, balanceTo:null, cash:lessonTotal() });
  return out;
}
function chosenLessonPayment(){
  var list = lessonPaymentChoices();
  for(var i=0;i<list.length;i++){
    if(list[i].id === STATE.lesson.payment) return list[i];
  }
  return null;
}
function lessonPaymentSummary(){
  var choice = chosenLessonPayment();
  if(!choice) return null;
  if(choice.id === 'card') return amount(choice.cash) + ' par carte';
  if(choice.id === 'wallet') return amount(choice.cash) + ' avec votre e-wallet golf';
  if(choice.id === 'gift') return amount(choice.cash) + ' avec votre carte cadeau';
  if(choice.id === 'applepay') return amount(choice.cash) + ' avec Apple Pay';
  return hoursLabel(lessonCreditPlan().need) + ' de votre carnet de cours';
}

/* --- Numéro de réservation et délai d'annulation -------------------------- */

function makeLessonReference(){
  var picked = pickedLesson();
  if(!picked) return null;
  var n = Math.floor(draw('lref' + picked.site.code + picked.kind
                          + picked.offset + picked.minutes) * 90000) + 10000;
  return picked.site.code + '-C' + n;
}

/* Décision 5 du brief : gratuite jusqu'à J-1 18 h, puis retenue, et le
   remboursement se fait toujours en crédit. Une séance du jour même est donc
   déjà hors délai. */
function lessonCancelWindow(offset){
  if(offset === null || offset === undefined) return null;
  if(offset <= 0) return { free:false, label:null };
  return { free:true, label:longDate(offset - 1) };
}

/* --- Vos cours : réservations de démonstration ---------------------------- */

/* Contenu de démonstration, comme la carte de départ de l'accueil : le
   prototype ne conserve pas les réservations qu'il produit. Le réglage
   « Prochain départ » de la barre de contrôle pilote aussi cette liste, pour
   que l'état vide et la séance hors délai soient démontrables à la demande. */
function lessonBookings(){
  if(STATE.demoBooking === 'none') return [];
  var site = currentSite();
  var team = prosOfSite(site);
  var soon = (STATE.demoBooking === 'soon');
  var theme = GROUP_THEMES[0];
  return [
    { id:'l1',
      kind:'solo',
      title:'Cours particulier',
      pro:team[0],
      site:site,
      theme:null,
      offset:soon ? 0 : 3,
      minutes:soon ? 16 * 60 : 10 * 60,
      duration:60,
      price:proRate(team[0], 'm60'),
      paidWith:'credits',
      debrief:null },
    { id:'l2',
      kind:'group',
      title:theme.label,
      pro:team[1],
      site:site,
      theme:theme,
      offset:-4,
      minutes:11 * 60,
      duration:theme.minutes,
      price:theme.price,
      paidWith:'card',
      debrief:LESSON_DEBRIEF }
  ];
}
function lessonBookingById(id){
  var list = lessonBookings();
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}
function lessonIsPast(booking){ return booking.offset < 0; }
function lessonIsCancelled(booking){ return !!STATE.lesson.cancelled[booking.id]; }

/* Ce que devient le montant après une annulation. Le remboursement est
   toujours en crédit, jamais en carte — décision 5 du brief. */
function lessonRefundText(booking){
  var window_ = lessonCancelWindow(booking.offset);
  if(window_ && !window_.free){
    return 'Le délai est passé : cette séance reste due, elle ne vous est pas rendue.';
  }
  if(booking.paidWith === 'credits'){
    return minutesLabel(booking.duration) + ' vous est rendu sur votre carnet de cours.';
  }
  return 'Le montant vous est rendu en crédit de cours, jamais sur votre carte.';
}


/* =========================================================================
   2e. Portefeuille — soldes, historique, carnets — lot 4

       Une seule source pour les soldes. Le portefeuille est l'écran de
       référence : la bande de l'accueil, les alertes et l'étape de paiement
       du green-fee lisent tous potValue(), et ne peuvent donc plus se
       contredire quand la barre de contrôle change un solde.

       Le solde est global au groupe (décision 4 du brief) : aucune fonction
       de ce bloc ne prend un site en paramètre. Le code du site n'apparaît
       que sur une ligne d'historique, pour dire d'où vient un mouvement.
   ========================================================================= */

function potById(id){
  for(var i=0;i<POTS.length;i++){ if(POTS[i].id === id) return POTS[i]; }
  return null;
}

/* Le membre Passion n'a pas de compteur green-fee : son accès est illimité.
   Le compteur est remplacé par un bandeau, et les carnets de green-fee
   restent au catalogue sans lui être proposés (brief lot 4). */
function potAvailable(id){
  if(!potById(id)) return false;
  return !(id === 'greenfee' && isPassion());
}
function visiblePots(){
  var out = [];
  for(var i=0;i<POTS.length;i++){ if(potAvailable(POTS[i].id)) out.push(POTS[i]); }
  return out;
}

/* Solde du jeu de données, avant les achats faits dans le prototype. Les deux
   premiers viennent des réglages de la barre de contrôle, le troisième du
   profil : il n'a pas de réglage, faute d'un cas à démontrer. */
function basePotValue(id){
  if(id === 'greenfee') return isPassion() ? null : gfCreditBalance();
  if(id === 'lessons') return lessonCreditBalance();
  if(id === 'buckets') return profile().credits.buckets.value;
  return null;
}
function boughtValue(id){
  var moves = STATE.wallet.moves;
  var n = 0;
  for(var i=0;i<moves.length;i++){ if(moves[i].pot === id) n += moves[i].delta; }
  return n;
}
function potValue(id){
  var base = basePotValue(id);
  return base === null ? null : base + boughtValue(id);
}

/* --- Libellés d'un solde -------------------------------------------------- */

/* Forme longue, pour un solde qu'on lit seul : « 8 crédits », « 4 h ». */
function potAmountLabel(id, n){
  if(id === 'lessons') return hoursLabel(n);
  if(id === 'buckets') return n + (n > 1 ? ' seaux' : ' seau');
  return n + (n > 1 ? ' crédits' : ' crédit');
}
/* Forme courte, pour une colonne étroite : bande de l'accueil, historique. */
function potShort(id, n){
  return id === 'lessons' ? hoursLabel(n) : String(n);
}
/* Un compteur vide n'affiche pas un zéro : il dit ce qui manque. */
function potValueLabel(id, n){
  if(n !== 0) return potAmountLabel(id, n);
  if(id === 'lessons') return 'Aucune heure';
  if(id === 'buckets') return 'Aucun seau';
  return 'Aucun crédit';
}
function dmy(offset){
  var d = dateAt(offset);
  return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
}
/* Brief lot 4 : à moins de 60 jours du terme, la date passe en attention. */
function expirySoon(id){ return POT_EXPIRY[id] <= EXPIRY_SOON; }

/* --- Carnets -------------------------------------------------------------- */

function packLabel(id, n){
  if(id === 'lessons') return 'Carnet de ' + hoursLabel(n);
  if(id === 'buckets') return 'Carnet de ' + n + ' seaux';
  return 'Carnet de ' + n + ' green-fees';
}

/* Un carnet du catalogue, avec son prix et l'économie réalisée par rapport au
   tarif unitaire — le brief demande explicitement cet affichage. */
function packAt(id, rank){
  var cat = PACKS[id];
  if(!cat || rank === null || rank < 0 || rank >= cat.sizes.length) return null;
  var size = cat.sizes[rank];
  var full = cat.unit * size;
  var price = Math.round(full * (1 - PACK_OFF[rank]));
  return {
    rank:rank,
    size:size,
    price:price,
    full:full,
    save:full - price,
    each:price / size,
    unit:cat.unit
  };
}
function pickedPack(){
  return packAt(STATE.wallet.buyPotId, STATE.wallet.packIndex);
}
function packTotal(){
  var pack = pickedPack();
  return pack ? pack.price : 0;
}

/* Numéro de commande, tiré du même PRNG que les numéros de réservation. Il est
   figé au moment du règlement pour ne plus bouger sous les yeux du joueur. */
function makePurchaseReference(){
  var pack = pickedPack();
  if(!pack) return null;
  var n = Math.floor(draw('buy' + STATE.wallet.buyPotId + pack.size
                          + STATE.siteCode + STATE.wallet.moves.length) * 90000) + 10000;
  return currentSite().code + '-' + n;
}

/* --- Historique d'un compteur --------------------------------------------

   Un seul fil chronologique, du plus récent au plus ancien. Le solde étant
   global au groupe, le code du site est purement informatif : il documente où
   le crédit a été acheté ou consommé, il ne le cloisonne pas. Aucun
   regroupement par site, donc, et des sites qui changent d'une ligne à
   l'autre — c'est ce qui rend la règle lisible sans avoir à l'écrire deux fois.

   Le solde résultant se calcule à rebours depuis le solde courant : la
   première ligne porte toujours le solde affiché sur la carte, et chaque ligne
   antérieure s'en déduit. La plus ancienne ne prétend pas être l'origine du
   compte — c'est une fenêtre, et le pied de liste le dit. */

function siteIndexOf(code){
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) return i; }
  return 0;
}

/* Pas d'une consommation ou d'une expiration, par nature de crédit. */
function moveStep(id, kind, r){
  if(id === 'lessons') return (r < 0.45 ? 0.5 : 1);
  if(id === 'buckets') return kind === 'expiration' ? 2 + Math.floor(r * 3) : 1 + Math.floor(r * 2);
  return kind === 'expiration' ? 1 + Math.floor(r * 2) : 1 + Math.floor(r * 3);
}

/* Le plus grand carnet du catalogue que le solde antérieur pouvait porter.
   Aucun montant inventé : un achat d'historique est toujours un carnet réel. */
function packFitting(id, ceiling){
  var sizes = PACKS[id].sizes;
  var best = null;
  for(var i=0;i<sizes.length;i++){ if(sizes[i] <= ceiling) best = sizes[i]; }
  return best;
}

function moveLabel(id, m){
  if(m.kind === 'achat') return packLabel(id, m.delta);
  if(m.kind === 'expiration'){
    if(id === 'lessons') return 'Heures expirées';
    if(id === 'buckets') return 'Seaux expirés';
    return 'Crédits expirés';
  }
  var n = -m.delta;
  if(id === 'greenfee') return n > 1 ? 'Départ à ' + n + ' joueurs' : 'Départ';
  if(id === 'buckets') return n > 1 ? n + ' seaux au practice' : 'Seau au practice';
  return m.solo ? 'Cours particulier' : 'Cours collectif';
}

function potHistory(id){
  var out = [];
  var value = potValue(id);
  if(value === null) return out;

  /* Les achats faits à l'écran ouvrent le fil : ils datent d'aujourd'hui. */
  var mine = STATE.wallet.moves;
  var after = value;
  for(var i=mine.length-1;i>=0;i--){
    if(mine[i].pot !== id) continue;
    out.push({ kind:mine[i].kind || 'achat', delta:mine[i].delta, after:after,
               offset:0, site:mine[i].site });
    after -= mine[i].delta;
  }

  /* Un compteur qui n'a jamais rien porté n'a pas d'historique à raconter :
     l'écran montre son état vide plutôt qu'une chronologie inventée. */
  if(after <= 0) return out;

  var key = 'wal' + id + STATE.persona + STATE.siteCode;
  var home = siteIndexOf(STATE.siteCode);
  var offset = -1;

  for(var k=0;k<HISTORY_MOVES.length;k++){
    var kind = HISTORY_MOVES[k];
    var delta;

    if(kind === 'achat'){
      var size = packFitting(id, after);
      /* Le solde antérieur ne portait aucun carnet du catalogue : la ligne
         devient une consommation plutôt qu'un montant hors catalogue. */
      if(size === null){ kind = 'conso'; }
      else { delta = size; }
    }
    if(kind !== 'achat'){
      delta = -moveStep(id, kind, draw(key + 'v' + k));
    }

    offset -= 1 + Math.floor(draw(key + 'd' + k) * 9);
    out.push({
      kind:kind,
      delta:delta,
      after:after,
      offset:offset,
      /* Une expiration ne se rattache à aucun site : elle n'en porte pas. */
      site:kind === 'expiration' ? null : SITES[(home + k * 3) % SITES.length],
      solo:draw(key + 's' + k) < 0.55
    });
    after -= delta;
    if(after <= 0) break;
  }
  return out;
}

function moveDate(offset){
  return offset === 0 ? 'Aujourd\'hui' : shortDate(offset);
}

/* =========================================================================
   2f. Notifications — lot 5

       Une notification n'est pas une donnée : elle se calcule à partir de
       l'état, comme les alertes de l'accueil et pour la même raison. Un
       message « votre carnet de seaux est épuisé » stocké à côté d'un
       compteur à douze seaux serait une contradiction à trois écrans
       d'écart — c'est le défaut trouvé au lot 4, où la bande de l'accueil
       lisait le jeu de données pendant que le portefeuille lisait le solde.

       Conséquence de méthode : le déclencheur du brief est écrit une fois,
       dans notifications(), et il lit les mêmes fonctions que les écrans
       concernés — potValue(), nextBooking(), lessonBookings(), les
       fermetures de site. Les sept types sont couverts ; ils ne se
       rencontrent jamais tous à la fois, deux d'entre eux s'excluant par
       construction (la fin de cotisation n'existe que pour le membre
       Passion, le compteur qui expire suppose un carnet pourvu).
   ========================================================================= */

function notifTypeById(id){
  for(var i=0;i<NOTIF_TYPES.length;i++){
    if(NOTIF_TYPES[i].id === id) return NOTIF_TYPES[i];
  }
  return null;
}

/* --- Autorisation au niveau du système ------------------------------------

   Trois états, et un seul que l'application ne peut pas résoudre elle-même :
   une fois la permission refusée, iOS ne la redemande plus. L'application
   n'a alors qu'une chose à faire, dire où aller la rétablir. */

function pushGranted(){ return STATE.pushState === 'on'; }
function pushBlocked(){ return STATE.pushState === 'off'; }
function pushPending(){ return STATE.pushState === 'ask'; }

/* --- Préférences par type et par canal ------------------------------------

   Opt-in cellule par cellule (RGPD, brief lot 5). Le SMS n'est ouvert que sur
   les deux rappels J-1 : la restriction est portée par le référentiel, pas
   seulement par le texte de l'écran. Le push se coche encore quand le
   téléphone le bloque, mais il ne se modifie plus — le choix appartient au
   compte, l'autorisation appartient à l'appareil. */

function channelOpen(type, channel){
  if(!type) return false;
  return channel !== 'sms' || type.sms === true;
}
function channelEditable(type, channel){
  if(!channelOpen(type, channel)) return false;
  if(channel === 'mail' && type.lockMail) return false;
  return !(channel === 'push' && pushBlocked());
}

/* Les choix vivent dans l'état, pas dans le référentiel : celui-ci ne porte
   que la valeur de départ. La ligne se matérialise à la première lecture,
   ce qui évite d'avoir à l'initialiser au démarrage. */
function notifPrefs(){
  var store = STATE.notifs.prefs;
  for(var i=0;i<NOTIF_TYPES.length;i++){
    var t = NOTIF_TYPES[i];
    if(!store[t.id]){
      store[t.id] = { push:t.on.push, mail:t.on.mail, sms:t.on.sms };
    }
  }
  return store;
}
function notifPrefOn(typeId, channel){
  var type = notifTypeById(typeId);
  if(!channelOpen(type, channel)) return false;
  return notifPrefs()[typeId][channel] === true;
}
function toggleNotifPref(typeId, channel){
  var type = notifTypeById(typeId);
  if(!channelEditable(type, channel)) return false;
  var row = notifPrefs()[typeId];
  row[channel] = !row[channel];
  return true;
}
/* Nombre de types ouverts sur un canal — lecteur d'état et assertions. */
function notifChannelCount(channel){
  var n = 0;
  for(var i=0;i<NOTIF_TYPES.length;i++){
    if(notifPrefOn(NOTIF_TYPES[i].id, channel)) n += 1;
  }
  return n;
}

/* --- Ce que le centre contient -------------------------------------------

   Un type produit une notification quand son déclencheur tient dans l'état
   courant, jamais autrement. L'ancienneté du message vient de NOTIF_SENT,
   sauf pour les deux types qui partent de J-30 : elle se déduit alors de ce
   qui reste à courir, de sorte que le message ne puisse pas être daté d'un
   jour où le déclencheur n'avait pas encore joué. */

function makeNotif(typeId, extra){
  var type = notifTypeById(typeId);
  var out = {
    id:extra.id || ('n-' + typeId),
    type:typeId,
    icon:type.icon,
    cta:type.cta,
    minutes:type.hour,
    offset:extra.offset,
    title:extra.title,
    text:extra.text,
    target:extra.target
  };
  return out;
}

function notifications(){
  if(STATE.demoNotifs === 'none') return [];

  var out = [];
  var p = profile();
  var site = currentSite();

  /* 1. Fin de cotisation — J-30 avant expiration. */
  if(p.membership && p.membership.daysLeft <= NOTIF_EXPIRY_DAYS){
    out.push(makeNotif('membership', {
      offset:-(NOTIF_EXPIRY_DAYS - p.membership.daysLeft),
      title:'Votre cotisation arrive à son terme',
      text:'Elle se termine le ' + membershipEnd() + '. Renouvelez-la pour '
         + 'conserver votre accès illimité et vos invitations.',
      target:{ tab:'profile', path:'/profile/membership' }
    }));
  }

  /* 2 et 3. Seaux et carnet d'heures — solde nul ou sous le seuil bas. Le
     seuil est celui de l'accueil : deux valeurs auraient fait diverger
     l'alerte et la notification qui parlent du même compteur. */
  var buckets = potValue('buckets');
  if(buckets !== null && buckets <= LOW_CREDIT){
    out.push(makeNotif('buckets', {
      offset:NOTIF_SENT.buckets,
      title:buckets === 0
        ? 'Votre carnet de seaux est épuisé'
        : 'Votre carnet de seaux arrive au bout',
      text:(buckets === 0
        ? 'Achetez un carnet '
        : 'Il vous reste ' + potAmountLabel('buckets', buckets) + '. Rechargez-le ')
        + 'pour vous entraîner sans passer par l\'accueil.',
      target:{ tab:'wallet', path:'/wallet/buy',
               prepare:function(){ prepareBuy('buckets'); } }
    }));
  }

  var lessons = potValue('lessons');
  if(lessons !== null && lessons <= LOW_CREDIT){
    out.push(makeNotif('lessons', {
      offset:NOTIF_SENT.lessons,
      title:lessons === 0
        ? 'Votre carnet de cours est épuisé'
        : 'Votre carnet de cours arrive au bout',
      text:(lessons === 0
        ? 'Achetez un carnet '
        : 'Il vous reste ' + hoursLabel(lessons) + '. Rechargez-le ')
        + 'pour réserver votre prochaine séance en un geste.',
      target:{ tab:'wallet', path:'/wallet/buy',
               prepare:function(){ prepareBuy('lessons'); } }
    }));
  }

  /* 4. Carnet qui expire — J-30 avant la date. Un compteur vide n'expire
     pas : il n'y a rien à perdre, et le message serait faux. */
  var pots = visiblePots();
  for(var i=0;i<pots.length;i++){
    var pot = pots[i];
    var value = potValue(pot.id);
    var days = POT_EXPIRY[pot.id];
    if(!value || days > NOTIF_EXPIRY_DAYS) continue;
    out.push(makeNotif('expiry', {
      id:'n-expiry-' + pot.id,
      offset:-(NOTIF_EXPIRY_DAYS - days),
      title:'Expiration de ' + pot.noun,
      /* Le solde n'est pas repris ici : un compteur sous le seuil bas produit
         déjà un message qui le dit, et les deux se liraient à quelques
         centimètres d'écart. La phrase se passe aussi de pronom — « votre
         carnet » et « vos crédits » ne s'accordent pas de la même façon. */
      text:'Fin de validité le ' + dmy(days) + '. Ce qui n\'aura pas été '
         + 'utilisé d\'ici là sera perdu.',
      target:{ tab:'wallet', path:'/wallet/pot',
               prepare:function(id){
                 return function(){ STATE.wallet.potId = id; };
               }(pot.id) }
    }));
    break;
  }

  /* 5. Travaux — saisie back-office. Le texte est celui des fermetures, déjà
     partagé avec l'alerte de l'accueil et avec les jours barrés de l'étape 3
     depuis le lot 2 : un même événement s'annonce avec les mêmes mots. */
  var closures = site.closures || [];
  if(closures.length){
    out.push(makeNotif('works', {
      offset:NOTIF_SENT.works,
      title:'Travaux ' + atSite(site),
      text:closureText(site, closures[0]),
      target:{ tab:'book', path:'/book/gf/date',
               prepare:function(){ prepareWorks(site, closures[0]); } }
    }));
  }

  /* 6. Rappel de départ — la veille. Le message a été écrit hier soir : il
     dit « demain », quelle que soit l'heure à laquelle on le relit. */
  var booking = nextBooking();
  if(booking && booking.minutesAway <= 24 * 60){
    out.push(makeNotif('tee', {
      offset:NOTIF_SENT.tee,
      title:'Votre départ est demain à ' + booking.time,
      text:booking.course + ', ' + booking.players
         + (booking.players > 1 ? ' joueurs' : ' joueur')
         + '. Présentez-vous à l\'accueil quinze minutes avant.',
      target:{ tab:'home', path:'/home/detail' }
    }));
  }

  /* 7. Rappel de cours — la veille, avec le téléphone du pro. C'est la
     réponse explicite du brief au no-show remonté en atelier. */
  var soonLesson = nextLessonBooking();
  if(soonLesson){
    out.push(makeNotif('lesson', {
      offset:NOTIF_SENT.lesson,
      title:'Votre cours est demain à ' + hhmm(soonLesson.minutes),
      text:minutesLabel(soonLesson.duration) + ' avec ' + proName(soonLesson.pro)
         + ' &middot; ' + lessonPlace(soonLesson.site, soonLesson.theme)
         + '. En cas d\'empêchement, appelez le ' + soonLesson.pro.phone + '.',
      target:{ tab:'book', path:'/book/lessons/detail',
               prepare:function(id){
                 return function(){ STATE.lesson.openId = id; };
               }(soonLesson.id) }
    }));
  }

  /* Du plus récent au plus ancien. Deux messages du même jour se départagent
     à l'heure d'envoi. */
  out.sort(function(a, b){
    if(a.offset !== b.offset) return b.offset - a.offset;
    return b.minutes - a.minutes;
  });
  return out;
}

/* Séance à venir dans les vingt-quatre heures, hors annulation. Le rappel de
   cours n'a pas d'autre déclencheur. */
function nextLessonBooking(){
  var list = lessonBookings();
  for(var i=0;i<list.length;i++){
    var b = list[i];
    if(b.offset !== 0 && b.offset !== 1) continue;
    if(lessonIsCancelled(b)) continue;
    return b;
  }
  return null;
}

function notifById(id){
  var list = notifications();
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}

/* Faute de session, le prototype n'a pas de date de dernière visite : une
   notification se lit comme non lue pendant trois jours, puis comme lue. Un
   message ouvert, lui, ne redevient jamais non lu. */
function notifIsUnread(n){
  if(STATE.notifs.read[n.id]) return false;
  return n.offset >= -NOTIF_UNREAD_DAYS;
}
function unreadCount(){
  var list = notifications();
  var n = 0;
  for(var i=0;i<list.length;i++){ if(notifIsUnread(list[i])) n += 1; }
  return n;
}

/* Les deux groupes du brief. Un groupe vide n'a pas de titre : il n'existe
   pas. */
function notifGroups(){
  var list = notifications();
  var week = [];
  var older = [];
  for(var i=0;i<list.length;i++){
    if(list[i].offset >= -NOTIF_WEEK_DAYS) week.push(list[i]);
    else older.push(list[i]);
  }
  var out = [];
  if(week.length) out.push({ id:'week', label:'Cette semaine', items:week });
  if(older.length) out.push({ id:'older', label:'Plus tôt', items:older });
  return out;
}

/* Horodatage d'un message. « Hier, 18:00 » tant qu'il est proche, la date
   ensuite : au-delà de quelques jours, le jour de la semaine ne situe plus
   rien. */
function notifWhen(n){
  if(n.offset === 0) return 'Aujourd\'hui, ' + hhmm(n.minutes);
  if(n.offset === -1) return 'Hier, ' + hhmm(n.minutes);
  if(n.offset >= -NOTIF_WEEK_DAYS){
    return JOURS[dateAt(n.offset).getDay()].toLowerCase() + ', ' + hhmm(n.minutes);
  }
  return shortDate(n.offset);
}

/* --- Deep link ------------------------------------------------------------

   Le brief l'exige : taper une notification ouvre l'écran concerné, pas
   l'accueil. Deux chemins, une seule fonction.

   Depuis le centre, l'écran concerné se pose sur la pile : le retour ramène
   à la liste, le joueur continue de la lire. Depuis une notification du
   système — application fermée — la pile repart de la racine de l'onglet
   concerné avant de poser l'écran : le retour ramène à cet onglet, jamais
   dans un écran sans issue. C'est la différence entre les deux, et c'est
   pourquoi elles partagent tout le reste.

   Chaque cible pose l'état dont son écran a besoin avant la navigation : les
   gardes des tunnels renverraient sinon le joueur à l'étape manquante. */

function prepareBuy(potId){
  clearWalletDraft();
  STATE.wallet.buyPotId = potId;
}

/* « Voir les dates » ouvre l'étape 3 du tunnel green-fee sur le parcours
   concerné : les jours fermés y sont barrés avec leur motif. Le lot 1 avait
   laissé l'alerte de travaux sans action, faute d'écran derrière ; c'est
   celui-ci, et il existait déjà. */
function prepareWorks(site, closure){
  clearDraft();
  STATE.draft.siteCode = site.code;
  STATE.draft.courseIndex = closure.course;
}

function followNotif(n, fromPush){
  if(!n || !n.target) return false;
  if(n.target.prepare) n.target.prepare();
  if(fromPush) setRoot(tabRoot(n.target.tab));
  navigate(n.target.path);
  return true;
}

function openNotification(id){
  var n = notifById(id);
  if(!n) return false;
  STATE.notifs.read[n.id] = true;
  return followNotif(n, false);
}

/* Ouverture depuis une notification du système. Le prototype n'en reçoit
   pas : la barre de contrôle joue le geste sur le message le plus récent. */
function openFromPush(id){
  var n = id ? notifById(id) : notifications()[0];
  if(!n) return false;
  STATE.notifs.read[n.id] = true;
  var ok = followNotif(n, true);
  renderPanel();
  return ok;
}

/* --- Réponse à la demande système ----------------------------------------

   La boîte de dialogue est celle du téléphone, pas celle de l'application :
   elle ne se ferme pas au voile, et ses deux réponses sont définitives.
   Contrairement aux réglages de la barre de contrôle, répondre ne
   réinitialise pas l'application — c'est un geste du joueur dans son
   parcours, pas une bascule de démonstration. */

function askPush(){
  if(!pushPending()) return false;
  STATE.notifs.dialog = true;
  refresh();
  return true;
}

function answerPush(granted){
  if(!STATE.notifs.dialog) return false;
  STATE.notifs.dialog = false;
  STATE.pushState = granted ? 'on' : 'off';
  refresh();
  renderPanel();
  return true;
}

/* =========================================================================
   2g. Le compte — identité, licence, proches, cartes, consentements
       Lot 6. Même principe qu'aux paragraphes précédents : tout ce que les
       écrans affichent se lit par une fonction, jamais dans `PROFILES` ni dans
       le référentiel directement. C'est la règle posée au lot 4 après la
       divergence des crédits green-fee — le profil est le troisième écran à
       afficher les proches, et le second à afficher une carte enregistrée.
   ========================================================================= */

/* « 22 juillet 2025 » — une date de recueil se lit avec son année, à la
   différence des dates du calendrier de réservation. */
function dateWithYear(offset){
  var d = dateAt(offset);
  return d.getDate() + ' ' + MOIS[d.getMonth()].toLowerCase() + ' ' + d.getFullYear();
}

/* --- Identité et coordonnées --------------------------------------------- */

function accountName(){ return profile().firstName + ' ' + profile().lastName; }
function accountInitials(){
  return (profile().firstName.charAt(0) + profile().lastName.charAt(0)).toUpperCase();
}

/* Les coordonnées viennent du jeu de données tant que le joueur ne les a pas
   modifiées. Une seule fonction les rend, quel que soit le cas. */
function contactOf(){ return STATE.account.contact || profile().contact; }

/* --- Licence et index ----------------------------------------------------

   La licence n'est absente que chez le licencié externe, réglage « Fiche
   licence » de la barre de contrôle (lot 1). L'index affiché est celui du jeu
   de données jusqu'à la première actualisation depuis la FFG. */
function licenceNumber(){ return STATE.account.licence || profile().licence.number; }
function licenceIndex(){ return STATE.account.index || profile().licence.index; }

/* Club de rattachement de la licence. Il ne se confond pas avec le site de
   rattachement de l'application : le membre Passion est licencié à son golf,
   le licencié externe l'est ailleurs. C'est précisément ce que le profil doit
   montrer côte à côte. */
function licenceClub(){
  return isPassion() ? currentSite().name : FFG_CLUB_EXTERNE;
}

/* Ancienneté de la dernière actualisation, en jours et en négatif comme les
   mouvements du portefeuille. Sans actualisation dans la session, c'est celle
   du jeu de données. */
function ffgOffset(){
  return STATE.account.ffgAt === null ? -FFG_STALE_DAYS : STATE.account.ffgAt;
}
function ffgFresh(){ return STATE.account.ffgAt === 0; }

/* --- Certificat médical --------------------------------------------------

   Inutile pour réserver un départ, indispensable pour s'inscrire en
   compétition : le brief le veut présent dès la V1 pour cette raison. Les
   trois états se règlent depuis la barre de contrôle. */
function medicalDays(){
  var days = MED_DEMO[STATE.demoMedical];
  return days === undefined ? MED_DEMO.valid : days;
}
function medicalState(){
  var days = medicalDays();
  if(days < 0) return 'expired';
  if(days <= MED_SOON) return 'soon';
  return 'valid';
}

/* --- Droits attachés à la cotisation -------------------------------------

   Le brief en nomme quatre. Leur valeur se calcule : le périmètre et le solde
   d'invitations changent avec la variante d'abonnement, et le portefeuille dit
   déjà que les seaux restent au carnet — l'écrire autrement ici ferait deux
   règles pour un même objet. */
function memberRightValue(id){
  var p = profile();
  if(!p.membership) return null;
  if(id === 'courses') return 'Illimité sur ' + accessScope();
  /* Le practice ne figure pas ici : il a sa propre ligne, et deux droits qui
     se recouvrent se lisent comme une contradiction. */
  if(id === 'rate') return 'Boutique et restaurant';
  if(id === 'range') return 'Inclus, les seaux restent au carnet';
  if(id === 'invites'){
    var left = p.invitations.total - p.invitations.used;
    return left + ' sur ' + p.invitations.total
         + (left > 1 ? ' restantes' : ' restante');
  }
  return null;
}

/* --- Statut et échéances, lot 9d ------------------------------------------

   Repris du booking engine v3, retours du 24/09. */

/* Fin de la cotisation, en date. Le jeu de données porte un nombre de jours
   et la date s'en déduit : écrite en dur, elle avait dérivé (« 21 septembre
   2026 » annoncé à 24 jours de l'échéance, le 19/10). Une seule source pour
   l'accueil, la notification, le portefeuille et le profil. */
function membershipEnd(){
  var m = profile().membership;
  return m ? dateWithYear(m.daysLeft) : null;
}
/* Début de la période : le lendemain du même jour, un an plus tôt. */
function membershipStart(){
  var m = profile().membership;
  if(!m) return null;
  var end = dateAt(m.daysLeft);
  return dateWithYear(offsetOf(new Date(end.getFullYear() - 1, end.getMonth(),
                                        end.getDate() + 1)));
}
function membershipSoon(){
  var m = profile().membership;
  return !!m && m.daysLeft <= RENEW_DAYS;
}

/* Échéance de la licence. Au 31 décembre ; si cette date tombe déjà sous le
   seuil de renouvellement, la licence de l'année suivante est supposée prise. */
function licenceDays(){
  if(STATE.demoLicenceEnd === 'soon') return LICENCE_SOON_DAYS;
  var t = startOfToday();
  var days = offsetOf(new Date(t.getFullYear(), 11, 31));
  if(days <= RENEW_DAYS) days = offsetOf(new Date(t.getFullYear() + 1, 11, 31));
  return days;
}
function licenceEnd(){ return dateWithYear(licenceDays()); }
function licenceSoon(){ return hasLicence() && licenceDays() <= RENEW_DAYS; }
function daysText(n){ return n + (n > 1 ? ' jours' : ' jour'); }

/* Statut en texte simple, avec un libellé propre au profil — repris du
   booking engine v3, retours du 24/09 (« Abonné Passion Hardelot 7/7 »).
   Deux personas, donc deux statuts au plus : l'abonnement et la licence.
   Aucun autre statut tarifé (jeune, Loisir 5/7, réseau) n'est ajouté :
   conflit 3 du lot 9a. HYPOTHÈSE de libellé : « Abonné Passion » suivi du
   périmètre, la région ou le golf en variante Monosite. */
function statusLabels(){
  var out = [];
  /* v3 écrit « Abonné Le Touquet » pour l'abonnée d'un seul golf. */
  if(isPassion()) out.push(STATE.passionScope === 'mono'
    ? 'Abonné ' + currentSite().name
    : 'Abonné Passion ' + accessScope());
  if(hasLicence()) out.push('Licencié FFGolf');
  if(!out.length) out.push('Visiteur');
  return out;
}
function statusText(){ return statusLabels().join(' &middot; '); }

/* --- Grille des tarifs, lot 9d --------------------------------------------

   Repris du booking engine v3, retours du 24/09 : un tableau par saison,
   semaine ou week-end, chaque parcours regroupant ses formules. Calculée
   avec les mêmes fourchettes et le même écart licencié / visiteur que le
   tunnel : elle ne contredit pas l'ordre de grandeur de la feuille de
   départs, où le prix varie en plus avec l'heure. */
function seasonById(id){
  for(var i=0;i<SEASONS.length;i++){ if(SEASONS[i].id === id) return SEASONS[i]; }
  return null;
}
function seasonNow(){
  var m = startOfToday().getMonth();
  for(var i=0;i<SEASONS.length;i++){ if(SEASONS[i].of.indexOf(m) > -1) return SEASONS[i]; }
  return SEASONS[1];
}
function tariffSeason(){ return seasonById(STATE.account.tariff.season) || seasonNow(); }
function tariffSite(){
  var code = STATE.account.tariff.siteCode || STATE.siteCode;
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) return SITES[i]; }
  return currentSite();
}

/* Formules d'un parcours : un 18 trous se joue aussi en 9 trous (commande
   du lot 9, « option 18 T ou 9 T » ; HYPOTHÈSE de tarif, la fourchette 9
   trous de `GF_RANGE`), un 9 trous ou un compact en une seule formule. */
function courseFormulas(course){ return course.holes === 18 ? [18, 9] : [course.holes]; }

function gridLicPrice(site, courseIndex, holes, season, weekend){
  var range = GF_RANGE[holes] || GF_RANGE[18];
  var f = GRID_BAND + draw('grid' + site.code + courseIndex) * GRID_SPREAD
        + (weekend ? GRID_WEEKEND : 0) + season.shift;
  if(f < 0) f = 0;
  if(f > 1) f = 1;
  return Math.round(range[0] + (range[1] - range[0]) * f);
}

/* Le prix du joueur est le plus avantageux de ceux que ses statuts ouvrent,
   jamais un cumul (booking engine v3, retours du 24/09). Le prix public est
   le tarif visiteur de l'application. */
function gridPrice(site, courseIndex, holes, season, weekend){
  var lic = gridLicPrice(site, courseIndex, holes, season, weekend);
  var pub = visitorPrice(lic);
  var offers = [pub];
  if(hasLicence()) offers.push(lic);
  if(passCoversSite(site)) offers.push(0);
  return { pub:pub, mine:Math.min.apply(null, offers) };
}

/* Fourchette d'un prix d'enseignement au golf affiché : il dépend du pro. */
function priceSpan(values){
  var lo = Math.min.apply(null, values);
  var hi = Math.max.apply(null, values);
  return lo === hi ? amount(lo) : lo + ' à ' + amount(hi);
}
function lessonSpan(site, durationId){
  var pros = prosOfSite(site);
  var out = [];
  for(var i=0;i<pros.length;i++) out.push(pros[i].prices[durationId]);
  return priceSpan(out);
}
function groupSpan(){
  var out = [];
  for(var i=0;i<GROUP_THEMES.length;i++) out.push(GROUP_THEMES[i].price);
  return priceSpan(out);
}

/* --- Licence reconnue en cours de route, lot 9d ---------------------------

   Repris du booking engine v3, retours du 24/09 : le gain se chiffre tout de
   suite, montant et lignes concernées. Avec un départ en cours au brouillon,
   ce sont ses lignes ; sans départ, la grille du golf de rattachement, saison
   en cours, en semaine. Le calcul se fait avant que la licence soit
   enregistrée : c'est l'écart entre les deux états. Seule la place du
   titulaire change, les licences des autres joueurs leur appartiennent. */
function licenceGain(){
  var lines = [];
  var slot = draftSlot();
  var d = STATE.draft;
  if(slot && d.players.length && d.players[0].kind === 'holder' && !d.players[0].licence){
    lines.push({ label:'Votre place, ' + longDate(slot.offset) + ' à ' + slot.time,
                 sub:slot.course.name, before:visitorPrice(slot.base), after:slot.base });
    return { scope:'draft', lines:lines, total:lines[0].before - lines[0].after };
  }
  var site = currentSite();
  var season = seasonNow();
  var best = 0;
  for(var ci=0;ci<site.courses.length;ci++){
    var forms = courseFormulas(site.courses[ci]);
    for(var k=0;k<forms.length;k++){
      var lic = gridLicPrice(site, ci, forms[k], season, false);
      var pub = visitorPrice(lic);
      lines.push({ label:site.courses[ci].name + ' &middot; ' + forms[k] + ' trous',
                   sub:null, before:pub, after:lic });
      if(pub - lic > best) best = pub - lic;
    }
  }
  return { scope:'grid', site:site, lines:lines, total:best };
}

/* Licence saisie par le joueur : neuf chiffres, et pas celle d'un autre.
   Même recherche que celle des proches (lot 9e) : un proche ou un licencié
   nommé de l'annuaire n'est pas le joueur. */
function ownLicenceError(raw){
  var r = licenceLookup(raw);
  if(r.error === 'format'){
    return 'Un numéro de licence FFGolf compte ' + LICENCE_DIGITS + ' chiffres. '
         + 'Il figure sur votre carte de licencié.';
  }
  if(r.error === 'known'){
    return 'Ce numéro est celui de ' + escapeAttr(playerName(r.rel))
         + ', l\'un de vos proches. Saisissez le vôtre.';
  }
  /* Le joueur figure lui-même à l'annuaire (Sophie Marchand, 19/10) : sa
     propre licence n'est pas celle d'un autre. */
  for(var i=0;i<FFG_DIRECTORY.length;i++){
    if(FFG_DIRECTORY[i].licence === digitsOf(raw)
       && digitsOf(raw) !== digitsOf(profile().licence.number)){
      return 'Cette licence est au nom de ' + escapeAttr(playerName(FFG_DIRECTORY[i]))
           + '. Vérifiez le numéro.';
    }
  }
  return null;
}

/* --- Proches --------------------------------------------------------------

   Le tunnel du lot 2 les consomme par `relativesOf()`. Le profil les crée, les
   modifie et les retire ici. Un proche déjà inscrit sur un départ en cours en
   a reçu une copie : le retirer du profil ne le sort pas du départ, ce qui est
   le comportement attendu — la feuille de départs est déjà faite. */
function relativeById(id){
  var list = STATE.account.relatives;
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}

/* --- Proches, lot 9e ------------------------------------------------------

   Repris du booking engine v3, retours du 24/09 : lien de parenté, licence à
   neuf chiffres, profil rattaché sans compte, téléphone international, et
   « Mes proches sur le parcours ». Une seule couche de calcul, lue par le
   profil comme par le tunnel. */

function relationOf(rel){ return rel.relation || 'Ami·e'; }

/* D'où vient ce proche. Le libellé dit aussi, sans le nommer, comment il
   réglera sa place s'il la règle lui-même : un profil rattaché n'a pas de
   compte. */
function relativeKind(rel){
  if(rel.source === 'profile') return 'Profil rattaché à votre compte';
  return rel.member ? 'Compte au club' : 'Licence FFGolf vérifiée';
}

/* Âge à aujourd'hui, depuis une date ISO (AAAA-MM-JJ). */
function ageOn(birth){
  if(!birth || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(birth)) return null;
  var parts = birth.split('-');
  var y = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10);
  var d = parseInt(parts[2], 10);
  var t = startOfToday();
  var age = t.getFullYear() - y;
  if(t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) age -= 1;
  return age;
}
/* Date ISO d'un jour compté depuis aujourd'hui : borne du champ de date. */
function dateIso(offset){
  var d = dateAt(offset);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function isYouth(rel){
  var age = ageOn(rel.birth);
  return age !== null && age < YOUTH_AGE;
}
function birthLabel(birth){
  var parts = birth.split('-');
  return parseInt(parts[2], 10) + ' '
       + MOIS[parseInt(parts[1], 10) - 1].toLowerCase() + ' ' + parts[0];
}

/* Téléphone : indicatif en liste, et les saisies « 0032… » ou « +32… »
   reconnues. Le numéro se stocke au format international (+32 470 12 34 56).
   Repris du booking engine v3, retours du 28/09. */
function phoneCode(code){
  for(var i=0;i<PHONE_CODES.length;i++){ if(PHONE_CODES[i][0] === code) return PHONE_CODES[i]; }
  return PHONE_CODES[0];
}
function phoneSplit(raw, code){
  var t = String(raw === null || raw === undefined ? '' : raw).replace(/[^0-9+]/g, '');
  if(t.indexOf('00') === 0) t = '+' + t.slice(2);
  if(t.charAt(0) === '+'){
    var codes = PHONE_CODES.slice().sort(function(a, b){ return b[0].length - a[0].length; });
    for(var i=0;i<codes.length;i++){
      if(t.slice(1).indexOf(codes[i][0]) === 0){
        return { code:codes[i][0], nat:t.slice(1 + codes[i][0].length) };
      }
    }
    return { code:code || '33', nat:t.slice(1), bad:true };
  }
  return { code:code || '33', nat:t.replace(/^0/, '') };
}
/* Groupes de deux chiffres ; le premier bloc garde un chiffre (France) ou
   trois (mobiles belges). */
function phoneGroups(nat, code){
  var head = nat.length % 2 ? (code === '32' && nat.length === 9 ? 3 : 1) : 0;
  return ((head ? nat.slice(0, head) + ' ' : '')
        + nat.slice(head).replace(/([0-9]{2})(?=[0-9])/g, '$1 ')).replace(/^\s+|\s+$/g, '');
}
function phoneNorm(raw, code){
  var x = phoneSplit(raw, code);
  if(x.bad || !x.nat) return null;
  var c = phoneCode(x.code);
  if(x.nat.length < c[3][0] || x.nat.length > c[3][1]) return null;
  return '+' + x.code + ' ' + phoneGroups(x.nat, x.code);
}
function phoneCodeOf(stored){ return stored ? phoneSplit(stored, '33').code : '33'; }
function phoneNational(stored){
  if(!stored) return '';
  var x = phoneSplit(stored, '33');
  return phoneGroups(x.nat, x.code);
}

/* Recherche d'un joueur par sa licence. Jamais par e-mail : une adresse peut
   être partagée par deux personnes (booking engine v3, retours du 24/09). */
function licenceLookup(raw){
  var q = digitsOf(raw);
  if(q.length !== LICENCE_DIGITS) return { error:'format' };
  if(digitsOf(licenceNumber()) === q) return { error:'self' };
  var list = STATE.account.relatives;
  for(var i=0;i<list.length;i++){
    if(list[i].licence === q) return { error:'known', rel:list[i] };
  }
  for(var j=0;j<FFG_DIRECTORY.length;j++){
    var e = FFG_DIRECTORY[j];
    if(e.licence === q){
      return { found:{ licence:q, firstName:e.firstName, lastName:e.lastName,
                       member:e.member } };
    }
  }
  return { found:{ licence:q, firstName:'Licencié·e', lastName:'n° ' + q, member:false } };
}
function lookupError(result){
  if(result.error === 'format'){
    return 'Un numéro de licence FFGolf compte ' + LICENCE_DIGITS + ' chiffres. '
         + 'Il figure sur la licence.';
  }
  if(result.error === 'self') return 'Ce numéro est celui de votre propre licence.';
  if(result.error === 'known'){
    return playerName(result.rel) + ' fait déjà partie de vos proches.';
  }
  return null;
}

/* --- Mes proches sur le parcours ------------------------------------------ */

/* Places qu'un proche occupe déjà sur ce départ, qu'il le partage ou non. */
function relativeTeePlayers(site, courseIndex, offset, minutes){
  if(!site || site.code !== STATE.siteCode || courseIndex !== 0) return 0;
  for(var i=0;i<relativeTees().length;i++){
    var t = relativeTees()[i];
    if(t.day === offset && t.minutes === minutes) return t.players;
  }
  return 0;
}

/* Départs visibles ce jour-là, sur le site et le parcours du brouillon : ceux
   des proches encore dans la liste et qui partagent leurs départs. */
function relativeTeesOn(offset){
  var d = STATE.draft;
  var site = draftSite();
  var out = [];
  if(!site || offset === null || offset === undefined) return out;
  /* Lot 11 : l'étape Départ montre tous les parcours ; les départs des
     proches (premier parcours) restent visibles quel que soit le parcours
     du brouillon. */
  if(site.code !== STATE.siteCode) return out;
  if(!dayIsOpen(site, 0, offset)) return out;
  for(var i=0;i<relativeTees().length;i++){
    var t = relativeTees()[i];
    if(t.day !== offset) continue;
    var rel = relativeById(t.relId);
    if(!rel || !rel.shares) continue;
    out.push({
      rel:rel,
      minutes:t.minutes,
      time:hhmm(t.minutes),
      players:t.players,
      key:slotKey(offset, t.minutes),
      seats:slotSeats(site, 0, offset, t.minutes)
    });
  }
  return out;
}
function relativeTeeAt(offset, minutes){
  var list = relativeTeesOn(offset);
  for(var i=0;i<list.length;i++){ if(list[i].minutes === minutes) return list[i]; }
  return null;
}

/* Le départ rejoint ne vaut que tant que le brouillon pointe encore dessus. */
function joinedRelative(){
  var d = STATE.draft;
  var j = d.joinWith;
  if(!j || j.key !== d.slotKey || j.siteCode !== d.siteCode
     || j.courseIndex !== d.courseIndex) return null;
  return relativeById(j.relId);
}

/* --- Cartes enregistrées --------------------------------------------------

   Une seule carte sert par défaut : c'est elle que le paiement d'un carnet
   annonce au lot 4. L'application écrit « carte », jamais un nom de réseau. */
function cardById(id){
  var list = STATE.account.cards;
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}
function mainCard(){
  var list = STATE.account.cards;
  for(var i=0;i<list.length;i++){ if(list[i].main) return list[i]; }
  return list.length ? list[0] : null;
}
function cardLabel(card){
