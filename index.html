}

/* --- Consentements -------------------------------------------------------- */

function consentEntry(id){
  return STATE.account.consents[id] || { on:false, days:0 };
}
function consentOn(id){ return !!consentEntry(id).on; }
function consentDays(id){ return consentEntry(id).days; }
function consentsOnCount(){
  var n = 0;
  for(var i=0;i<CONSENTS.length;i++){ if(consentOn(CONSENTS[i].id)) n += 1; }
  return n;
}

/* --- Actions du compte ----------------------------------------------------

   Toutes passent par `refresh()` : le profil n'empile pas d'écran pour une
   modification, il se refait en place, comme les étapes du tunnel. */

/* Un compte rendu chasse le précédent : deux lignes de compte rendu à l'écran
   en même temps ne se rapportent plus à un geste. */
function accountDone(text){
  STATE.account.done = text || null;
}

function openAccountSheet(kind, id){
  var a = STATE.account;
  if(kind !== 'contact' && kind !== 'relative' && kind !== 'card') return false;
  a.sheet = kind;
  a.editId = id || null;
  a.formError = null;
  a.form = {};

  if(kind === 'contact'){
    /* Lot 9d : le numéro est rangé au format international ; la feuille le
       rend en deux champs, indicatif et numéro national. */
    var c = contactOf();
    a.form = { email:c.email, cc:phoneCodeOf(c.phone), phone:phoneNational(c.phone),
               address:c.address };
  } else if(kind === 'relative'){
    /* Lot 9e : trois façons d'ajouter (licence, profil rattaché, lien), et
       la modification d'un proche existant. Le nom de famille du compte est
       proposé pour un profil rattaché, comme dans le booking engine v3. */
    var rel = id ? relativeById(id) : null;
    a.form = rel
      ? { mode:'edit', relation:relationOf(rel), firstName:rel.firstName,
          lastName:rel.lastName, birth:rel.birth || '', cc:phoneCodeOf(rel.phone),
          phone:phoneNational(rel.phone), licence:rel.licence || '' }
      : { mode:'find', lq:'', found:null, busy:false, relation:'Ami·e',
          firstName:'', lastName:profile().lastName, birth:'', cc:'33', phone:'',
          licence:'', sharing:false };
  } else {
    a.form = { number:'', expires:'', holder:accountName() };
  }
  refresh();
  return true;
}

function closeAccountSheet(){
  clearAccountSheet();
  refresh();
  return true;
}

function setAccountField(name, value){
  STATE.account.form[name] = value;
  return true;
}

/* Le champ « ce joueur a un compte au club » est une case, pas une saisie :
   il se bascule au toucher et redessine la feuille. */
function toggleAccountFlag(name){
  var a = STATE.account;
  a.form[name] = !a.form[name];
  refresh();
  return true;
}

function trimText(value){
  return String(value === null || value === undefined ? '' : value)
    .replace(/^\s+|\s+$/g, '');
}
function digitsOf(value){ return trimText(value).replace(/[^0-9]/g, ''); }

/* Coordonnées. L'erreur dit quoi corriger, elle ne s'excuse pas (brief §3). */
function saveContact(){
  var a = STATE.account;
  var email = trimText(a.form.email);
  var phone = trimText(a.form.phone);
  var address = trimText(a.form.address);

  if(email.indexOf('@') < 1 || email.indexOf('.', email.indexOf('@')) < 0){
    a.formError = 'Cette adresse ne peut pas recevoir de courriel. '
                + 'Vérifiez le signe arobase et le nom de domaine.';
    refresh();
    return false;
  }
  /* Lot 9d — repris du booking engine v3, retours du 24/09 : indicatif en
     liste, « 0032… » et « +32… » reconnus, numéro rangé au format
     international. Mêmes fonctions que le téléphone d'un proche (lot 9e). */
  if(!phone){
    a.formError = 'Indiquez votre téléphone : il reçoit les rappels de la veille.';
    refresh();
    return false;
  }
  var stored = phoneNorm(phone, a.form.cc);
  if(!stored){
    var c = phoneCode(phoneSplit(phone, a.form.cc).code);
    a.formError = 'Ce numéro ne correspond pas à l\'indicatif ' + c[2] + ' +' + c[0]
                + ' (exemple&nbsp;: ' + c[4] + '). Vérifiez l\'indicatif choisi.';
    refresh();
    return false;
  }
  if(!address){
    a.formError = 'Indiquez votre adresse : elle figure sur vos factures.';
    refresh();
    return false;
  }

  a.contact = { email:email, phone:stored, address:address };
  clearAccountSheet();
  accountDone('Vos coordonnées sont enregistrées.');
  refresh();
  return true;
}

/* Proche — lot 9e, repris du booking engine v3, retours du 24/09. Jamais
   d'ajout par e-mail : une même adresse peut être partagée par deux personnes,
   et la mauvaise serait rattachée. Trois voies seulement : la licence, le
   profil rattaché, le lien d'invitation (qui n'enregistre rien tant que le
   proche n'a pas créé son compte). */
function saveRelative(){
  var a = STATE.account;
  var known = a.editId ? relativeById(a.editId) : null;
  if(known) return saveRelativeEdit(known);
  if(a.form.mode === 'find') return saveFoundRelative();
  if(a.form.mode === 'create') return createRelative();
  return false;
}

function relativeFormError(text){
  STATE.account.formError = text;
  refresh();
  return false;
}

/* Champs d'un profil rattaché : prénom, nom, date de naissance et téléphone
   obligatoires, licence facultative. L'erreur dit quoi corriger. */
function profileFieldsError(f){
  var missing = [];
  if(!trimText(f.firstName)) missing.push('prénom');
  if(!trimText(f.lastName)) missing.push('nom');
  if(!trimText(f.birth)) missing.push('date de naissance');
  if(!trimText(f.phone)) missing.push('téléphone');
  if(missing.length){
    return 'À compléter&nbsp;: ' + missing.join(', ') + '. Les champs marqués '
         + 'd\'un astérisque sont obligatoires.';
  }
  var age = ageOn(trimText(f.birth));
  if(age === null) return 'La date de naissance se saisit jour, mois et année.';
  if(age < 0) return 'Cette date de naissance est à venir. Vérifiez l\'année.';
  if(age > 110) return 'Cette date de naissance est trop ancienne. Vérifiez l\'année.';
  if(!phoneNorm(f.phone, f.cc)){
    var c = phoneCode(phoneSplit(f.phone, f.cc).code);
    return 'Ce numéro ne correspond pas à l\'indicatif ' + c[2] + ' +' + c[0]
         + ' (exemple&nbsp;: ' + c[4] + '). Vérifiez l\'indicatif choisi.';
  }
  var lic = digitsOf(f.licence);
  if(lic && lic.length !== LICENCE_DIGITS){
    return 'Un numéro de licence FFGolf compte ' + LICENCE_DIGITS + ' chiffres. '
         + 'Laissez le champ vide si votre proche n\'en a pas.';
  }
  return null;
}

function saveFoundRelative(){
  var a = STATE.account;
  var found = a.form.found;
  if(!found){
    return relativeFormError('Recherchez d\'abord votre proche par son numéro de licence.');
  }
  a.seq += 1;
  a.relatives.push({
    id:'rel-' + a.seq,
    firstName:found.firstName,
    lastName:found.lastName,
    licence:found.licence,
    member:!!found.member,
    relation:a.form.relation || 'Ami·e',
    source:'licence',
    birth:null,
    phone:null,
    shares:false
  });
  clearAccountSheet();
  accountDone(escapeAttr(playerName(found)) + ' fait maintenant partie de vos proches.');
  refresh();
  return true;
}

function createRelative(){
  var a = STATE.account;
  var f = a.form;
  var err = profileFieldsError(f);
  if(err) return relativeFormError(err);
  a.seq += 1;
  var rel = {
    id:'rel-' + a.seq,
    firstName:trimText(f.firstName),
    lastName:trimText(f.lastName),
    licence:digitsOf(f.licence) || null,
    /* Un profil rattaché n'a pas de compte : s'il règle sa place lui-même,
       c'est à l'accueil. */
    member:false,
    relation:f.relation || 'Enfant',
    source:'profile',
    birth:trimText(f.birth),
    phone:phoneNorm(f.phone, f.cc),
    shares:false
  };
  a.relatives.push(rel);
  clearAccountSheet();
  accountDone('Profil de ' + escapeAttr(rel.firstName) + ' créé, rattaché à votre compte.');
  refresh();
  return true;
}

/* Un proche retrouvé par sa licence garde le nom que la FFGolf rend : seul
   le lien de parenté se modifie. Un profil rattaché se modifie en entier. */
function saveRelativeEdit(known){
  var f = STATE.account.form;
  if(known.source === 'profile'){
    var err = profileFieldsError(f);
    if(err) return relativeFormError(err);
    known.firstName = trimText(f.firstName);
    known.lastName = trimText(f.lastName);
    known.birth = trimText(f.birth);
    known.phone = phoneNorm(f.phone, f.cc);
    known.licence = digitsOf(f.licence) || null;
  }
  if(RELATIONS.indexOf(f.relation) > -1) known.relation = f.relation;
  clearAccountSheet();
  accountDone('Les informations de ' + escapeAttr(playerName(known)) + ' sont à jour.');
  refresh();
  return true;
}

function setRelativeMode(mode){
  var a = STATE.account;
  if(a.sheet !== 'relative' || a.editId) return false;
  if(mode !== 'find' && mode !== 'create' && mode !== 'invite') return false;
  if(a.form.mode === mode) return false;
  a.form.mode = mode;
  /* Créer un profil, c'est le plus souvent celui d'un enfant (v3). */
  a.form.relation = (mode === 'create') ? 'Enfant' : 'Ami·e';
  a.form.sharing = false;
  a.formError = null;
  refresh();
  return true;
}

function setRelation(value){
  var a = STATE.account;
  if(a.sheet !== 'relative' || RELATIONS.indexOf(value) < 0) return false;

}

function findRelativeLicence(){

/* Carte. Le prototype ne conserve que les quatre derniers chiffres : c'est
   aussi ce que l'écran annonce. */
function saveCard(){
  var a = STATE.account;
  var digits = digitsOf(a.form.number);
  var expires = trimText(a.form.expires);
  var holder = trimText(a.form.holder);

  if(digits.length !== CARD_DIGITS){
    a.formError = 'Un numéro de carte compte ' + CARD_DIGITS + ' chiffres. '
                + 'Ils figurent au recto.';
    refresh();
    return false;
  }
  if(!/^[0-9]{2}\/[0-9]{2}$/.test(expires)){
    a.formError = 'La date d\'expiration s\'écrit en quatre chiffres, '
                + 'mois puis année.';
    refresh();
    return false;
  }
  if(!/^[0-9]{3,4}$/.test(trimText(a.form.cvc || ''))){
    a.formError = 'Le cryptogramme compte trois chiffres, au dos de la carte.';
    refresh();
    return false;
  }
  if(!holder){
    a.formError = 'Indiquez le nom inscrit sur la carte.';
    refresh();
    return false;
  }

  var first = (a.cards.length === 0);
  a.cards.push({
    id:'card-' + (a.cards.length + 1) + '-' + digits.slice(-4),
    last4:digits.slice(-4),
    expires:expires,
    holder:holder,
    main:first
  });
  clearAccountSheet();
  accountDone('Votre carte se terminant par ' + digits.slice(-4)
            + ' est enregistrée.');
  refresh();
  return true;
}

/* Retirer la carte qui sert par défaut promeut la suivante : un compte qui a
   encore une carte doit toujours en avoir une qui serve. */
function dropCard(id){
  var a = STATE.account;
  for(var i=0;i<a.cards.length;i++){
    if(a.cards[i].id !== id) continue;
    var wasMain = a.cards[i].main;
    var last4 = a.cards[i].last4;
    a.cards.splice(i, 1);
    if(wasMain && a.cards.length) a.cards[0].main = true;
    clearAccountSheet();
    accountDone('La carte se terminant par ' + last4 + ' est retirée.');
    refresh();
    return true;
  }
  return false;
}

function setMainCard(id){
  var a = STATE.account;
  var found = cardById(id);
  if(!found || found.main) return false;
  for(var i=0;i<a.cards.length;i++){ a.cards[i].main = (a.cards[i].id === id); }
  accountDone('Vos achats seront réglés avec la carte se terminant par '
            + found.last4 + '.');
  refresh();
  return true;
}

/* --- Actualisation depuis la FFG -----------------------------------------

   Un appel qui reviendrait sans délai ne montrerait pas l'état d'attente que

function refreshFfg(){

  refresh();
  window.setTimeout(function(){

    a.index = ffgIndexAfter();
    a.ffgAt = 0;

/* Première saisie de la licence, chez le licencié externe dont la fiche est
   incomplète. Le même appel que l'actualisation : c'est la FFG qui rend
   l'index, le joueur ne le saisit pas.

   Le réglage de la barre de contrôle et cet écran écrivent le même état, mais
   ils ne font pas la même chose : une bascule de la barre réinitialise
   l'application, un geste du joueur dans son parcours ne le fait pas. Même
   partage qu'au lot 5 entre le réglage d'autorisation et la réponse à la boîte
   de dialogue du système. */
function saveLicence(){
  var a = STATE.account;
  if(a.ffgBusy) return false;
  /* Lot 9d : neuf chiffres, et la licence d'un proche ou d'un autre licencié
     est refusée (même recherche que le lot 9e). */
  var error = ownLicenceError(a.form.number);
  if(error){
    a.formError = error;
    refresh();
    return false;
  }
  a.formError = null;
  a.licGain = null;
  a.ffgBusy = true;
  refresh();
  window.setTimeout(function(){
    /* Le gain se chiffre avant d'enregistrer la licence : c'est l'écart entre
       les deux états (booking engine v3, retours du 24/09). */
    var gain = licenceGain();
    a.ffgBusy = false;
    a.licence = digitsOf(a.form.number);
    STATE.licenceOnFile = true;
    /* Le départ en cours suit : la place du titulaire passe au tarif licencié. */
    var d = STATE.draft;
    if(d.players.length && d.players[0].kind === 'holder') d.players[0].licence = true;
    a.ffgAt = 0;
    a.licGain = gain;
    accountDone('Licence ' + a.licence + ' reconnue. Le tarif licencié FFGolf '
              + 's\'applique dès maintenant.');
    refresh();
  }, FFG_DELAY);
  return true;
}

/* Le renouvellement d'une licence se fait auprès de la FFGolf ou du club :
   l'application y renvoie et rend compte de son effet (booking engine v3,

   rendu de renouvellement. */

/* « 0032… » ou « +32… » saisi dans le numéro : la liste des indicatifs suit,
   et le numéro se range en groupes — bindTel du booking engine v3. Le champ
   est relu à la sortie, jamais à chaque frappe : le curseur ne saute pas. */
function syncPhoneField(){
  var f = STATE.account.form;
  var raw = trimText(f.phone);

}

/* =========================================================================
   3. Utilitaires
   ========================================================================= */

function node(role){ return document.querySelector('[data-role="' + role + '"]'); }

/* Une saisie libre revient dans l'écran par un attribut HTML : sans échappement,
   un guillemet dans un nom casserait le balisage. */
function escapeAttr(text){
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
/* Lot 11 (22/10) : les pictos golf d'Alexie remplacent leurs équivalents
   Tabler partout où ils servent. */
var GOLF_ICONS = { 'golf':'trou', 'flag':'parcours', 'trophy':'competition', 'car':'voiturette',
                   'ball-tennis':'balle', 'school':'joueur', 'traffic-cone':'bunker',
                   'trolley':'sac', 'golf-club':'club' };
function icon(name){
  var g = GOLF_ICONS[name];
  if(g) return '<svg class="gi ti ti-' + name + '" aria-hidden="true"><use href="#gi-' + g + '"></use></svg>';
  return '<i class="ti ti-' + name + '" aria-hidden="true"></i>';
}

function reducedMotion(){
  try{
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }catch(e){ return false; }
}
function pushDuration(){ return reducedMotion() ? 0 : 220; }

/* Force le calcul de style pour figer l'etat de depart d'une transition.
   On ne passe pas par requestAnimationFrame : dans un onglet en arriere-plan
   il ne se declenche pas, et l'ecran entrant resterait hors champ. */
function reflow(el){ return el ? el.offsetWidth : 0; }

/* Défilement — sous jsdom, scrollTo est absent et scrollTop ne retient rien.
   On double donc la valeur dans data-scroll, qui sert de repli en lecture. */
function readScroll(el){
  if(!el) return 0;
  var native = el.scrollTop || 0;
  if(native) return native;
  var mirror = parseInt(el.getAttribute('data-scroll') || '0', 10);
  return isNaN(mirror) ? 0 : mirror;
}
function applyScroll(el, top){
  if(!el) return;
  try{
    if(typeof el.scrollTo === 'function'){ el.scrollTo(0, top); }
    else { el.scrollTop = top; }
  }catch(e){ el.scrollTop = top; }
  el.setAttribute('data-scroll', String(top));
}
var HERO_SOLID_AT = 180;
function watchScroll(el){
  el.addEventListener('scroll', function(){
    el.setAttribute('data-scroll', String(el.scrollTop || 0));
    if(el.getAttribute('data-path') === '/home'){
      node('top').classList.toggle('is-solid', (el.scrollTop || 0) > HERO_SOLID_AT);
    }
  });
}

/* =========================================================================
   4. Router par hash et pile de navigation
   ========================================================================= */

var hashLock = false;

function normalizePath(path){
  if(!path) return '/home';
  path = String(path).replace(/^#/, '');
  if(path.charAt(0) !== '/') path = '/' + path;
  if(path.length > 1) path = path.replace(/\/+$/, '');
  return path;
}

function pathFromHash(){ return normalizePath(window.location.hash || '#/home'); }

function setHash(path){
  var target = '#' + path;
  if(window.location.hash === target) return;
  hashLock = true;
  window.location.hash = target;
}

function resolveRoute(path){
  if(ROUTES[path]) return ROUTES[path];
  /* Lot 12b (30/10) : fiche d'un bon du wallet, /wallet/gift/<code>. */
  var gc = giftPathCode(path);
  if(gc){
    return { title:(GIFT_CARDS[gc].type === 'coffret' ? 'Coffret' : 'Carte cadeau'),
             tab:'wallet', lot:12, kind:'gift' };
  }
  var m = /^(\/[a-z]+)\/detail$/.exec(path);
  if(m && ROUTES[m[1]]){
    return { title:'Écran de détail', kind:'detail', parent:ROUTES[m[1]], lot:ROUTES[m[1]].lot };
  }
  return { title:'Écran introuvable', kind:'notfound' };
}

function currentEntry(){ return STATE.stack.length ? STATE.stack[STATE.stack.length - 1] : null; }
function currentPath(){ var e = currentEntry(); return e ? e.path : null; }
function stackDepth(){ return STATE.stack.length; }

function makeEntry(path, inheritedTab){
  var route = resolveRoute(path);
  return {
    path:path,
    route:route,
    tab:route.tab || inheritedTab || 'home',
    scroll:0,
    el:null
  };
}

function buildScreen(entry){
  var el = document.createElement('section');
  el.className = 'screen';
  el.setAttribute('data-role', 'screen');
  el.setAttribute('data-path', entry.path);
  el.setAttribute('data-scroll', '0');
  if(entry.route.tone) el.setAttribute('data-tone', entry.route.tone);
  var inner = document.createElement('div');
  inner.className = 'screen-inner';
  inner.innerHTML = renderScreen(entry);
  el.appendChild(inner);
  watchScroll(el);
  return el;
}

/* Remplace toute la pile — utilisé au démarrage, au changement d'onglet
   et à chaque réinitialisation. */
function setRoot(path){
  path = tunnelGuard(normalizePath(path));
  var viewport = node('viewport');
  for(var i=0;i<STATE.stack.length;i++){
    var old = STATE.stack[i].el;
    if(old && old.parentNode) old.parentNode.removeChild(old);
  }
  STATE.stack.length = 0;
  var entry = makeEntry(path, null);
  STATE.stack.push(entry);
  entry.el = buildScreen(entry);
  viewport.appendChild(entry.el);
  setHash(path);
  renderChrome();
  return entry;
}

/* Garde du tunnel green-fee — critères d'acceptation du brief §5, lot 2 :
   l'étape 4 est inatteignable sans parcours sélectionné sur un site
   multi-parcours, et l'étape 2 se saute d'elle-même sur un site
   mono-parcours. La garde vit ici et non dans les écrans : une adresse tapée
   à la main ou un retour navigateur passe par le même chemin. */
function tunnelGuard(path){
  path = v2Guard(path);
  if(path.indexOf('/notifications') === 0) return notifGuard(path);
  if(path.indexOf('/wallet') === 0) return walletGuard(path);
  if(path.indexOf('/book/lessons') === 0) return lessonGuard(path);
  if(path === '/book/practice/confirm') return STATE.wallet.practice.reference ? path : '/book/practice';
  if(path.indexOf('/book/gf/') !== 0) return path;
  if(path === '/book/gf/site') return path;

  var d = STATE.draft;
  if(!d.siteCode) return '/book/gf/site';
  var site = draftSite();
  if(!site){ d.siteCode = null; return '/book/gf/site'; }

  /* Lot 11 (retour du 22/10) : le tunnel suit celui du booking engine v3.
     Plus d'étape « parcours » : l'étape Départ montre tous les parcours du
     golf côte à côte, et le parcours se retient avec le créneau. Le premier
     parcours sert de valeur par défaut tant qu'aucun créneau n'est pris. */
  if(d.courseIndex === null || !site.courses[d.courseIndex]) d.courseIndex = 0;

  /* Le jour se choisit d'office : le premier jour où au moins un parcours
     du golf est ouvert. */
  if(d.dayOffset === null || !siteDayOpen(site, d.dayOffset)){
    d.dayOffset = firstSiteDay(site);
    d.slotKey = null;
  }

  if(path === '/book/gf/course') return '/book/gf/date';

  /* Ancienne adresse de l'étape 4, conservée le temps que les liens et les
     assertions du lot 2a la lâchent. */
  if(path === '/book/gf/slot') path = '/book/gf/date';

  if(path === '/book/gf/date') return path;
  if(d.dayOffset === null || !d.slotKey) return '/book/gf/date';

  /* À partir d'ici le départ est retenu : le titulaire existe, sans quoi
     aucun total ne peut se calculer. */
  ensurePlayers();

  if(path === '/book/gf/players') return path;
  /* Lot 11 : joueurs et options tiennent sur une seule étape. */
  if(path === '/book/gf/options') return '/book/gf/players';

  /* Étape 7 sautée quand il n'y a rien à payer — membre Passion, départ seul,
     sans invité ni option. C'est la garde qui la saute, pas l'écran des
     options : une adresse tapée à la main doit se comporter pareil. */
  if(path === '/book/gf/pay') return paymentNeeded() ? path : '/book/gf/confirm';

  if(path === '/book/gf/confirm'){
    return (paymentNeeded() && !d.payment) ? '/book/gf/pay' : path;
  }
  return path;
}

/* Garde du périmètre fonctionnel — lot 7. Les six écrans conçus pour la V2
   n'existent qu'en V1 + V2 : en V1 chacun ramène à l'écran qui le porterait,
   pas à l'accueil, pour que le retour se lise. L'onglet Club faisant
   exception — il est désactivé en V1, il n'y a pas d'écran où revenir — ses
   trois adresses ramènent à l'accueil.

   La garde vit ici, avec les quatre autres : sans elle, une adresse tapée à
   la main ouvrait l'écran d'un service que le commutateur venait d'éteindre. */
function v2Guard(path){
  if(showsV2()) return path;
  if(path.indexOf('/club') === 0) return '/home';
  if(path === '/book/spa') return '/book';
  if(path === '/wallet/cagnotte') return '/wallet';
  return path;
}

/* Garde du tunnel de cours — lot 3. Même rôle que celle du green-fee : la
   porte d'entrée fixe le mode, les valeurs par défaut sont posées avant tout
   retour anticipé (la garde ne se rappelle pas elle-même, piège du lot 2c),
   et une adresse tapée à la main se comporte comme un enchaînement d'écrans. */
function lessonGuard(path){
  var l = STATE.lesson;

  if(path === '/book/lessons/pro' || path === '/book/lessons/when') l.mode = 'solo';
  if(path === '/book/lessons/group') l.mode = 'group';

  if(l.mode === 'solo' && l.proId){
    var pro = proById(l.proId);
    if(l.dayOffset === null || !proDayHasSlots(pro, l.dayOffset, l.durationId)){
      l.dayOffset = firstProDay(pro, l.durationId);
      l.slotKey = null;
    }
  }
  if(l.mode === 'group'){
    if(l.dayOffset === null || !dayHasGroup(currentSite(), l.dayOffset)){
      l.dayOffset = firstGroupDay(currentSite());
      l.sessionId = null;
    }
  }
  /* Aucun jour trouvé sur tout l'horizon : l'écran s'ouvre quand même sur
     aujourd'hui, avec son état vide, plutôt que sur une date absente. */
  if(l.mode && l.dayOffset === null) l.dayOffset = 0;

  if(path === '/book/lessons') return path;
  if(path === '/book/lessons/detail'){
    return (l.openId && lessonBookingById(l.openId)) ? path : '/book/lessons';
  }
  if(path === '/book/lessons/pro') return path;
  if(path === '/book/lessons/group') return path;
  if(path === '/book/lessons/when') return l.proId ? path : '/book/lessons/pro';

  /* Le paiement et la confirmation supposent une séance retenue. */
  if(!pickedLesson()){
    if(l.mode === 'group') return '/book/lessons/group';
    return l.proId ? '/book/lessons/when' : '/book/lessons/pro';
  }
  if(path === '/book/lessons/pay') return path;
  if(path === '/book/lessons/confirm') return l.payment ? path : '/book/lessons/pay';
  return path;
}

/* Garde du portefeuille — lot 4. Même rôle que les deux autres : un compteur
   qui n'existe pas pour ce profil, un carnet non retenu ou un achat non réglé
   ramènent à l'étape qui manque. Le membre Passion n'ayant pas de compteur
   green-fee, ni son détail ni son carnet ne lui sont atteignables, y compris
   par une adresse tapée à la main. */
function walletGuard(path){
  var w = STATE.wallet;
  if(path === '/wallet') return path;
  if(path === '/wallet/pot'){
    return potAvailable(w.potId) ? path : '/wallet';
  }
  /* 29/10/2026 : la confirmation de recharge suppose une recharge réglée. */
  if(path === '/wallet/topup') return path;
  if(path === '/wallet/topup/confirm') return w.topup.reference ? path : '/wallet/topup';
  /* Lot 12b : la fiche d'un bon suppose le bon ajouté au wallet. */
  if(giftPathCode(path)) return giftEntry(giftPathCode(path)) ? path : '/wallet';
  if(path.indexOf('/wallet/buy') !== 0) return path;
  if(!potAvailable(w.buyPotId)) return '/wallet';
  if(path === '/wallet/buy') return path;
  if(!pickedPack()) return '/wallet/buy';
  if(path === '/wallet/buy/pay') return path;
  if(path === '/wallet/buy/confirm') return w.reference ? path : '/wallet/buy/pay';
  return path;
}

/* Garde des notifications — lot 5. Un seul cas à tenir : la marche à suivre
   dans les réglages du téléphone n'a de sens que si les notifications y sont
   coupées. L'amorce, elle, reste atteignable dans les trois états — elle dit
   à chacun ce qu'il en est, c'est son rôle. Adresse tapée à la main
   comprise, comme pour les trois autres gardes. */
function notifGuard(path){
  if(path === '/notifications/system' && !pushBlocked()) return '/notifications';
  return path;
}

function navigate(path){
  path = tunnelGuard(normalizePath(path));
  if(path === currentPath()) return false;
  var from = currentEntry();
  if(from) from.scroll = readScroll(from.el);
  var entry = makeEntry(path, from ? from.tab : null);
  STATE.stack.push(entry);
  entry.el = buildScreen(entry);
  node('viewport').appendChild(entry.el);
  animate(entry.el, from ? from.el : null, 'push');
  setHash(path);
  renderChrome();
  return true;
}

function back(){
  if(STATE.stack.length < 2) return false;
  var leaving = STATE.stack.pop();
  var entry = currentEntry();
  entry.el.hidden = false;
  /* Le tunnel se relit en revenant : l'étape retrouvée doit montrer ce qui a
     été choisi plus loin, sans quoi le jour ou le départ retenu disparaît de
     l'écran alors qu'il est toujours au brouillon. Le défilement est rendu
     ensuite, la reconstruction ne le touche pas.

     Le profil s'y ajoute au lot 6, et pour la même raison : chacune de ses
     rubriques modifie ce que sa racine affiche — l'index, le nombre de
     proches, la carte par défaut, le compte des consentements. Sans cette
     relecture, la racine montrait encore « Index 18,4 » au retour d'une
     actualisation qui venait de le passer à 18,2. */
  if(entry.path.indexOf('/book/gf/') === 0
     || entry.path.indexOf('/book/lessons') === 0
     || entry.path.indexOf('/wallet') === 0
     || entry.path.indexOf('/profile') === 0
     || entry.path.indexOf('/bookings') === 0
     || entry.path === '/book/table'
     || entry.path === '/book/practice'
     || entry.path === '/qr'
     || entry.path.indexOf('/book/comp') === 0){
    var inner = entry.el.querySelector('.screen-inner');
    if(inner) inner.innerHTML = renderScreen(entry);
  }
  applyScroll(entry.el, entry.scroll);
  animate(entry.el, leaving.el, 'pop');
  setHash(entry.path);
  renderChrome();
  return true;
}

/* Remonte à une étape déjà empilée. Les écrans intermédiaires sont retirés
   sans animation, seul le dernier saut est animé : enchaîner deux back()
   ferait se chevaucher deux transitions. */
function backTo(path){
  path = normalizePath(path);
  var idx = -1;
  for(var i=0;i<STATE.stack.length;i++){ if(STATE.stack[i].path === path) idx = i; }
  if(idx < 0) return navigate(path);
  if(idx === STATE.stack.length - 1) return false;
  while(STATE.stack.length - 2 > idx){
    var mid = STATE.stack.splice(STATE.stack.length - 2, 1)[0];
    if(mid.el && mid.el.parentNode) mid.el.parentNode.removeChild(mid.el);
  }
  return back();
}

/* Reconstruit l'écran courant sans toucher à la pile ni au défilement.
   Sert aux réglages internes à un écran — l'ouverture du calendrier mensuel
   de l'étape 3 — qui ne sont pas une navigation. */
function refresh(){
  var entry = currentEntry();
  if(!entry || !entry.el) return false;
  var top = readScroll(entry.el);
  var inner = entry.el.querySelector('.screen-inner');
  if(!inner) return false;
  inner.innerHTML = renderScreen(entry);
  applyScroll(entry.el, top);
  renderChrome();
  return true;
}

/* Transitions push / pop — translation horizontale, durée nulle si
   prefers-reduced-motion est actif. */
function animate(incoming, outgoing, direction){
  var dur = pushDuration();

  if(direction === 'push'){
    incoming.classList.add('is-offstage');
    if(outgoing) outgoing.classList.remove('is-behind');
  } else {
    incoming.classList.remove('is-offstage');
    incoming.classList.add('is-behind');
  }

  reflow(incoming);

  incoming.classList.add('is-animated');
  if(outgoing) outgoing.classList.add('is-animated');
  if(direction === 'push'){
    incoming.classList.remove('is-offstage');
    if(outgoing) outgoing.classList.add('is-behind');
  } else {
    incoming.classList.remove('is-behind');
    if(outgoing) outgoing.classList.add('is-offstage');
  }

  window.setTimeout(function(){ settle(incoming, outgoing, direction); }, dur + 20);
}

function settle(incoming, outgoing, direction){
  incoming.classList.remove('is-animated', 'is-offstage', 'is-behind');
  if(outgoing){
    outgoing.classList.remove('is-animated');
    if(direction === 'push'){
      outgoing.hidden = true;
    } else {
      outgoing.classList.remove('is-offstage', 'is-behind');
      if(outgoing.parentNode) outgoing.parentNode.removeChild(outgoing);
    }
  }
}

function selectTab(id){
  var tab = null;
  for(var i=0;i<TABS.length;i++){ if(TABS[i].id === id) tab = TABS[i]; }
  if(!tab) return false;
  if(tab.v2 && !showsV2()) return false;
  var here = currentEntry();
  if(here && here.tab === id && here.path === tab.root) return false;
  setRoot(tab.root);
  return true;
}

function onHashChange(){
  if(hashLock){ hashLock = false; return; }
  var path = pathFromHash();
  if(path === currentPath()) return;
  var prev = STATE.stack.length > 1 ? STATE.stack[STATE.stack.length - 2] : null;
  if(prev && prev.path === path){ back(); return; }
  navigate(path);
}

function renderAppbar(){

  var route = entry.route;

  top.classList.toggle('is-brand', route.tone === 'brand');
  /* Lot 11 : sur l'accueil, l'en-tête passe en transparence au-dessus de la
     photo du golf, puis redevient blanc quand la photo est passée. */
  /* Retour du 22/10 : le fil des étapes du tunnel vit dans l'en-tête,
     compact et toujours visible. */
  var stepAt = GF_STEP_OF[entry.path];
  var strip = top.querySelector('.topstep');
  if(stepAt === undefined){
    if(strip) strip.parentNode.removeChild(strip);
  } else {
    if(!strip){
      strip = document.createElement('div');
      strip.className = 'topstep';
      top.appendChild(strip);
    }
    strip.innerHTML = gfFil(stepAt);
  }
  var over = (entry.path === '/home');
  top.classList.toggle('is-over', over);

    left = '<button type="button" class="icon-btn" data-role="back" aria-label="Revenir">'
         + icon('chevron-left') + '</button>';
  } else {
    left = brandLogo();
  }

  /* Une route porte une action, ou plusieurs : l'accueil en a deux depuis le
     lot 5. La forme au singulier des autres routes n'a pas eu à changer. */
  var actions = route.actions || (route.action ? [route.action] : []);
  var right = '';
  for(var i=0;i<actions.length;i++){
    var a = actions[i];
    var unread = a.badge ? unreadCount() : 0;
    right += '<button type="button" class="icon-btn" data-nav="' + a.to
           + '" aria-label="' + a.label + unreadLabel(unread) + '">'
           + icon(a.icon)
           + (unread
              ? '<span class="bell-badge" data-role="bell-badge">' + unread + '</span>'
              : '')
           + '</button>';

  bar.innerHTML =
      '<span class="appbar-slot is-left">' + left + '</span>'
    + '<h1 class="appbar-title" data-role="title">' + route.title + '</h1>'
    + '<span class="appbar-slot is-right">' + right + '</span>';
}

          + '</span>'

function pad2(n){ return n < 10 ? '0' + n : String(n); }

function dayLabel(d, today){
  if(today) return 'AUJOURD\'HUI';
  return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];
}

/* « 2 h 15 », « 45 min » — le compte à rebours du brief lot 1. */
function countdown(minutes){
  var h = Math.floor(minutes / 60);
  var m = minutes % 60;
  if(h <= 0) return m + ' min';
  return h + ' h ' + pad2(m);
}

function courseLabel(course){ return course.name + ' ' + course.holes + ' trous'; }

/* Prochaine réservation. Le scénario vient de la barre de contrôle : le
   prototype doit pouvoir montrer les trois états à la demande, sans dépendre
   de l'heure à laquelle la revue client a lieu. */
function nextBooking(){
  if(STATE.demoBooking === 'none') return null;
  var p = profile();
  var site = currentSite();
  var course = site.courses[p.booking.courseIndex] || site.courses[0];
  var now = new Date();

  if(STATE.demoBooking === 'soon'){
    var soonAt = new Date(now.getTime() + 135 * 60000);
    return {
      date:soonAt,
      day:dayLabel(soonAt, true),
      time:pad2(soonAt.getHours()) + ':' + pad2(soonAt.getMinutes()),
      course:courseLabel(course),
      players:p.booking.players,
      payment:p.booking.payment,
      minutesAway:135,
      soon:true
    };
  }

  var laterAt = new Date(now.getTime() + 3 * 86400000);
  return {
    date:laterAt,
    day:dayLabel(laterAt, false),
    time:p.booking.time,
    course:courseLabel(course),

/* Un compteur de la bande crédits. Le green-fee du membre Passion n'est pas un
   compteur : c'est un accès, d'où la valeur « Illimité ».

   Lot 4 — les soldes ne sont plus lus dans le jeu de données mais dans
   potValue(). Le portefeuille est l'écran de référence des soldes : la bande
   de l'accueil ne doit pas pouvoir le contredire, ce qui arrivait dès qu'un
   réglage de la barre de contrôle changeait un solde, ou après un achat. */
function creditTile(spec, label){
  if(spec.unlimited){
    return '<div class="credit is-open">'
         + '<p class="credit-value">Illimité</p>'
         + '<p class="credit-label">' + label + '</p></div>';
  }
  return '<div class="credit' + (spec.zero ? ' is-zero' : '') + '">'
       + '<p class="credit-value">' + spec.text + '</p>'
       + '<p class="credit-label">' + label + '</p></div>';
}
function creditSpec(id){
  var value = potValue(id);
  if(value === null) return { unlimited:true };
  return { zero:(value === 0), text:potShort(id, value) };
}

function homeCredits(){
  var p = profile();
  var greenfee = potValue('greenfee');

  var buckets = potValue('buckets');

  var notes = '';

    notes = '<p class="credits-notes">'
          + '<span>Accès illimité &middot; ' + accessScope() + '</span>'
          + '<b>' + (p.invitations.total - p.invitations.used) + ' invitations sur '
          + p.invitations.total + '</b>'
          + '</p>';
  }

  /* Un compteur à zéro garde sa place et devient une invitation à agir.
     Un compteur bas, lui, remonte en alerte : voir alertCandidates(). */
  var nudge = '';
  if(greenfee === 0){
    nudge = 'Aucun crédit green-fee. <span>Achetez un carnet pour réserver plus vite.</span>';
  } else if(lessons === 0){
    nudge = 'Aucun crédit de cours. <span>Achetez un carnet pour réserver plus vite.</span>';
  } else if(buckets === 0){
    nudge = 'Aucun seau de practice. <span>Achetez un carnet pour vous entraîner sans passer à l\'accueil.</span>';
  }
  if(nudge) nudge = '<p class="credits-nudge">' + nudge + '</p>';

  return ''
    + '<section class="section">'
    +   '<p class="eyebrow">Vos crédits</p>'

    +     '<div class="credits-row">'
    +       creditTile(creditSpec('greenfee'), 'Green-fees')

/* Alertes contextuelles : au maximum deux, triées par urgence décroissante.
   Les compteurs à zéro n'entrent pas ici, ils sont traités dans la bande
   crédits — sans quoi la même information serait affichée deux fois. */
function alertCandidates(){
  var p = profile();
  var site = currentSite();
  /* Même source que la bande et que le portefeuille : un seuil bas ne peut
     pas se déclencher sur un solde que l'écran n'affiche pas. */
  var lessons = potValue('lessons');
  var buckets = potValue('buckets');
  var list = [];

  if(p.membership && p.membership.daysLeft <= MEMBERSHIP_ALERT_DAYS){
    list.push({
      urgency:90,
      tone:'attention',
      icon:'alert-circle',
      title:'Votre cotisation expire dans ' + p.membership.daysLeft + ' jours',
      text:'Renouvelez avant le ' + membershipEnd() + ' pour conserver votre accès illimité.',
      /* Le lot 1 renvoyait à la racine du profil, faute d'écran de cotisation.
         Le lot 6 l'a livré : l'action vise désormais l'écran où le
         renouvellement se demande, comme les notifications visent l'écran
         concerné depuis le lot 5. */
      action:{ label:'Renouveler', nav:'/profile/membership' }
    });
  }

  if(lessons > 0 && lessons <= LOW_CREDIT){
    list.push({
      urgency:65,
      tone:'attention',
      icon:'school',
      title:'Il vous reste ' + hoursLabel(lessons) + ' de cours',
      text:'Votre carnet arrive au bout. Rechargez-le avant de réserver votre prochaine séance.',
      action:{ label:'Acheter un carnet', tab:'wallet' }
    });
  }

  if(buckets > 0 && buckets <= LOW_CREDIT){
    list.push({
      urgency:60,
      tone:'attention',
      icon:'ball-tennis',
      title:'Il vous reste ' + buckets + ' seaux de practice',
      text:'Rechargez votre carnet pour vous entraîner sans passer par l\'accueil.',
      action:{ label:'Acheter un carnet', tab:'wallet' }
    });
  }

  var works = worksText(site);
  if(works){
    list.push({
      urgency:40,
      tone:'neutral',
      icon:'traffic-cone',
      title:'Travaux ' + atSite(site),
      text:works,
      /* Le lot 1 avait laissé cette alerte sans action : l'écran derrière
         « Voir les dates » n'existait pas encore, et un bouton qui ne mène
         nulle part se lit comme une panne. Le lot 5 le désigne — c'est
         l'étape 3 du tunnel, où les jours fermés sont barrés avec leur
         motif — et la notification de travaux vise le même écran. */
      /* Retour du 22/10 : simple information sur le parcours, sans bouton.
         La notification de travaux garde son lien vers l'étape Départ. */
      action:null
    });
  }

  list.sort(function(a, b){ return b.urgency - a.urgency; });
  return list;
}

function homeAlerts(){
  var list = alertCandidates().slice(0, 2);
  if(!list.length) return '';

  var html = '<section class="section" data-role="alerts">'
           + '<p class="eyebrow">À surveiller</p>';
  for(var i=0;i<list.length;i++){
    var a = list[i];
    html += '<div class="alert' + (a.tone === 'attention' ? ' is-attention' : '') + '" data-role="alert">'
          +   '<div class="alert-head">'
          +     '<span class="alert-icon">' + icon(a.icon) + '</span>'
          +     '<div>'
          +       '<p class="alert-title">' + a.title + '</p>'

}

   séparés par un retour à la ligne est un défaut visible. */
function amount(value){ return grouped(value) + '&nbsp;€'; }

/* Tarif unitaire ramene d'un carnet. Sous dix euros, l'arrondi a l'euro ecrase
   l'ecart entre les trois carnets — « soit 6 € le seau » trois fois de suite
   n'apprend rien au joueur. On garde alors une decimale. */
function unitAmount(value, reference){
  if(reference >= 10) return amount(Math.round(value));
  return String(Math.round(value * 10) / 10).replace('.', ',') + '&nbsp;€';
}

/* Espace insecable de groupement des milliers, typographie francaise. */
function grouped(value){
  var text = String(value);
  var out = '';
  for(var i=0;i<text.length;i++){
    var left = text.length - i;
    if(i > 0 && left % 3 === 0) out += '\u00a0';
    out += text.charAt(i);
  }
  return out;
}
function metres(value){
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '&nbsp;') + '&nbsp;m';
}
function seatsLabel(seats){
  if(seats === 0) return 'Complet';
  return seats + (seats > 1 ? ' places' : ' place');
}
function capitalize(text){ return text.charAt(0).toUpperCase() + text.slice(1); }

/* « à Le Touquet » est la faute que le lot 1 avait rencontrée sur les noms de
   sites, et que l'alerte de travaux portait depuis. Comme dePrenom() au lot 3,
   la forme correcte se calcule une fois plutôt que de se recopier dans chaque
   libellé. Seuls les noms à article défini pluriel ou masculin la demandent :
   « au Touquet », « aux Yvelines », et « à La Grande Bastide » sans changement. */
function atSite(site){
  var name = site.name;
  if(name.indexOf('Les ') === 0) return 'aux ' + name.slice(4);
  if(name.indexOf('Le ') === 0) return 'au ' + name.slice(3);
  return 'à ' + name;
}

/* Fil des choix déjà faits. Chaque maillon ramène à son étape ; l'étape sautée
   d'un site mono-parcours n'est pas un bouton, il n'y a rien à y choisir. */
function crumbs(step){
  var d = STATE.draft;
  var site = draftSite();
  if(!site) return '';

  var links = [{ label:site.name, to:'/book/gf/site', icon:'map-pin' }];

  var afterCourse = (step !== 'course');
  var afterSlot = (step === 'players' || step === 'options' || step === 'pay');
  var afterDate = afterSlot;

  if(afterCourse){
    var course = draftCourse();
    if(course){
      links.push({
        label:course.name,
        to:site.courses.length > 1 ? '/book/gf/course' : null,
        icon:'flag'
      });
    }
  }
  if(afterDate && d.dayOffset !== null){
    links.push({ label:shortDate(d.dayOffset), to:'/book/gf/date', icon:'calendar' });
  }
  if(afterSlot && d.slotKey){
    var picked = draftSlot();
    if(picked) links.push({ label:picked.time, to:'/book/gf/date', icon:'clock' });
  }

  var html = '<nav class="crumbs" data-role="crumbs" aria-label="Vos choix">';
  for(var i=0;i<links.length;i++){
    var l = links[i];
    html += l.to
      ? '<button type="button" class="crumb" data-backto="' + l.to + '" '
        + 'aria-label="Revenir au choix : ' + l.label + '">'
        + icon(l.icon) + '<span>' + l.label + '</span></button>'
      : '<span class="crumb">' + icon(l.icon) + '<span>' + l.label + '</span></span>';
  }
  return html + '</nav>';
}

function monthGrid(site, ci){
  var d = STATE.draft;

  var first = new Date(base.getFullYear(), base.getMonth() + d.monthShift, 1);

  var html = '<div class="month" data-role="month">'
    + '<div class="month-head">'
    +   '<button type="button" class="month-nav" data-act="month-prev"'

    +     ' ' + first.getFullYear() + '</p>'
    +   '<button type="button" class="month-nav" data-act="month-next"'
    +     (d.monthShift >= 3 ? ' disabled' : '') + ' aria-label="Mois suivant">'
    +     icon('chevron-right') + '</button>'
    + '</div>'
    + '<div class="month-grid">';

  for(var w=0;w<7;w++){ html += '<span class="month-dow">' + DOW_LUNDI[w] + '</span>'; }
  for(var v=0;v<lead;v++){ html += '<span class="month-cell is-void"></span>'; }

  for(var n=1;n<=count;n++){
    var date = new Date(first.getFullYear(), first.getMonth(), n);
    var offset = offsetOf(date);
    var open = (ci === null) ? siteDayOpen(site, offset) : dayIsOpen(site, ci, offset);
    var closed = (offset >= 0 && offset <= BOOK_HORIZON && !open);
    var prox = open && dayHasRelatives(offset);

          +   (closed ? ' is-closed' : '')

          +   'data-pick="day" data-value="' + offset + '"'
          +   (open ? '' : ' disabled aria-disabled="true"')
          +   ' aria-label="' + longDate(offset) + (open ? '' : ', fermé')
          +   (prox ? ', vos proches jouent' : '') + '">'

          +   (ci === null && open ? monthPrice(site, offset) : '')
          +   (prox ? '<span class="month-dot" data-role="day-prox"></span>' : '')
          + '</button>';
  }
  return html + '</div></div>';
}

/* --- Lot 11 · étape Départ du booking engine v3 ---------------------------

   Retour d'Alexie du 22/10 : « avoir le même parcours que sur le booking
   engine v3 mobile pour réserver sur le Touquet ». Trois étapes, comme v3 :
   Départ, Joueurs & options, Paiement. L'étape Départ réunit la date, le
   nombre de joueurs, le moment de la journée et les proches dans une barre
   de recherche ; une bande de jours avec le prix « dès » ; puis chaque
   parcours du golf avec sa photo et sa grille de créneaux (heure, prix,
   places prises). Les créneaux complets restent visibles (lot 10). */
var GF_STEPS = ['Départ', 'Joueurs & options', 'Paiement'];
var GF_STEP_OF = { '/book/gf/date':0, '/book/gf/players':1, '/book/gf/pay':2 };
var GF_CLAMP = 9;
function gfFil(cur){
  var html = '<ol class="fil" data-role="fil" aria-label="Étapes de la réservation">';
  for(var i=0;i<GF_STEPS.length;i++){
    var cls = i < cur ? ' is-done' : (i === cur ? ' is-on' : '');
    html += '<li class="fil-step' + cls + '"' + (i === cur ? ' aria-current="step"' : '') + '>'
          +   '<span class="fil-dot">' + (i < cur ? icon('check') : (i + 1)) + '</span>'
          +   '<span class="fil-label">' + GF_STEPS[i] + '</span>'
          + '</li>';
  }
  return html + '</ol>';
}

function siteDayOpen(site, offset){
  for(var i=0;i<site.courses.length;i++){ if(dayIsOpen(site, i, offset)) return true; }
  return false;
}
function firstSiteDay(site){
  for(var i=0;i<=BOOK_HORIZON;i++){ if(siteDayOpen(site, i)) return i; }
  return null;
}
function inWindow(block){
  var w = STATE.draft.window;
  return w === 'all' || w === block.id;
}
function courseSlots(site, ci, offset){
  var out = [];
  for(var b=0;b<TEE_BLOCKS.length;b++){
    if(!inWindow(TEE_BLOCKS[b])) continue;
    out = out.concat(slotsOfBlock(site, ci, offset, TEE_BLOCKS[b]));
  }
  return out;
}
/* Prix « dès » d'un jour, pour le groupe cherché : le moins cher des
   créneaux qui ont la place, tous parcours confondus. */
function dayFrom(site, offset){
  var party = needSeats();
  var best = null;
  for(var ci=0;ci<site.courses.length;ci++){
    if(!dayIsOpen(site, ci, offset)) continue;
    var list = courseSlots(site, ci, offset);
    for(var i=0;i<list.length;i++){
      if(list[i].seats < party) continue;
      if(best === null || list[i].price < best) best = list[i].price;
    }
  }
  return best;
}
function dayTile(site, offset, selected){
  var date = dateAt(offset);
  var open = siteDayOpen(site, offset);
  var best = open ? dayFrom(site, offset) : null;
  var full = open && best === null;
  var prox = open && dayHasRelatives(offset);
  var price = !open ? 'fermé'
            : (full ? 'complet' : (passCoversSite(site) ? 'Inclus' : 'dès ' + amount(best)));
  return '<button type="button" class="dtile'
       +   (selected ? ' is-on is-selected' : '') + (full ? ' is-full' : '') + '" '
       +   'data-pick="day" data-value="' + offset + '"'
       +   (open ? '' : ' disabled aria-disabled="true"')
       +   ' aria-label="' + longDate(offset) + ', ' + price
       +   (prox ? ', vos proches jouent' : '') + '">'
       +   (prox ? '<span class="day-dot" data-role="day-prox"></span>' : '')
       +   '<span class="dtile-d">' + capitalize(JOURS_COURT[date.getDay()]) + ' ' + date.getDate() + '</span>'
       +   '<span class="dtile-m">' + MOIS_COURT[date.getMonth()] + '</span>'
       +   '<span class="dtile-p">' + price + '</span>'
       + '</button>';
}
