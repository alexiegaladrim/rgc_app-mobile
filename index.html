.notif-text{ font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.notif-cta{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:4px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--gold-dark);
}
.notif-cta .ti{ font-size:15px; }

/* --- Boîte vide. Une invitation à agir, pas un constat (brief §3). --- */
.notif-empty{
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  padding:24px 18px;
  text-align:center;
}
.notif-empty .ti{ font-size:26px; color:var(--ink-3); }
.notif-empty-title{
  margin:8px 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.notif-empty-text{
  margin:0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.notif-empty .btn{ max-width:260px; margin-left:auto; margin-right:auto; }

/* --- Préférences : une matrice type par canal, opt-in cellule par cellule
       (RGPD, brief lot 5). Trois colonnes de 44 px, la contrainte de cible
       tactile fixe la largeur avant le confort de lecture. --- */
.prefs{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  overflow:hidden;
}
.pref-head,
.pref-row{
  display:grid;
  grid-template-columns:1fr 44px 44px 44px;
  align-items:center;
  gap:0;
}
.pref-head{
  padding:10px 14px 8px;
  border-bottom:1px solid var(--line);
  background:var(--canvas);
}
.pref-head span{
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-3);
  text-align:center;
}
.pref-head span:first-child{ text-align:left; letter-spacing:.08em; }
.pref-row{ padding:8px 14px; }
.pref-row + .pref-row{ border-top:1px solid var(--line); }
.pref-label{ min-width:0; padding-right:8px; }
.pref-name{
  display:block;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.pref-when{
  display:block;
  margin-top:2px;
  font-size:var(--t-11);
  line-height:1.35;
  color:var(--ink-3);
}
.pref-box{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:none;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink-3);
  font-size:15px;
}
.pref-box span{
  width:22px;
  height:22px;
  border-radius:6px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
}
.pref-box.is-on span{ background:var(--gold); border-color:var(--gold); color:var(--surface); }
.pref-box[disabled]{ cursor:default; opacity:.45; }
.pref-void{
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--t-13);
  color:var(--ink-3);
}
.prefs-foot{
  margin:12px 2px 0;
  font-size:var(--t-11);
  line-height:1.45;
  color:var(--ink-3);
}
.prefs-foot + .prefs-foot{ margin-top:6px; }

/* --- Amorce de permission. Elle explique ce que le joueur va recevoir avant
       que le système ne le demande : demander à froid fait chuter le taux
       d'acceptation (brief lot 5). --- */
.primer-list{
  margin:18px 0 0;
  padding:0;
  list-style:none;
}
.primer-list li{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
  font-size:var(--t-15);
  color:var(--ink-2);
}
.primer-list li:last-child{ border-bottom:1px solid var(--line); }
.primer-list .ti{ flex:0 0 auto; font-size:20px; color:var(--gold-dark); margin-top:1px; }

/* --- Marche à suivre dans les réglages du téléphone. Numérotée : c'est un
       chemin à refaire de mémoire, hors de l'application. --- */
.steps{
  margin:18px 0 0;
  padding:0 0 0 22px;
}
.steps li{
  padding:6px 0;
  font-size:var(--t-15);
  line-height:1.45;
  color:var(--ink-2);
}
.steps b{ font-weight:var(--w-medium); color:var(--ink); }

/* --- Boîte de dialogue du système. Elle n'appartient pas à l'application :
       centrée, sans marque, boutons côte à côte, comme une alerte iOS. Le
       bloc conteneur est .viewport, comme les feuilles du lot 3. --- */
.sysalert{
  position:fixed;
  inset:0;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 48px;
  background:var(--scrim-system);
}
.sysalert-card{
  width:100%;
  max-width:270px;
  border-radius:var(--r-card);
  background:var(--surface);
  text-align:center;
  overflow:hidden;
}
.sysalert-body{ padding:18px 16px 16px; }
.sysalert-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.sysalert-text{
  margin:6px 0 0;
  font-size:var(--t-13);
  line-height:1.4;
  color:var(--ink-2);
}
.sysalert-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
}
.sysalert-btn{
  min-height:44px;
  padding:0 6px;
  border:0;
  background:none;
  font-family:inherit;
  /* 15 px et non 17 : « Ne pas autoriser » passe alors sur une seule ligne
     dans les 135 px d'une demi-alerte. iOS empilerait les deux boutons ; le
     prototype prefere les garder cote a cote. */
  font-size:var(--t-15);
  color:var(--ink);
  cursor:pointer;
}
.sysalert-btn + .sysalert-btn{ border-left:1px solid var(--line); }
.sysalert-btn.is-strong{ font-weight:var(--w-semi); }
.sysalert-btn:active{ background:var(--canvas); }

/* =========================================================================
   4h. Profil — lot 6
   ========================================================================= */

/* --- Carte d'identité, en tête du profil. Le portrait reprend le placeholder
       des pros du lot 3 : dégradé sourd aux couleurs des tokens, aucune image
       externe. Les initiales par-dessus disent que ce n'est pas une photo. --- */
.ident{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.avatar{
  position:relative;
  flex:0 0 auto;
  width:64px;
  height:64px;
}
.avatar .photo{
  width:64px;
  height:64px;
  border-radius:var(--r-pill);
}
.avatar-initials{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.ident-body{ flex:1 1 auto; min-width:0; }
.ident-name{
  margin:0;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.ident-meta{
  margin:4px 0 0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.ident-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.ident.is-large{ flex-direction:column; text-align:center; }
.ident.is-large .avatar,
.ident.is-large .avatar .photo{ width:88px; height:88px; }
.ident.is-large .avatar-initials{ font-size:var(--t-28); }
.ident.is-large .ident-chips{ justify-content:center; }

/* --- Entrée de profil : le composant du lot 2a, avec la valeur courante à
       droite. Elle évite d'ouvrir l'écran pour savoir ce qu'il contient. --- */
.pick-value{
  flex:0 0 auto;
  max-width:42%;
  font-size:var(--t-13);
  color:var(--ink-3);
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.pick-flag{
  flex:0 0 auto;
  width:8px;
  height:8px;
  border-radius:var(--r-pill);
  background:var(--attention);
}

/* --- Droits attachés à la cotisation. Une ligne par droit : le libellé à
       gauche, ce qu'il vaut à droite. --- */
.rights{ display:flex; flex-direction:column; gap:2px; margin-top:14px; }
.right{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:11px 0;
  border-top:1px solid var(--line);
}
.right .ti{ flex:0 0 auto; font-size:19px; color:var(--gold-dark); margin-top:1px; }
.right-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.right-label{ font-size:var(--t-15); color:var(--ink); }
.right-value{ font-size:var(--t-13); color:var(--ink-2); }

/* --- Certificat médical. Trois états : valide, à renouveler, échu. La bordure
       suit l'état, comme le bandeau système du lot 5. --- */
.med{
  margin-top:16px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
}
.med.is-soon{ border-color:var(--attention); }
.med.is-expired{ border-color:var(--negative); }
.med-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.med-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.med-date{
  margin:8px 0 0;
  font-size:var(--t-15);
  color:var(--ink);
}
.med-text{
  margin:6px 0 0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.med .btn{ margin-top:14px; min-height:44px; font-size:var(--t-15); }
.chip.is-attention{ border-color:var(--attention); color:var(--attention); }
.chip.is-positive{ border-color:var(--positive); color:var(--positive); }

/* --- Cartes enregistrées. Même structure qu'un compteur du lot 4 : un corps
       qui décrit, des actions dessous. --- */
.payrow{
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
}
.payrow + .payrow{ margin-top:10px; }
.payrow.is-main{ border-color:var(--gold); }
.payrow-top{ display:flex; align-items:flex-start; gap:12px; }
.payrow-top .ti{ flex:0 0 auto; font-size:20px; color:var(--ink-2); margin-top:2px; }
.payrow-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.payrow-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.payrow-name{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.payrow-meta{ font-size:var(--t-13); color:var(--ink-2); }
.payrow-actions{ display:flex; gap:10px; margin-top:12px; }
.payrow-actions .btn{ flex:1 1 0; min-height:44px; font-size:var(--t-13); margin:0; }

/* --- Consentement : le composant de choix du lot 2c, avec la date de recueil
       en pied de ligne. Un refus porte sa date au même titre qu'un accord. --- */
.choice-when{ font-size:var(--t-11); color:var(--ink-3); }

/* --- Case à cocher d'une feuille de saisie : « ce joueur a un compte au
       club ». Même marque que le choix, sans la carte autour. --- */
.checkline{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  min-height:44px;
  padding:10px 0;
  border:0;
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.checkline-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  margin-top:1px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--surface);
  color:var(--surface);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.checkline.is-on .checkline-mark{
  border-color:var(--gold-dark);
  background:var(--gold-dark);
  color:var(--surface);
}
.checkline-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.checkline-title{ font-size:var(--t-15); color:var(--ink); }
.checkline-text{ font-size:var(--t-13); color:var(--ink-2); }

/* --- Boîte vide d'une rubrique du profil : une invitation à agir, pas un
       constat (brief §3). Même traitement que celle du centre au lot 5. --- */
.account-empty{
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  padding:24px 18px;
  text-align:center;
}
.account-empty .ti{ font-size:26px; color:var(--ink-3); }
.account-empty-title{
  margin:8px 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.account-empty-text{
  margin:0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.account-empty .btn{ max-width:280px; margin:14px auto 0; }

/* --- Lot 9d · statut et tarifs. Le statut s'écrit en texte simple ; les
       échéances, la carte de membre et la grille des tarifs. --- */
.ident-status{
  margin:2px 0 0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.ident-end{
  margin:6px 0 0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.ident-end b{ font-weight:var(--w-semi); color:var(--ink); }
.ident-end.is-soon{ color:var(--attention); }

/* Carte de membre sur fond encre, reprise du booking engine v3 (19/10). Le
   logo y passe en blanc par sa variable d'encre. */
.mcard{
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:18px 18px 16px;
  border-radius:18px;
  background:var(--ink);
  color:var(--surface);
  box-shadow:var(--shadow-card);
  --logo-ink:var(--surface);
}
.mcard-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold-light);
}
.mcard-top .brand-logo{ margin-left:0; }
.mcard-name{ margin:0; font-size:var(--t-22); font-weight:var(--w-medium); color:var(--surface); }
.mcard-status{ margin:6px 0 0; font-size:var(--t-13); color:var(--gold-light); }
.mcard-end{ margin:2px 0 0; font-size:var(--t-13); color:var(--surface); }
.mcard-end b{ font-weight:var(--w-medium); }
.mcard-foot{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  margin:12px 0 0;
  font-size:var(--t-13);
  color:var(--gold-light);
}
.mcard-foot p{ margin:0; line-height:1.5; }
.mcard-qr{ flex:0 0 auto; padding:5px; border-radius:8px; background:var(--surface); }
.qr{ display:block; width:58px; height:58px; fill:var(--ink); }
.qr .qr-gap{ fill:var(--surface); }

/* En-tête « Mon espace » du profil, repris du booking engine v3. */
.space{ display:flex; align-items:flex-start; gap:14px; }
.space-av{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--ink);
  color:var(--surface);
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  letter-spacing:.06em;
}
.space-body{ min-width:0; }
.space-hello{
  margin:2px 0 4px;
  font-size:var(--t-28);
  font-weight:var(--w-light);
  line-height:1.15;
  color:var(--ink);
}
.space-hello b{ font-weight:var(--w-medium); }
.space .ident-status{ margin:0; }
.space-renew{
  margin-left:4px;
  padding:0;
  border:0;
  background:none;
  font:inherit;
  color:var(--ink);
  text-decoration:underline;
  text-decoration-color:var(--gold);
  text-underline-offset:3px;
  cursor:pointer;
}
.space + .mcard{ margin-top:18px; }

.due{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-top:12px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
}
.due > .ti{ flex:0 0 auto; font-size:20px; color:var(--positive); margin-top:1px; }
.due.is-soon{ border-color:var(--attention); }
.due.is-soon > .ti{ color:var(--attention); }
.due.is-missing > .ti{ color:var(--ink-3); }
.due-body{ flex:1 1 auto; min-width:0; }
.due-title{ margin:0; font-size:var(--t-15); font-weight:var(--w-medium); color:var(--ink); }
.due-text{ margin:4px 0 0; font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.due-text b{ font-weight:var(--w-semi); color:var(--ink); }
.due-left{ color:var(--attention); font-weight:var(--w-medium); }
.due .btn{ margin-top:12px; min-height:44px; font-size:var(--t-15); }
.section > .spec{ margin-top:12px; }

.tariff-rule{
  margin:0 0 12px;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.tariff-season{ margin:-4px 2px 10px; font-size:var(--t-13); color:var(--ink-2); }
.tcard{
  padding:2px 14px 6px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.tgrid{ width:100%; border-collapse:collapse; table-layout:fixed; font-size:var(--t-15); }
.tgrid-c1{ width:38%; }
.tgrid th,
.tgrid td{ padding:10px 0; text-align:left; vertical-align:baseline; }
.tgrid thead th{
  padding-top:12px;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-2);
  border-bottom:1px solid var(--line);
}
.tgrid .r{ text-align:right; white-space:nowrap; }
.tgrid tbody tr + tr th,
.tgrid tbody tr + tr td{ border-top:1px solid var(--line); }
.tgrid-course th{ padding:14px 0 2px; font-weight:var(--w-semi); color:var(--ink); }
.tgrid tbody .tgrid-course + tr th,
.tgrid tbody .tgrid-course + tr td{ border-top:0; }
.tgrid-f{ padding-left:12px !important; font-weight:var(--w-regular); color:var(--ink-2); }
.tgrid s{ color:var(--ink-2); }
.tgrid b{ font-weight:var(--w-semi); color:var(--ink); }
.tgrid.is-two thead th:first-child{ width:62%; }
.tgrid.is-two th[scope="row"]{ font-weight:var(--w-regular); color:var(--ink); white-space:normal; }
.tgrid.is-two td{ font-weight:var(--w-semi); color:var(--ink); }
.tgrid-v2{ font-weight:var(--w-regular); color:var(--ink-2); }

.gain{
  margin-top:16px;
  padding:14px 16px;
  border:1px solid var(--positive);
  border-radius:var(--r-card);
  background:var(--surface);
}
.gain-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  font-size:var(--t-15);
  color:var(--ink);
}
.gain-head b{ font-size:var(--t-17); font-weight:var(--w-semi); color:var(--positive); white-space:nowrap; }
.gain-list{ list-style:none; margin:10px 0 0; padding:0; }
.gain-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:var(--t-15);
  color:var(--ink);
}
.gain-label{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.gain-sub{ font-size:var(--t-13); color:var(--ink-2); }
.gain-off{ font-weight:var(--w-semi); white-space:nowrap; }
.gain-foot{ margin:8px 0 0; font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.gain .btn{ margin-top:12px; min-height:44px; font-size:var(--t-15); }

.vis{ list-style:none; margin:0; padding:0; }
.vis-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:10px 0;
  border-top:1px solid var(--line);
}
.vis-row:first-child{ border-top:0; }
.vis-row > .ti{ flex:0 0 auto; font-size:19px; color:var(--ink-3); margin-top:1px; }
.vis-row.is-on > .ti{ color:var(--positive); }
.vis-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.vis-title{ font-size:var(--t-15); color:var(--ink); }
.vis-text{ font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
[data-role="visibility"] > .btn{ margin-top:12px; }

.doc{ display:flex; align-items:flex-start; gap:12px; margin-top:14px; }
.doc > .ti{ flex:0 0 auto; font-size:20px; color:var(--gold-dark); margin-top:1px; }
.doc-body{ display:flex; flex-direction:column; gap:2px; }
.doc-title{ font-size:var(--t-15); color:var(--ink); }
.doc-text{ font-size:var(--t-13); color:var(--ink-2); }
.doc + .btn{ margin-top:12px; }

.btn.player-lic{ margin:8px 0 4px; min-height:44px; font-size:var(--t-15); }

/* =========================================================================
   4i. Écrans conçus pour la V2 — lot 7
       Structure réelle, contenu réduit, opacité légèrement réduite. Le
       bandeau reste à pleine opacité : c'est lui qui dit ce que sont ces
       écrans, il ne peut pas être le premier élément à s'effacer.

       Aucun montant n'est écrit sur ces écrans. Le brief ne donne ni le
       tarif d'un soin, ni le prix d'un polo, ni le droit d'inscription
       d'une compétition, et une maquette basse fidélité n'a pas à les
       inventer : la place du montant est tenue par une barre d'attente.
   ========================================================================= */

.v2-flag{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:12px 14px;
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
}
.v2-flag .ti{ flex:0 0 auto; font-size:20px; color:var(--ink-3); margin-top:1px; }
.v2-flag-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.v2-flag-title{
  font-size:var(--t-13);
  font-weight:var(--w-semi);
  letter-spacing:.02em;
  color:var(--ink-2);
}
.v2-flag-text{ font-size:var(--t-13); line-height:1.45; color:var(--ink-3); }

/* Tout ce qui suit le bandeau. L'opacité porte sur le conteneur : une valeur
   posée composant par composant aurait dérivé au premier ajout. */
.v2-body{ margin-top:20px; opacity:var(--v2-dim); }

/* La place d'un montant que le prototype ne connaît pas. Elle se lit comme
   une valeur en attente, jamais comme un zéro. */
.v2-fill{
  display:inline-block;
  width:52px;
  height:12px;
  border-radius:var(--r-pill);
  background:var(--line);
  vertical-align:middle;
}
.v2-fill.is-wide{ width:96px; }
.v2-fill.is-solde{ width:148px; height:26px; }

/* Commande à trois positions, figée sur la première : la structure de
   l'écran, sans le comportement. */
.v2-tabs{
  display:flex;
  gap:6px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--canvas);
}
.v2-tab{
  flex:1 1 0;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:var(--r-btn);
  font-size:var(--t-13);
  color:var(--ink-3);
  text-align:center;
}
.v2-tab.is-on{ background:var(--surface); color:var(--ink); font-weight:var(--w-medium); }

/* Suite de pastilles d'horaire, inertes. */
.v2-times{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.v2-time{
  min-height:32px;
  display:inline-flex;
  align-items:center;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.v2-time.is-on{ border-color:var(--gold); background:var(--gold-soft); color:var(--gold-dark); }

/* Ligne générique : un intitulé, une note, une valeur à droite. Sert à
   l'historique de la cagnotte comme au catalogue des soins. */
.v2-rows{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  padding:0 16px;
}
.v2-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px 0;
  border-top:1px solid var(--line);
}
.v2-row:first-child{ border-top-color:transparent; }
.v2-row-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.v2-row-label{ font-size:var(--t-15); color:var(--ink); }
.v2-row-note{ font-size:var(--t-13); color:var(--ink-3); }
.v2-row-value{ flex:0 0 auto; padding-top:3px; text-align:right; }

.v2-note{
  margin:14px 0 0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-3);
}

/* --- Vie du club : le fil des nouvelles ---------------------------------- */
.posts{ display:flex; flex-direction:column; gap:10px; }
.post{
  display:flex;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.post .photo{
  flex:0 0 auto;
  width:72px;
  height:72px;
  border-radius:var(--r-btn);
}
.post-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.post-kind{
  margin:0;
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.post-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  line-height:1.35;
  color:var(--ink);
}
.post-meta{ margin:0; font-size:var(--t-13); color:var(--ink-3); }

/* --- Compétitions : une ligne par épreuve -------------------------------- */
.evs{ display:flex; flex-direction:column; gap:10px; }
.ev{
  display:flex;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.ev-date{
  flex:0 0 52px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  padding:6px 0;
  border-radius:var(--r-btn);
  background:var(--canvas);
}
.ev-day{ font-size:var(--t-17); font-weight:var(--w-semi); color:var(--ink); }
.ev-month{
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.ev-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.ev-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.ev-meta{ margin:0; font-size:var(--t-13); color:var(--ink-3); }
.ev-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:5px; }
.ev-seats{ font-size:var(--t-13); color:var(--ink-2); }

/* --- Boutique : deux colonnes, la photo porte l'article ------------------ */
.goods{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.good{
  display:flex;
  flex-direction:column;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.good .photo{ width:100%; height:104px; }
.good-body{ padding:11px 12px 13px; display:flex; flex-direction:column; gap:5px; }
.good-name{ margin:0; font-size:var(--t-15); color:var(--ink); }
.good-price{ display:flex; align-items:center; }

/* La carte Cagnotte du lot 4 est devenue un bouton : elle garde l'aspect
   d'une carte de compteur — bordure tiretée, fond de canevas — et prend les
   réglages qu'un bouton demande. Son rang de contenu reste .pot-top, comme
   celui des compteurs qu'elle côtoie. */
button.pot.is-v2{
  display:block;
  width:100%;
  padding:0;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
button.pot.is-v2:active{ background:var(--gold-soft); }
.pot.is-v2 .pot-top{ align-items:center; padding-bottom:16px; }

/* --- Entrée de choix portant un badge V2 --------------------------------- */
.pick-head{ display:flex; align-items:center; gap:8px; }

/* =========================================================================
   5. Barre de contrôle du prototype
   ========================================================================= */
.panel{
  flex:0 0 300px;
  max-width:300px;
  position:sticky;
  top:40px;
  padding:22px 20px 20px;
  background:var(--surface);
  border:1px solid var(--proto-line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.panel-kicker{
  margin:0;
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--proto-ink-2);
}
.panel-title{
  margin:4px 0 18px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--proto-ink);
}
.field{ margin-bottom:16px; }
.field-label{
  display:block;
  margin-bottom:7px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--proto-ink);
}
.field-help{
  margin:6px 0 0;
  font-size:var(--t-11);
  color:var(--proto-ink-2);
}
.field.is-muted{ opacity:.45; }

.seg{
  display:grid;
  gap:4px;
  padding:4px;
  border:1px solid var(--proto-line);
  border-radius:var(--r-btn);
  background:var(--canvas);
}
.seg.is-row{ grid-template-columns:1fr 1fr; }
.seg.is-three{ grid-template-columns:repeat(3,1fr); }
.seg button{
  min-height:34px;
  padding:0 10px;
  border:0;
  border-radius:9px;
  background:none;
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--proto-ink-2);
  cursor:pointer;
  text-align:center;
}
.seg button.is-on{
  background:var(--gold);
  color:var(--surface);
  font-weight:var(--w-semi);
}
.seg button[disabled]{ cursor:default; }

.select{
  width:100%;
  min-height:38px;
  padding:0 10px;
  border:1px solid var(--proto-line);
  border-radius:var(--r-btn);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  color:var(--proto-ink);
}

.panel-action{
  width:100%;
  min-height:40px;
  margin-top:4px;
  border:1px solid var(--proto-line);
  border-radius:var(--r-btn);
  background:var(--canvas);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--proto-ink);
  cursor:pointer;
}
.panel-action:active{ background:var(--proto-bg); }
.panel-action + .panel-action{ margin-top:8px; }

.readout{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--proto-line);
}
.readout dl{ margin:0; }
.readout div{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:4px 0;
  font-size:var(--t-11);
}
.readout dt{ color:var(--proto-ink-2); }
.readout dd{ margin:0; color:var(--proto-ink); font-weight:var(--w-medium); }

/* =========================================================================
   Lot 10 — retours des points du 19 et du 20/10/2026
   ========================================================================= */
.weather{
  display:flex; align-items:center; gap:8px;
  margin:2px 0 0; font-size:var(--t-13); color:var(--ink-2);
}
.weather .ti{ font-size:18px; color:var(--gold-dark); }
.weather b{ font-weight:var(--w-medium); color:var(--ink); }
.seeall{
  display:flex; align-items:center; justify-content:flex-end; gap:4px;
  width:100%; min-height:44px; margin-top:4px; padding:0;
  border:0; background:none; font-family:inherit;
  font-size:var(--t-13); font-weight:var(--w-medium); color:var(--gold-dark);
  cursor:pointer;
}
.seeall .ti{ font-size:16px; }
.blist{ display:flex; flex-direction:column; gap:12px; }
.blist .lesson{ margin:0; }
.booking.is-static{ cursor:default; }
.booking.is-static:active{ background:var(--surface); }
.booking-day .chip + .chip{ margin-left:6px; }
.gfb-head{ display:flex; align-items:center; gap:16px; margin-top:4px; }
.gfb-time{ margin:0; font-size:var(--t-28); font-weight:var(--w-semi); color:var(--ink); }
.gfb-course{ margin:2px 0 0; font-size:var(--t-15); color:var(--ink); }
.gfb-site{ margin:2px 0 0; font-size:var(--t-13); color:var(--ink-2); }

.paylink{ display:flex; gap:8px; align-items:stretch; }
.paylink-field{ flex:1 1 auto; min-width:0; background:var(--canvas); color:var(--ink-2); }
.paylink-copy{ flex:0 0 auto; width:auto; margin-top:0; min-height:44px; padding:0 14px; gap:6px; }

.tchips{ display:flex; flex-wrap:wrap; gap:8px; }
.tchips.is-scroll{ flex-wrap:nowrap; overflow-x:auto; padding-bottom:2px; }
.tchips.is-scroll::-webkit-scrollbar{ width:0; height:0; }
.tchip{
  flex:0 0 auto; min-width:44px; min-height:44px; padding:0 14px;
  border:1px solid var(--line); border-radius:var(--r-pill);
  background:var(--surface); font-family:inherit; font-size:var(--t-15);
  color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.tchip.is-on{ border-color:var(--ink); background:var(--ink); color:var(--surface); }
.tlabel{ margin:14px 0 8px; font-size:var(--t-13); color:var(--ink-2); }
.tlabel:first-of-type{ margin-top:0; }
.sheet .tchips{ margin-bottom:6px; }

.party-choices.is-text .party-choice{ width:auto; padding:0 14px; font-size:var(--t-13); }

.day.is-full{ background:var(--sand); border-color:var(--line-2); }
.day.is-full .day-num{ color:var(--ink-2); }
.day-full{ color:var(--attention); font-weight:var(--w-medium); }
.day.is-selected.is-full{ background:var(--ink); border-color:var(--ink); }
.day.is-selected.is-full .day-num,
.day.is-selected.is-full .day-full{ color:var(--surface); }

.slot.is-full{ cursor:default; background:var(--canvas); }
.slot.is-full:active{ background:var(--canvas); }
.slot-note.is-wait{ color:var(--ink-2); padding-top:2px; }
.slot-wait{
  display:inline-flex; align-items:center; gap:4px;
  min-height:36px; padding:0 12px; margin:0;
  border:1px solid var(--line-2); border-radius:var(--r-pill);
  background:var(--surface); font-family:inherit; font-size:var(--t-13);

  font-family:inherit; color:var(--ink); cursor:pointer;
}
.gtime-t{ font-size:var(--t-15); font-weight:var(--w-medium); }
.gtime-p{ font-size:12px; font-weight:var(--w-medium); color:var(--ink-2); }
.gtime-p.is-incl{ color:var(--positive); }
.gtime-p.is-badge{ color:var(--gold-dark); }
.gdots{ display:flex; gap:3px; margin-top:2px; }
.gdots i{ width:5px; height:5px; border-radius:var(--r-pill); background:var(--line-2); }
.gdots i.is-on{ background:var(--ink); }
.gtime.is-on{ background:var(--ink); border-color:var(--ink); color:var(--on-dark); }
.gtime.is-on .gtime-p{ color:var(--gold-light); }
.gtime.is-on .gdots i{ background:var(--ink-3); }
.gtime.is-on .gdots i.is-on{ background:var(--on-dark); }
.gtime.is-short{ background:var(--canvas); color:var(--ink-3); cursor:default; }
.gtime.is-short .gtime-p{ color:var(--ink-3); font-weight:var(--w-regular); }
.gtime.is-full{ background:var(--sand); border-style:dashed; color:var(--ink-3); }
.gtime.is-full .gtime-p{ color:var(--gold-dark); }
.gtime.is-wait{ border-style:solid; border-color:var(--gold); }
.gtime.is-more{ border-style:dashed; color:var(--gold-dark); font-size:12px; letter-spacing:.08em; text-transform:uppercase; justify-content:center; }
.gtime.is-more b{ font-size:var(--t-13); letter-spacing:.1em; }
.gtime-rel{ display:inline-flex; align-items:center; gap:3px; font-size:10.5px; color:var(--gold-dark); font-weight:var(--w-medium); }
.gtime-rel .ti{ font-size:12px; }
.gtime.has-rel{ border-color:var(--gold); }
.gtime.is-on .gtime-rel{ color:var(--gold-light); }
.gtimes-empty{ margin:4px 14px 14px; font-size:var(--t-13); color:var(--ink-3); }
.gf-note{ margin:16px 2px 0; font-size:12.5px; color:var(--ink-3); line-height:1.5; }

/* --- Étape 2 : carte du départ retenu, déjà inscrits --- */
.backlink{
  display:inline-flex; align-items:center; gap:6px;
  min-height:36px; margin:0 0 10px; padding:0;
  border:0; background:none;
  font-family:inherit; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2); cursor:pointer;
}
.teecard{ position:relative; height:168px; border-radius:20px; overflow:hidden; color:var(--on-dark); }
.teecard .ph{ position:absolute; inset:0; }
.teecard-body{ position:absolute; left:18px; right:18px; bottom:16px; }
.teecard-k{ margin:0 0 6px; font-size:var(--t-11); letter-spacing:.16em; text-transform:uppercase; color:var(--on-dark-2); }
.teecard-t{ margin:0; font-size:26px; font-weight:var(--w-light); }
.teecard-t b{ font-weight:var(--w-medium); }
.teecard-s{ margin:4px 0 0; font-size:var(--t-13); color:var(--on-dark-2); }
.already{
  margin-top:14px; padding:12px 14px;
  border:1px dashed var(--line-2); border-radius:16px;
  background:var(--surface);
}
.already-h{ margin:0 0 8px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); }
.already-row{ display:flex; align-items:center; gap:10px; padding:4px 0; }
.already-row .av{
  width:30px; height:30px; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); background:var(--sand); color:var(--ink-2);
  font-size:11px; font-weight:var(--w-semi);
}
.already-row b{ display:block; font-size:var(--t-13); font-weight:var(--w-medium); }
.already-row span{ font-size:12px; color:var(--ink-3); }
.subhead{ margin:24px 0 10px; font-size:var(--t-17); font-weight:var(--w-medium); }

.linkbtn{
  display:inline-flex; align-items:center; gap:4px;
  min-height:32px; padding:0;
  border:0; background:none;
  font-family:inherit; font-weight:var(--w-medium); color:var(--gold-dark);
  text-decoration:underline; text-underline-offset:3px; cursor:pointer;
}
.quick.is-2{ grid-template-columns:repeat(3,1fr); }
.quick.is-5.is-2{ grid-template-columns:repeat(4,1fr); }
.empty-photo{ height:150px; }

/* --- Onglets en tête d'écran (Mes réservations, détail du départ) --- */
.tabsx{
  display:flex; gap:4px;
  padding:4px;
  border-radius:var(--r-pill);
  background:var(--sand);
}
.tabx{
  flex:1 1 0;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:40px; padding:0 8px;
  border:0; border-radius:var(--r-pill); background:none;
  font-family:inherit; font-size:var(--t-13); font-weight:var(--w-medium); color:var(--ink-3);
  cursor:pointer; white-space:nowrap;
}
.tabx.is-on{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card); }
.tabx-n{
  min-width:20px; height:20px; padding:0 6px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); background:var(--gold-light); color:var(--gold-dark);
  font-size:11px; font-weight:var(--w-semi);
}
.tabx.is-on .tabx-n{ background:var(--ink); color:var(--on-dark); }
.screen[data-path="/bookings"] .tabsx{ margin-bottom:4px; }

/* --- Détail du départ : gestion de la réservation --- */
.gfh{ position:relative; height:200px; margin:-20px -16px 0; color:var(--on-dark); }
.gfh .ph{ position:absolute; inset:0; }
.gfh .ph-shade{ background:var(--photo-shade-soft); }
.gfh-body{ position:absolute; left:18px; right:18px; bottom:18px; }
.gfh-k{ margin:0 0 6px; font-size:var(--t-11); letter-spacing:.16em; text-transform:uppercase; color:var(--gold-light); }
.gfh-t{ margin:0; font-size:26px; font-weight:var(--w-medium); line-height:1.15; }
.gfh-s{ display:flex; flex-wrap:wrap; gap:6px 14px; margin:8px 0 0; font-size:var(--t-13); color:var(--on-dark-2); }
.gfh-s span{ display:inline-flex; align-items:center; gap:5px; }
.gfh-s .ti{ font-size:15px; }
.gfh-chip{
  position:absolute; top:14px; right:14px;
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 10px; border-radius:var(--r-pill);
  background:var(--positive); color:var(--on-dark);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
}
.gfh-chip .ti{ font-size:14px; }
.gfb-tabs{ position:sticky; top:0; z-index:1; margin:14px -16px 0; padding:8px 16px; background:var(--canvas); }
.gfdue{
  margin-top:14px; padding:16px;
  border:1px solid var(--line); border-radius:18px;
  background:var(--surface); box-shadow:var(--shadow-card);
}
.gfdue-l{ margin:0; font-size:var(--t-13); color:var(--ink-3); }
.gfdue-v{ margin:2px 0 10px; font-size:34px; font-weight:var(--w-semi); line-height:1.1; }
.gfdue-v.is-zero{ color:var(--positive); font-size:24px; }
.gfdue-bar{ height:6px; border-radius:var(--r-pill); background:var(--sand); overflow:hidden; }
.gfdue-bar i{ display:block; height:100%; border-radius:inherit; background:var(--gold); }
.gfdue-f{ display:flex; justify-content:space-between; margin:8px 0 0; font-size:12.5px; color:var(--ink-3); }
.gfdue-f b{ color:var(--ink); font-weight:var(--w-medium); }
.plist{ margin-top:10px; border:1px solid var(--line); border-radius:18px; background:var(--surface); overflow:hidden; }
.prow{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); }
.prow:first-child{ border-top:0; }
.prow .av{
  width:36px; height:36px; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); background:var(--sand); color:var(--ink-2);
  font-size:12px; font-weight:var(--w-semi);
}
.prow .av.is-me{ background:var(--ink); color:var(--on-dark); }
.prow-body{ flex:1 1 auto; min-width:0; }
.prow-n{ display:block; font-size:var(--t-15); font-weight:var(--w-medium); }
.prow-s{ display:block; font-size:12.5px; color:var(--ink-3); }
.prow-side{ text-align:right; flex:0 0 auto; }
.prow-a{ display:block; font-size:var(--t-15); font-weight:var(--w-medium); }
.st{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:var(--w-medium); }
.st .ti{ font-size:14px; }
.st.is-ok{ color:var(--positive); }
.st.is-due{ color:var(--attention); }
.st.is-desk{ color:var(--ink-3); }
.qrcard{
  display:flex; align-items:center; gap:16px;
  margin-top:14px; padding:16px;
  border-radius:18px; background:var(--ink); color:var(--on-dark);
}
.qrcard .mcard-qr{ padding:6px; }
.qrcard-t{ margin:0; font-size:var(--t-17); font-weight:var(--w-medium); }
.qrcard-s{ margin:4px 0 0; font-size:12.5px; color:var(--on-dark-2); line-height:1.45; }
.ilist{ margin-top:10px; border:1px solid var(--line); border-radius:18px; background:var(--surface); overflow:hidden; }
.irow{
  display:flex; align-items:center; gap:12px;
  width:100%; padding:13px 14px;
  border:0; border-top:1px solid var(--line); background:none;
  font-family:inherit; text-align:left; color:var(--ink);
}
.irow:first-child{ border-top:0; }
button.irow{ cursor:pointer; }
.irow-ic{
  flex:0 0 auto; width:36px; height:36px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:12px; background:var(--gold-light); color:var(--gold-dark); font-size:19px;
}
.irow-body{ flex:1 1 auto; min-width:0; }
.irow-t{ display:block; font-size:var(--t-15); font-weight:var(--w-medium); }
.irow-s{ display:block; font-size:12.5px; color:var(--ink-3); }
.irow .ti-chevron-right{ color:var(--ink-3); font-size:18px; }
.irow-v{ font-size:var(--t-13); color:var(--ink-2); font-weight:var(--w-medium); }
.pnote{ display:flex; gap:8px; margin:14px 2px 0; font-size:12.5px; color:var(--ink-3); line-height:1.5; }
.pnote .ti{ flex:0 0 auto; font-size:16px; color:var(--gold-dark); }
.btnrow{ display:flex; gap:8px; margin-top:12px; }
.btnrow .btn{ flex:1 1 0; }

/* --- Portefeuille : carte e-wallet façon carte bancaire --- */
.wcard{
  position:relative;
  aspect-ratio:1.586;
  display:flex; flex-direction:column;
  padding:18px 20px;
  border-radius:20px;
  background:var(--wcard-sheen), var(--wcard-bg);
  box-shadow:var(--shadow-lift);
  color:var(--on-dark);
  overflow:hidden;
  --logo-ink:var(--on-dark);
}
.wcard::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  border:1px solid var(--wcard-line); pointer-events:none;
}
.wcard-top{ display:flex; align-items:center; justify-content:space-between; }
.wcard-top .brand-logo{ margin-left:0; }
.wcard-tag{
  display:inline-flex; align-items:center; gap:6px;
  font-size:var(--t-11); letter-spacing:.18em; text-transform:uppercase; color:var(--gold-light);
}
.wcard-tag .ti{ font-size:16px; }
.wcard-chip{
  width:38px; height:28px; margin-top:14px;
  border-radius:7px;
  background:linear-gradient(135deg, var(--gold-light), var(--gold));
  opacity:.9;
}
.wcard-l{ margin:auto 0 0; font-size:var(--t-13); color:var(--on-dark-2); }
.wcard-v{ margin:2px 0 0; font-size:38px; font-weight:var(--w-semi); line-height:1.1; letter-spacing:.01em; color:var(--on-dark); }
.wcard-foot{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-top:14px; }
.wcard-k{ display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--on-dark-2); }
.wcard-foot b{ font-size:var(--t-15); font-weight:var(--w-medium); letter-spacing:.04em; }
.wcard-site{ font-size:var(--t-11); letter-spacing:.18em; text-transform:uppercase; color:var(--gold-light); }
.wcard-note{ display:flex; gap:8px; margin:12px 4px 0; font-size:12.5px; color:var(--ink-3); line-height:1.5; }
.wcard-note .ti{ flex:0 0 auto; font-size:16px; color:var(--gold-dark); }
.screen[data-path="/wallet"] .wgrid{ margin-top:0; }
/* 29/10/2026 : les deux e-wallets en pile, comme dans Apple Wallet. La
   carte de devant est entière ; celle de derrière ne montre que son haut
   (logo, nom, solde). La toucher la fait passer devant. */
.wstack{ position:relative; padding-top:4px; margin-bottom:14px; }
.wstack .wcard{ width:100%; }
.wstack .wcard + .wcard{ margin-top:calc(62px - 100% / 1.586); }
.wcard.is-back{
  display:flex; flex-direction:column; text-align:left;
  font:inherit; cursor:pointer; -webkit-appearance:none; appearance:none;
  border:0; box-shadow:var(--shadow-card);
  transform:scale(.95); transform-origin:top center;
}
.wcard.is-front.is-swap{ animation:wcard-in .34s cubic-bezier(.2,.8,.2,1); }
@keyframes wcard-in{ from{ transform:translateY(-46px); } to{ transform:none; } }
@media (prefers-reduced-motion: reduce){ .wcard.is-front.is-swap{ animation:none; } }
.wcard.is-front{ text-align:left; font:inherit; -webkit-appearance:none; appearance:none; border:0; }
button.wcard.is-front{ cursor:pointer; }
.ewallet-uses .irow-ic{ color:var(--gold-dark); }
.wcard-peek{ margin-left:8px; font-size:var(--t-13); letter-spacing:0; text-transform:none; color:var(--on-dark); }
.wcard.is-resto{ background:var(--wcard-sheen), var(--wcard-resto-bg); }
.wcard-use{ margin:2px 0 0; font-size:var(--t-11); color:var(--on-dark-2); }
/* Lot 12 (29/10) : inactivité d'un e-wallet, bloqué après 12 mois. */
.wcard-idle{ margin:4px 0 0; font-size:12px; font-style:italic; color:var(--on-dark-2); }
.wcard-idle.is-soon, .wcard-idle.is-blocked{ color:var(--gold-light); }
.ewallet-last{ margin:-4px 4px 12px; font-size:12.5px; font-style:italic; color:var(--ink-3); }
.ewallet-last.is-soon{ color:var(--attention); }
.ewallet-last.is-blocked{ color:var(--negative); }
/* Lot 12 : cartes cadeaux du wallet. */
.gift-ic{ color:var(--gold-dark); }
.gift-form{ margin-top:6px; }
.gift-form .input{ font-size:var(--t-17); letter-spacing:.08em; text-transform:uppercase; }
/* Lot 12b (30/10) : vignette QR du héros, à droite du salut. Carré givré de
   56 px, mini QR sur pastille blanche pour rester lisible sur la photo. */
.hero-hi{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.hero.is-photo .hero-hi .hero-hello{ margin:0; min-width:0; }
.hero-qr{
  flex:0 0 auto; width:56px; height:56px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--glass-line); border-radius:14px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  cursor:pointer;
}
.hero-qr:active{ background:var(--glass-line); }
.hero-qr:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.hero-qr-code{ display:block; padding:3px; border-radius:6px; background:var(--surface); }
.hero-qr .qr{ width:34px; height:34px; }
/* La carte membre : son QR s'ouvre en plein écran (/qr). */
button.mcard-qr{ border:0; font:inherit; cursor:pointer; min-width:44px; min-height:44px; }
button.mcard-qr:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
/* Lot 12b : le bon cadeau dans le wallet, d'après gcBonHtml (boutique_cadeaux). */
.gbon{
  position:relative; overflow:hidden;
  display:grid; gap:6px;
  padding:20px 20px 16px; border-radius:18px;
  background:var(--ink); color:var(--gold-light);
  box-shadow:var(--shadow-card);
  font-size:var(--t-13); line-height:1.4;
}
.gbon > *{ position:relative; min-width:0; }
.gbon > .ph{ position:absolute; inset:0; }
.gbon > .ph .ph-shade{ background:var(--gbon-shade); }
.gbon p{ margin:0; }
.gbon-top{ display:flex; justify-content:space-between; gap:10px; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; }
.gbon .gbon-t{ margin-top:8px; font-size:var(--t-22); font-weight:var(--w-light); line-height:1.2; color:var(--on-dark); }
.gbon-v{ font-size:30px; font-weight:var(--w-medium); line-height:1.1; color:var(--on-dark); }
.gbon-e{ font-size:12.5px; }
.gbon .gbon-for{ margin-top:4px; font-size:var(--t-15); color:var(--on-dark); }
.gbon-foot{ display:flex; gap:12px; align-items:center; margin-top:8px; padding-top:12px; border-top:1px solid var(--glass-line); font-size:12px; }
.gbon-foot b{ font-weight:var(--w-medium); letter-spacing:.1em; color:var(--on-dark); }
.gbon-foot small{ display:block; font-size:11.5px; color:var(--on-dark-2); }
.gbon-qr{ flex:0 0 auto; padding:4px; border-radius:6px; background:var(--surface); }
.gbon-qr .qr{ width:52px; height:52px; }
.gbon.is-off{ filter:grayscale(1); opacity:.7; }
.gift-valid{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:12px 2px 0; font-size:var(--t-13); color:var(--ink-2); }
.gift-valid.is-soon{ color:var(--attention); }
.gift-valid.is-off{ color:var(--negative); }
.gift-solde{ margin-top:16px; }
.gift-off{ margin-top:16px; }
/* Lot 12 : QR code en grand (Mon QR code, seau réservé). */
.qrbig{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  margin:4px 0 16px; padding:22px 18px 18px;
  border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-card);
  text-align:center;
}
.qrbig .qr{ width:228px; height:228px; }
.qrbig-code{ padding:10px; border-radius:14px; background:var(--surface); }
.qrbig-name{ margin:6px 0 0; font-size:var(--t-17); font-weight:var(--w-semi); color:var(--ink); }
.qrbig-sub{ margin:0; font-size:var(--t-13); color:var(--ink-3); }
.practice-card{ margin-top:4px; }
.wtopup{ width:100%; margin:0 0 14px; }
.topup-custom{ position:relative; margin-top:12px; }
.topup-custom .input{ padding-right:40px; font-size:var(--t-17); }
.topup-custom-unit{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--ink-3); }
.total-note.is-error{ color:var(--negative); }
.tchip-sub{ display:block; font-size:var(--t-11); opacity:.75; }

/* --- Profil : carte membre complète --- */
.mcard .mcard-status{ margin-top:4px; }
.mcard .mcard-end.is-soon{ color:var(--gold-light); }
.mcard-renew{ margin-top:10px; width:100%; }

/* --- Mon année --- */
.yhero{
  margin-top:4px; padding:20px 18px;
  border-radius:20px; background:var(--wcard-sheen), var(--wcard-bg); color:var(--on-dark);
}
.yhero .eyebrow{ color:var(--gold-light); }
.ybig{ display:flex; align-items:center; gap:14px; margin:10px 0 16px; }
.ybig b{ font-size:64px; font-weight:var(--w-light); line-height:1; }
.ybig span{ font-size:var(--t-15); color:var(--on-dark-2); line-height:1.35; }
.yrow{ display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; }
.yrow b{ display:block; font-size:var(--t-17); font-weight:var(--w-medium); }
.yrow span{ font-size:12px; color:var(--on-dark-2); }
.ycard{
  margin-top:14px; padding:16px;
  border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow-card);
}
.ycard h3{ margin:0; font-size:var(--t-15); font-weight:var(--w-medium); }
.ycard p{ margin:2px 0 12px; font-size:12.5px; color:var(--ink-3); }
.ychart{ display:flex; align-items:flex-end; gap:6px; height:110px; }
.ychart div{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; }
.ychart i{ display:block; width:100%; border-radius:6px 6px 2px 2px; background:var(--gold-light); }
.ychart i.is-top{ background:var(--gold); }
.ychart span{ font-size:10px; color:var(--ink-3); }
.ymate{ display:flex; align-items:center; gap:10px; padding:6px 0; }
.ymate .av{
  width:32px; height:32px; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); background:var(--sand); color:var(--ink-2); font-size:11px; font-weight:var(--w-semi);
}
.ymate-b{ flex:1 1 auto; min-width:0; }
.ymate-b b{ display:block; font-size:var(--t-13); font-weight:var(--w-medium); }
.ymate-b span{ display:block; height:6px; margin-top:4px; border-radius:var(--r-pill); background:var(--sand); overflow:hidden; }
.ymate-b span i{ display:block; height:100%; background:var(--gold); border-radius:inherit; }
.ymate-n{ font-size:var(--t-15); font-weight:var(--w-medium); }
.ytiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.ytile{ padding:14px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
.ytile b{ display:block; font-size:var(--t-22); font-weight:var(--w-medium); }
.ytile span{ font-size:12px; color:var(--ink-3); }

/* --- Compétitions (lot 11, reprises du booking engine v3) --- */
.cfil{ margin-top:14px; }
.cfil .seg{ display:flex; }
.cfil .seg button{ flex:1 1 0; padding:0 6px; }
.chipsx{ display:flex; gap:6px; margin:10px -16px 0; padding:2px 16px; overflow-x:auto; scrollbar-width:none; }
.chipsx::-webkit-scrollbar{ display:none; }
.chipx{
  flex:0 0 auto; min-height:34px; padding:0 13px;
  border:1px solid var(--line-2); border-radius:var(--r-pill); background:var(--surface);
  font-family:inherit; font-size:var(--t-13); color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.chipx.is-on{ background:var(--ink); border-color:var(--ink); color:var(--on-dark); }
.chipx.is-mine{ border-color:var(--gold); color:var(--gold-dark); }
.chipx.is-mine.is-on{ background:var(--gold); border-color:var(--gold); color:var(--on-dark); }
.ccount{ margin:14px 2px 0; font-size:var(--t-13); color:var(--ink-3); }
.cmp{
  margin-top:12px; padding:14px;
  border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow-card);
  cursor:pointer;
}
.cmp-top{ display:flex; gap:12px; }
.cmp-body{ flex:1 1 auto; min-width:0; }
.cmp-site{ display:flex; align-items:center; gap:5px; margin:0 0 3px; font-size:11.5px; color:var(--ink-3); }
.cmp-site b{ color:var(--ink-2); font-weight:var(--w-medium); }
.cmp-site.is-here b{ color:var(--gold-dark); }
.cmp-site .ti{ font-size:14px; color:var(--gold-dark); }
.cmp-n{ margin:0; font-size:var(--t-17); font-weight:var(--w-medium); line-height:1.25; }
.cmp-m{ margin:3px 0 0; font-size:12.5px; color:var(--ink-3); }
.ctags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
.ctag{ padding:3px 8px; border-radius:var(--r-pill); background:var(--sand); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); }
.ctag.is-dk{ background:var(--ink); color:var(--on-dark); }
.ctag.is-ol{ background:var(--gold-light); color:var(--gold-dark); }
.cbar{ height:5px; margin-top:12px; border-radius:var(--r-pill); background:var(--sand); overflow:hidden; }
.cbar i{ display:block; height:100%; border-radius:inherit; background:var(--gold); }
.cbar.is-full i{ background:var(--attention); }
.cplaces{ margin:6px 0 0; font-size:12px; color:var(--ink-3); }
.celig{ display:flex; align-items:center; gap:5px; margin:8px 0 0; font-size:12.5px; font-weight:var(--w-medium); }
.celig.is-ok{ color:var(--positive); }
.celig.is-ko{ color:var(--attention); }
.celig .ti{ font-size:15px; }
.cmp-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.cmp-price b{ display:block; font-size:var(--t-17); font-weight:var(--w-semi); }
.cmp-price small{ font-size:11px; color:var(--ink-3); }
.cmp-foot .btn{ min-height:40px; padding:0 16px; font-size:12px; }
.cmp-state{ display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:var(--r-pill); background:var(--gold-light); color:var(--gold-dark); font-size:12px; font-weight:var(--w-medium); }
.cmp-state .ti{ font-size:15px; }
.cmp-state.is-off{ background:var(--sand); color:var(--ink-3); }
.cband{ position:relative; height:180px; margin:-20px -16px 16px; color:var(--on-dark); }
.cband + .subhead{ margin-top:8px; }
.cband .ph{ position:absolute; inset:0; }
.cband-b{ position:absolute; left:18px; right:18px; bottom:16px; }
.cband-k{ margin:0 0 6px; font-size:var(--t-11); letter-spacing:.14em; text-transform:uppercase; color:var(--gold-light); }
.cband-t{ margin:0; font-size:24px; font-weight:var(--w-medium); line-height:1.15; }
.cband-s{ margin:6px 0 0; font-size:var(--t-13); color:var(--on-dark-2); }
.ck-ic{ flex:0 0 auto; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-pill); font-size:16px; }
.ck-ic.is-ok{ background:var(--gold-light); color:var(--positive); }
.ck-ic.is-ko{ background:var(--sand); color:var(--attention); }
.irow .btn{ min-height:36px; padding:0 12px; font-size:11.5px; }
.cnote{ margin:10px 2px 0; font-size:12.5px; color:var(--ink-3); line-height:1.5; }
.csum{ margin-top:10px; padding:14px 16px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
.csum-l{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:var(--t-13); color:var(--ink-2); }
.csum-l b{ font-weight:var(--w-medium); color:var(--ink); white-space:nowrap; }
.csum-l b.is-incl{ color:var(--positive); }
.csum-t{ display:flex; justify-content:space-between; margin-top:6px; padding-top:10px; border-top:1px solid var(--line); font-size:var(--t-15); font-weight:var(--w-medium); }
.licrow{ display:flex; gap:8px; margin-top:10px; }
.licrow .input{ flex:1 1 auto; min-width:0; }
.cmsg{ width:100%; min-height:70px; margin-top:10px; resize:vertical; }
.cdone{ text-align:center; padding:12px 0 4px; }
.cdone .card-mark{ margin:0 auto 12px; }
.cpos{ font-size:44px; font-weight:var(--w-semi); line-height:1; }
.booking.is-past{ opacity:.8; }

/* --- Joueurs du départ, modèle du booking engine v3 (lot 11) --- */
.vplist{ border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow-card); padding:2px 16px; }
.vplist .players{ border:0; border-radius:0; background:none; box-shadow:none; overflow:visible; }
.vplist .player:first-child{ border-top:0; }
.vp{ display:grid; grid-template-columns:44px 1fr; column-gap:12px; padding:16px 0; border-top:1px solid var(--line); }
.vp:first-child{ border-top:0; }
.vp-av{
  width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); background:var(--sand); color:var(--ink-2); font-size:12.5px; font-weight:var(--w-semi);
}
.vp.is-me .vp-av{ background:var(--ink); color:var(--on-dark); }
.vp-n{ margin:0; font-size:var(--t-15); font-weight:var(--w-medium); }
.vp-n span{ font-weight:var(--w-regular); color:var(--ink-3); font-size:var(--t-13); }
.vp-s{ margin:3px 0 0; font-size:var(--t-13); color:var(--ink-3); line-height:1.4; }
.vp-links{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; }
.vp-links .linkbtn{ font-size:12.5px; min-height:28px; }
.vp-inv{ display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:4px 10px; border-radius:var(--r-pill);
  background:var(--gold-light); color:var(--gold-dark); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
.vp-inv .ti{ font-size:13px; }
.vp-foot{ display:flex; align-items:center; gap:10px; margin-top:10px; }
.vp-price{ flex:1 1 auto; font-size:var(--t-17); font-weight:var(--w-semi); }
.vp-price s{ margin-right:6px; font-size:var(--t-13); font-weight:var(--w-regular); color:var(--ink-3); }
.vp-price.is-incl b{ color:var(--ink); }
.vp-foot .btn{ min-height:38px; padding:0 16px; font-size:12px; }
.vp-x{ width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  border:0; border-radius:var(--r-pill); background:none; color:var(--ink-3); font-size:18px; cursor:pointer; }
.vp-tag{ display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:4px 10px; border-radius:var(--r-pill);
  background:var(--gold-light); color:var(--gold-dark); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }
.vp-main .vp-warn{ display:block; }
.vp-warn{ margin:6px 0 0; font-size:12.5px; color:var(--attention); }
.vpadd{ padding:14px 0 16px; border-top:1px solid var(--line); text-align:center; }
.vpadd .btn{ width:100%; gap:8px; }
.vpadd .btn .ti{ font-size:18px; }
.vpadd-note{ margin:8px 0 0; font-size:12.5px; color:var(--ink-3); }
.vpadd[disabled]{ opacity:.5; cursor:default; }
.vpadd-av{ width:40px; height:40px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
  border:1.5px dashed var(--gold); border-radius:var(--r-pill); color:var(--gold-dark); font-size:18px; }
.vpadd b{ display:block; font-size:var(--t-15); font-weight:var(--w-medium); color:var(--gold-dark); }
.vpadd small{ font-size:12.5px; color:var(--ink-3); }
.vpnote{ margin:10px 2px 0; font-size:12.5px; color:var(--ink-3); line-height:1.5; }
.rel-price{ text-align:right; white-space:nowrap; font-size:var(--t-15); font-weight:var(--w-semi); }
.rel-price s{ display:block; font-size:11.5px; font-weight:var(--w-regular); color:var(--ink-3); }

/* --- Groupes de 5 à 12 joueurs (booking engine v3) --- */
.pxg{ display:inline-flex; align-items:center; gap:4px; height:40px; padding:0 4px; border:1px solid var(--line-2);
  border-radius:var(--r-pill); background:var(--surface); }
.pxg.is-on{ background:var(--ink); border-color:var(--ink); color:var(--on-dark); }
.pxg button{ width:32px; height:32px; border:0; border-radius:var(--r-pill); background:none; color:inherit;
  font-family:inherit; font-size:16px; cursor:pointer; }
.pxg b{ min-width:20px; text-align:center; font-weight:var(--w-medium); }
.pxg-open{ height:40px; padding:0 14px; border:1px solid var(--line-2); border-radius:var(--r-pill); background:var(--surface);
  font-family:inherit; font-size:var(--t-13); color:var(--ink); cursor:pointer; }
.grpnote{ margin:8px 2px 0; font-size:12.5px; color:var(--ink-3); line-height:1.5; }
.gbar{
  position:sticky; bottom:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin:16px -16px -24px; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--line); background:var(--surface);
}
.gbar b{ display:block; font-size:var(--t-15); font-weight:var(--w-medium); }
.gbar span{ font-size:12px; color:var(--ink-3); }
.gbar .btn{ flex:0 0 auto; min-height:44px; padding:0 20px; }
.fhead{ display:flex; align-items:center; gap:10px; margin:18px 0 8px; }
.fhead-n{ width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-pill);
  background:var(--ink); color:var(--on-dark); font-size:12px; font-weight:var(--w-semi); }
.fhead b{ display:block; font-size:var(--t-15); font-weight:var(--w-medium); }
.fhead span{ font-size:12.5px; color:var(--ink-3); }

/* Retour du 22/10 : carte de pro sans portrait étiré. Pastille ronde à côté
   du nom, le reste de la carte en pleine largeur. */
.pro{ display:grid; grid-template-columns:56px 1fr; column-gap:12px; padding:14px; align-items:center; }
.pro .pro-body{ display:contents; }
.pro .photo.is-pro{ grid-row:1 / span 2; width:56px; height:56px; min-height:0; border-radius:var(--r-pill); }
.pro .pro-name{ grid-column:2; align-self:end; }
.pro .pro-role{ grid-column:2; align-self:start; margin-top:2px; }
.pro .pro-tags, .pro .pro-blurb, .pro .pro-rate{ grid-column:1 / -1; }
.pro .pro-tags{ margin-top:10px; }

/* Ligne joueur : une seule cible, la feuille fait le reste (22/10). */
button.vp{ width:100%; border-left:0; border-right:0; border-bottom:0; background:none; font-family:inherit; text-align:left; color:var(--ink); cursor:pointer; }
.vp{ grid-template-columns:44px 1fr auto; align-items:center; }
.vp-main{ display:flex; flex-direction:column; min-width:0; }
.vp-main .vp-n{ font-size:var(--t-15); font-weight:var(--w-medium); }
.vp-main .vp-s{ font-size:12.5px; color:var(--ink-3); margin-top:2px; line-height:1.35; }
.vp-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.vp-tags .vp-tag{ margin:0; }
.vp-tag.is-plain{ background:var(--sand); color:var(--ink-2); }
.vp-side{ display:flex; align-items:center; gap:4px; padding-left:8px; }
.vp-side .vp-price{ text-align:right; font-size:var(--t-15); }
.vp-side .vp-price s{ display:block; margin:0; font-size:11px; }
.vp-side > .ti{ font-size:18px; color:var(--ink-3); }
.sheet-done{ width:100%; margin-top:16px; }
.vp-remove{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; min-height:44px; margin-top:6px;
  border:0; background:none; font-family:inherit; font-size:var(--t-13); font-weight:var(--w-medium); color:var(--negative); cursor:pointer; }
.vp-remove .ti{ font-size:17px; }

/* --- « Avec quoi ? » : choix du moyen de paiement, façon Lydia (22/10) --- */
.paysel{
  display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:12px 14px;
  border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow-card);
  font-family:inherit; text-align:left; color:var(--ink); cursor:pointer;
}
.paysel.is-empty{ border-style:dashed; border-color:var(--gold); }
.paysel-ic{ flex:0 0 auto; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:12px; background:var(--gold-light); color:var(--gold-dark); font-size:20px; }
.paysel-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.paysel-l{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); }
.paysel-v{ font-size:var(--t-15); font-weight:var(--w-medium); }
.paysel-s{ font-size:12.5px; color:var(--ink-3); }
.paysel > .ti{ font-size:18px; color:var(--ink-3); }
.paysheet-h{ margin:14px 0 4px; font-size:var(--t-15); font-weight:var(--w-semi); }
.sheet .payrow{
  display:flex; align-items:center; gap:12px; width:100%; min-height:60px; padding:10px 0;
  border:0; border-bottom:1px solid var(--line); background:none;
  font-family:inherit; text-align:left; color:var(--ink); cursor:pointer;
}
.sheet .payrow:last-child{ border-bottom:0; }
.sheet .payrow[disabled]{ opacity:.45; cursor:default; }
.sheet .payrow-ic{ flex:0 0 auto; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:12px; background:var(--sand); color:var(--ink-2); font-size:20px; }
.sheet .payrow-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.sheet .payrow-n{ font-size:var(--t-15); font-weight:var(--w-medium); }
.sheet .payrow-s{ font-size:12.5px; color:var(--ink-3); }
.sheet .payrow-ok{ flex:0 0 auto; font-size:20px; color:var(--gold-dark); }
.payadd{ display:inline-flex; align-items:center; gap:6px; min-height:44px; margin-top:14px; padding:0 18px;
  border:0; border-radius:var(--r-pill); background:var(--sand); font-family:inherit; font-size:var(--t-13);
  font-weight:var(--w-medium); color:var(--ink); cursor:pointer; }

/* Lignes de la feuille « Avec quoi ? » : ni bordure ni arrondi (22/10). */
.sheet .payrow{ border:0; border-radius:0; box-shadow:none; background:none; padding:8px 0; }

/* Photo de profil (22/10) : pastille appareil photo sur l'avatar. */
.avatar{ position:relative; overflow:visible; }
.avatar-img{ position:absolute; inset:0; border-radius:var(--r-pill); background-size:cover; background-position:center; }
.avatar-edit{ position:absolute; right:-2px; bottom:-2px; width:32px; height:32px; display:inline-flex; align-items:center;
  justify-content:center; border:2px solid var(--surface); border-radius:var(--r-pill); background:var(--ink);
  color:var(--on-dark); font-size:15px; cursor:pointer; }
.avatar-drop{ margin-top:6px; font-size:12.5px; }

/* Moyens de paiement : lignes plates (22/10). */
.cardrow{ display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
.cardrow:first-child{ border-top:0; }
.cardrow-ic{ flex:0 0 auto; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:12px; background:var(--sand); color:var(--ink-2); font-size:20px; }
.cardrow-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.cardrow-n{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:var(--t-15); font-weight:var(--w-medium); }
.cardrow-s{ font-size:12.5px; color:var(--ink-3); }
.cardrow-main{ align-self:flex-start; font-size:12.5px; min-height:32px; }
.cardrow-x{ flex:0 0 auto; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center;
  border:0; border-radius:var(--r-pill); background:none; color:var(--ink-3); font-size:20px; cursor:pointer; }
.cardrow-x:active{ background:var(--scrim); color:var(--negative); }

/* Les pastilles posent leur fond en raccourci « background », qui remettait
   la photo à sa taille réelle : on la recadre ici quoi qu'il arrive. */
.has-photo{ background-size:cover !important; background-position:center !important; background-repeat:no-repeat !important; color:transparent !important; }

.form-pair{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }

/* Pictos golf (22/10) : silhouettes à la taille et à la couleur du texte. */
svg.gi{ display:inline-block; width:1em; height:1em; fill:currentColor; vertical-align:-0.14em; overflow:visible; }

/* Places d'une feuille de départ. Un départ ne peut pas porter plus de
   quatre joueurs, et jamais plus que ses places restantes. */
var PARTY_MAX = 4;
/* Lot 11 (booking engine v3) : de 5 à 12 joueurs, on coche autant de
   départs qu'il en faut ; au-delà de 12, demande de groupe à l'accueil. */
var GROUP_MAX = 12;
function isGroup(){ return STATE.draft.party > PARTY_MAX; }
function needSeats(){ return isGroup() ? 1 : STATE.draft.party; }
function flightSlot(f){
  var d = STATE.draft;
  var site = draftSite();
  if(!site || !f) return null;
  var parts = f.key.split('-');
  var offset = parseInt(parts[0], 10), minutes = parseInt(parts[1], 10);
  var variant = slotVariant(site, f.ci, offset, minutes);
  return { site:site, course:site.courses[f.ci], ci:f.ci, offset:offset, minutes:minutes,
           time:hhmm(minutes), variant:variant, badge:SLOT_VARIANTS[variant].badge,
           seats:slotSeats(site, f.ci, offset, minutes),
           base:slotBasePrice(site, f.ci, offset, minutes, variant) };
}
/* Places de chaque départ coché, dans l'ordre : chacun prend ce qu'il peut,
   jusqu'à placer tout le groupe. */
function flightCaps(){
  var d = STATE.draft;
  var left = d.party, out = [];
  var fl = d.flights || [];
  for(var i=0;i<fl.length;i++){
    var s = flightSlot(fl[i]);
    var c = s ? Math.min(PARTY_MAX, s.seats, Math.max(0, left)) : 0;
    out.push(c);
    left -= c;
  }
  return out;
}
function placedCount(){
  var caps = flightCaps(), n = 0;
  for(var i=0;i<caps.length;i++) n += caps[i];
  return Math.min(n, STATE.draft.party);
}

/* Le compte repart du référentiel à toute bascule de la barre de contrôle,
   comme les brouillons et le portefeuille : les proches, les cartes et les
   consentements appartiennent au compte, et le compte change avec le persona.
   Les listes sont recopiées entrée par entrée — partager les objets du
   référentiel ferait qu'une modification survivrait à la réinitialisation. */
function clearAccount(){
  var a = STATE.account;
  var i;

  applyMembershipDemo();

  var RELATIVES = seedRelatives();
  a.relatives = [];
  for(i=0;i<RELATIVES.length;i++){
    a.relatives.push({
      id:RELATIVES[i].id,
      firstName:RELATIVES[i].firstName,
      lastName:RELATIVES[i].lastName,
      licence:RELATIVES[i].licence,
      member:RELATIVES[i].member,
      relation:RELATIVES[i].relation,
      source:RELATIVES[i].source,
      birth:RELATIVES[i].birth,
      phone:RELATIVES[i].phone,
      shares:RELATIVES[i].shares
    });
  }
  a.shareTees = false;
  a.seq = 0;
  a.bookings = [];
  a.gfWait = {};
  a.openGf = null;
  a.copied = null;
  clearTableDraft();

  a.cards = [];
  for(i=0;i<CARDS.length;i++){
    a.cards.push({
      id:CARDS[i].id,
      last4:CARDS[i].last4,
      expires:CARDS[i].expires,
      holder:playerName(profile()),
      /* La première carte du référentiel est celle qui sert par défaut. */
      main:(i === 0)
    });
  }

  a.consents = {};
  for(i=0;i<CONSENTS.length;i++){
    a.consents[CONSENTS[i].id] = { on:CONSENTS[i].on, days:CONSENTS[i].days };
  }

  a.contact = null;
  a.licence = null;
  a.licGain = null;
  /* Lot 9d : le compte rendu du dernier geste appartient au compte. Il
     survivait à la bascule de persona (« Licence … reconnue » lu sous
     l'autre profil). */
  a.done = null;
  a.pubProfile = false;
  a.tariff = { season:null, day:'week', siteCode:null };
  a.index = null;
  a.ffgAt = null;
  a.ffgBusy = false;
  a.medicalSent = false;
  clearAccountSheet();
}

/* Périmètre d'accès du membre Passion : sa région, ou son seul site en
   variante Monosite. Dérivé de isPassion(), jamais testé dans un écran. */
function accessScope(){
  var site = currentSite();
  return STATE.passionScope === 'region' ? site.region : site.name;
}

/* Libellé de l'abonnement. Il suit la variante retenue dans la barre de
   contrôle : écrire « Passion Région » à côté d'un périmètre monosite serait
   une contradiction à l'écran, et le portefeuille est le premier écran à
   afficher les deux côte à côte. Le jeu de données porte la variante Région du
   brief §2 ; le nom de la variante Monosite est une HYPOTHÈSE, le brief ne
   nomme que le commutateur. */
function membershipLabel(){
  var m = profile().membership;
  if(!m) return null;
  /* Monosite : la formule de Claire Dumas dans v3, « Abonnement 7 j/7 ». */
  return STATE.passionScope === 'mono'
    ? 'Abonnement 7 j/7 · ' + currentSite().name
    : m.label;
}

/* La fiche licence n'est incomplète que chez le licencié externe : le brief ne
   prévoit l'encart de relance que pour lui. */
function hasLicence(){ return isPassion() ? true : STATE.licenceOnFile; }

/* =========================================================================
   2b. Tirage déterministe, calendrier, tarifs — lot 2
       Tout ce qui varie ici est reproductible : même profil, même site, même
       jour, même feuille de départs et mêmes prix d'une exécution à l'autre.
   ========================================================================= */

/* PRNG du brief §6. Annoncé au lot 0, introduit ici : le lot 1 n'avait aucune
   série à tirer. */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Graine dérivée d'une chaîne : le tirage est indexé par ce qu'il décrit
   (site, parcours, jour, minute), jamais par un compteur d'appel. */
function seedFrom(text){
  var h = 2166136261;
  for(var i=0;i<text.length;i++){
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function draw(text){ return mulberry32(seedFrom(text))(); }

/* --- Calendrier ---------------------------------------------------------- */

function startOfToday(){
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function dateAt(offset){
  var d = startOfToday();
  d.setDate(d.getDate() + offset);
  return d;
}
function offsetOf(date){
  var a = startOfToday().getTime();
  var b = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  return Math.round((b - a) / 86400000);
}
function isWeekend(offset){
  var g = dateAt(offset).getDay();
  return g === 0 || g === 6;
}

/* « samedi 30 août » — prose. La casse haute des tables est ramenée en bas de
   casse ici, les accents passent sans dommage. */
function longDate(offset){
  var d = dateAt(offset);
  return JOURS[d.getDay()].toLowerCase() + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()].toLowerCase();
}
function shortDate(offset){
  var d = dateAt(offset);
  return d.getDate() + ' ' + MOIS_COURT[d.getMonth()];
}
function hhmm(minutes){
  return pad2(Math.floor(minutes / 60)) + ':' + pad2(minutes % 60);
}

/* --- Fermetures de parcours ---------------------------------------------- */

function closureFor(site, courseIndex, offset){
  var list = site.closures || [];
  for(var i=0;i<list.length;i++){
    var c = list[i];
    if(c.course === courseIndex && offset >= c.from && offset <= c.to) return c;
  }
  return null;
}
function closuresOfCourse(site, courseIndex){
  var list = site.closures || [];
  var out = [];
  for(var i=0;i<list.length;i++){ if(list[i].course === courseIndex) out.push(list[i]); }
  return out;
}
function dayIsOpen(site, courseIndex, offset){
  if(offset < 0 || offset > BOOK_HORIZON) return false;
  return !closureFor(site, courseIndex, offset);
}

/* Premier jour jouable, pour que l'étape 3 s'ouvre déjà sur une feuille de
   départs. Un écran qui demande de choisir un jour avant de montrer quoi que
   ce soit fait payer un geste pour rien : le cas courant est « aujourd'hui ». */
function firstOpenDay(site, courseIndex){
  for(var i=0;i<=BOOK_HORIZON;i++){
    if(dayIsOpen(site, courseIndex, i)) return i;
  }
  return null;
}

/* Motif d'une fermeture, en une phrase. « du 7 au 14 septembre », ou
   « jusqu'au 5 septembre » quand la fermeture a déjà commencé. */
function closureText(site, closure){
  var course = site.courses[closure.course];
  var when = closure.from <= 0
    ? 'jusqu\'au ' + dateAt(closure.to).getDate() + ' ' + MOIS[dateAt(closure.to).getMonth()].toLowerCase()
    : 'du ' + dateAt(closure.from).getDate() + ' au ' + dateAt(closure.to).getDate()
      + ' ' + MOIS[dateAt(closure.to).getMonth()].toLowerCase();
  return closure.reason + ' sur ' + course.name + ', ' + when + '.';
}

/* Texte de l'alerte de travaux de l'accueil — dérivé des fermetures depuis le
   lot 2, pour que l'accueil et l'étape 3 ne puissent pas se contredire. */
function worksText(site){
  var list = site.closures || [];
  if(!list.length) return null;
  return closureText(site, list[0]);
}

/* --- Distance simulée ----------------------------------------------------- */

/* Géolocalisation simulée : le joueur est supposé à son site de rattachement.
   HYPOTHÈSE — les distances ne sont pas des distances routières réelles, elles
   sont tirées de façon déterministe dans une fourchette cohérente avec le
   découpage régional. Elles servent à ordonner la liste, pas à informer. */
function siteDistance(site){
  var home = currentSite();
  if(site.code === home.code) return 0;
  var r = draw('dist' + home.code + site.code);
  if(site.region === home.region) return Math.round(12 + r * 48);
  return Math.round(180 + r * 720);
}
function distanceLabel(site){
  var km = siteDistance(site);
  return km === 0 ? 'Votre site' : km + ' km';
}

/* --- Périmètre de l'abonnement ------------------------------------------- */

/* Un site est couvert par la carte Passion selon la variante d'abonnement.
   Dérivé de isPassion(), jamais retesté dans un écran. */
function passCoversSite(site){
  if(!isPassion()) return false;
  var home = currentSite();
  return STATE.passionScope === 'region' ? site.region === home.region : site.code === home.code;
}

/* Le seul prédicat qui décide de la structure de la ligne de créneau : la
   colonne de prix existe, ou elle n'existe pas. Un membre Passion hors
   périmètre retrouve exactement la ligne du licencié externe. */
function slotsShowPrice(site){ return !passCoversSite(site); }

/* --- Feuille de départs et tarifs ---------------------------------------- */

function slotVariant(site, courseIndex, offset, minutes){
  if(minutes >= TWILIGHT_FROM) return 'twilight';
  if(minutes >= TEE_BLOCKS[1].from
     && draw('var' + site.code + courseIndex + offset + minutes) < 0.22) return 'web';
  return 'plein';
}

/* Lot 10 : une journée entièrement complète, pour montrer le jour sans
   disponibilité dans la bande et la liste d'attente à la journée. HYPOTHÈSE de
   démonstration : le premier dimanche à partir d'après-demain, sur tous les
   parcours. */
function dayIsFull(site, courseIndex, offset){
  /* Lot 11 : la journée complète de démonstration est le premier dimanche
     à partir d'après-demain qui ne porte aucun départ de proche (sinon la
     démo des proches disparaît le jeudi, quand J+3 est un dimanche). */
  return offset === demoFullDay();
}
function demoFullDay(){
  var tees = relativeTees();
  for(var o=2;o<=15;o++){
    if(dateAt(o).getDay() !== 0) continue;
    var busy = false;
    for(var i=0;i<tees.length;i++){ if(tees[i].day === o) busy = true; }
    if(!busy) return o;
  }
  return -1;
}

/* Places restantes sur quatre. Zéro vaut complet : la ligne reste affichée. */
function slotSeats(site, courseIndex, offset, minutes){
  if(dayIsFull(site, courseIndex, offset)) return 0;
  /* Lot 9e : un départ réservé par un proche occupe ses places. */
  var taken = relativeTeePlayers(site, courseIndex, offset, minutes);
  if(taken) return PARTY_MAX - taken;
  var r = draw('seat' + site.code + courseIndex + offset + minutes);
  if(r < 0.18) return 0;
  if(r < 0.34) return 1;
  if(r < 0.55) return 2;
  if(r < 0.72) return 3;
  return 4;
}

/* Tarification dynamique. Le prix se construit par un facteur dans [0,1] puis
   se projette dans la fourchette du parcours : il ne peut pas en sortir, et il
   varie dans la journée comme le veut le brief. Le résultat est le tarif
   licencié — c'est le tarif de référence du créneau, indépendant de qui joue.
   Les étapes 5 et suivantes en dérivent le tarif de chaque joueur. */
function slotBasePrice(site, courseIndex, offset, minutes, variant){
  var course = site.courses[courseIndex];
  var range = GF_RANGE[course.holes] || GF_RANGE[18];
  var band;
  if(minutes >= TWILIGHT_FROM) band = 0.04;
  else if(minutes >= TEE_BLOCKS[1].from) band = 0.30;
  else if(minutes >= 10 * 60) band = 0.56;
  else band = 0.66;

  var factor = band
