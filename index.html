    +     '<span class="sbar-ic">' + icon('users-group') + '</span>'
    +     '<span class="sbar-body"><span class="sbar-lbl">Mes proches</span>'
    +       '<span class="sbar-val">' + (prox ? 'Affichés sur les jours' : 'Afficher') + '</span></span>'
    +     '<span class="switch' + (prox ? ' is-on' : '') + '" aria-hidden="true"><span class="switch-knob"></span></span>'
    +   '</button>'
    + '</div>';
}

function gtimeDots(seats){
  var html = '<span class="gdots" aria-hidden="true">';
  for(var i=0;i<PARTY_MAX;i++) html += '<i' + (i < PARTY_MAX - seats ? ' class="is-on"' : '') + '></i>';
  return html + '</span>';
}
function gtile(site, ci, slot, covered){
  var d = STATE.draft;
  if(slot.seats >= needSeats()){
    var on = isGroup() ? flightIndexOf(ci, slot.key) > -1 : (d.courseIndex === ci && d.slotKey === slot.key);
    var price = covered
      ? '<span class="gtime-p is-incl">Inclus</span>'
      : '<span class="gtime-p' + (slot.badge ? ' is-badge' : '') + '">'
        + (slot.badge ? slot.badge + ' ' : '') + amount(slot.price) + '</span>';
    var tee = (d.proxOn && ci === 0) ? relativeTeeAt(d.dayOffset, slot.minutes) : null;
    if(tee) price += '<span class="gtime-rel" data-role="slot-prox">' + icon('users')
                   + escapeAttr(tee.rel.firstName) + '</span>';
    return '<button type="button" class="gtime' + (on ? ' is-on' : '') + (tee ? ' has-rel' : '') + '" '
         +   'data-pick="slot" data-course="' + ci + '" data-value="' + slot.key + '" '
         +   'data-role="slot" aria-label="' + site.courses[ci].name + ', ' + slot.time + ', '
         +   seatsLabel(slot.seats) + (covered ? ', inclus' : ', ' + slot.price + ' euros') + '">'
         +   '<span class="gtime-t">' + slot.time + '</span>' + price + gtimeDots(slot.seats)
         + '</button>';
  }
  if(slot.seats === 0){
    var key = gfWaitKey(d.siteCode, ci, d.dayOffset, slot.minutes);
    if(gfWaitHas(key)){
      return '<span class="gtime is-full is-wait" data-role="slot-waiting">'
           +   '<span class="gtime-t">' + slot.time + '</span>'
           +   '<span class="gtime-p">' + icon('check') + ' En attente</span>' + gtimeDots(0)
           + '</span>';
    }
    return '<button type="button" class="gtime is-full" data-act="gf-wait-c" '
         +   'data-value="' + ci + '|' + slot.minutes + '" data-role="slot-full" '
         +   'aria-label="' + slot.time + ', complet, me prévenir si une place se libère">'
         +   '<span class="gtime-t">' + slot.time + '</span>'
         +   '<span class="gtime-p">Me prévenir</span>' + gtimeDots(0)
         + '</button>';
  }
  return '<span class="gtime is-short" data-role="slot-short" '
       +   'aria-label="' + slot.time + ', ' + seatsLabel(slot.seats) + ', pas assez pour votre groupe">'
       +   '<span class="gtime-t">' + slot.time + '</span>'
       +   '<span class="gtime-p">' + seatsLabel(slot.seats) + '</span>' + gtimeDots(slot.seats)
       + '</span>';
}

function flightIndexOf(ci, key){
  var fl = STATE.draft.flights || [];
  for(var i=0;i<fl.length;i++){ if(fl[i].ci === ci && fl[i].key === key) return i; }
  return -1;
}
function courseCard(site, ci, covered){
  var d = STATE.draft;
  var c = site.courses[ci];
  var open = dayIsOpen(site, ci, d.dayOffset);
  var top = '<div class="crs-top">'
          +   photo(site, ci, 'crs-' + site.code + '-' + ci)
          +   '<span class="crs-holes"><b>' + c.holes + '</b>trous</span>'
          +   '<p class="crs-name">' + c.name + ' <span>&middot; par ' + c.par + '</span></p>'
          + '</div>';
  if(!open){
    var closure = closureFor(site, ci, d.dayOffset);
    return '<div class="crs is-off" data-role="course-card" data-course="' + ci + '">' + top
         +   '<p class="crs-closed" data-role="course-closed">' + icon('traffic-cone')
         +     '<span>' + (closure ? closureText(site, closure) : 'Fermé ce jour-là.') + '</span></p>'
         + '</div>';
  }
  var list = courseSlots(site, ci, d.dayOffset);
  var free = 0, best = null, selIdx = -1;
  for(var i=0;i<list.length;i++){
    if(list[i].seats >= needSeats()){
      free += 1;
      if(best === null || list[i].price < best) best = list[i].price;
    }
    if(d.courseIndex === ci && d.slotKey === list[i].key) selIdx = i;
  }
  var more = (d.more || {})[ci] || selIdx >= GF_CLAMP - 1;
  var shown = more ? list.length : Math.min(list.length, GF_CLAMP - 1);
  var tiles = '';
  for(var k=0;k<shown;k++) tiles += gtile(site, ci, list[k], covered);
  if(!more && list.length > shown){
    tiles += '<button type="button" class="gtime is-more" data-act="gf-more" data-value="' + ci + '">'
           +   '<b>Voir plus</b><span>+' + (list.length - shown) + ' départs</span></button>';
  }
  var price = best === null ? ''
    : (covered ? '<b class="is-incl">Inclus</b><small>dans votre abonnement</small>'
               : '<b>dès ' + amount(best) + '</b><small>votre tarif, par joueur</small>');
  return '<div class="crs' + (free ? '' : ' is-off') + '" data-role="course-card" data-course="' + ci + '">'
       +   top
       +   '<div class="crs-head">'
       +     '<p class="crs-cad">' + plural(free, 'départ ouvert', 'départs ouverts') + '<br>Toutes les ' + TEE_STEP + ' min</p>'
       +     '<span class="crs-price">' + price + '</span>'
       +   '</div>'
       +   (list.length
          ? '<div class="gtimes" data-role="slots">' + tiles + '</div>'
          : '<p class="gtimes-empty">Aucun départ sur cette plage.</p>')
       + '</div>';
}
function plural(n, one, many){ return n + ' ' + (n > 1 ? many : one); }

function screenGfDate(){
  var site = draftSite();
  var d = STATE.draft;
  var covered = passCoversSite(site);
  var strip = '';
  for(var i=0;i<STRIP_DAYS;i++) strip += dayTile(site, i, d.dayOffset === i);

  var body;
  if(dayIsFull(site, 0, d.dayOffset)){
    body = fullDayBlock(site);
  } else {
    var cards = '', openCourses = 0, total = 0;
    for(var ci=0;ci<site.courses.length;ci++){
      cards += courseCard(site, ci, covered);
      if(!dayIsOpen(site, ci, d.dayOffset)) continue;
      var list = courseSlots(site, ci, d.dayOffset), n = 0;
      for(var k=0;k<list.length;k++) if(list[k].seats >= needSeats()) n += 1;
      if(n){ openCourses += 1; total += n; }
    }
    var head = total && isGroup()
      ? '<div class="crs-lh" data-role="tee-count"><b>Cochez vos créneaux &middot; ' + placedCount()
        + '&nbsp;/&nbsp;' + d.party + ' joueurs placés</b></div>'
        + '<p class="grpnote">Quatre joueurs au plus par départ&nbsp;: cochez autant de créneaux qu\'il en faut. '
        + 'Au-delà de ' + GROUP_MAX + ' joueurs, faites une demande de groupe à l\'accueil du golf.</p>'
      : total
      ? '<div class="crs-lh" data-role="tee-count"><b>'
        + plural(openCourses, 'parcours ouvert', 'parcours ouverts') + ' &middot; '
        + plural(total, 'départ', 'départs') + '</b><span>pour '
        + (d.party > 1 ? d.party + ' joueurs' : '1 joueur') + '</span></div>'
      : '<div class="stepempty" data-role="tee-empty">'
        + '<h3 class="screen-title">Aucun départ pour '
        + (d.party > 1 ? d.party + ' joueurs' : 'un joueur')
        + (d.window === 'all' ? ' ce jour-là' : ' sur cette plage') + '</h3>'
        + '<p class="screen-text">Essayez un autre jour, une autre plage, ou un groupe plus petit. '
        + 'Les départs complets ouvrent une liste d\'attente.</p>'
        + (d.party > 1
           ? '<button type="button" class="btn is-primary" data-act="party" data-value="'
             + (d.party - 1) + '">Chercher pour '
             + (d.party - 1 > 1 ? (d.party - 1) + ' joueurs' : 'un joueur') + '</button>'
           : '')
        + '</div>';
    body = head + (total ? slotsLead(site) : '') + cards
         + '<p class="gf-note">Le prix varie selon l\'heure du départ&nbsp;: tôt le matin et en fin '
         +   'de journée, il est plus doux. Les points sous l\'heure montrent les places déjà prises.</p>';
    if(isGroup()){
      var caps = flightCaps();
      var names = [];
      for(var f=0;f<(d.flights || []).length;f++){
        var fs = flightSlot(d.flights[f]);
        names.push(fs.course.name + ' ' + fs.time + ' (' + caps[f] + ')');
      }
      body += '<div class="gbar" data-role="group-bar"><div><b>' + placedCount() + '&nbsp;/&nbsp;' + d.party
            + ' joueurs placés</b><span>' + (names.length ? names.join(' &middot; ') : 'Aucun créneau coché') + '</span></div>'
            + '<button type="button" class="btn is-primary" data-act="group-go"'
            + (placedCount() >= d.party ? '' : ' disabled aria-disabled="true"') + '>Continuer</button></div>';
    }
  }

  return ''
    + '<p class="gf-site" data-role="gf-site"><span>Green-fee &middot; <b>' + site.name + '</b></span>'
    +   '<button type="button" class="linkbtn" data-nav="/book/gf/site">Autre golf du groupe</button></p>'
    + '<h2 class="gf-title">Quand souhaitez-vous <b>jouer</b>&nbsp;?</h2>'
    + searchBar(site)
    + '<div class="dtiles" data-role="daystrip">' + strip + '</div>'
    + withHint()
    + proxBlock()
    + '<section class="section" data-role="tee">' + body + '</section>';
}

/* Étape 3 du lot 2, remplacée au lot 11. Gardée pour mémoire du gabarit. */
function screenGfDateLot10(){
  var site = draftSite();
  var ci = STATE.draft.courseIndex;
  var d = STATE.draft;

  var strip = '';
  var openInStrip = 0;
  for(var i=0;i<STRIP_DAYS;i++){
    if(dayIsOpen(site, ci, i)) openInStrip += 1;
    strip += dayButton(site, ci, i, d.dayOffset === i);
  }

  var closures = closuresOfCourse(site, ci);
  var note = '';
  for(var k=0;k<closures.length;k++){
    if(closures[k].from <= STRIP_DAYS - 1){
      note = '<p class="daystrip-note">' + icon('traffic-cone')
           + '<span>' + closureText(site, closures[k]) + '</span></p>';
      break;
    }
  }

  /* Aucun jour ouvert sur la bande : l'écran invite à ouvrir le mois plutôt
     que de laisser une rangée de jours barrés sans issue. */
  var empty = '';
  if(openInStrip === 0){
    empty = '<div class="stepempty" data-role="date-empty">'
          +   '<h3 class="screen-title">Aucune date sur les quinze prochains jours</h3>'
          +   '<p class="screen-text">' + draftCourse().name + ' rouvre plus tard. '
          +     'Ouvrez le calendrier pour voir les dates suivantes.</p>'
          +   (d.monthOpen ? ''
             : '<button type="button" class="btn is-primary" data-act="month-toggle">'
               + 'Ouvrir le calendrier</button>')
          + '</div>';
  }

  return ''
    + crumbs('date')
    + '<h2 class="screen-title">Quel départ ?</h2>'
    + '<section class="section">'
    +   '<div class="daystrip" data-role="daystrip">' + strip + '</div>'
    +   note
    +   (empty ? '<div class="section">' + empty + '</div>' : '')
    +   '<button type="button" class="daymore" data-act="month-toggle">'
    +     icon('calendar-month')
    +     '<span>' + (d.monthOpen ? 'Masquer le calendrier' : 'Voir tout le calendrier')
    +     '</span>'
    +   '</button>'
    +   (d.monthOpen ? monthGrid(site, ci) : '')
    +   proxToggle()
    + '</section>'
    + withHint()
    + teeSheet();
}

/* « Réserver un départ avec » : le proche choisi sera placé d'office. Le
   rappel vit au-dessus de la feuille de départs, là où se fait le choix. */
function withHint(){
  var d = STATE.draft;
  var rel = d.withId ? relativeById(d.withId) : null;
  if(!rel) return '';
  return '<p class="hint" data-role="with-hint">' + icon('user-plus')
       + '<span>Choisissez un départ&nbsp;: <b>' + escapeAttr(rel.firstName)
       + '</b> y sera ajouté·e automatiquement.</span></p>';
}

/* Interrupteur « Mes proches sur le parcours » — repris du booking engine v3,
   retours du 24/09. Éteint par défaut : il ajoute de l'information à un écran
   déjà dense, c'est au joueur de la demander. */
function proxToggle(){
  var on = STATE.draft.proxOn;
  return '<button type="button" class="switchrow" data-act="prox-toggle" '
       +   'data-role="prox-toggle" role="switch" aria-checked="' + (on ? 'true' : 'false') + '">'
       +   '<span class="switchrow-mark">' + icon('users') + '</span>'
       +   '<span class="switchrow-body">'
       +     '<span class="switchrow-title">Mes proches sur le parcours</span>'
       +     '<span class="switchrow-text">'
       +       (on ? 'Les jours où ils jouent portent un point.'
                   : 'Voir les départs que vos proches partagent avec vous.')
       +     '</span>'
       +   '</span>'
       +   '<span class="switch' + (on ? ' is-on' : '') + '" aria-hidden="true">'
       +     '<span class="switch-knob"></span></span>'
       + '</button>';
}

/* Le bloc « Vos proches jouent ce jour-là ». Rejoindre un départ crée une
   réservation indépendante : on ne règle que ses propres places, et le proche
   est prévenu (booking engine v3, retours du 24/09). */
function proxBlock(){
  var d = STATE.draft;
  if(!d.proxOn || d.dayOffset === null) return '';
  var tees = relativeTeesOn(d.dayOffset);

  if(!tees.length){
    var other = false;
    for(var k=0;k<STRIP_DAYS;k++){ if(relativeTeesOn(k).length) other = true; }
    return '<div class="prox" data-role="prox-empty">'
         +   '<p class="prox-title">Aucun de vos proches ne joue ce jour-là</p>'
         +   '<p class="prox-text">'
         +     (other
              ? 'Touchez un jour marqué d\'un point pour voir leurs départs.'
              : 'Seuls les proches qui partagent leurs départs avec vous apparaissent '
                + 'ici, sur les parcours ' + atSite(currentSite()) + '.')
         +   '</p>'
         + '</div>';
  }

  var rows = '';
  for(var i=0;i<tees.length;i++){
    var t = tees[i];
    var action;
    if(d.slotKey === t.key && joinedRelative()){
      action = '<p class="prox-note is-on">' + icon('check') + '<span>Départ retenu</span></p>';
    } else if(t.seats >= d.party){
      action = '<button type="button" class="btn is-quiet prox-join" data-act="prox-join" '
             +   'data-value="' + t.rel.id + '|' + t.key + '">Rejoindre ce départ</button>';
    } else {
      action = '<p class="prox-note">'
             + (t.seats
                ? 'Plus que ' + t.seats + (t.seats > 1 ? ' places' : ' place')
                  + '&nbsp;: pas assez pour ' + d.party + ' joueurs.'
                : 'Départ complet.')
             + '</p>';
    }
    rows += '<div class="prox-row" data-role="prox-row">'
          +   '<span class="rel-mark">' + initials(t.rel) + '</span>'
          +   '<span class="prox-body">'
          +     '<span class="prox-name">' + escapeAttr(playerName(t.rel)) + ' &middot; '
          +       t.time + '</span>'
          +     '<span class="prox-meta">' + relationOf(t.rel) + ' &middot; '
          +       t.players + (t.players > 1 ? ' joueurs' : ' joueur') + '</span>'
          +   '</span>'
          + '</div>'
          + action;
  }

  return '<div class="prox" data-role="prox">'
       +   '<p class="prox-title">Vos proches jouent ce jour-là</p>'
       +   rows
       +   '<p class="prox-text">Rejoindre un départ crée votre propre réservation&nbsp;: '
       +     'vous ne réglez que vos places, et votre proche est prévenu·e.</p>'
       + '</div>';
}

/* --- Nombre de joueurs recherché ----------------------------------------- */

/* Le filtre du haut de la feuille. Depuis le lot 10, il ne masque plus rien :
   un départ qui n'a pas la place du groupe reste lisible, non sélectionnable. */
function partyPicker(){
  var d = STATE.draft;
  var html = '<div class="party" data-role="party">'
           + '<span class="party-label">Combien de joueurs&nbsp;?</span>'
           + '<div class="party-choices" role="radiogroup" '
           +   'aria-label="Nombre de joueurs">';
  for(var n=1;n<=PARTY_MAX;n++){
    var on = (d.party === n);
    html += '<button type="button" class="party-choice' + (on ? ' is-on' : '') + '" '
          +   'data-act="party" data-value="' + n + '" '
          +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '" '
          +   'aria-label="' + n + (n > 1 ? ' joueurs' : ' joueur') + '">'
          +   n
          + '</button>';
  }
  return html + '</div></div>';
}

/* --- Feuille de départs, sous la bande de jours -------------------------- */

/* Plage horaire — lot 10, point du 20/10. */
function windowPicker(){
  var d = STATE.draft;
  var opts = [{ id:'all', label:'Journée' }].concat(TEE_BLOCKS);
  var html = '<div class="party" data-role="window">'
           + '<span class="party-label">Quand&nbsp;?</span>'
           + '<div class="party-choices is-text" role="radiogroup" aria-label="Plage horaire">';
  for(var i=0;i<opts.length;i++){
    var on = (d.window === opts[i].id);
    html += '<button type="button" class="party-choice' + (on ? ' is-on' : '') + '" '
          +   'data-act="window" data-value="' + opts[i].id + '" role="radio" '
          +   'aria-checked="' + (on ? 'true' : 'false') + '">' + opts[i].label + '</button>';
  }
  return html + '</div></div>';
}
function setWindow(id){
  var ok = (id === 'all');
  for(var i=0;i<TEE_BLOCKS.length;i++){ if(TEE_BLOCKS[i].id === id) ok = true; }
  if(!ok || STATE.draft.window === id) return false;
  STATE.draft.window = id;
  refresh();
  return true;
}

/* Lot 10, point du 20/10 : les départs complets restent à l'écran, grisés, et
   ouvrent la liste d'attente — voir l'activité autour de soi est une
   information. Cela revient à la règle du brief, que la décision d'Alexie du
   28/08 avait levée. Un départ qui a des places, mais pas assez pour le
   groupe cherché, reste lui aussi visible et non sélectionnable. */
function teeSheet(){
  var site = draftSite();
  var d = STATE.draft;
  if(d.dayOffset === null) return '';

  var showPrice = slotsShowPrice(site);
  var outside = isPassion() && !passCoversSite(site);
  var full = dayIsFull(site, d.courseIndex, d.dayOffset);

  var groups = '';
  var free = 0;
  for(var b=0;b<TEE_BLOCKS.length;b++){
    var block = TEE_BLOCKS[b];
    if(d.window !== 'all' && d.window !== block.id) continue;
    var slots = slotsOfBlock(site, d.courseIndex, d.dayOffset, block);
    var rows = '';
    for(var i=0;i<slots.length;i++){
      var tee = d.proxOn ? relativeTeeAt(d.dayOffset, slots[i].minutes) : null;
      if(slots[i].seats >= d.party){
        free += 1;
        rows += slotRow(site, slots[i], showPrice, outside, d.slotKey === slots[i].key,
                        tee ? tee.rel.firstName : null);
      } else {
        rows += slotRowShort(site, slots[i], showPrice);
      }
    }
    groups += '<section class="slot-group" data-role="slot-group">'
            +   '<h3 class="slot-group-head">' + block.label + '</h3>'
            +   '<div class="slots' + (showPrice ? ' has-price' : '') + '" data-role="slots">'
            +     rows
            +   '</div>'
            + '</section>';
  }

  var body;
  if(full){
    body = fullDayBlock(site);
  } else if(free){
    body = slotsLead(site)
         + groups
         + '<p class="slots-foot">Départs toutes les neuf minutes. Un départ complet '
         +   'reste affiché&nbsp;: touchez «&nbsp;Me prévenir&nbsp;» pour rejoindre sa '
         +   'liste d\'attente.</p>';
  } else {
    body = '<div class="stepempty" data-role="tee-empty">'
         +   '<h3 class="screen-title">Aucun départ pour '
         +     (d.party > 1 ? d.party + ' joueurs' : 'un joueur')
         +     (d.window === 'all' ? ' ce jour-là' : ' sur cette plage') + '</h3>'
         +   '<p class="screen-text">Essayez un autre jour, une autre plage, ou '
         +     'un groupe plus petit.</p>'
         +   (d.party > 1
            ? '<button type="button" class="btn is-primary" data-act="party" '
              + 'data-value="' + (d.party - 1) + '">Chercher pour '
              + (d.party - 1 > 1 ? (d.party - 1) + ' joueurs' : 'un joueur')
              + '</button>'
            : '')
         + '</div>'
         + groups;
  }

  return '<section class="section" data-role="tee">'
       +   '<h3 class="tee-head">' + capitalize(longDate(d.dayOffset)) + '</h3>'
       +   windowPicker()
       +   partyPicker()
       +   proxBlock()
       +   body
       + '</section>';
}

/* Ligne d'un départ qui n'a pas la place du groupe. Complet : la liste
   d'attente s'ouvre d'un geste. Un div, pas un bouton : la ligne porte
   elle-même un bouton. */
function slotRowShort(site, slot, showPrice){
  var d = STATE.draft;
  var key = gfWaitKey(d.siteCode, d.courseIndex, d.dayOffset, slot.minutes);
  var waiting = gfWaitHas(key);
  var side;
  if(slot.seats === 0){
    side = waiting
      ? '<span class="slot-wait is-on" data-role="slot-waiting">' + icon('check')
        + 'En attente</span>'
      : '<button type="button" class="slot-wait" data-act="gf-wait" '
        + 'data-value="' + slot.minutes + '" aria-label="Me prévenir si une place '
        + 'se libère à ' + slot.time + '">Me prévenir</button>';
  } else {
    side = '<span class="slot-wait is-text">Pas assez de places</span>';
  }
  return '<div class="slot is-full" data-role="slot-full" data-value="' + slot.key + '">'
       +   '<span class="slot-time">' + slot.time + '</span>'
       +   '<span class="slot-tags"></span>'
       +   '<span class="slot-left">' + seatsLabel(slot.seats) + '</span>'
       +   '<span class="slot-price"></span>'
       +   '<span class="slot-note is-wait">' + side + '</span>'
       + '</div>';
}

/* Journée complète : une seule liste d'attente, à la journée. */
function fullDayBlock(site){
  var d = STATE.draft;
  var key = gfWaitKey(d.siteCode, d.courseIndex, d.dayOffset, null);
  var waiting = gfWaitHas(key);
  return '<div class="stepempty" data-role="day-full">'
       +   '<h3 class="screen-title">Complet ce jour-là</h3>'
       +   '<p class="screen-text">Tous les départs ' + atSite(site) + ' sont pris. '
       +     'Inscrivez-vous sur la liste d\'attente&nbsp;: vous serez prévenu·e si '
       +     'une place se libère. Rien n\'est réservé ni débité.</p>'
       +   (waiting
          ? '<p class="done" data-role="day-waiting">' + icon('check')
            + '<span>Vous êtes sur la liste d\'attente de cette journée.</span></p>'
          : '<button type="button" class="btn is-primary" data-act="gf-wait" '
            + 'data-value="day">Me prévenir d\'une place</button>')
       + '</div>';
}

/* --- Étape 4 : le créneau ------------------------------------------------ */

/* La mention de tête est la seule à dire, en une phrase, ce que la colonne de
   droite signifie. Elle change de contenu selon le persona et le périmètre,
   jamais de place. */
function slotsLead(site){
  if(isPassion()){
    if(passCoversSite(site)){
      return '<p class="slots-lead" data-role="slots-lead">' + icon('infinity')
           + '<span>Vos départs sont inclus dans votre abonnement.</span></p>';
    }
    return '<p class="slots-lead" data-role="slots-lead">' + icon('map-pin-off')
         + '<span><b>Hors périmètre de votre abonnement.</b> '
         + 'Le tarif applicable s\'affiche sur chaque départ.</span></p>';
  }
  if(!hasLicence()){
    return '<p class="slots-lead" data-role="slots-lead">' + icon('id-badge-2')
         + '<span><b>Tarifs visiteurs.</b> Renseignez votre licence dans votre profil '
         + 'pour obtenir le tarif licencié.</span></p>';
  }
  return '<p class="slots-lead" data-role="slots-lead">' + icon('tag')
       + '<span>Tarifs licenciés. Ils varient selon l\'heure du départ.</span></p>';
}

function slotRow(site, slot, showPrice, outside, selected, relName){
  var full = (slot.seats === 0);
  var tags = (slot.badge && !full)
    ? '<span class="chip is-gold">' + slot.badge + '</span>'
    : '';
  /* Lot 9e : le départ d'un proche porte son prénom. */
  if(relName){
    tags += '<span class="chip" data-role="slot-prox">' + icon('users')
          + escapeAttr(relName) + '</span>';
  }

  var label = slot.time + ', ' + seatsLabel(slot.seats)
            + (showPrice && !full ? ', ' + slot.price + ' euros' : '')
            + (outside ? ', hors périmètre de votre abonnement' : '');

  return '<button type="button" class="slot'
       +   (full ? ' is-full' : '')
       +   (selected ? ' is-selected' : '') + '" '
       +   'data-pick="slot" data-value="' + slot.key + '"'
       +   (full ? ' disabled aria-disabled="true"' : '')
       +   ' aria-label="' + label + '">'
       +   '<span class="slot-time">' + slot.time + '</span>'
       +   '<span class="slot-tags">' + tags + '</span>'
       +   '<span class="slot-left">' + seatsLabel(slot.seats) + '</span>'
       +   '<span class="slot-price">'
       +     (showPrice && !full ? amount(slot.price) : '')
       +   '</span>'
       +   '<span class="slot-note">'
       +     (outside ? 'Hors périmètre de votre abonnement' : '')
       +   '</span>'
       + '</button>';
}


/* =========================================================================
   6d. Tunnel de réservation green-fee — lot 2, étapes 5 à 8
   ========================================================================= */

/* Pied permanent des étapes à total. Le montant y est toujours celui de
   grandTotal() : aucune étape ne compose le sien. */
function stepFoot(label, note, button){
  var total = grandTotal();
  return '<div class="stepfoot" data-role="stepfoot">'
       +   '<p class="total">'
       +     '<span class="total-label">' + label + '</span>'
       +     '<span class="total-value" data-role="total">'
       +       (total === 0 ? 'Rien à payer' : amount(total))
       +     '</span>'
       +   '</p>'
       +   (note ? '<p class="total-note">' + note + '</p>' : '')
       +   button
       + '</div>';
}

function primaryButton(act, label, disabled, busy){
  return '<button type="button" class="btn is-primary' + (busy ? ' is-busy' : '') + '" '
       +   'data-act="' + act + '"'
       +   (disabled || busy ? ' disabled aria-disabled="true"' : '')
       +   (busy ? ' aria-busy="true"' : '')
       +   '>'
       +   (busy ? icon('loader-2') + '<span>Traitement en cours</span>' : label)
       + '</button>';
}

/* --- Étape 5 : les joueurs ----------------------------------------------- */

function playerSub(p, index){
  if(p.kind === 'holder'){
    return statusText() + (hasLicence() ? ' &middot; index ' + licenceIndex() : '');
  }
  if(p.slot) return 'Invité·e sans compte &middot; prix public';
  if(p.kind === 'relative'){
    var rel = relativeById(p.id);
    var info = COMP_PEOPLE[playerName(p)];
    return (rel ? relationOf(rel) + ' &middot; ' : '')
         + (p.licence ? 'Licencié FFGolf' : 'Sans licence, prix public')
         + (info ? ' &middot; index ' + fmtIdx(info.idx) : '');
  }
  if(p.kind === 'licence') return 'Licence vérifiée FFGolf';
  return 'Invité·e sans licence &middot; prix public';
}
/* Retour du 22/10 (mobile) : la ligne d'un joueur est une seule cible. Elle
   résume son état (statut, tarif, invitation, règlement) ; toucher la ligne
   ouvre la feuille « Joueur N » où tout se règle. */
function playerRow(line){
  var p = line.player;
  var i = line.index;
  var slot = playerSlot(p);
  var pub = slot ? visitorPrice(slot.base) : line.price;
  var holder = (p.kind === 'holder');
  var price = '<span class="vp-price' + (line.price === 0 ? ' is-incl' : '') + '">'
            + (line.price < pub ? '<s>' + amount(pub) + '</s>' : '')
            + '<b>' + (line.price === 0 ? 'Inclus' : amount(line.price)) + '</b></span>';
  var tags = '';
  if(line.invited) tags += '<span class="vp-tag" data-role="invited">' + icon('ticket') + line.why + '</span>';
  else if(line.price < pub) tags += '<span class="vp-tag">' + line.why + '</span>';
  if(!holder && p.payer === 'desk') tags += '<span class="vp-tag is-plain">Paie sur place</span>';
  if(!holder && p.slot) tags += '<span class="vp-tag is-plain">À renseigner</span>';
  var inner = (holder ? photoAv('vp-av player-rank', initials(p))
                      : '<span class="vp-av player-rank" aria-hidden="true">' + (p.slot ? (i + 1) : initials(p)) + '</span>')
            + '<span class="vp-main">'
            +   '<span class="vp-n player-name">' + escapeAttr(slotLabel(p, i)) + (holder ? ' <span>(vous)</span>' : '') + '</span>'
            +   '<span class="vp-s">' + playerSub(p, i) + '</span>'
            +   (tags ? '<span class="vp-tags">' + tags + '</span>' : '')
            +   (line.warn && !p.slot ? '<span class="vp-warn">' + line.warn + '</span>' : '')
            + '</span>'
            + '<span class="vp-side">' + price + (holder ? '' : icon('chevron-right')) + '</span>';
  if(holder){
    return '<div class="vp player is-me is-holder" data-role="player">' + inner + '</div>'
         + (!p.licence && !isPassion()
            ? '<button type="button" class="btn is-quiet player-lic" data-nav="/profile/licence" '
              + 'data-role="holder-licence">Renseigner ma licence</button>' : '');
  }
  return '<button type="button" class="vp player is-guest" data-role="player" data-act="player-attach" '
       +   'data-value="' + i + '" aria-label="' + escapeAttr(slotLabel(p, i)) + ', régler ce joueur">' + inner + '</button>';
}

/* Ligne du lot 2, remplacée au lot 11. */
function playerRowLot10(line){
  var p = line.player;
  var holder = (p.kind === 'holder');
  var price = line.price === 0
    ? '<span class="player-price is-free">Inclus</span>'
    : '<span class="player-price' + (line.byHolder ? '' : ' is-other')
      + '">' + amount(line.price) + '</span>';
  var who = payerText(line);

  var body = '<span class="player-body">'
           +   '<span class="player-name">' + playerName(p) + '</span>'
           +   '<span class="player-why">' + line.why + '</span>'
           +   (who ? '<span class="player-pay">' + icon(line.byHolder ? 'wallet'
                      : (p.member ? 'bell' : 'building-store'))
                    + '<span>' + who + '</span></span>' : '')
           +   (line.warn ? '<span class="player-warn">' + line.warn + '</span>' : '')
           + '</span>';

  /* Le titulaire n'a rien à régler sur lui-même : sa ligne n'est pas
     actionnable. Celle d'un joueur ajouté ouvre son réglage. */
  if(holder){
    /* Lot 9d : sans licence au dossier, le titulaire paie le tarif visiteur.
       Il peut la renseigner sans quitter son départ ; l'écran de licence
       chiffre le gain, et le retour retrouve l'étape à jour. */
    return '<div class="player is-holder" data-role="player">'
         +   '<span class="player-rank">1</span>'
         +   body
         +   '<span class="player-side">' + price + '</span>'
         + '</div>'
         + (!p.licence && !isPassion()
            ? '<button type="button" class="btn is-quiet player-lic" '
              + 'data-nav="/profile/licence" data-role="holder-licence">'
              + 'Renseigner ma licence</button>'
            : '');
  }

  return '<div class="player is-guest" data-role="player">'
       +   '<button type="button" class="player-open" data-act="player-terms" '
       +     'data-value="' + line.index + '" '
       +     'aria-label="Régler l\'invitation et le paiement de ' + playerName(p) + '">'
       +     '<span class="player-rank">' + (line.index + 1) + '</span>'
       +     body
       +     '<span class="player-side">' + price
       +       '<i class="ti ti-chevron-right player-chevron" aria-hidden="true"></i>'
       +     '</span>'
       +   '</button>'
       +   '<button type="button" class="player-drop" data-act="player-drop" '
       +     'data-value="' + line.index + '" '
       +     'aria-label="Retirer ' + playerName(p) + ' de ce départ">'
       +     icon('x') + '</button>'
       + '</div>';
}

/* Décompte des invitations, membre Passion seulement. Il montre le solde tel
   qu'il sera après cette réservation : c'est ce que le joueur veut savoir. */
function inviteQuotaLine(){
  var q = inviteQuota();
  if(!q) return '';
  var left = invitesLeftAfter();
  if(left === 0){
    return '<p class="quota is-spent" data-role="quota">' + icon('ticket-off')
         + '<span><b>Aucune invitation</b> restante sur ' + q.total
         + ' cette année.</span></p>';
  }
  return '<p class="quota" data-role="quota">' + icon('ticket')
       + '<span><b>' + left + (left > 1 ? ' invitations' : ' invitation')
       + '</b> sur ' + q.total + ' encore disponibles cette année.</span></p>';
}

function addPlayerBlock(){
  var max = partyMax();
  var full = partyFull();
  var note = '';
  if(full){
    note = (max < PARTY_MAX)
      ? 'Ce départ ne compte plus que ' + max + (max > 1 ? ' places.' : ' place.')
      : 'Un départ accueille au maximum ' + PARTY_MAX + ' joueurs.';
  }
  var left = max - STATE.draft.players.length;
  /* Retour du 22/10 : un bouton standard, la place restante dite dessous. */
  return '<div class="vpadd">'
       +   '<button type="button" class="btn is-quiet" data-act="slot-add" data-role="slot-add"'
       +     (full ? ' disabled aria-disabled="true"' : '') + '>'
       +     icon('user-plus') + '<span>Ajouter un joueur</span></button>'
       +   '<p class="vpadd-note">'
       +     (full ? note : left + (left > 1 ? ' places encore libres' : ' place encore libre') + ' sur ce départ')
       +   '</p>'
       + '</div>';
}

function relativeRow(rel){
  var joined = joinedRelative();
  var onTee = !!(joined && joined.id === rel.id);
  var added = relativeAdded(rel.id) || onTee;
  var meta = relationOf(rel) + ' &middot; ' + (rel.licence
    ? 'Licence ' + rel.licence
    : 'Sans licence, tarif visiteur');
  return '<button type="button" class="rel" data-act="relative-add" '
       +   'data-value="' + rel.id + '"'
       +   (added ? ' disabled aria-disabled="true"' : '') + '>'
       +   '<span class="rel-mark">' + initials(rel) + '</span>'
       +   '<span class="rel-body">'
       +     '<span class="rel-name">' + playerName(rel) + '</span>'
       +     '<span class="rel-meta">' + meta + '</span>'
       +   '</span>'
       +   '<span class="rel-side">'
       +     (onTee ? 'Sur ce départ' : added ? 'Déjà au départ' : 'Ajouter')
       +   '</span>'
       + '</button>';
}

/* Recherche par licence FFGolf, dans la feuille d'ajout du tunnel. Le joueur
   retrouvé rejoint le départ sans être enregistré comme proche : c'est le
   comportement du lot 6, que le conflit 7 du lot 9a laisse ouvert. */
function findBlock(){
  var f = STATE.draft.find;
  var result = '';
  if(f.error){
    result = '<p class="form-error" data-role="find-error">' + icon('alert-circle')
           + '<span>' + f.error + '</span></p>';
  } else if(f.found){
    var taken = relativeAdded('lic-' + f.found.licence);
    result = '<button type="button" class="rel" data-act="found-add" data-role="found"'
           +   (taken ? ' disabled aria-disabled="true"' : '') + '>'
           +   '<span class="rel-mark">' + initials(f.found) + '</span>'
           +   '<span class="rel-body">'
           +     '<span class="rel-name">' + escapeAttr(playerName(f.found)) + '</span>'
           +     '<span class="rel-meta">Licence ' + f.found.licence + ' &middot; '
           +       (f.found.member ? 'compte au club' : 'tarif licencié') + '</span>'
           +   '</span>'
           +   '<span class="rel-side">' + (taken ? 'Déjà au départ' : 'Ajouter') + '</span>'
           + '</button>'
           + '<p class="form-hint">Ce joueur rejoint ce départ sans être ajouté à vos '
           +   'proches. Seuls son nom et sa licence sont visibles.</p>';
  }
  return '<p class="sheet-sect">Rechercher par licence FFGolf</p>'
       + '<div class="findbox">'
       +   '<input class="input" id="gf-find" type="text" inputmode="numeric" '
       +     'autocomplete="off" data-field="search" '
       +     'placeholder="N° de licence FFGolf (9 chiffres)" '
       +     'aria-label="N° de licence FFGolf (9 chiffres)" '
       +     'value="' + escapeAttr(f.q) + '">'
       +   '<button type="button" class="btn is-quiet findbox-btn' + (f.busy ? ' is-busy' : '') + '" '
       +     'data-act="gf-find"' + (f.busy ? ' disabled aria-disabled="true" aria-busy="true"' : '') + '>'
       +     (f.busy ? icon('loader-2') + '<span>Recherche</span>' : 'Rechercher')
       +   '</button>'
       + '</div>'
       + result;
}

/* Feuille « Joueur N » du booking engine v3 : depuis ma liste d'amis, avec
   le tarif de chacun ; par licence FFGolf ; ou en invité·e, par son nom. */
function attachPriceOf(licensed){
  var slot = draftSlot();
  if(!slot) return '';
  var pub = visitorPrice(slot.base);
  var p = licensed ? slot.base : pub;
  return '<span class="rel-price">' + (p < pub ? '<s>' + amount(pub) + '</s>' : '') + amount(p) + '</span>';
}
function sheetAttach(){
  var d = STATE.draft;
  var i = d.attachIndex;
  var p = d.players[i];
  if(!p) return '';
  /* Joueur déjà identifié : son résumé, et « Changer » rouvre le choix. */
  if(!p.slot && !d.attachChange) return sheetPlayer(i);
  var list = relativesOf();
  var rels = '';
  for(var j=0;j<list.length;j++){
    var rel = list[j];
    if(relativeTaken(rel.id) && rel.id !== p.id) continue;
    var info = COMP_PEOPLE[playerName(rel)];
    rels += '<button type="button" class="rel" data-act="relative-add" data-value="' + rel.id + '">'
          +   '<span class="rel-mark">' + initials(rel) + '</span>'
          +   '<span class="rel-body"><span class="rel-name">' + playerName(rel) + '</span>'
          +     '<span class="rel-meta">' + relationOf(rel) + ' &middot; '
          +       (rel.licence ? 'Licencié FFGolf' : 'Sans licence') + (info ? ' &middot; index ' + fmtIdx(info.idx) : '')
          +     '</span></span>'
          +   attachPriceOf(!!rel.licence)
          + '</button>';
  }
  var g = d.guest;
  var err = d.guestError;
  return sheetShell(slotLabel(p, i),
      '<p class="sheet-lead">Rattachez ce joueur à son compte ou à sa licence&nbsp;: son tarif '
    +   's\'applique à sa place.</p>'
    + (rels ? '<p class="sheet-sect">Depuis ma liste d\'amis</p>' + rels
            : '<p class="sheet-lead">Vos proches se gardent depuis votre profil&nbsp;; pour ce départ, '
              + 'retrouvez ce joueur par sa licence ou ajoutez-le par son nom.</p>')
    + '<hr class="sheet-sep">'
    + findBlock()
    + '<hr class="sheet-sep">'
    + '<p class="sheet-sect">Ou en invité·e, sans licence</p>'
    + '<p class="sheet-lead">Indiquez son prénom et son nom&nbsp;: votre invité·e sera reconnu·e '
    +   'automatiquement au desk pour le check-in. Vous pourrez aussi le compléter plus tard.</p>'
    + '<div class="form-row">'
    +   '<label class="form-label" for="guest-first">Prénom</label>'
    +   '<input class="input" id="guest-first" type="text" data-field="firstName" autocomplete="off" '
    +     'value="' + escapeAttr(g.firstName) + '">'
    + '</div>'
    + '<div class="form-row">'
    +   '<label class="form-label" for="guest-last">Nom</label>'
    +   '<input class="input" id="guest-last" type="text" data-field="lastName" autocomplete="off" '
    +     'value="' + escapeAttr(g.lastName) + '">'
    + '</div>'
    + guestWarning()
    + (err ? '<p class="form-error" data-role="guest-error">' + icon('alert-circle') + '<span>' + err + '</span></p>' : '')
    + '<button type="button" class="btn is-quiet" data-act="guest-add">Ajouter l\'invité·e &middot; prix public</button>'
    + playerSettings(i));
}

/* Invitation, règlement, retrait : la seconde moitié de la feuille. */
function playerSettings(i){
  var d = STATE.draft;
  var p = d.players[i];
  var html = '';
  if(isPassion()){
    var can = p.invited || inviteAvailableFor(i);
    var left = invitesLeftBefore() - invitesUsedInDraft();
    html += '<hr class="sheet-sep"><p class="sheet-sect">Invitation</p>'
          + '<button type="button" class="switchrow" data-act="invite-toggle" data-value="' + i + '" '
          +   'data-role="invite-toggle" role="switch" aria-checked="' + (p.invited ? 'true' : 'false') + '"'
          +   (can ? '' : ' disabled aria-disabled="true"') + '>'
          +   '<span class="switchrow-mark">' + icon('ticket') + '</span>'
          +   '<span class="switchrow-body"><span class="switchrow-title">Offrir une invitation</span>'
          +     '<span class="switchrow-text">' + (can
                 ? 'Remise sur sa place &middot; ' + left + (left > 1 ? ' restantes' : ' restante') + ' sur ' + inviteQuota().total
                 : 'Vos ' + inviteQuota().total + ' invitations de l\'année sont utilisées.') + '</span></span>'
          +   '<span class="switch' + (p.invited ? ' is-on' : '') + '" aria-hidden="true"><span class="switch-knob"></span></span>'
          + '</button>';
  }
  html += '<hr class="sheet-sep"><p class="sheet-sect">Qui paie sa place&nbsp;?</p>'
        + '<div class="choicegroup" role="radiogroup" aria-label="Règlement">'
        +   choiceRow('payer-set', i + '|self', p.payer !== 'desk' && p.payer !== 'holder', 'Il paie en ligne',
              'Il reçoit un lien de paiement à la confirmation. Sans règlement la veille à 20 h, sa part est débitée sur votre carte.', false)
        +   choiceRow('payer-set', i + '|desk', p.payer === 'desk', 'Il paie sur place',
              'Il règle sa part à l\'accueil du golf, en arrivant.', false)
        + '</div>'
        + '<button type="button" class="btn is-primary sheet-done" data-act="sheet-close">Terminer</button>'
        + '<button type="button" class="vp-remove" data-act="player-drop" data-value="' + i + '" data-role="player-remove">'
        +   icon('trash') + 'Retirer ce joueur du départ</button>';
  return html;
}
function sheetPlayer(i){
  var d = STATE.draft;
  var p = d.players[i];
  var lines = playerLines();
  var line = null;
  for(var k=0;k<lines.length;k++){ if(lines[k].index === i) line = lines[k]; }
  return sheetShell(slotLabel(p, i),
      '<div class="ilist"><div class="irow">'
    +   '<span class="ck-ic" style="background:var(--sand);color:var(--ink-2);font-size:12px">' + initials(p) + '</span>'
    +   '<span class="irow-body"><span class="irow-t">' + escapeAttr(playerName(p)) + '</span>'
    +     '<span class="irow-s">' + playerSub(p, i) + (line ? ' &middot; ' + (line.price ? amount(line.price) : 'Inclus') : '') + '</span></span>'
    +   '<button type="button" class="btn is-quiet" data-act="attach-change" data-role="attach-change">Changer</button>'
    + '</div></div>'
    + playerSettings(i));
}
function attachChange(){ STATE.draft.attachChange = true; refresh(); return true; }
function setPayerOf(value){
  var parts = String(value || '').split('|');
  var d = STATE.draft;
  var p = d.players[parseInt(parts[0], 10)];
  if(!p || (parts[1] !== 'self' && parts[1] !== 'desk')) return false;
  p.payer = parts[1];
  d.payment = null;
  refresh();
  return true;
}

function sheetRelatives(){
  var list = relativesOf();
  var body = '';
  if(!list.length){
    /* Libellé repris au lot 6 : les proches s'enregistrent au profil, et un
       invité saisi ici ne s'y ajoute pas. La phrase promettait le contraire. */
    body = '<p class="sheet-lead">Aucun proche enregistré. Vos proches se '
         + 'gardent depuis votre profil ; pour ce départ, retrouvez un joueur par '
         + 'sa licence ou invitez-le.</p>';
  } else {
    /* « Depuis ma liste d'amis » : libellé repris du booking engine v3,
       retours du 24/09. */
    body = '<p class="sheet-sect">Depuis ma liste d\'amis</p>';
    if(relativesLeft() === 0){
      body += '<p class="sheet-lead">Tous vos proches sont déjà à ce départ.</p>';
    }
    for(var j=0;j<list.length;j++) body += relativeRow(list[j]);
  }

  return sheetShell('Ajouter un joueur',
      body
    + '<hr class="sheet-sep">'
    + findBlock()
    + '<hr class="sheet-sep">'
    + '<button type="button" class="addbtn" data-act="sheet-guest">'
    +   icon('user-question') + '<span>Inviter un joueur sans licence</span>'
    + '</button>');
}

/* Lot 9e — repris du booking engine v3, retours du 24/09 : sans licence, le
   joueur se retrouve par son nom au desk. Prénom et nom sont fortement
   incités, jamais bloquants : un avertissement, puis « Ajouter quand même ».
   La licence se cherche dans la feuille précédente, plus ici. */
function guestWarning(){
  var d = STATE.draft;
  if(!d.guestWarn) return '';
  var first = trimText(d.guest.firstName);
  var last = trimText(d.guest.lastName);
  var head = (!first && !last) ? 'Son prénom et son nom manquent.'
           : (!first ? 'Son prénom manque.' : 'Son nom manque.');

    ? 'Sans nom, ce joueur apparaîtra comme « Joueur ' + (attaching() ? d.attachIndex + 1 : d.players.length + 1)
      + ' » sur la réservation et devra se présenter à l\'accueil avant de partir.'
    : 'Avec un nom incomplet, ce joueur devra se présenter à l\'accueil avant de partir.';
  return '<div class="form-warn" data-role="guest-error">' + icon('info-circle')
       +   '<div class="form-warn-body"><p class="form-warn-head">' + head + '</p>'
       +   '<p class="form-warn-text">' + then + '</p>'

/* Réglage d'un joueur : son invitation et qui paie sa place. Les deux
   décisions se prennent au même endroit parce qu'elles portent sur la même
   ligne et se lisent ensemble — une invitation que le joueur règle lui-même
   n'aurait pas de sens à découvrir sur deux écrans. */
function sheetTerms(){
  var d = STATE.draft;
  var index = d.termsIndex;
  var p = d.players[index];
  if(!p) return '';

  var lines = playerLines();
  var line = null;
  for(var i=0;i<lines.length;i++){ if(lines[i].index === index) line = lines[i]; }
  if(!line) return '';

  var body = '<p class="sheet-lead">' + line.why + '.</p>';

  if(isPassion()){
    var canInvite = inviteAvailableFor(index);
    body += '<div class="choicegroup" role="radiogroup" '
          +   'aria-label="Invitation">'
          +   '<p class="choicegroup-head">Votre invitation</p>'
          +   choiceRow('invite', 'on', p.invited,
                'Utiliser une invitation',
                canInvite || p.invited
                  ? 'Remise sur sa place. Il vous en resterait '
                    + (invitesLeftBefore() - invitesUsedInDraft()
                       - (p.invited ? 0 : 1)) + ' sur ' + inviteQuota().total + '.'
                  : 'Vos ' + inviteQuota().total + ' invitations de l\'année sont utilisées.',
                !canInvite && !p.invited)
          +   choiceRow('invite', 'off', !p.invited,
                'Sans invitation', 'Tarif applicable, sans remise.', false)
          + '</div>';
  }

  body += '<div class="choicegroup" role="radiogroup" aria-label="Comment il règle sa part">'
        +   '<p class="choicegroup-head">Comment règle-t-il sa part&nbsp;?</p>'
        +   choiceRow('payer', 'self', p.payer !== 'desk',
              'Par lien de paiement',
              'Vous recevez le lien à la confirmation. Sans paiement la veille '
                + 'à 20 h, sa part est débitée sur votre carte.',
              false)
        +   choiceRow('payer', 'desk', p.payer === 'desk',
              'À l\'accueil du golf',
              'Il règle sa part en caisse, en arrivant.', false)
        + '</div>';

  body += '<button type="button" class="btn is-primary" data-act="sheet-close">'
        +   'Terminer</button>';

  return sheetShell(playerName(p), body);
}

function choiceRow(control, value, on, title, text, disabled){
  return '<button type="button" class="choice' + (on ? ' is-on' : '') + '" '
       +   'data-act="' + control + '" data-value="' + value + '" '
       +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '"'
       +   (disabled ? ' disabled aria-disabled="true"' : '') + '>'
       +   '<span class="choice-mark">' + icon('check') + '</span>'
       +   '<span class="choice-body">'
       +     '<span class="choice-title">' + title + '</span>'
       +     '<span class="choice-text">' + text + '</span>'
       +   '</span>'
       + '</button>';
}

function sheetShell(title, body){
  return '<div class="sheet" data-role="sheet">'
       +   '<div class="sheet-card" role="dialog" aria-modal="true" '
       +     'aria-label="' + title + '">'
       +     '<div class="sheet-head">'
       +       '<h3 class="sheet-title">' + title + '</h3>'
       +       '<button type="button" class="sheet-close" data-act="sheet-close" '
       +         'aria-label="Fermer">' + icon('x') + '</button>'
       +     '</div>'
       +     body
       +   '</div>'
       + '</div>';
}

/* --- Lot 11 · étape Joueurs & options du booking engine v3 -----------------

   La carte du départ retenu (photo, parcours, heure), les joueurs déjà
   inscrits sur le créneau, vos joueurs, puis les options et la table, sur
   un seul écran. HYPOTHÈSE : les noms des joueurs déjà inscrits sont ceux
   de la démonstration du booking engine v3 (nom ou « Profil masqué » et
   index). */
var ALREADY_POOL = [
  { name:'Camille Bernard', ini:'CB', idx:'18,4' },
  { name:'Profil masqué',   ini:'',   idx:'22,1' },
  { name:'Hugo Leroy',      ini:'HL', idx:'9,6' },
  { name:'Profil masqué',   ini:'',   idx:'15,0' }
];
function teeCard(slot){
  var n = STATE.draft.players.length;
  return '<div class="teecard" data-role="teecard">'
       +   photo(slot.site, STATE.draft.courseIndex, 'tee-' + slot.site.code + '-' + STATE.draft.courseIndex)
       +   '<div class="teecard-body">'
       +     '<p class="teecard-k">' + slot.course.holes + ' trous &middot; par ' + slot.course.par + '</p>'
       +     '<p class="teecard-t">' + slot.course.name + ' &middot; <b>' + slot.time.replace(':', ' h ') + '</b></p>'
       +     '<p class="teecard-s">' + capitalize(longDate(slot.offset)) + ' &middot; '
       +       n + (n > 1 ? ' joueurs' : ' joueur') + '</p>'
       +   '</div>'
       + '</div>';
}
function groupCard(){
  var d = STATE.draft;
  var fs = flightSlot(d.flights[0]);
  var times = [];
  for(var i=0;i<d.flights.length;i++){ var s = flightSlot(d.flights[i]); times.push(s.course.name + ' ' + s.time); }
  return '<div class="teecard" data-role="teecard">'
       +   photo(fs.site, fs.ci, 'tee-group')
       +   '<div class="teecard-body">'
       +     '<p class="teecard-k">Réservation de groupe</p>'
       +     '<p class="teecard-t"><b>' + d.party + ' joueurs</b> &middot; ' + d.flights.length + ' départs</p>'
       +     '<p class="teecard-s">' + capitalize(longDate(fs.offset)) + ' &middot; ' + times.join(' &middot; ') + '</p>'
       +   '</div>'
       + '</div>';
}
function alreadyBlock(slot){
  var taken = PARTY_MAX - slot.seats;
  if(taken <= 0) return '';
  var rel = joinedRelative();
  var start = Math.floor(draw('occ' + slot.site.code + slot.offset + slot.minutes) * ALREADY_POOL.length);
  var rows = '';
  for(var i=0;i<taken;i++){
    var who = (i === 0 && rel)
      ? { name:playerName(rel), ini:initials(rel), idx:null, rel:relationOf(rel) }
      : ALREADY_POOL[(start + i) % ALREADY_POOL.length];
    rows += '<div class="already-row"><span class="av" aria-hidden="true">'
          +   (who.ini || icon('eye-off')) + '</span>'
          +   '<span><b>' + who.name + '</b><span>'
          +   (who.rel ? who.rel : 'Index ' + who.idx) + '</span></span></div>';
  }
  return '<div class="already" data-role="already"><p class="already-h">Déjà inscrits sur ce départ</p>'
       + rows + '</div>';
}

  return '<p class="hint" data-role="party-hint">' + icon('users')
       + '<span>Vous cherchiez un départ pour <b>' + d.party + ' joueurs</b>. '

       +       ' aria-label="Ajouter un ' + opt.label + '">' + icon('plus') + '</button>'

       + '</div>';

/* --- Table au clubhouse, proposée avant le paiement (point du 20/10) ------

   Une fenêtre simple : couverts et horaire. La table reste en attente
   jusqu'au paiement du départ, et se confirme avec lui. Les horaires
   proposés suivent la fin de partie estimée. HYPOTHÈSE : 4 h 30 pour un
   18 trous, 2 h 30 pour un 9 trous. */
function suggestedTableTimes(){
  var slot = draftSlot();
  if(!slot) return [];
  var end = slot.minutes + (slot.course.holes >= 18 ? 270 : 150);
  var first = Math.ceil(end / 30) * 30;
  return [first, first + 30, first + 60];
}
function tableUpsell(){
  var d = STATE.draft;
  if(d.table){
    return '<section class="section" data-role="table-upsell">'
         +   '<p class="eyebrow">Après votre partie</p>'
         +   '<div class="upsell is-on">'
         +     '<span class="opt-mark">' + icon('tools-kitchen-2') + '</span>'
         +     '<span class="opt-body">'
         +       '<span class="opt-name">Table pour ' + d.table.seats + ' à ' + d.table.time + '</span>'
         +       '<span class="opt-note">Au clubhouse. Confirmée avec le paiement de votre départ.</span>'
         +     '</span>'
         +     '<button type="button" class="btn is-quiet upsell-btn" data-act="table-drop">Retirer</button>'
         +   '</div>'
         + '</section>';
  }
  return '<section class="section" data-role="table-upsell">'
       +   '<p class="eyebrow">Après votre partie</p>'
       +   '<div class="upsell">'
       +     '<span class="opt-mark">' + icon('tools-kitchen-2') + '</span>'
       +     '<span class="opt-body">'
       +       '<span class="opt-name">Une table au clubhouse&nbsp;?</span>'
       +       '<span class="opt-note">Réservée en même temps que votre départ, réglée sur place.</span>'
       +     '</span>'
       +     '<button type="button" class="btn is-quiet upsell-btn" data-act="table-open">Ajouter</button>'
       +   '</div>'
       + '</section>';
}
function sheetTableUpsell(){
  var d = STATE.draft;
  var f = d.tableForm || { seats:d.players.length, time:null };
  var seats = '';
  for(var n=1;n<=TABLE_SEATS_MAX;n++){
    seats += tableChip('upsell-seats', n, f.seats === n, String(n),
                       n + (n > 1 ? ' couverts' : ' couvert'));
  }
  var times = '';
  var list = suggestedTableTimes();
  for(var i=0;i<list.length;i++){
    var t = hhmm(list[i]);
    times += tableChip('upsell-time', t, f.time === t, t, null);
  }
  return sheetShell('Une table au clubhouse',
      '<p class="sheet-lead">Elle reste en attente jusqu\'au paiement de votre '
    + 'départ, puis se confirme avec lui.</p>'
    + '<p class="sheet-sect">Couverts</p>'
    + '<div class="tchips" role="radiogroup" aria-label="Couverts">' + seats + '</div>'
    + '<p class="sheet-sect">Horaire</p>'
    + '<div class="tchips" role="radiogroup" aria-label="Horaire">' + times + '</div>'
    + primaryButton('upsell-add', 'Ajouter cette table', !f.time, false));
}
function openTableUpsell(){
  var d = STATE.draft;
  d.tableForm = { seats:Math.min(TABLE_SEATS_MAX, d.players.length || 1), time:null };
  d.sheet = 'table';
  refresh();
  return true;
}
function setUpsell(kind, value){
  var f = STATE.draft.tableForm;
  if(!f) return false;
  if(kind === 'seats'){
    var n = parseInt(value, 10);
    if(isNaN(n) || n < 1 || n > TABLE_SEATS_MAX) return false;
    f.seats = n;
  } else if(kind === 'time'){
    f.time = value;
  } else return false;
  refresh();
  return true;
}
function addTableUpsell(){
  var d = STATE.draft;
  if(!d.tableForm || !d.tableForm.time) return false;
  d.table = { seats:d.tableForm.seats, time:d.tableForm.time };
  d.tableForm = null;
  d.sheet = null;
  refresh();
  return true;
}
function dropTableUpsell(){
  STATE.draft.table = null;
  refresh();
  return true;
}

/* --- Étape 7 : le paiement ----------------------------------------------- */

/* La mention de tête dit ce qui a déjà été réglé autrement, ou pourquoi le
   solde de crédits ne suffit pas. Elle ne remplace jamais le choix : les deux
   options restent également offertes, aucune n'est présélectionnée. */
/* Retour du 22/10 : un seul champ « Payer avec » ; il ouvre la feuille
   « Avec quoi ? », comme Lydia : d'abord les comptes Resonance (e-wallet,
   carnet, crédits), puis les cartes bancaires et « Ajouter une carte ». */
function payWhat(ctx){
  return ctx === 'lesson' ? 'cette séance' : (ctx === 'practice' ? 'ce seau' : 'ce départ');
}
function payMeta(c, ctx){
  if(c.id === 'wallet'){
    return { group:'acc', icon:'wallet', name:'E-wallet golf (' + eurosCents(c.walletFrom) + ')',
             sub:c.disabled ? 'Solde insuffisant pour ' + payWhat(ctx)
                            : 'Puis ' + eurosCents(c.walletTo) + ' après ' + payWhat(ctx) };
  }
  /* Lot 12 (29/10) : la carte cadeau ajoutée au wallet. */
  if(c.id === 'gift'){
    return { group:'acc', icon:'gift', name:'Carte cadeau (' + eurosCents(c.giftFrom) + ')',
             sub:c.disabled ? 'Solde insuffisant pour ' + payWhat(ctx)
                            : 'Puis ' + eurosCents(c.giftTo) + ' après ' + payWhat(ctx) };
  }
  if(c.id === 'credits' && ctx === 'lesson'){
    return { group:'acc', icon:'school', name:'Carnet de cours (' + hoursLabel(c.balanceFrom) + ')',
             sub:'Puis ' + hoursLabel(c.balanceTo) + ' après cette séance' };
  }
  if(c.id === 'credits'){
    return { group:'acc', icon:'ticket', name:'Crédits green-fee (' + c.balanceFrom + ')',
             sub:c.title.replace(/^Utiliser /, 'Utilise ') + (c.mixed ? '' : ' · puis ' + c.balanceTo + ' après ce départ')
                 + '. Les crédits qui expirent en premier sont utilisés d\'abord.' };
  }
  if(c.id === 'applepay'){
    return { group:'card', icon:'brand-apple', name:'Apple Pay', sub:'Confirmé par Face ID' };
  }
  var card = mainCard();
  return { group:'card', icon:'credit-card', name:card ? cardLabel(card) : 'Carte bancaire',
           sub:card ? 'Carte enregistrée' : 'Saisie au paiement' };
}
function paySelector(chosen, ctx, openAct){
  var m = chosen ? payMeta(chosen, ctx) : null;
  return '<button type="button" class="paysel' + (m ? '' : ' is-empty') + '" data-act="' + openAct + '" data-role="pay-selector">'
       +   '<span class="paysel-ic">' + icon(m ? m.icon : 'credit-card') + '</span>'
       +   '<span class="paysel-body"><span class="paysel-l">Payer avec</span>'
       +     '<span class="paysel-v">' + (m ? m.name : 'Choisir un moyen de paiement') + '</span>'
       +     (m ? '<span class="paysel-s">' + m.sub + '</span>' : '') + '</span>'
       +   icon('chevron-right')
       + '</button>';
}
function paySheet(choices, chosenId, ctx, pickAct){
  var acc = '', cards = '';
  for(var i=0;i<choices.length;i++){
    var c = choices[i], m = payMeta(c, ctx), on = (c.id === chosenId);
    var row = '<button type="button" class="payrow" data-act="' + pickAct + '" data-value="' + c.id + '" '
            +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '"' + (c.disabled ? ' disabled aria-disabled="true"' : '') + '>'
            +   '<span class="payrow-ic">' + icon(m.icon) + '</span>'
            +   '<span class="payrow-body"><span class="payrow-n">' + m.name + '</span><span class="payrow-s">' + m.sub + '</span></span>'
            +   (on ? '<span class="payrow-ok">' + icon('circle-check') + '</span>' : '')
            + '</button>';
    if(m.group === 'acc') acc += row; else cards += row;
  }
  return sheetShell('Avec quoi ?',
      (acc ? '<p class="paysheet-h">Mes comptes Resonance</p>' + acc : '')
    + '<p class="paysheet-h">Cartes bancaires</p>' + cards
    + '<button type="button" class="payadd" data-nav="/profile/cards">' + icon('plus') + 'Ajouter une carte</button>');
}

function payLead(){
  var plan = creditPlan();
  if(anySelfPaid()){
    var n = selfPaidLines().length;
    return '<p class="paylead" data-role="paylead">' + icon(anyLinkPaid() ? 'shield-check' : 'users')
         + '<span><b>Vous réglez votre seule part.</b> '
         + (n > 1
            ? n + ' joueurs règlent la leur de leur côté. '
            : 'Votre partenaire règle la sienne de son côté. ')
         + (anyLinkPaid() ? guaranteeText() : '') + '</span></p>';
  }
  if(isPassion()){
    return '<p class="paylead" data-role="paylead">' + icon('infinity')
         + '<span><b>Votre départ est inclus dans votre abonnement.</b> '
         + 'Le reste à payer ne porte que sur vos invités et vos options.</span></p>';
  }
  if(plan.mixed){
    return '<p class="paylead" data-role="paylead">' + icon('ticket')
         + '<span><b>Votre solde ne couvre pas tous les joueurs.</b> '
         + 'Vous pouvez utiliser vos crédits et régler la différence par carte.</span></p>';
  }
  if(plan.balance === 0){
    return '<p class="paylead" data-role="paylead">' + icon('ticket-off')
         + '<span><b>Aucun crédit green-fee disponible.</b> '
         + 'Vous pourrez acheter un carnet depuis votre portefeuille.</span></p>';
  }
  return '';
}

function payChoiceRow(choice){
  var selected = (STATE.draft.payment === choice.id);
  var lines = '';
  if(choice.balanceFrom !== null){
    lines += '<span class="payopt-line">Solde de crédits <b>' + choice.balanceFrom
           + '</b> puis <b>' + choice.balanceTo + '</b> après ce départ.</span>';
  }
  if(choice.id === 'wallet'){
    lines += '<span class="payopt-line">' + (choice.disabled
      ? 'Solde de <b>' + eurosCents(choice.walletFrom) + '</b>, insuffisant pour ce départ.'
      : 'E-wallet golf <b>' + eurosCents(choice.walletFrom) + '</b> puis <b>'
        + eurosCents(choice.walletTo) + '</b> après ce départ.') + '</span>';
  }
  if(choice.id === 'card'){
    lines += '<span class="payopt-line">Carte enregistrée dans votre profil.</span>';
  }
  if(choice.id === 'applepay'){
    lines += '<span class="payopt-line">Avec la carte de votre téléphone, '
           + 'confirmée par Face ID.</span>';
  }
  if(choice.id === 'credits'){
    lines += '<span class="payopt-line">Les crédits qui expirent en premier sont '
           + 'utilisés d\'abord.</span>';

  return '<button type="button" class="payopt' + (selected ? ' is-selected' : '') + '" '

       +   (choice.disabled ? ' disabled aria-disabled="true"' : '') + '>'
       +   '<span class="payopt-mark">' + icon('check') + '</span>'

       +     '<span class="payopt-title">' + choice.title + '</span>'

/* Récapitulatif allégé : une ligne par joueur, le prix de référence barré
   quand une remise s'applique, le total des réductions en bas, le détail
   des tarifs replié. Une option incluse s'écrit « Incluse », jamais comme
   une fausse réduction. */
function playerRef(line){
  var slot = draftSlot();
  return line.player.licence ? slot.base : visitorPrice(slot.base);
}
function recapPrice(ref, price, freeLabel){
  if(price === 0) return '<span class="recap-price">' + freeLabel + '</span>';
  return '<span class="recap-price">'
       + (ref > price ? '<s>' + amount(ref) + '</s> ' : '')
       + amount(price) + '</span>';
}
function recapBlock(){
  var lines = playerLines();
  var rows = '';
  var off = 0;
  var detail = '';
  for(var i=0;i<lines.length;i++){
    var l = lines[i];
    var ref = playerRef(l);
    var right;
    if(!l.byHolder){
      right = '<span class="recap-price is-other">'
            + (l.player.payer === 'desk' ? 'À l\'accueil' : 'Par lien') + ' &middot; '
            + (ref > l.price && l.price > 0 ? '<s>' + amount(ref) + '</s> ' : '')
            + amount(l.price) + '</span>';
    } else {
      right = recapPrice(ref, l.price, 'Inclus');
    }
    /* Les réductions de tout le départ, parts des partenaires comprises. */
    if(l.price > 0) off += Math.max(0, ref - l.price);
    rows += '<li class="recap-row" data-role="recap-player">'
          +   '<span class="recap-name">' + escapeAttr(playerName(l.player)) + '</span>'
          +   right
          + '</li>';
    detail += '<li>' + escapeAttr(playerName(l.player)) + ' <b>' + l.why
            + (ref > l.price && l.price > 0 ? ', au lieu de ' + amount(ref) : '') + '</b></li>';
  }
  var opts = optionLines();
  for(var k=0;k<opts.length;k++){
    var o = opts[k];
    var label = optionQtyLabel(o.option, o.qty);
    var side;
    if(o.price === 0){
      side = '<span class="recap-price">' + (o.included ? 'Incluse' : 'Sur votre carnet') + '</span>';
    } else {
      side = '<span class="recap-price">' + amount(o.price) + '</span>';
    }
    rows += '<li class="recap-row" data-role="recap-option">'
          +   '<span class="recap-name">' + label + '</span>' + side + '</li>';
    if(o.included || o.fromPot){
      detail += '<li>' + o.option.label + ' <b>'
              + (o.included ? o.included + ' incluse dans votre abonnement' : '')
              + (o.included && o.fromPot ? ', ' : '')
              + (o.fromPot ? o.fromPot + ' sur votre carnet' : '')
              + '</b></li>';
    }
  }
  var table = STATE.draft.table;
  if(table){
    rows += '<li class="recap-row" data-role="recap-table">'
          +   '<span class="recap-name">Table pour ' + table.seats + ' à ' + table.time + '</span>'
          +   '<span class="recap-price">Sur place</span></li>';
  }
  return '<section class="section recap" data-role="recap">'
       +   '<p class="eyebrow">Récapitulatif</p>'
       +   '<ul class="recap-list">' + rows + '</ul>'
       +   (off > 0
          ? '<p class="recap-off" data-role="recap-off"><span>Total des réductions</span>'
            + '<b>&minus;' + amount(off) + '</b></p>'
          : '')
       +   '<details class="recap-more" data-role="recap-more">'
       +     '<summary>Détail des tarifs' + icon('chevron-down') + '</summary>'
       +     '<ul class="spec">' + detail + '</ul>'
       +   '</details>'
       + '</section>';
}

function screenGfPay(){
  var choices = paymentChoices();
  var rows = '';
  for(var i=0;i<choices.length;i++) rows += payChoiceRow(choices[i]);

  var chosen = chosenPayment();
  var note = chosen
    ? null
    : 'Choisissez un mode de règlement pour continuer.';

  return ''
    + '<div class="stepbody">'
    +   '<h2 class="screen-title">Comment souhaitez-vous payer ?</h2>'
    +   recapBlock()
    +   payLead()
    +   '<section class="section" data-role="payopts">'
    +     paySelector(chosen, 'gf', 'pay-open') + '</section>'
    + '</div>'
    + (STATE.draft.sheet === 'pay' ? paySheet(choices, STATE.draft.payment, 'gf', 'pay-pick') : '')
    + stepFoot('Total', note,
        primaryButton('book-now', 'Réserver ce départ', !chosen, STATE.draft.paying));
}

/* --- Étape 8 : la confirmation ------------------------------------------- */

function paymentSummary(){
  var choice = chosenPayment();
  if(!choice) return 'Inclus dans votre abonnement';
  if(choice.id === 'card') return amount(choice.cash) + ' par carte';
  if(choice.id === 'applepay') return amount(choice.cash) + ' avec Apple Pay';
  if(choice.id === 'wallet') return amount(choice.cash) + ' avec votre e-wallet golf';
  if(choice.id === 'gift') return amount(choice.cash) + ' avec votre carte cadeau';
  if(choice.mixed){
    return creditsLabel(creditPlan().use) + ' et ' + amount(choice.cash) + ' par carte';
  }
  return capitalize(creditsLabel(creditPlan().use));
}

function confirmPlayersLine(){
  var lines = playerLines();
  var names = [];
  for(var i=0;i<lines.length;i++) names.push(playerName(lines[i].player));
  return names.join(', ');
}

/* Les places que le titulaire n'a pas prises en charge. Les taire laisserait
   croire que tout est réglé, et c'est exactement le litige que l'écran doit
   éviter. */
function confirmOthersLine(){
  var lines = selfPaidLines();
  if(!lines.length) return null;
  var out = [];
  for(var i=0;i<lines.length;i++){
    var l = lines[i];
    out.push(playerName(l.player) + ' &middot; ' + amount(l.price)
             + (l.player.payer === 'desk' ? ', à l\'accueil' : ', par lien de paiement'));
  }
  return out.join('<br>');
}

/* « 2 seaux de balles », pas « 2 seau de balles » : le pluriel vient du
   référentiel (lot 10). */
function optionQtyLabel(opt, qty){
  return qty + ' ' + (qty > 1 && opt.plural ? opt.plural : opt.label.toLowerCase());
}
function confirmOptionsLine(){
  var lines = optionLines();
  if(!lines.length) return 'Aucune';
  var out = [];
  for(var i=0;i<lines.length;i++){
    out.push(optionQtyLabel(lines[i].option, lines[i].qty));
  }
  return out.join(', ');
}

function cancelLine(){
  var limit = cancelDeadline();
  if(!limit) return '';
  var text = limit.sameDay
    ? 'Ce départ a lieu aujourd\'hui : l\'annulation en ligne n\'est plus gratuite. '
      + 'Le montant vous serait rendu en crédit.'
    : 'Annulation gratuite jusqu\'au ' + limit.label + ' à 18 h. '
      + 'Passé ce délai, le montant vous est rendu en crédit.';
  return '<p class="cancelnote" data-role="cancel">' + icon('clock-hour-4')
       + '<span>' + text + '</span></p>';
}

function screenGfConfirm(){

  var done = '';
  if(d.calendarAdded){

          + '<span>Récapitulatif envoyé aux joueurs de ce départ.</span></p>';

  if(joined){
    done += '<p class="done" data-role="join-done">' + icon('bell')

  return ''
    + '<div class="confirm-mark">' + icon('circle-check') + '</div>'

    + '<p class="confirm-ref">Numéro <b>' + (d.reference || makeReference()) + '</b></p>'
    + '<ul class="spec" data-role="confirm-spec">'
    +   '<li>Parcours <b>' + slot.course.name + ', ' + slot.site.name + '</b></li>'
    +   '<li>Date <b>' + capitalize(longDate(d.dayOffset)) + '</b></li>'
    +   '<li>Départ <b>' + slot.time + '</b></li>'
    +   '<li>Joueurs <b>' + confirmPlayersLine() + '</b></li>'
    +   '<li>Options <b>' + confirmOptionsLine() + '</b></li>'
    +   '<li>Vous réglez <b>' + paymentSummary() + '</b></li>'
    +   (confirmOthersLine()
       ? '<li>À régler par eux <b>' + confirmOthersLine() + '</b></li>'
       : '')
    +   (d.table
       ? '<li>Table <b>' + d.table.seats + (d.table.seats > 1 ? ' couverts' : ' couvert')
         + ' à ' + d.table.time + ', au clubhouse</b></li>'
       : '')
    + '</ul>'
    + (anyLinkPaid() ? payLinkBlock(payLinkOf(d.reference || makeReference())) : '')
    + '<div class="confirm-actions">'
    +   '<button type="button" class="btn is-quiet" data-act="add-calendar">'
    +     icon('calendar-plus') + '<span>Au calendrier</span></button>'
    +   '<button type="button" class="btn is-quiet" data-act="share-booking">'
    +     icon('share') + '<span>Partager</span></button>'
    + '</div>'
    + done
    + cancelLine()
    + '<button type="button" class="btn is-primary" data-act="finish">'
