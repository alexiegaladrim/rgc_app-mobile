}

/* --- Sélections des étapes 5 à 8 ----------------------------------------- */

function openSheet(kind){
  var d = STATE.draft;
  if(kind === 'relatives' && partyFull()) return false;
  d.sheet = kind;
  d.guestError = null;
  refresh();
  return true;
}
function closeSheet(){
  STATE.draft.sheet = null;
  STATE.draft.attachIndex = null;
  STATE.draft.guestError = null;
  STATE.draft.guestWarn = false;
  STATE.draft.find = { q:'', busy:false, found:null, error:null };
  refresh();
  return true;
}

/* Un proche, ou un joueur retrouvé par sa licence, devient un joueur du
   départ. Par défaut on invite tant que le quota le permet, et le titulaire
   règle : c'est le geste le plus courant. Les deux se corrigent d'un toucher
   sur la ligne. */
function playerFrom(src, id, kind){
  return {
    id:id,
    kind:kind,
    firstName:src.firstName,
    lastName:src.lastName,
    licence:!!src.licence,
    member:!!src.member,
    invited:false,
    payer:'self'
  };
}

function addRelative(id){
  var d = STATE.draft;
  if(partyFull() && !attaching()) return false;
  if(relativeTaken(id)) return false;
  var rel = relativeById(id);
  if(!rel) return false;
  placePlayer(playerFrom(rel, rel.id, 'relative'));
  trimOptions();
  refresh();
  return true;
}

function setGuestField(name, value){
  if(name === 'search'){ STATE.draft.find.q = value; return true; }
  if(name !== 'firstName' && name !== 'lastName' && name !== 'licence') return false;
  STATE.draft.guest[name] = value;
  return true;
}

/* Recherche par licence dans le tunnel. L'appel à l'annuaire passe par un état
   d'attente, comme l'actualisation FFG du lot 6. */
function findLicence(){
  var d = STATE.draft;
  var f = d.find;
  if(f.busy) return false;
  var result = licenceLookup(f.q);
  f.found = null;
  f.error = null;
  if(result.error){
    f.error = lookupError(result)
            + (result.error === 'known' ? ' Choisissez ce joueur dans la liste.' : '');
    refresh();
    return false;
  }
  f.busy = true;
  refresh();
  window.setTimeout(function(){
    f.busy = false;
    f.found = result.found;
    refresh();
  }, FIND_DELAY);
  return true;
}

function addFoundPlayer(){
  var d = STATE.draft;
  var found = d.find.found;
  if(!found || (partyFull() && !attaching())) return false;
  var id = 'lic-' + found.licence;
  if(relativeAdded(id)) return false;
  placePlayer(playerFrom(found, id, 'licence'));
  d.find = { q:'', busy:false, found:null, error:null };
  trimOptions();
  refresh();
  return true;
}

/* Un joueur sans nom ne peut pas être inscrit sur une feuille de départs :
   l'erreur dit quoi corriger, elle ne s'excuse pas. */
function addGuest(force){
  var d = STATE.draft;
  var g = d.guest;
  var last = trimText(g.lastName);
  var first = trimText(g.firstName);

  if(partyFull() && !attaching()){
    d.guestError = 'Ce départ est complet. Retirez un joueur pour en ajouter un autre.';
    refresh();
    return false;
  }
  /* Lot 9e : un nom manquant avertit, il ne bloque pas. */
  if((!first || !last) && !force){
    d.guestWarn = true;
    d.guestError = null;
    refresh();
    return false;
  }

  var nameless = !first && !last;
  placePlayer({
    id:'guest-' + (STATE.draft.slotSeq = (STATE.draft.slotSeq || 0) + 1),
    kind:'guest',
    slot:nameless,
    firstName:nameless ? 'Joueur' : first,
    lastName:nameless ? String(attaching() ? d.attachIndex + 1 : d.players.length + 1) : last,
    incomplete:!first || !last,
    licence:false,
    /* Un joueur saisi à la main n'a pas de compte au club : il réglera à
       l'accueil s'il règle lui-même. */
    member:false,
    invited:false,
    payer:'self'
  });
  d.guest = { firstName:'', lastName:'', licence:'' };
  d.guestError = null;
  d.guestWarn = false;
  trimOptions();
  refresh();
  return true;
}

/* Lot 11 (booking engine v3) : « Rattacher » remplace la place choisie ;
   sans place choisie, le joueur s'ajoute en bout de liste. L'invitation et
   le mode de règlement de la place sont conservés : l'invitation n'est
   jamais posée d'office (retour du 22/10), elle se choisit sur la ligne. */
function attaching(){
  var d = STATE.draft;
  return d.sheet === 'attach' && d.attachIndex !== null && d.attachIndex !== undefined
      && !!d.players[d.attachIndex];
}
function placePlayer(p){
  var d = STATE.draft;
  if(attaching()){
    var old = d.players[d.attachIndex];
    p.invited = !!old.invited;
    p.payer = old.payer || 'self';
    p.f = old.f || 0;
    d.players[d.attachIndex] = p;
    /* La feuille reste ouverte sur le joueur : invitation et règlement se
       règlent dans la foulée. */
    d.attachChange = false;
    return;
  }
  d.players.push(p);
  d.attachIndex = null;
  d.sheet = null;
}
function openAttach(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  if(isNaN(index) || index < 1 || !d.players[index]) return false;
  d.attachIndex = index;
  d.attachChange = false;
  var p = d.players[index];
  d.guest = { firstName:p.kind === 'guest' && !p.slot ? p.firstName : '',
              lastName:p.kind === 'guest' && !p.slot ? p.lastName : '', licence:'' };
  d.guestError = null;
  d.guestWarn = false;
  d.sheet = 'attach';
  refresh();
  return true;
}
function toggleInvite(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  var p = d.players[index];
  if(!p || !isPassion() || index < 1) return false;
  if(!p.invited && !inviteAvailableFor(index)) return false;
  p.invited = !p.invited;
  d.payment = null;
  refresh();
  return true;
}
function togglePayer(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  var p = d.players[index];
  if(!p || index < 1) return false;
  p.payer = p.payer === 'desk' ? 'self' : 'desk';
  d.payment = null;
  refresh();
  return true;
}

/* Ouvre le réglage d'un joueur : son invitation et qui règle sa place. */
function openTerms(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  if(isNaN(index) || index < 1 || index >= d.players.length) return false;
  d.termsIndex = index;
  d.sheet = 'terms';
  refresh();
  return true;
}

function setInvite(value){
  var d = STATE.draft;
  var p = d.players[d.termsIndex];
  if(!p || !isPassion()) return false;
  var want = (value === 'on');
  if(want && !inviteAvailableFor(d.termsIndex)) return false;
  if(p.invited === want) return false;
  p.invited = want;
  d.payment = null;
  refresh();
  return true;
}

function setPayer(value){
  var d = STATE.draft;
  var p = d.players[d.termsIndex];
  if(!p) return false;
  if(value !== 'self' && value !== 'desk') return false;
  if(p.payer === value) return false;
  p.payer = value;
  d.payment = null;
  refresh();
  return true;
}

/* Reprendre à sa charge toutes les places d'un coup. */
function payForAll(){
  var d = STATE.draft;
  var changed = false;
  for(var i=1;i<d.players.length;i++){
    if(d.players[i].payer === 'self'){ d.players[i].payer = 'holder'; changed = true; }
  }
  if(!changed) return false;
  d.payment = null;
  refresh();
  return true;
}

function dropPlayer(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  if(isNaN(index) || index < 1 || index >= d.players.length) return false;
  d.players.splice(index, 1);
  renumberSlots();
  d.sheet = null;
  d.attachIndex = null;
  trimOptions();
  refresh();
  return true;
}

/* Une quantité d'option ne survit pas au départ du joueur qui la justifiait. */
function trimOptions(){
  var d = STATE.draft;
  for(var i=0;i<GF_OPTIONS.length;i++){
    var id = GF_OPTIONS[i].id;
    var max = optionMax(GF_OPTIONS[i]);
    if(d.options[id] > max) d.options[id] = max;
  }
  /* Un changement de total invalide un mode de règlement déjà choisi : le
     choix doit rester explicite sur le montant réellement dû. */
  d.payment = null;
}

function setOption(id, delta){
  var d = STATE.draft;
  var known = null;
  for(var i=0;i<GF_OPTIONS.length;i++){ if(GF_OPTIONS[i].id === id) known = GF_OPTIONS[i]; }
  if(!known) return false;
  var next = optionQty(id) + delta;
  if(next < 0 || next > optionMax(known)) return false;
  d.options[id] = next;
  d.payment = null;
  refresh();
  return true;
}

function choosePayment(id){
  var list = paymentChoices();
  for(var i=0;i<list.length;i++){
    if(list[i].id !== id || list[i].disabled) continue;
    STATE.draft.payment = id;
    if(STATE.draft.sheet === 'pay') STATE.draft.sheet = null;
    refresh();
    return true;
  }
  return false;
}

/* Le règlement passe par un état d'attente : un paiement instantané ne
   ressemble à rien et masque l'état de chargement que le lot doit couvrir. */
function bookNow(){
  var d = STATE.draft;
  if(d.paying) return false;
  if(paymentNeeded() && !d.payment) return false;
  d.paying = true;
  refresh();
  window.setTimeout(function(){
    d.paying = false;
    d.reference = makeReference();
    if(d.payment === 'wallet'){
      profile().wallet = Math.max(0, (profile().wallet || 0) - grandTotal());
      logEwallet('golf', -grandTotal(), 'Réservation d\'un départ', 'Dans l\'app');
    }
    if(d.payment === 'gift') useGift(grandTotal());
    recordBooking();
    navigate('/book/gf/confirm');
  }, PAY_DELAY);
  return true;
}

/* Les deux actions de l'étape 8 n'ont pas de cible dans un prototype. Elles
   rendent compte de ce qu'elles font plutôt que de ne rien faire : un bouton
   sans effet visible se lit comme une panne. */
function addToCalendar(){
  STATE.draft.calendarAdded = true;
  refresh();
  return true;
}
function shareBooking(){
  STATE.draft.shared = true;
  refresh();
  return true;
}

/* Sortir du tunnel : la réservation est faite, le brouillon n'a plus lieu
   d'être. */
/* Lot 10 : le départ confirmé rejoint « Mes réservations », avec la table
   prise en même temps. */
function recordBooking(){
  var d = STATE.draft;
  var slot = draftSlot();
  if(!slot || !d.reference) return false;
  var list = STATE.account.bookings;
  for(var i=0;i<list.length;i++){ if(list[i].id === d.reference) return false; }
  var names = [];
  var lines = playerLines();
  for(var j=0;j<lines.length;j++) names.push(playerName(lines[j].player));
  var others = confirmOthersLine();
  list.push({
    kind:'gf', id:d.reference, siteCode:slot.site.code, courseIndex:d.courseIndex,
    offset:slot.offset, minutes:slot.minutes, players:names,
    options:optionLines().length ? confirmOptionsLine() : null,
    payment:paymentSummary(),
    others:others ? others.replace(/<br>/g, ', ') : null,
    link:anyLinkPaid() ? payLinkOf(d.reference) : null,
    table:d.table ? { seats:d.table.seats, time:d.table.time } : null,
    flights:isGroup() ? (function(){ var t = []; for(var k=0;k<d.flights.length;k++){ var s = flightSlot(d.flights[k]); t.push(s.course.name + ' ' + s.time); } return t; })() : null,
    /* Lot 11 : une ligne par joueur, pour le détail de la réservation. */
    lines:lines.map(function(l){
      var p = l.player;
      return { name:playerName(p), ini:initials(p),
               sub:p.kind === 'holder' ? statusLabels()[0] : (p.relation || 'Invité·e'),
               price:l.price,
               payer:l.byHolder ? 'holder' : (p.payer === 'desk' ? 'desk' : 'link') };
    })
  });
  if(d.table){
    STATE.account.seq += 1;
    list.push({ kind:'table', id:'TBL-' + slot.site.code + '-' + (100 + STATE.account.seq),
                siteCode:slot.site.code, offset:slot.offset,
                minutes:minutesOf(d.table.time), seats:d.table.seats, pending:true });
  }
  return true;
}

function finishBooking(){
  clearDraft();
  selectTab('home');
  return true;
}

/* --- Sélections du tunnel ------------------------------------------------ */

/* Entrer dans le tunnel repart d'un brouillon vide. Le retour arrière, lui,
   conserve les saisies : c'est un critère d'acceptation du brief. */
/* Le site de rattachement est retenu d'avance : c'est le cas courant, et un
   choix déjà fait se corrige plus vite qu'un choix à faire. L'étape 1 reste
   affichée, avec ce site marqué comme retenu — la sauter empêcherait de jouer
   ailleurs, ce que le brief demande précisément de rendre possible. */
/* « Voir les dates » — depuis l'alerte de l'accueil comme depuis la
   notification de travaux. L'écran concerné se pose sur la pile courante : le
   retour ramène d'où l'on vient. */
function openWorksDates(){
  var site = currentSite();
  var closures = site.closures || [];
  if(!closures.length) return false;
  prepareWorks(site, closures[0]);
  navigate('/book/gf/date');
  return true;
}

/* Lot 11 (retour du 22/10) : le membre est déjà rattaché à son golf, on ne
   lui demande plus où jouer. Le tunnel s'ouvre sur l'étape Départ de son
   golf ; « Autre golf du groupe » reste un lien discret, comme dans
   l'en-tête du booking engine v3. */
function startGreenfee(){
  clearDraft();
  STATE.draft.siteCode = STATE.siteCode;
  navigate('/book/gf/date');
  return true;
}
function stackHas(path){
  for(var i=0;i<STATE.stack.length;i++){ if(STATE.stack[i].path === path) return true; }
  return false;
}

function pickSite(code){
  var known = false;
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) known = true; }
  if(!known) return false;
  var d = STATE.draft;
  if(d.siteCode !== code){
    d.siteCode = code;
    d.courseIndex = null;
    d.dayOffset = null;
    d.slotKey = null;
    d.monthOpen = false;
    d.monthShift = 0;
  }
  /* Le retour arrière ne repasse pas par la garde : les valeurs par défaut
     du nouveau golf se posent ici. */
  var site = draftSite();
  if(d.courseIndex === null) d.courseIndex = 0;
  if(d.dayOffset === null || !siteDayOpen(site, d.dayOffset)){
    d.dayOffset = firstSiteDay(site);
    d.slotKey = null;
  }
  if(stackHas('/book/gf/date')) backTo('/book/gf/date');
  else navigate('/book/gf/date');
  return true;
}

function pickCourse(index){
  var site = draftSite();
  index = parseInt(index, 10);
  if(!site || isNaN(index) || !site.courses[index]) return false;
  var d = STATE.draft;
  if(d.courseIndex !== index){
    d.courseIndex = index;
    d.dayOffset = null;
    d.slotKey = null;
  }
  navigate('/book/gf/date');
  return true;
}

/* Changer de jour ne quitte pas l'écran : la feuille de départs se refait en
   place, sous la bande de jours. */
function pickDay(offset){
  var site = draftSite();
  offset = parseInt(offset, 10);
  if(!site || isNaN(offset)) return false;
  if(!siteDayOpen(site, offset)) return false;
  var d = STATE.draft;
  if(d.dayOffset !== offset){
    d.dayOffset = offset;
    d.slotKey = null;
  }
  d.monthOpen = false;
  refresh();
  return true;
}

/* Nombre de joueurs recherché : il filtre la feuille de départs. Un départ
   déjà retenu qui n'a plus assez de places est relâché plutôt que conservé
   en contradiction avec le filtre. */
function setParty(n){
  n = parseInt(n, 10);
  if(isNaN(n) || n < 1 || n > GROUP_MAX) return false;
  var d = STATE.draft;
  if(d.party === n) return false;
  var wasGroup = isGroup();
  d.party = n;
  if(isGroup() !== wasGroup){ d.flights = []; d.slotKey = null; d.players = []; }
  if(d.slotKey){
    var slot = draftSlot();
    if(!slot || slot.seats < n) d.slotKey = null;
  }
  refresh();
  return true;
}

function pickSlot(key, course){
  var d = STATE.draft;
  /* Lot 11 : le créneau porte son parcours. */
  if(course !== undefined && course !== null && course !== ''){
    var ci = parseInt(course, 10);
    var site = draftSite();
    if(!site || isNaN(ci) || !site.courses[ci]) return false;
    if(d.courseIndex !== ci) d.joinWith = null;
    d.courseIndex = ci;
  }
  if(d.siteCode === null || d.courseIndex === null || d.dayOffset === null) return false;
  /* Groupe : le créneau se coche ou se décoche, on reste sur l'étape. */
  if(isGroup()){
    d.flights = d.flights || [];
    var at = -1;
    for(var k=0;k<d.flights.length;k++){ if(d.flights[k].key === key && d.flights[k].ci === d.courseIndex) at = k; }
    if(at > -1) d.flights.splice(at, 1);
    else if(placedCount() < d.party) d.flights.push({ ci:d.courseIndex, key:key });
    d.players = [];
    refresh();
    return true;
  }
  if(d.joinWith && d.joinWith.key !== key) d.joinWith = null;
  d.slotKey = key;
  navigate('/book/gf/players');
  return true;
}

/* --- Proches, lot 9e ------------------------------------------------------ */

function toggleProx(){
  STATE.draft.proxOn = !STATE.draft.proxOn;
  refresh();
  return STATE.draft.proxOn;
}

/* Rejoindre le départ d'un proche : c'est le choix d'un créneau, qui garde la
   mémoire du proche rejoint. Le départ doit avoir la place du groupe cherché. */
function joinRelative(value){
  var d = STATE.draft;
  var parts = String(value || '').split('|');
  var tees = relativeTeesOn(d.dayOffset);
  for(var i=0;i<tees.length;i++){
    var t = tees[i];
    if(t.rel.id !== parts[0] || t.key !== parts[1]) continue;
    if(t.seats < d.party) return false;
    d.joinWith = { relId:t.rel.id, key:t.key, siteCode:d.siteCode, courseIndex:0 };
    return pickSlot(t.key, 0);
  }
  return false;
}

/* « Réserver un départ avec » — repris du booking engine v3, retours du
   24/09. Le tunnel s'ouvre comme depuis l'accueil, pour deux joueurs au
   moins, et le proche sera placé d'office à l'étape 5. */
function bookWithRelative(id){
  var rel = relativeById(id);
  if(!rel) return false;
  clearDraft();
  STATE.draft.siteCode = STATE.siteCode;
  STATE.draft.withId = rel.id;
  STATE.draft.party = 2;
  clearAccountSheet();
  accountDone(null);
  navigate('/book/gf/date');
  return true;
}

function toggleMonth(){
  STATE.draft.monthOpen = !STATE.draft.monthOpen;
  refresh();
  return STATE.draft.monthOpen;
}
function shiftMonth(delta){
  var next = STATE.draft.monthShift + delta;
  if(next < 0 || next > 3) return false;
  STATE.draft.monthShift = next;
  refresh();
  return true;
}

function tabIcon(id){
  for(var i=0;i<TABS.length;i++){ if(TABS[i].id === id) return TABS[i].icon; }
  return 'home';
}
function tabRoot(id){
  for(var i=0;i<TABS.length;i++){ if(TABS[i].id === id) return TABS[i].root; }
  return '/home';
}

/* =========================================================================
   6e. Réservation de cours — lot 3
   ========================================================================= */

/* Élision devant un prénom : « le planning de Élise » est une faute que le
   lot 1 avait déjà rencontrée sur les noms de sites. La forme correcte se
   calcule, elle ne se recopie pas dans chaque libellé. */
function dePrenom(name){
  return /^[aeiouyàâäéèêëîïôöûü]/i.test(name.charAt(0))
    ? 'd\'' + name
    : 'de ' + name;
}

/* Portrait de pro : même principe que le placeholder de parcours du lot 1 —
   dégradé sourd aux couleurs des tokens, aucune image externe. La silhouette
   reste abstraite, elle ne prétend pas être une photo. */
function proPhoto(key){
  var lift = 6 + Math.floor(draw('face' + key) * 10);
  return ''
    + '<svg class="photo is-pro" viewBox="0 0 92 120" preserveAspectRatio="xMidYMid slice" '
    +   'role="img" aria-label="Portrait stylisé">'
    +   '<defs><linearGradient id="pro-sky-' + key + '" x1="0" y1="0" x2="0" y2="1">'
    +     '<stop offset="0" class="sky"></stop><stop offset="1" class="dusk"></stop>'
    +   '</linearGradient></defs>'
    +   '<rect width="92" height="120" fill="url(#pro-sky-' + key + ')"></rect>'
    +   '<circle class="figure" cx="46" cy="' + (44 + lift) + '" r="17"></circle>'
    +   '<path class="figure" d="M46 ' + (68 + lift)
    +     ' C 22 ' + (68 + lift) + ', 12 ' + (92 + lift) + ', 10 120 L82 120 '
    +     'C 80 ' + (92 + lift) + ', 70 ' + (68 + lift) + ', 46 ' + (68 + lift) + ' Z">'
    +   '</path>'
    + '</svg>';
}

/* Fil des choix du tunnel de cours. Mêmes règles qu'au green-fee : un maillon
   qui n'a rien à rouvrir n'est pas un bouton. */
function lessonCrumbs(step){
  var l = STATE.lesson;
  var links = [];

  if(l.mode === 'solo'){
    var pro = proById(l.proId);
    if(pro) links.push({ label:proName(pro), to:'/book/lessons/pro', icon:'user-check' });
    if(step !== 'when' && l.slotKey){
      links.push({ label:shortDate(l.dayOffset), to:'/book/lessons/when', icon:'calendar' });
      links.push({ label:hhmm(parseInt(l.slotKey.split('-')[1], 10)),
                   to:'/book/lessons/when', icon:'clock' });
    }
  } else if(l.mode === 'group'){
    var picked = pickedLesson();
    links.push({ label:'Cours collectif', to:'/book/lessons/group', icon:'users' });
    if(picked){
      links.push({ label:picked.title, to:'/book/lessons/group', icon:'target' });
      links.push({ label:picked.time || hhmm(picked.minutes),
                   to:'/book/lessons/group', icon:'clock' });
    }
  }
  if(!links.length) return '';

  var html = '<nav class="crumbs" data-role="lesson-crumbs" aria-label="Vos choix">';
  for(var i=0;i<links.length;i++){
    var c = links[i];
    html += '<button type="button" class="crumb" data-backto="' + c.to + '" '
          + 'aria-label="Revenir au choix : ' + c.label + '">'
          + icon(c.icon) + '<span>' + c.label + '</span></button>';
  }
  return html + '</nav>';
}

/* --- Entrée : les deux portes du lot 3 ----------------------------------- */

function lessonRow(booking){
  var date = dateAt(booking.offset);
  var cancelled = lessonIsCancelled(booking);
  var past = lessonIsPast(booking);

  var chip;
  if(cancelled) chip = '<span class="chip is-void">Annulé</span>';
  else if(past && booking.debrief) chip = '<span class="chip is-gold">Debrief</span>';
  else if(past) chip = '<span class="chip is-quiet">Terminé</span>';
  else chip = '<span class="chip is-gold">À venir</span>';

  return '<button type="button" class="lesson" data-act="lesson-open" '
       +   'data-value="' + booking.id + '" '
       +   'aria-label="' + booking.title + ', ' + longDate(booking.offset)
       +   ', ' + hhmm(booking.minutes) + '">'
       +   '<span class="lesson-date">'
       +     '<span class="lesson-day">' + date.getDate() + '</span>'
       +     '<span class="lesson-month">' + MOIS_COURT[date.getMonth()] + '</span>'
       +   '</span>'
       +   '<span class="lesson-body">'
       +     '<span class="lesson-title">' + booking.title + '</span>'
       +     '<span class="lesson-meta">' + hhmm(booking.minutes) + ' &middot; '
       +       minutesLabel(booking.duration) + ' &middot; ' + proName(booking.pro)
       +     '</span>'
       +   '</span>'
       +   '<span class="lesson-side">' + chip
       +     '<i class="ti ti-chevron-right lesson-chevron" aria-hidden="true"></i>'
       +   '</span>'
       + '</button>';
}

/* Retour du 22/10 : dans Mes réservations, le cours prend la même carte
   que le green-fee et la compétition (bloc de date, étiquette, heure). */
function lessonCard(booking){
  var cancelled = lessonIsCancelled(booking);
  var past = lessonIsPast(booking);

       +   'data-act="lesson-open" data-value="' + booking.id + '" data-role="lesson-booking" '

       +     '<p class="booking-main"><span class="booking-time">' + hhmm(booking.minutes) + '</span>'
       +       '<span class="booking-course">' + booking.title + '</span></p>'
       +     '<p class="booking-meta">' + minutesLabel(booking.duration) + ' &middot; ' + proName(booking.pro) + '</p>'
       +   '</span>'
       + '</button>';
}

    +       '<span class="pick-title">Un cours collectif</span>'

/* --- Cours particulier, étape 1 : le pro --------------------------------- */

/* --- Calendrier des cours ------------------------------------------------ */

/* Le brief demande le planning du pro « en vue calendrier, pas en liste ».
   La grille est donc toujours ouverte, et les jours qui ont encore quelque
   chose à proposer portent une pastille. `hasDay` dit ce qu'une pastille
   signifie : un créneau libre pour un pro, une séance pour un collectif. */
function lessonMonth(hasDay){
  var l = STATE.lesson;
  var base = startOfToday();
  var first = new Date(base.getFullYear(), base.getMonth() + l.monthShift, 1);
  var lead = (first.getDay() + 6) % 7;
  var count = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();

  var html = '<div class="month" data-role="lesson-month">'
    + '<div class="month-head">'
    +   '<button type="button" class="month-nav" data-act="lmonth-prev"'
    +     (l.monthShift <= 0 ? ' disabled' : '') + ' aria-label="Mois précédent">'
    +     icon('chevron-left') + '</button>'
    +   '<p class="month-title">' + capitalize(MOIS[first.getMonth()].toLowerCase())
    +     ' ' + first.getFullYear() + '</p>'
    +   '<button type="button" class="month-nav" data-act="lmonth-next"'
    +     (l.monthShift >= 3 ? ' disabled' : '') + ' aria-label="Mois suivant">'
    +     icon('chevron-right') + '</button>'
    + '</div>'
    + '<div class="month-grid">';

  for(var w=0;w<7;w++){ html += '<span class="month-dow">' + DOW_LUNDI[w] + '</span>'; }
  for(var v=0;v<lead;v++){ html += '<span class="month-cell is-void"></span>'; }

  for(var n=1;n<=count;n++){
    var date = new Date(first.getFullYear(), first.getMonth(), n);
    var offset = offsetOf(date);
    var open = hasDay(offset);
    html += '<button type="button" class="month-cell'
          +   (l.dayOffset === offset ? ' is-selected' : '') + '" '
          +   'data-pick="lday" data-value="' + offset + '"'
          +   (open ? '' : ' disabled aria-disabled="true"')
          +   ' aria-label="' + longDate(offset)
          +   (open ? ', des séances ce jour-là' : ', aucune séance') + '">'
          +   n
          +   (open ? '<span class="month-dot"></span>' : '')
          + '</button>';
  }
  return html + '</div></div>';
}

/* --- Cours particulier, étape 2 : la durée et le planning ---------------- */

/* La durée se choisit avant le créneau, et non après comme le laisse lire
   l'ordre du brief : c'est elle qui détermine ce que le planning peut
   proposer. Une heure demande deux demi-heures contiguës — présenter des
   créneaux avant de savoir la durée les rendrait faux. */
function durationPicker(pro){
  var l = STATE.lesson;
  var html = '<div class="durations" role="radiogroup" aria-label="Durée du cours">';
  for(var i=0;i<LESSON_DURATIONS.length;i++){
    var dur = LESSON_DURATIONS[i];
    var on = (l.durationId === dur.id);
    html += '<button type="button" class="duration' + (on ? ' is-on' : '') + '" '
          +   'data-act="duration" data-value="' + dur.id + '" '
          +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '" '
          +   'aria-label="' + dur.label + ', ' + proRate(pro, dur.id) + ' euros">'
          +   '<span class="duration-label">' + dur.label + '</span>'
          +   '<span class="duration-price">' + amount(proRate(pro, dur.id)) + '</span>'
          + '</button>';
  }
  return html + '</div>';
}

function lessonSlotRow(slot, dur, selected){
  return '<button type="button" class="slot' + (selected ? ' is-selected' : '') + '" '
       +   'data-pick="lslot" data-value="' + slot.key + '" '
       +   'aria-label="' + slot.time + ', ' + dur.label + '">'
       +   '<span class="slot-time">' + slot.time + '</span>'
       +   '<span class="slot-tags"></span>'
       +   '<span class="slot-left">jusqu\'à '
       +     hhmm(slot.minutes + dur.minutes) + '</span>'
       + '</button>';
}

function screenLessonWhen(){
  var l = STATE.lesson;
  var pro = proById(l.proId);
  var dur = durationById(l.durationId);
  if(!pro) return screenNotFound();

  var slots = proSlots(pro, l.dayOffset, l.durationId);
  var groups = '';
  for(var b=0;b<LESSON_BLOCKS.length;b++){
    var block = LESSON_BLOCKS[b];
    var rows = '';
    for(var i=0;i<slots.length;i++){
      if(slots[i].block !== block.id) continue;
      rows += lessonSlotRow(slots[i], dur, l.slotKey === slots[i].key);
    }
    if(!rows) continue;
    groups += '<section class="slot-group" data-role="lesson-slot-group">'
            +   '<h3 class="slot-group-head">' + block.label + '</h3>'
            +   '<div class="slots" data-role="lesson-slots">' + rows + '</div>'
            + '</section>';
  }

  var body = groups
    ? groups + '<p class="slots-foot">Le tarif ne dépend pas de l\'heure : '
      + 'il est celui de la durée choisie.</p>'
    : '<div class="stepempty" data-role="when-empty">'
      +   '<h3 class="screen-title">Aucun créneau ce jour-là</h3>'
      +   '<p class="screen-text">Le planning ' + dePrenom(pro.firstName)
      +     ' est pris pour ' + dur.label + '. Les jours marqués d\'une pastille '
      +     'ont encore des créneaux.</p>'
      + '</div>';

  return ''
    + lessonCrumbs('when')
    + '<h2 class="screen-title">Quand souhaitez-vous ce cours ?</h2>'
    + '<section class="section">'
    +   '<p class="eyebrow">Durée</p>'
    +   durationPicker(pro)
    + '</section>'
    + '<section class="section">'
    +   '<p class="eyebrow">Le planning ' + dePrenom(pro.firstName) + '</p>'
    +   lessonMonth(function(offset){ return proDayHasSlots(pro, offset, l.durationId); })
    + '</section>'
    + '<section class="section" data-role="lesson-tee">'
    +   '<h3 class="tee-head">' + capitalize(longDate(l.dayOffset)) + '</h3>'
    +   body
    + '</section>';
}

/* --- Cours collectif : calendrier, filtres, liste du jour ---------------- */

function filterPill(kind, label, on, iconName){
  return '<button type="button" class="filter' + (on ? ' is-on' : '') + '" '
       +   'data-act="filter-open" data-value="' + kind + '" '
       +   'aria-label="Filtre : ' + label + '">'
       +   icon(iconName) + '<span>' + label + '</span>'
       + '</button>';
}

function filterBar(){
  var l = STATE.lesson;
  var site = currentSite();
  var proLabel = 'Tous les pros';
  if(l.filterPro !== 'all'){
    var pro = proById(l.filterPro);
    if(pro) proLabel = proName(pro);
  }
  var themeLabel = 'Tous les thèmes';
  if(l.filterTheme !== 'all'){
    for(var i=0;i<GROUP_THEMES.length;i++){
      if(GROUP_THEMES[i].id === l.filterTheme) themeLabel = GROUP_THEMES[i].label;
    }
  }
  var whenLabel = 'Toute la journée';
  if(l.filterWhen === 'am') whenLabel = 'Matin';
  if(l.filterWhen === 'pm') whenLabel = 'Après-midi';

  return '<div class="filters" data-role="filters">'
       +   filterPill('pro', proLabel, l.filterPro !== 'all', 'user-check')
       +   filterPill('theme', themeLabel, l.filterTheme !== 'all', 'target')
       +   filterPill('when', whenLabel, l.filterWhen !== 'all', 'clock')
       + '</div>';
}

/* Une séance complète reste visible et grisée, comme le demande le brief.
   Elle n'est plus réservable, mais elle porte une demande d'alerte : la
   mécanique de liste d'attente n'est pas spécifiée, le prototype se borne à
   enregistrer la demande et à en rendre compte. */
function sessionRow(session, selected){
  var meta = minutesLabel(session.theme.minutes) + ' &middot; ' + proName(session.pro);
  var side = '<span class="sess-side">'
           +   '<span class="sess-price">' + amount(session.price) + '</span>'
           +   '<span class="sess-seats">' + groupSeatsLabel(session.seats) + '</span>'
           + '</span>';
  var body = '<span class="sess-body">'
           +   '<span class="sess-name">' + session.theme.label + '</span>'
           +   '<span class="sess-meta">' + meta + '</span>'
           + '</span>';

  if(session.seats === 0){
    var asked = !!STATE.lesson.waitlist[session.id];
    return '<div class="sess is-full" data-role="session" '
         +   'data-value="' + session.id + '">'
         +   '<div class="sess-head">'
         +     '<span class="sess-time">' + session.time + '</span>'
         +     body
         +     side
         +   '</div>'
         +   '<button type="button" class="sess-wait" data-act="waitlist" '
         +     'data-value="' + session.id + '"'
         +     (asked ? ' disabled aria-disabled="true"' : '') + '>'
         +     icon(asked ? 'check' : 'bell')
         +     '<span>' + (asked
                ? 'Vous serez prévenu si une place se libère'
                : 'Prévenez-moi si une place se libère') + '</span>'
         +   '</button>'
         + '</div>';
  }

  return '<button type="button" class="sess' + (selected ? ' is-selected' : '') + '" '
       +   'data-pick="session" data-value="' + session.id + '" '
       +   'data-role="session" '
       +   'aria-label="' + session.theme.label + ', ' + session.time + ', '
       +   groupSeatsLabel(session.seats) + ', ' + session.price + ' euros">'
       +   '<span class="sess-time">' + session.time + '</span>'
       +   body
       +   side
       + '</button>';
}

function groupDayTiles(site){
  var l = STATE.lesson;
  var html = '';
  for(var i=0;i<STRIP_DAYS;i++){
    var dt = dateAt(i);
    var has = dayHasGroup(site, i);
    var n = has ? filteredSessions(site, i).length : 0;
    var on = (l.dayOffset === i);
    html += '<button type="button" class="dtile' + (on ? ' is-on' : '') + (has ? '' : ' is-full') + '" '
          +   'data-pick="lday" data-value="' + i + '"' + (has ? '' : ' disabled aria-disabled="true"')
          +   ' aria-label="' + longDate(i) + (has ? ', ' + n + ' cours' : ', aucun cours') + '">'
          +   '<span class="dtile-d">' + capitalize(JOURS_COURT[dt.getDay()]) + ' ' + dt.getDate() + '</span>'
          +   '<span class="dtile-m">' + MOIS_COURT[dt.getMonth()] + '</span>'
          +   '<span class="dtile-p">' + (has ? n + ' cours' : 'aucun') + '</span>'
          + '</button>';
  }
  return html;
}
function toggleLessonCal(){ STATE.lesson.calOpen = !STATE.lesson.calOpen; refresh(); return true; }
function screenLessonGroup(){
  var l = STATE.lesson;
  var site = currentSite();
  var list = filteredSessions(site, l.dayOffset);

  var rows = '';
  for(var i=0;i<list.length;i++){
    rows += sessionRow(list[i], l.sessionId === list[i].id);
  }

  var body;
  if(rows){
    body = '<div class="sessions" data-role="sessions">' + rows + '</div>'
         + '<p class="slots-foot">Le nombre de places restantes est indiqué, '
         +   'jamais les noms des inscrits.</p>';
  } else if(anyFilterOn()){
    body = '<div class="stepempty" data-role="group-empty">'
         +   '<h3 class="screen-title">Aucun cours ne correspond</h3>'
         +   '<p class="screen-text">Vos filtres ne laissent rien passer ce '
         +     'jour-là. Retirez-en un pour voir le reste de la journée.</p>'
         +   '<button type="button" class="btn is-primary" data-act="filters-clear">'
         +     'Retirer les filtres</button>'
         + '</div>';
  } else {
    body = '<div class="stepempty" data-role="group-empty">'
         +   '<h3 class="screen-title">Aucun cours ce jour-là</h3>'
         +   '<p class="screen-text">Les jours marqués d\'une pastille portent '
         +     'des séances collectives.</p>'
         + '</div>';
  }

  return ''
    + '<h2 class="screen-title">Les cours collectifs</h2>'
    + '<p class="screen-text">Des séances à thème, en petit groupe, encadrées '
    +   'par les pros du golf.</p>'
    /* Retour du 22/10 : un sélecteur de date qui ouvre le calendrier, puis
       les jours en bande comme au green-fee, pour voir les cours plus vite. */
    + '<div class="sbar" data-role="lesson-date" style="margin-top:14px">'
    +   '<button type="button" class="sbar-row" data-act="lcal" aria-expanded="' + (l.calOpen ? 'true' : 'false') + '">'
    +     '<span class="sbar-ic">' + icon('calendar') + '</span>'
    +     '<span class="sbar-body"><span class="sbar-lbl">Date</span>'
    +       '<span class="sbar-val">' + capitalize(longDate(l.dayOffset)) + icon(l.calOpen ? 'chevron-up' : 'chevron-down') + '</span></span>'
    +   '</button>'
    +   (l.calOpen ? '<div class="datepanel">' + lessonMonth(function(offset){ return dayHasGroup(site, offset); }) + '</div>' : '')
    + '</div>'
    + '<div class="dtiles" data-role="lesson-days">' + groupDayTiles(site) + '</div>'
    + '<section class="section" data-role="group-day">'
    +   filterBar()
    +   body
    + '</section>'
    + lessonSheet();
}

/* --- Feuilles de filtre et d'annulation ---------------------------------- */

function filterSheet(kind){
  var l = STATE.lesson;
  var site = currentSite();
  var body = '';
  var title = '';
  var i;

  if(kind === 'pro'){
    title = 'Filtrer par pro';
    var team = prosOfSite(site);
    body += choiceRow('filter-pro', 'all', l.filterPro === 'all',
              'Tous les pros', 'Aucun filtre sur l\'encadrement.', false);
    for(i=0;i<team.length;i++){
      body += choiceRow('filter-pro', team[i].id, l.filterPro === team[i].id,
                proName(team[i]), team[i].tags.join(', '), false);
    }
  } else if(kind === 'theme'){
    title = 'Filtrer par thème';
    body += choiceRow('filter-theme', 'all', l.filterTheme === 'all',
              'Tous les thèmes', 'Aucun filtre sur le contenu.', false);
    for(i=0;i<GROUP_THEMES.length;i++){
      body += choiceRow('filter-theme', GROUP_THEMES[i].id,
                l.filterTheme === GROUP_THEMES[i].id,
                GROUP_THEMES[i].label,
                minutesLabel(GROUP_THEMES[i].minutes) + ', '
                  + amount(GROUP_THEMES[i].price), false);
    }
  } else {
    title = 'Filtrer par période';
    body += choiceRow('filter-when', 'all', l.filterWhen === 'all',
              'Toute la journée', 'Aucun filtre sur l\'horaire.', false);
    body += choiceRow('filter-when', 'am', l.filterWhen === 'am',
              'Matin', 'Les séances qui commencent avant 13 h.', false);
    body += choiceRow('filter-when', 'pm', l.filterWhen === 'pm',
              'Après-midi', 'Les séances qui commencent après 13 h.', false);
  }

  return sheetShell(title,
      '<div class="choicegroup" role="radiogroup" aria-label="' + title + '">'
    +   body
    + '</div>'
    + '<button type="button" class="btn is-primary" data-act="lesson-sheet-close">'
    +   'Terminer</button>');
}

/* La feuille ne redit pas le délai : le rappel est écrit juste au-dessus,
   sur l'écran. Elle dit ce que le geste produit, c'est-à-dire le sort du
   montant — décision 5 du brief. */
function cancelSheet(booking){
  return sheetShell('Annuler ce cours',
      '<p class="sheet-lead">' + lessonRefundText(booking) + '</p>'
    + '<button type="button" class="btn is-primary" data-act="lesson-sheet-close">'
    +   'Garder ce cours</button>'
    + '<button type="button" class="btn is-danger" data-act="lesson-cancel">'
    +   'Annuler ce cours</button>');
}

function lessonSheet(){
  var l = STATE.lesson;
  if(l.sheet === 'pro' || l.sheet === 'theme' || l.sheet === 'when'){
    return filterSheet(l.sheet);
  }
  if(l.sheet === 'cancel'){
    var booking = lessonBookingById(l.openId);
    return booking ? cancelSheet(booking) : '';
  }
  return '';
}

/* --- Le paiement --------------------------------------------------------- */

/* Même pied que les étapes à total du green-fee, sur le montant du cours.
   Aucun écran ne compose son propre total : il vient de lessonTotal(). */
function lessonFoot(note, button){
  var total = lessonTotal();
  return '<div class="stepfoot" data-role="stepfoot">'
       +   '<p class="total">'
       +     '<span class="total-label">Total</span>'
       +     '<span class="total-value" data-role="total">' + amount(total) + '</span>'
       +   '</p>'
       +   (note ? '<p class="total-note">' + note + '</p>' : '')
       +   button
       + '</div>';
}

/* La mention de tête dit pourquoi le carnet n'est pas proposé, quand il ne
   l'est pas. Elle ne remplace jamais un choix : la carte reste offerte, et
   rien n'est présélectionné. */
function lessonPayLead(){
  var plan = lessonCreditPlan();
  if(plan.covers) return '';
  if(plan.balance <= 0){
    return '<p class="paylead" data-role="lesson-paylead">' + icon('ticket-off')
         + '<span><b>Aucun crédit de cours disponible.</b> '
         + 'Vous pourrez acheter un carnet depuis votre portefeuille.</span></p>';
  }
  return '<p class="paylead" data-role="lesson-paylead">' + icon('ticket')
       + '<span><b>Votre carnet ne couvre pas cette séance.</b> '
       + 'Il vous reste ' + hoursLabel(plan.balance) + ', cette séance en demande '
       + hoursLabel(plan.need) + '.</span></p>';
}

function lessonPayRow(choice){
  var selected = (STATE.lesson.payment === choice.id);
  var lines = '';
  if(choice.id === 'wallet'){
    lines += '<span class="payopt-line">' + (choice.disabled
      ? 'Solde de <b>' + eurosCents(choice.walletFrom) + '</b>, insuffisant pour cette séance.'
      : 'E-wallet golf <b>' + eurosCents(choice.walletFrom) + '</b> puis <b>'
        + eurosCents(choice.walletTo) + '</b> après cette séance.') + '</span>';
  } else if(choice.id === 'gift'){
    lines += '<span class="payopt-line">Carte cadeau <b>' + eurosCents(choice.giftFrom) + '</b> puis <b>'
           + eurosCents(choice.giftTo) + '</b> après cette séance.</span>';
  } else if(choice.balanceFrom !== null){
    lines += '<span class="payopt-line">Carnet de cours <b>'
           + hoursLabel(choice.balanceFrom) + '</b> puis <b>'
           + hoursLabel(choice.balanceTo) + '</b> après cette séance.</span>';
  } else {
    lines += '<span class="payopt-line">Carte enregistrée dans votre profil.</span>';
  }
  return '<button type="button" class="payopt' + (selected ? ' is-selected' : '') + '" '
       +   'data-act="lesson-pay-pick" data-value="' + choice.id + '" '
       +   'role="radio" aria-checked="' + (selected ? 'true' : 'false') + '"'
       +   (choice.disabled ? ' disabled aria-disabled="true"' : '') + '>'
       +   '<span class="payopt-mark">' + icon('check') + '</span>'
       +   '<span class="payopt-body">'
       +     '<span class="payopt-title">' + choice.title + '</span>'
       +     lines
       +   '</span>'
       + '</button>';
}

function screenLessonPay(){
  var choices = lessonPaymentChoices();
  var rows = '';
  for(var i=0;i<choices.length;i++) rows += lessonPayRow(choices[i]);

  var chosen = chosenLessonPayment();
  var note = chosen ? null : 'Choisissez un mode de règlement pour continuer.';

  return ''
    + '<div class="stepbody">'
    +   lessonCrumbs('pay')
    +   '<h2 class="screen-title">Comment souhaitez-vous payer ?</h2>'
    +   lessonPayLead()
    +   '<section class="section" data-role="lesson-payopts">'
    +     paySelector(chosen, 'lesson', 'lesson-pay-open') + '</section>'
    + '</div>'
    + (STATE.lesson.sheet === 'pay' ? paySheet(choices, STATE.lesson.payment, 'lesson', 'lesson-pay-pick') : '')
    + lessonFoot(note,
        '<button type="button" class="btn is-primary'
        + (STATE.lesson.paying ? ' is-busy' : '') + '" data-act="lesson-book"'
        + ((!chosen || STATE.lesson.paying) ? ' disabled aria-disabled="true"' : '')
        + (STATE.lesson.paying ? ' aria-busy="true"' : '') + '>'
        + (STATE.lesson.paying
           ? icon('loader-2') + '<span>Traitement en cours</span>'
           : 'Réserver ce cours')
        + '</button>');
}

/* --- La confirmation ----------------------------------------------------- */

  if(!picked) return screenNotFound();

  var done = '';
  if(l.calendarAdded){
    done += '<p class="done">' + icon('calendar-check')
          + '<span>Cours ajouté à votre calendrier.</span></p>';

    +   '<li>Horaire <b>' + hhmm(picked.minutes) + '</b></li>'
    +   '<li>Durée <b>' + minutesLabel(picked.duration) + '</b></li>'
    +   '<li>Vous réglez <b>' + lessonPaymentSummary() + '</b></li>'

    + '<div class="confirm-actions">'
    +   '<button type="button" class="btn is-quiet" data-act="lesson-calendar">'
    +     icon('calendar-plus') + '<span>Au calendrier</span></button>'
    +   '<button type="button" class="btn is-quiet" data-act="lesson-share">'

    + '<p class="cancelnote" data-role="lesson-cancelnote">' + icon('clock-hour-4')

    + '<button type="button" class="btn is-primary" data-act="lesson-finish">'
    +   'Revenir à l\'accueil</button>';
}

/* --- Le détail d'une réservation de cours -------------------------------- */

/* Le bloc de debrief est en lecture seule côté joueur : il est alimenté par
   le back-office, l'application ne fait que l'afficher. Il n'apparaît qu'une
   fois la séance passée — avant, il n'a rien à dire. */
function debriefBlock(booking){
  var points = '';
  for(var i=0;i<booking.debrief.points.length;i++){
    points += '<li>' + icon('point') + '<span>'
            + booking.debrief.points[i] + '</span></li>';
  }
  return '<section class="debrief" data-role="debrief">'
       +   '<h3 class="debrief-head">' + icon('notebook')
       +     '<span>Le debrief de votre pro</span></h3>'
       +   '<p class="debrief-who">Écrit par ' + proName(booking.pro)
       +     ' après la séance du ' + longDate(booking.offset) + '.</p>'
       +   '<p class="debrief-text">' + booking.debrief.intro + '</p>'
       +   '<ul class="debrief-list">' + points + '</ul>'
       + '</section>';
}

function screenLessonDetail(){
  var booking = lessonBookingById(STATE.lesson.openId);
  if(!booking) return screenNotFound();

  var cancelled = lessonIsCancelled(booking);
  var past = lessonIsPast(booking);
  var paid = booking.paidWith === 'credits'
    ? minutesLabel(booking.duration) + ' de votre carnet'
    : amount(booking.price) + ' par carte';

  var tail = '';
  if(cancelled){
    tail = '<p class="voided" data-role="lesson-voided">' + icon('circle-x')
         + '<span><b>Cours annulé.</b> ' + lessonRefundText(booking) + '</span></p>';
  } else if(!past){
    var window_ = lessonCancelWindow(booking.offset);
    var text = window_ && window_.free
      ? 'Annulation gratuite jusqu\'au ' + window_.label + ' à 18 h. Passé ce '
        + 'délai, la séance reste due.'
      : 'Ce cours a lieu aujourd\'hui : le délai d\'annulation gratuite est '
        + 'passé, la séance reste due.';
    tail = '<p class="cancelnote" data-role="lesson-delay">' + icon('clock-hour-4')
         +   '<span>' + text + '</span></p>'
         + '<div class="lessonfoot">'
         +   '<button type="button" class="btn is-danger" data-act="lesson-cancel-open">'
         +     'Annuler ce cours</button>'
         + '</div>';
  }

  return ''
    + '<h2 class="screen-title">' + booking.title + '</h2>'
    + '<p class="screen-text">' + (booking.kind === 'group'
        ? 'Cours collectif, ' + minutesLabel(booking.duration) + '.'
        : 'Séance en tête-à-tête, ' + minutesLabel(booking.duration) + '.') + '</p>'
    + '<ul class="spec" data-role="lesson-detail-spec">'
    /* Le thème est le titre de l'écran : le répéter en première ligne de
       fiche serait le doublon de libellé qui revient à chaque lot. */
    +   '<li>Pro <b>' + proName(booking.pro) + '</b></li>'
    +   '<li>Lieu <b>' + lessonPlace(booking.site, booking.theme) + '</b></li>'
    +   '<li>Date <b>' + capitalize(longDate(booking.offset)) + '</b></li>'
    +   '<li>Horaire <b>' + hhmm(booking.minutes) + '</b></li>'
    +   '<li>Paiement <b>' + (cancelled ? 'Annulé' : 'Réglé, ' + paid) + '</b></li>'
    + '</ul>'
    + tail
    + (past && booking.debrief && !cancelled ? debriefBlock(booking) : '')
    + lessonSheet();
}

/* Entrer par l'une des deux portes repart d'un brouillon vide : un cours
   collectif retenu n'a rien à faire dans un cours particulier. */
function startLessonSolo(){
  clearLesson();
  STATE.lesson.mode = 'solo';
  navigate('/book/lessons/pro');
  return true;
}
function startLessonGroup(){
  clearLesson();
  STATE.lesson.mode = 'group';
  navigate('/book/lessons/group');
  return true;
}

function pickPro(id){
  var pro = proById(id);
  if(!pro) return false;
  var l = STATE.lesson;
  if(l.proId !== id){
    l.proId = id;
    l.dayOffset = null;
    l.slotKey = null;
    l.monthShift = 0;
  }
  navigate('/book/lessons/when');
  return true;
}

/* Changer de durée refait le planning en place : une heure et une demi-heure
   n'ouvrent pas les mêmes créneaux. Un créneau retenu qui ne tient plus dans
   la nouvelle durée est relâché plutôt que gardé en contradiction. */
function setLessonDuration(id){
  var l = STATE.lesson;
  var dur = durationById(id);
  if(!dur || l.durationId === dur.id) return false;
  l.durationId = dur.id;
  l.payment = null;
  var pro = proById(l.proId);
  if(l.slotKey){
    var still = false;
    var slots = proSlots(pro, l.dayOffset, l.durationId);
    for(var i=0;i<slots.length;i++){ if(slots[i].key === l.slotKey) still = true; }
    if(!still) l.slotKey = null;
  }
  if(l.dayOffset === null || !proDayHasSlots(pro, l.dayOffset, l.durationId)){
    l.dayOffset = firstProDay(pro, l.durationId);
    l.slotKey = null;
  }
  refresh();
  return true;
}

/* Changer de jour ne quitte pas l'écran, comme à l'étape 3 du green-fee. */
function pickLessonDay(offset){
  offset = parseInt(offset, 10);
  if(isNaN(offset)) return false;
  var l = STATE.lesson;
  l.calOpen = false;
  if(l.dayOffset === offset){ refresh(); return false; }
  l.dayOffset = offset;
  l.slotKey = null;
  l.sessionId = null;
  l.payment = null;
  refresh();
  return true;
}
function shiftLessonMonth(delta){
  var next = STATE.lesson.monthShift + delta;
  if(next < 0 || next > 3) return false;
  STATE.lesson.monthShift = next;
  refresh();
  return true;
}

function pickLessonSlot(key){
  var l = STATE.lesson;
  if(!l.proId || l.dayOffset === null) return false;
  l.slotKey = key;
  l.payment = null;
  navigate('/book/lessons/pay');
  return true;
}

function pickSession(id){
  var l = STATE.lesson;
  var session = groupSessionById(currentSite(), l.dayOffset, id);
  if(!session || session.seats === 0) return false;
  l.sessionId = id;
  l.payment = null;
  navigate('/book/lessons/pay');
  return true;
}

/* La mécanique de liste d'attente n'est pas spécifiée : le prototype
   enregistre la demande et en rend compte, il ne promet rien d'autre. */
/* La demande retient le jour et le golf de la séance (19/10/2026) : le bloc
   « Mes listes d'attente » repris du booking engine v3 doit pouvoir la
   nommer et la dater. */
function askWaitlist(id){
  var l = STATE.lesson;
  if(l.waitlist[id]) return false;
  l.waitlist[id] = { offset:l.dayOffset, siteCode:currentSite().code };
  refresh();
  return true;
}
/* Désinscription en un geste, sans confirmation, comme dans v3. */
function quitWaitlist(id){
  var l = STATE.lesson;
  if(!l.waitlist[id]) return false;
  delete l.waitlist[id];
  refresh();
  return true;
}
function waitlistEntries(){
  var out = [];
  var w = STATE.lesson.waitlist;
  for(var id in w){
    if(!Object.prototype.hasOwnProperty.call(w, id) || !w[id]) continue;
    var site = null;
    for(var i=0;i<SITES.length;i++){ if(SITES[i].code === w[id].siteCode) site = SITES[i]; }
    var s = site ? groupSessionById(site, w[id].offset, id) : null;
    if(s) out.push({ id:id, session:s, offset:w[id].offset });
  }
  return out;
}

/* Bloc des listes d'attente, en tête de « Vos cours » — repris de « Mes
   réservations » du booking engine v3 : fond sable, bord pointillé,
   compteur, « Rien n'est réservé ni débité », désinscription en un geste. */
/* Lot 10 : « Mes réservations » y ajoute les listes d'attente green-fee.
   « Vos cours » garde les seules séances : withGf vaut faux. */
function waitBox(withGf){
  var list = waitlistEntries();
  var gf = withGf ? gfWaitEntries() : [];
  if(!list.length && !gf.length) return '';
  var rows = '';
  for(var g=0;g<gf.length;g++){
    var w = gf[g];
    rows += ''
      + '<div class="wrow" data-role="wait-row" data-kind="gf">'
      +   '<span class="chip">Green-fee</span>'
      +   '<p class="wrow-title">' + w.course.name + ' &middot; ' + w.site.name + '</p>'
      +   '<p class="wrow-meta">' + shortDate(w.offset) + ' &middot; '
      +     (w.minutes === null ? 'Toute la journée' : hhmm(w.minutes)) + ' &middot; '
      +     w.party + (w.party > 1 ? ' joueurs' : ' joueur') + '</p>'
      +   '<button type="button" class="btn is-quiet wrow-quit" '
      +     'data-act="gf-wait-quit" data-value="' + w.key + '">Me désinscrire</button>'
      + '</div>';
  }
  for(var i=0;i<list.length;i++){
    var e = list[i];
    rows += ''
      + '<div class="wrow" data-role="wait-row">'
      +   '<span class="chip">Cours collectif</span>'
      +   '<p class="wrow-title">' + e.session.theme.label + '</p>'
      +   '<p class="wrow-meta">' + shortDate(e.offset) + ' &middot; '
      +     e.session.time + '</p>'
      +   '<button type="button" class="btn is-quiet wrow-quit" '
      +     'data-act="waitlist-quit" data-value="' + e.id + '">Me désinscrire</button>'
      + '</div>';
  }
  var n = list.length + gf.length;
  return ''
    + '<section class="waitbox" data-role="waitbox">'
    +   '<div class="waitbox-head">'
    +     '<span class="waitbox-mark">' + icon('clock') + '</span>'
    +     '<p class="waitbox-title">Mes listes d\'attente '
    +       '<span class="waitbox-n">' + n + '</span></p>'
    +   '</div>'
    +   '<p class="waitbox-text">Rien n\'est réservé ni débité : vous êtes '
    +     'prévenu·e si une place se libère.</p>'
    +   rows
    + '</section>';
}

   pas l'état de chargement que le lot doit couvrir. */

  var l = STATE.lesson;

    l.paying = false;

/* Jauge en segments du carnet de cours, reprise de « Carnets & avoirs » du
   booking engine v3 : un segment par cours de 30 min, « 3 / 5 cours
   restants ». Seulement quand le carnet du profil est connu en entier. */
var GAUGE_UNIT = 0.5;
/* 29/10/2026 : même jauge pour les seaux, un segment par seau du carnet,
   « 12 / 25 seaux restants ». HYPOTHÈSE : carnet de 25 pour Claire, de 10
   pour Sophie (tailles de PACKS). Un solde qui dépasse le carnet (après un
   achat) fait la jauge à sa taille. */
function bucketGauge(){
  var b = profile().credits.buckets;
  var left = potValue('buckets');
  if(!b || !b.total || !left) return '';
  var tot = Math.max(b.total, left);
  var seg = '';
  for(var i=0;i<tot;i++) seg += '<i' + (i < left ? ' class="is-on"' : '') + '></i>';
  return ''
    + '<span class="pot-gauge" data-role="pot-gauge">'
    +   '<span class="gauge' + (tot > 15 ? ' is-dense' : '') + '" aria-hidden="true">' + seg + '</span>'
    +   '<span class="pot-gauge-text">' + left + ' / ' + tot + ' seaux restants'
    +     ' &middot; ' + (tot - left) + ' utilisé' + (tot - left > 1 ? 's' : '') + '</span>'
    + '</span>';
}
function potGauge(pot){
  if(pot.id === 'buckets') return bucketGauge();
  if(pot.id !== 'lessons' || STATE.demoLessons !== 'profile') return '';
  var total = profile().credits.lessons.total;
  if(!total) return '';
  var tot = Math.round(total / GAUGE_UNIT);
  var left = Math.min(tot, Math.round(potValue('lessons') / GAUGE_UNIT));
  if(!left) return '';
  var seg = '';
  for(var i=0;i<tot;i++) seg += '<i' + (i < left ? ' class="is-on"' : '') + '></i>';
  return ''
    + '<span class="pot-gauge" data-role="pot-gauge">'
    +   '<span class="gauge" aria-hidden="true">' + seg + '</span>'
    +   '<span class="pot-gauge-text">' + left + ' / ' + tot
    +     ' cours de 30 min restants</span>'
    + '</span>';
}

/* Lot 10, point du 19/10 : tout tient sans défilement. En tête, l'accès
   illimité (ou le compteur green-fee) et l'e-wallet ; dessous, les deux
   compteurs côte à côte ; puis les avoirs. Le rappel de validité passe en
   pied. */
/* Lot 11 (retour du 22/10) : l'e-wallet se présente comme une carte
   bancaire, en tête d'écran, avec son solde (comme une application de
   banque en ligne). Dessous, les crédits restants et les avoirs ; puis le
   récapitulatif des accès membre. L'écran défile de nouveau : la règle « sans
   défilement » du point du 19/10 cède devant cette demande. */
function eurosCents(n){
  var v = Math.round((n || 0) * 100) / 100;
  var parts = v.toFixed(2).split('.');
  return grouped(parts[0]) + ',' + parts[1] + ' €';

/* 29/10/2026, retour client : le joueur a deux e-wallets distincts, un pour

/* role : 'front' (devant, ouvre le détail), 'back' (derrière, passe devant),

function openPot(id){
  if(!potAvailable(id)) return false;
  STATE.wallet.potId = id;
  navigate('/wallet/pot');
  return true;
}

/* « Utiliser » ouvre le tunnel où ce crédit se dépense. Le portefeuille reste
   dans la pile : le retour y ramène. */
function usePot(id){
  var pot = potById(id);
  if(!pot || !pot.use) return false;
  if(pot.use === '/book/gf') return startGreenfee();
  navigate(pot.use);
  return true;
}

/* Entrer dans le tunnel d'achat repart d'un carnet non retenu : un choix fait
   sur un autre compteur n'a pas de sens ici. */
function startBuy(id){
  if(!potAvailable(id)) return false;
  clearWalletDraft();
  STATE.wallet.buyPotId = id;
  navigate('/wallet/buy');
  return true;
}

function pickPack(rank){
  var n = parseInt(rank, 10);
  if(!packAt(STATE.wallet.buyPotId, n)) return false;
  STATE.wallet.packIndex = n;
  refresh();
  return true;
}

/* Même état d'attente qu'au règlement d'un départ ou d'un cours : un paiement
   instantané ne montre pas l'état de chargement que le lot doit couvrir. */
function buyPack(){
  var w = STATE.wallet;
  if(w.paying) return false;
  var pack = pickedPack();
  if(!pack) return false;
  w.paying = true;
  refresh();
  window.setTimeout(function(){
    w.paying = false;
    w.moves.push({ pot:w.buyPotId, delta:pack.size, site:currentSite() });
    w.reference = makePurchaseReference();
    navigate('/wallet/buy/confirm');
  }, PAY_DELAY);
  return true;
}

/* Sortir du tunnel : le carnet est acheté, le brouillon n'a plus lieu d'être.
   Le solde, lui, reste — c'est tout l'objet de l'achat. */
function finishPurchase(){
  clearWalletDraft();
  setRoot('/wallet');
  return true;
}

/* --- Recharge d'un e-wallet — retour client du 29/10/2026 ----------------

   Les deux e-wallets se rechargent depuis l'app. Un seul écran : quel
   e-wallet, quel montant, avec quoi ; puis la confirmation avec le nouveau
   solde. On ne recharge pas un e-wallet avec un autre : carte enregistrée
   ou Apple Pay seulement. HYPOTHÈSE : montants proposés 20, 50, 100, 150 et
   200 euros, pas de montant libre. */
var TOPUP_VALUES = [20, 50, 100, 150, 200];
/* 29/10/2026 : montant personnalisé. HYPOTHÈSE : de 10 à 500 euros, en
   euros entiers. */
var TOPUP_MIN = 10, TOPUP_MAX = 500;
function topupCustomValue(raw){
  var s = String(raw || '').replace(/\s|€/g, '');
  if(!/^\d+$/.test(s)) return null;
  var n = parseInt(s, 10);
  return (n >= TOPUP_MIN && n <= TOPUP_MAX) ? n : null;
}

function topupBalance(kind){
  var p = profile();
  return (kind === 'resto' ? p.walletResto : p.wallet) || 0;
}
function topupName(kind){ return kind === 'resto' ? 'E-wallet restaurant' : 'E-wallet golf'; }

/* Sans e-wallet désigné, on recharge celui que la personne regarde : la
   carte au premier plan de la pile. */
function startTopup(kind){
  if(kind !== 'golf' && kind !== 'resto') kind = STATE.wallet.front === 'resto' ? 'resto' : 'golf';
  /* Lot 12 : un e-wallet bloqué ne se recharge pas dans l'app (HYPOTHÈSE). */
  if(ewalletBlocked(kind)) return false;
  STATE.wallet.topup = { kind:kind, value:null, method:mainCard() ? 'card' : 'applepay',
                         paying:false, reference:null, paid:0, mode:'preset', custom:'' };
  navigate('/wallet/topup');
  return true;
}
function setTopup(field, value){
  var t = STATE.wallet.topup;
  if(field === 'kind'){
    if(value !== 'golf' && value !== 'resto') return false;
    t.kind = value;
  } else if(field === 'value'){
    if(value === 'custom'){
      t.mode = 'custom';
      t.value = topupCustomValue(t.custom);
      refresh();
      window.setTimeout(function(){
        var f = document.getElementById('topup-custom');
        if(f && f.focus) f.focus();
      }, 30);
      return true;
    }
    var n = parseInt(value, 10);
    if(TOPUP_VALUES.indexOf(n) < 0) return false;
    t.mode = 'preset';
    t.value = n;
  } else if(field === 'method'){
    if(value === 'card' && !mainCard()) return false;
    if(value !== 'card' && value !== 'applepay') return false;
    t.method = value;
  } else return false;
  refresh();
  return true;
}
function topupMethodRow(id, title, line, on, disabled){
  return '<button type="button" class="payopt' + (on ? ' is-selected' : '') + '" '
       +   'data-act="topup-method" data-value="' + id + '" role="radio" '

       +   '<span class="payopt-body">'
       +     '<span class="payopt-title">' + title + '</span>'

       +   '</span>'
       + '</button>';
}

  var t = STATE.wallet.topup;
  var kinds = tableChip('topup-kind', 'golf', t.kind === 'golf',

  var customField = custom

  var card = mainCard();

    + topupMethodRow('applepay', 'Apple Pay', 'Validation sur votre téléphone.',
                     t.method === 'applepay', false);
  return ''
    + '<div class="stepbody">'
    +   '<h2 class="screen-title">Recharger un e-wallet</h2>'
    +   '<section class="section">'
    +     '<p class="eyebrow">Quel e-wallet&nbsp;?</p>'

    +     customField

    +   '</section>'
    + '</div>'
    + topupFoot();
}
function topupFoot(){
  var t = STATE.wallet.topup;
  var after = topupBalance(t.kind) + (t.value || 0);
  var ready = !!(t.value && t.method);
  var note = t.value

        : (t.mode === 'custom' ? 'Saisissez un montant pour continuer.'

function setTopupCustom(raw, input){

  var d = startOfToday();

function sinceParts(offset){
  var from = dateAt(offset), to = startOfToday();
  var m = (to.getFullYear() - from.getFullYear()) * 12 + to.getMonth() - from.getMonth();
  var anchor = new Date(from.getTime()); anchor.setMonth(from.getMonth() + m);
  if(anchor.getTime() > to.getTime()){

function addGiftCard(raw){
  var f = STATE.wallet.gift;
  if(raw !== undefined && raw !== null) f.code = String(raw);
  var typed = String(f.code || '').trim();
  var code = normalizeGiftCode(typed);
  var known = false;
  for(var i=0;i<STATE.wallet.gifts.length;i++){ if(STATE.wallet.gifts[i].code === code) known = true; }
  f.error = null;
  if(!typed) f.error = 'Saisissez le code de la carte cadeau, au format RGC-XXXX-XXXX.';
  else if(!code) f.error = 'Ce code n\'a pas le bon format : il compte huit lettres ou chiffres après RGC, au format RGC-XXXX-XXXX.';
  else if(known) f.error = (GIFT_CARDS[code] && GIFT_CARDS[code].type === 'coffret')
    ? 'Ce coffret est déjà dans votre wallet.' : 'Cette carte cadeau est déjà dans votre wallet.';
  else if(!GIFT_CARDS[code]) f.error = 'Ce code ne correspond à aucune carte cadeau ni à aucun coffret. Vérifiez-le sur le bon ou dans l\'e-mail reçu, puis saisissez-le de nouveau.';
  else {
    /* Lot 12b : un bon consommé ou expiré ne s'ajoute pas. */
    var gm = GIFT_CARDS[code], gs = giftState(code, gm.balance), box = gm.type === 'coffret';
    if(gs === 'used'){
      f.error = box
        ? 'Ce coffret a déjà été utilisé : ses prestations ont été servies, il ne peut plus être ajouté à votre wallet.'
        : 'Cette carte cadeau a déjà été utilisée jusqu\'au dernier euro : elle ne peut plus être ajoutée à votre wallet.';
    } else if(gs === 'expired'){
      f.error = (box ? 'Ce coffret a expiré le ' : 'Cette carte cadeau a expiré le ') + giftUntilText(code)
              + ' : ' + (box ? 'il ne peut plus être ajouté ni utilisé' : 'elle ne peut plus être ajoutée ni utilisée')
              + '. L\'accueil du golf peut étudier une prolongation.';
    }
  }
  if(f.error){ refresh(); return false; }
  var gmeta = GIFT_CARDS[code];
  STATE.wallet.gifts.push(gmeta.type === 'coffret'
    ? { code:code, type:'coffret', init:null, balance:null }
    : { code:code, type:'carte', init:gmeta.init, balance:gmeta.balance });
  f.done = code;
  f.code = '';
  refresh();
  return true;
}

/* --- Practice : un seau de balles seul, sans horaire ------------------------

   Retour du 29/10. Le seau se prend sur le carnet de seaux s'il en reste
   (comme l'option du départ, lot 10) ; sinon il s'achète à l'unité, au prix
   de l'option « Seau de balles » (5 €, booking engine v3). Le seau est
   chargé sur le compte : le QR code du joueur le délivre à la machine à
   balles. HYPOTHÈSE : pas de date limite de retrait ; un seau à la fois. */
function bucketPrice(){
  for(var i=0;i<GF_OPTIONS.length;i++){ if(GF_OPTIONS[i].id === 'bucket') return GF_OPTIONS[i].price; }
  return 5;
}
function practiceFromPot(){ return (potValue('buckets') || 0) > 0; }
function practicePickText(){
  var n = potValue('buckets') || 0;
  return n > 0 ? 'Un seau de balles, pris sur votre carnet (' + potAmountLabel('buckets', n) + ')'
               : 'Un seau de balles à l\'unité, sans horaire';
}
function clearPractice(){
  STATE.wallet.practice = { method:null, sheet:null, paying:false, reference:null, paid:0, used:null };
}
function startPractice(){
  clearPractice();
  navigate('/book/practice');
  return true;
}
function practiceChoices(){
  if(practiceFromPot()) return [];
  var price = bucketPrice(), out = [];
  var w = profile().wallet || 0;
  if(w > 0 && !ewalletBlocked('golf')){
    out.push({ id:'wallet', walletFrom:w, walletTo:w - price, disabled:w < price, cash:price });
  }
  var gc = giftChoice(price);
  if(gc) out.push(gc);
  out.push({ id:'card', cash:price });
  out.push({ id:'applepay', cash:price });
  return out;
}
function practiceChosen(){
  var list = practiceChoices();
  for(var i=0;i<list.length;i++){ if(list[i].id === STATE.wallet.practice.method) return list[i]; }
  return null;
}
function pickPracticePay(id){
  var list = practiceChoices();
  for(var i=0;i<list.length;i++){
    if(list[i].id !== id || list[i].disabled) continue;
    STATE.wallet.practice.method = id;
    STATE.wallet.practice.sheet = null;
    refresh();
    return true;
  }
  return false;
}
function closePracticeSheet(){
  STATE.wallet.practice.sheet = null;
  refresh();
  return true;
}
function screenPractice(){

    +   '<p class="screen-text">Sans horaire : le seau est chargé sur votre compte, vous le retirez '
    +     'à la machine à balles ' + atSite(site) + ' avec votre QR code.</p>'

    +     '<span class="irow-ic">' + icon('bucket') + '</span>'
    +     '<span class="irow-body"><span class="irow-t">Seau de balles</span>'

    +   '</div></div>'

    + (p.sheet === 'pay' ? paySheet(practiceChoices(), p.method, 'practice', 'practice-pay-pick') : '')

    +     '<span class="total-value" data-role="total">' + (pot ? 'Rien à payer' : amount(bucketPrice())) + '</span></p>'
    +   (ready ? '' : '<p class="total-note">Choisissez un moyen de paiement pour continuer.</p>')
    +   primaryButton('practice-book', 'Réserver ce seau', !ready, p.paying)
    + '</div>';
}
function bookPractice(){
  var p = STATE.wallet.practice;
  if(p.paying) return false;
  var pot = practiceFromPot();
  if(!pot && !practiceChosen()) return false;
  p.paying = true;
  refresh();
  window.setTimeout(function(){
    p.paying = false;
    p.reference = 'PRA-' + (Math.floor(draw('pra' + STATE.persona + STATE.siteCode + STATE.wallet.ready) * 90000) + 10000);
    var price = bucketPrice();
    if(pot){
      STATE.wallet.moves.push({ pot:'buckets', delta:-1, site:currentSite(), kind:'consommation' });
      p.used = 'pot'; p.paid = 0;
    } else {
      p.used = p.method; p.paid = price;
      if(p.method === 'wallet'){
        profile().wallet = Math.max(0, (profile().wallet || 0) - price);
        logEwallet('golf', -price, 'Seau de balles au practice', 'Dans l\'app');
      }
      if(p.method === 'gift') useGift(price);
    }
    STATE.wallet.ready += 1;
    navigate('/book/practice/confirm');
  }, PAY_DELAY);
  return true;
}

  if(p.used === 'wallet') return amount(p.paid) + ' avec votre e-wallet golf';
  if(p.used === 'gift') return amount(p.paid) + ' avec votre carte cadeau';
  if(p.used === 'applepay') return amount(p.paid) + ' avec Apple Pay';
  return amount(p.paid) + ' par carte';

/* --- Bandeau d'état système ----------------------------------------------

   Deux cas, et un seul bandeau. La permission jamais demandée est une
   invitation ; la permission coupée est une panne que l'application ne peut
   pas réparer — elle dit où aller, elle ne propose pas un interrupteur
   qu'elle n'a pas. Le centre continue de recevoir dans les deux cas : ce qui
   manque, c'est l'annonce sur le téléphone, pas le message. */
function pushBanner(){
  if(pushGranted()) return '';

  if(pushBlocked()){
    return ''
      + '<div class="sysbanner is-off" data-role="sysbanner" data-state="off">'
      +   '<span class="sysbanner-ic">' + icon('bell-off') + '</span>'

      +   '</div>'
      +   '<button type="button" class="sysbanner-btn" data-nav="/notifications/system">Voir</button>'
      + '</div>';
  }

  return ''
    /* Retour du 22/10 : bandeau ramené à une ligne, action en pastille. */
    + '<div class="sysbanner" data-role="sysbanner" data-state="ask">'
    +   '<span class="sysbanner-ic">' + icon('bell') + '</span>'
    +   '<div class="sysbanner-body">'
    +     '<p class="sysbanner-title">Activez les notifications</p>'

    + '</div>';
}
