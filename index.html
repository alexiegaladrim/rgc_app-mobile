}

/* Boîte vide : une invitation à agir, pas un constat (brief §3). Ce qu'il y a
   à faire ici n'est pas de recevoir un message, c'est de choisir lesquels. */
function notifEmpty(){
  return ''
    + '<div class="notif-empty" data-role="notif-empty">'
    +   icon('bell')
    +   '<p class="notif-empty-title">Rien de neuf</p>'
    +   '<p class="notif-empty-text">Vos rappels de départ, vos alertes de crédits '
    +     'et les travaux annoncés sur vos parcours arriveront ici.</p>'
    +   '<button type="button" class="btn is-quiet" data-nav="/notifications/prefs">'
    +     'Choisir vos notifications</button>'
    + '</div>';
}

function screenNotifs(){
  var groups = notifGroups();
  if(!groups.length) return pushBanner() + notifEmpty();

  var html = pushBanner();
  for(var g=0;g<groups.length;g++){
    var group = groups[g];
    var rows = '';
    for(var i=0;i<group.items.length;i++) rows += notifRow(group.items[i]);
    html += '<section class="section" data-role="notif-group" '
          +   'data-group="' + group.id + '">'
          +   '<p class="eyebrow">' + group.label + '</p>'
          +   '<div class="notifs">' + rows + '</div>'
          + '</section>';
  }
  return html;
}

/* --- Les préférences ------------------------------------------------------

   Opt-in par type et par canal (RGPD, brief lot 5). Une cellule par
   croisement : trois colonnes de 44 px, la cible tactile fixe la largeur
   avant le confort de lecture. Le SMS n'est ouvert que sur les deux rappels
   de dernière minute ; ailleurs la cellule porte un tiret, et le pied de
   liste dit pourquoi. */

function prefCell(type, channel){
  if(!channelOpen(type, channel)){
    return '<span class="pref-void" data-role="pref-void" aria-hidden="true">'
         + '\u2014</span>';
  }
  var on = notifPrefOn(type.id, channel);
  var editable = channelEditable(type, channel);
  return ''
    + '<button type="button" class="pref-box' + (on ? ' is-on' : '') + '" '
    +   'data-act="pref" data-value="' + type.id + ':' + channel + '" '
    +   'data-role="pref-box" role="checkbox" aria-checked="' + (on ? 'true' : 'false') + '" '
    +   (editable ? '' : 'disabled aria-disabled="true" ')
    +   'aria-label="' + escapeAttr(type.label) + ', ' + channelLabel(channel) + '">'
    +   '<span>' + icon('check') + '</span>'
    + '</button>';
}

/* Lot 10 : le canal des messages courts porte le nom de la messagerie
   choisie, SMS ou WhatsApp. L'identifiant reste 'sms'. */
var MESSENGERS = [{ id:'sms', label:'SMS' }, { id:'whatsapp', label:'WhatsApp' }];
function messengerLabel(){
  return STATE.notifs.messenger === 'whatsapp' ? 'WhatsApp' : 'SMS';
}
function setMessenger(id){
  if(id !== 'sms' && id !== 'whatsapp') return false;
  if(STATE.notifs.messenger === id) return false;
  STATE.notifs.messenger = id;
  refresh();
  return true;
}
function messengerPicker(){
  var html = '<div class="party" data-role="messenger">'
           + '<span class="party-label">Rappels et places libérées par</span>'
           + '<div class="party-choices is-text" role="radiogroup" aria-label="Messagerie">';
  for(var i=0;i<MESSENGERS.length;i++){
    var on = (STATE.notifs.messenger || 'sms') === MESSENGERS[i].id;
    html += '<button type="button" class="party-choice' + (on ? ' is-on' : '') + '" '
          +   'data-act="messenger" data-value="' + MESSENGERS[i].id + '" role="radio" '
          +   'aria-checked="' + (on ? 'true' : 'false') + '">' + MESSENGERS[i].label + '</button>';
  }
  return html + '</div></div>';
}

function channelLabel(id){
  if(id === 'sms') return messengerLabel();
  for(var i=0;i<NOTIF_CHANNELS.length;i++){
    if(NOTIF_CHANNELS[i].id === id) return NOTIF_CHANNELS[i].label;
  }
  return id;
}

function screenNotifPrefs(){
  var head = '<div class="pref-head"><span>Message</span>';
  for(var c=0;c<NOTIF_CHANNELS.length;c++){
    head += '<span>' + channelLabel(NOTIF_CHANNELS[c].id) + '</span>';
  }
  head += '</div>';

  var rows = '';
  for(var i=0;i<NOTIF_TYPES.length;i++){
    var type = NOTIF_TYPES[i];
    var cells = '';
    for(var k=0;k<NOTIF_CHANNELS.length;k++){
      cells += prefCell(type, NOTIF_CHANNELS[k].id);
    }
    rows += '<div class="pref-row" data-role="pref-row" data-type="' + type.id + '">'
          +   '<span class="pref-label">'
          +     '<span class="pref-name">' + type.label + '</span>'
          +     '<span class="pref-when">' + type.when + '</span>'
          +   '</span>'
          +   cells
          + '</div>';
  }

  return ''
    + '<h2 class="screen-title">Ce que vous recevez</h2>'
    + '<p class="screen-text">Chaque type de message se règle canal par canal. '
    +   'Rien n\'est envoyé sur un canal que vous n\'avez pas ouvert.</p>'
    + '<section class="section">' + pushBanner() + '</section>'
    + messengerPicker()
    + '<div class="prefs" data-role="prefs" role="group" '
    +   'aria-label="Vos notifications, par type et par canal">'
    +   head + rows
    + '</div>'
    + '<p class="prefs-foot" data-role="sms-note">Le ' + messengerLabel()
    +   ' est réservé aux rappels, 24 h avant un départ ou une séance, et aux '
    +   'places libérées. Les confirmations, modifications et annulations partent '
    +   'toujours par e-mail.</p>'
    + '<p class="prefs-foot">Vous pouvez revenir sur ces choix à tout moment. '
    +   'Ils valent pour tous les golfs de la collection.</p>';
}

/* --- Amorce de permission -------------------------------------------------

   Elle passe avant la demande du système : demander à froid fait chuter le
   taux d'acceptation (brief lot 5). L'écran dit ce que le joueur va recevoir,
   avec les mêmes mots que les messages eux-mêmes, puis ouvre la boîte de
   dialogue du téléphone.

   Il reste atteignable une fois la réponse donnée : il dit alors ce qu'il en
   est, et où aller ensuite. Un écran qui disparaît après usage laisse le
   joueur sans explication s'il y revient. */

function primerItems(){
  var items = [
    { icon:'golf',        text:'Votre départ, 24 h avant.' },
    { icon:'clock-hour-4', text:'Votre cours de demain, avec le téléphone du pro.' },
    { icon:'ticket',      text:'Vos crédits quand ils arrivent au bout ou qu\'ils expirent.' },
    { icon:'traffic-cone', text:'Les travaux annoncés sur les parcours du groupe.' }
  ];
  var html = '<ul class="primer-list" data-role="primer-list">';
  for(var i=0;i<items.length;i++){
    html += '<li>' + icon(items[i].icon) + '<span>' + items[i].text + '</span></li>';
  }
  return html + '</ul>';
}

/* Boîte de dialogue du système. Elle n'appartient pas à l'application : pas de
   marque, pas de fermeture au voile, deux réponses définitives. C'est la seule
   feuille du prototype qui ne se referme pas d'un toucher à côté. */
function systemDialog(){
  if(!STATE.notifs.dialog) return '';
  return ''
    + '<div class="sysalert" data-role="sysalert">'
    +   '<div class="sysalert-card" role="alertdialog" aria-modal="true" '
    +     'aria-label="Demande d\'autorisation du système">'
    +     '<div class="sysalert-body">'
    +       '<p class="sysalert-title">« Resonance Golf Collection » souhaite vous '
    +         'envoyer des notifications</p>'
    +       '<p class="sysalert-text">Elles peuvent comprendre des alertes, des sons '
    +         'et des pastilles. Vous pourrez les modifier dans les Réglages.</p>'
    +     '</div>'
    +     '<div class="sysalert-actions">'
    +       '<button type="button" class="sysalert-btn" data-act="push-refuse">'
    +         'Ne pas autoriser</button>'
    +       '<button type="button" class="sysalert-btn is-strong" data-act="push-allow">'
    +         'Autoriser</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';
}

function screenPushPrimer(){
  if(pushGranted()){
    return ''
      + '<div class="card">'
      +   '<div class="card-mark">' + icon('circle-check') + '</div>'
      +   '<h2 class="screen-title">Les notifications sont activées</h2>'
      +   '<p class="screen-text">Vos rappels et vos alertes s\'annoncent maintenant '
      +     'sur cet appareil. Le détail se règle type par type.</p>'
      +   '<button type="button" class="btn is-primary" '
      +     'data-nav="/notifications/prefs">Choisir vos notifications</button>'
      + '</div>';
  }

  if(pushBlocked()){
    return ''
      + '<div class="card">'
      +   '<div class="card-mark">' + icon('bell-off') + '</div>'
      +   '<h2 class="screen-title">Les notifications sont coupées</h2>'
      +   '<p class="screen-text">Votre téléphone ne les annonce plus. Elles ne se '
      +     'redemandent pas depuis l\'application : elles se rétablissent dans les '
      +     'réglages de l\'appareil.</p>'
      +   '<button type="button" class="btn is-primary" '
      +     'data-nav="/notifications/system">Voir la marche à suivre</button>'
      + '</div>';
  }

  return ''
    + '<div class="card">'
    +   '<div class="card-mark">' + icon('bell') + '</div>'
    +   '<h2 class="screen-title">Ne manquez pas votre départ</h2>'
    +   '<p class="screen-text">Nous vous prévenons de ce qui vous concerne, et de '
    +     'rien d\'autre. Quatre messages, pas une lettre d\'information.</p>'
    +   primerItems()
    +   '<button type="button" class="btn is-primary" data-act="push-ask">'
    +     'Activer les notifications</button>'
    +   '<button type="button" class="btn is-quiet" data-act="push-later">'
    +     'Plus tard</button>'
    +   '<p class="prefs-foot">Vous réglerez ensuite le détail, type par type et '
    +     'canal par canal.</p>'
    + '</div>'
    + systemDialog();
}

/* --- Notifications coupées au niveau du système ---------------------------

   Le seul écran du prototype dont l'action sort de l'application. Le bouton
   rend compte de son effet plutôt que de ne rien faire, comme « Au
   calendrier » et « Partager » au lot 2b : un bouton sans effet visible se lit
   comme une panne. */
function screenSystemOff(){
  var steps = [
    'Ouvrez les <b>Réglages</b> de votre téléphone.',
    'Descendez jusqu\'à <b>Resonance Golf Collection</b>.',
    'Touchez <b>Notifications</b>.',
    'Activez <b>Autoriser les notifications</b>.'
  ];
  var list = '<ol class="steps" data-role="steps">';
  for(var i=0;i<steps.length;i++) list += '<li>' + steps[i] + '</li>';
  list += '</ol>';

  return ''
    + '<div class="card">'
    +   '<div class="card-mark">' + icon('bell-off') + '</div>'
    +   '<h2 class="screen-title">Réactiver les notifications</h2>'
    +   '<p class="screen-text">Une fois refusées, les notifications ne se '
    +     'redemandent plus depuis l\'application. Elles se rétablissent en quatre '
    +     'gestes, dans les réglages de l\'appareil.</p>'
    +   list
    +   '<button type="button" class="btn is-primary" data-act="open-settings">'
    +     'Ouvrir les réglages</button>'
    +   (STATE.notifs.opened
       ? '<p class="done" data-role="settings-done">' + icon('external-link')
         + '<span>Réglages du téléphone ouverts sur la fiche de '
         + 'l\'application.</span></p>'
       : '')
    +   '<p class="prefs-foot">En attendant, vos messages restent lisibles dans '
    +     'l\'application : c\'est leur annonce sur le téléphone qui est coupée, '
    +     'pas leur envoi.</p>'
    + '</div>';
}

/* --- Actions du lot ------------------------------------------------------- */

/* « Plus tard » referme l'amorce. Ouverte depuis le centre, elle se referme
   par le retour ; ouverte à la racine — une adresse tapée à la main — il n'y a
   rien derrière, et le bouton mène au centre plutôt que de ne rien faire. */
function pushLater(){
  if(stackDepth() > 1) return back();
  return navigate('/notifications');
}

/* Le renvoi vers les réglages du téléphone n'a pas de cible dans un
   prototype : il rend compte, plutôt que de ne rien faire. */
function openPhoneSettings(){
  STATE.notifs.opened = true;
  refresh();
  return true;
}

function togglePref(value){
  var parts = String(value).split(':');
  if(parts.length !== 2) return false;
  if(!toggleNotifPref(parts[0], parts[1])) return false;
  refresh();
  return true;
}

/* =========================================================================
   6h. Profil — lot 6
   ========================================================================= */

/* --- Portrait. Même principe que les placeholders du lot 1 et du lot 3 :
       dégradé sourd aux couleurs des tokens, aucune image externe. Les
       initiales par-dessus disent que ce n'est pas une photographie. --- */
function avatarPhoto(key){
  return ''
    + '<svg class="photo" viewBox="0 0 88 88" preserveAspectRatio="none" '
    +   'role="img" aria-label="Portrait stylisé">'
    +   '<defs><linearGradient id="avatar-' + key + '" x1="0" y1="0" x2="1" y2="1">'
    +     '<stop offset="0" class="sky"></stop><stop offset="1" class="dusk"></stop>'
    +   '</linearGradient></defs>'
    +   '<rect width="88" height="88" fill="url(#avatar-' + key + ')"></rect>'
    + '</svg>';
}

function accountAvatar(key){
  /* Retour du 22/10 : photo de profil facultative. Elle reste en mémoire,
     le temps de la démonstration. */
  var photoUrl = accountPhoto();
  var inner = photoUrl
    ? '<span class="avatar-img" style="background-image:url(\'' + photoUrl + '\')"></span>'
    : avatarPhoto(key) + '<span class="avatar-initials" aria-hidden="true">' + accountInitials() + '</span>';
  if(key !== 'big') return '<span class="avatar">' + inner + '</span>';
  return '<span class="avatar">' + inner
       + '<label class="avatar-edit" data-role="avatar-edit" aria-label="'
       +   (photoUrl ? 'Changer la photo de profil' : 'Ajouter une photo de profil') + '">'
       +   icon(photoUrl ? 'pencil' : 'camera')
       +   '<input type="file" accept="image/*" data-afield="photo" class="visually-hidden">'
       + '</label></span>'
       + (photoUrl ? '<button type="button" class="linkbtn avatar-drop" data-act="photo-drop">Retirer la photo</button>' : '');
}
/* Photo de Claire Dumas fournie par Alexie le 22/10 ; Sophie n'en a pas. */
var PERSONA_PHOTOS = { passion:'assets/claire-dumas.jpg' };
function accountPhoto(){
  if(STATE.account.photo !== undefined) return STATE.account.photo;
  return PERSONA_PHOTOS[STATE.persona] || null;
}
function photoAv(cls, fallback){
  var u = accountPhoto();
  return u ? '<span class="' + cls + ' has-photo" style="background-image:url(\'' + u + '\')" aria-hidden="true"></span>'
           : '<span class="' + cls + '" aria-hidden="true">' + fallback + '</span>';
}
function setAccountPhoto(input){
  var f = input.files && input.files[0];
  if(!f || typeof FileReader === 'undefined') return false;
  var r = new FileReader();
  r.onload = function(){ STATE.account.photo = r.result; refresh(); };
  r.readAsDataURL(f);
  return true;
}

/* Les deux pastilles de tête : ce que le joueur est, et ce qui lui manque.
   Le membre Passion porte son abonnement, tout le monde porte son index — ou
   son absence, qui est la seule chose à corriger depuis cet écran. */
/* Une seule pastille, et seulement pour ce que la carte est seule à dire :
   l'abonnement. L'index vit sur l'entrée « Licence et index », qui le porte
   déjà en valeur — l'écrire aux deux endroits, à quinze lignes d'écart, était
   le doublon de libellé que chaque lot depuis le 2b a rencontré. Sans licence,
   aucune pastille non plus : l'entrée porte l'alerte, et elle a la place de
   dire quoi faire. */
/* Lot 9d : le statut s'écrit en texte simple, non cliquable, avec son
   libellé propre au profil — il remplace la pastille d'abonnement du lot 6
   (booking engine v3, retours du 24/09). En tête du profil, la date de fin
   de cotisation est explicite ; à J-30, le nombre de jours s'y ajoute. */
function identStatus(){
  return '<p class="ident-status" data-role="status">' + statusText() + '</p>';
}
function identEnd(){
  if(!isPassion()) return '';
  var soon = membershipSoon();
  return '<p class="ident-end' + (soon ? ' is-soon' : '') + '" data-role="cotis-end">'
       +   'Cotisation valable jusqu\'au <b>' + membershipEnd() + '</b>'
       +   (soon ? ' &middot; expire dans ' + daysText(profile().membership.daysLeft) : '')
       + '</p>';
}

/* En-tête du profil — « Mon espace » du booking engine v3 (19/10/2026) :
   initiales sur fond encre, surtitre, « Bonjour » en grand titre, statut en
   texte simple, échéance de la cotisation et « Renouveler » à J-30. Il garde
   les repères du lot 6 (`ident`, `status`, `cotis-end`). */
function spaceHeader(){
  var p = profile();
  var end = identEnd();
  if(end && membershipSoon()){
    end = end.replace('</p>', '<button type="button" class="space-renew" '
        + 'data-nav="/profile/membership">Renouveler</button></p>');
  }
  return ''
    + '<div class="space" data-role="ident">'
    +   '<span class="space-av" aria-hidden="true">' + initials(p) + '</span>'
    +   '<div class="space-body">'
    +     '<p class="eyebrow">Mon espace</p>'
    +     '<p class="space-hello">Bonjour <b>' + p.firstName + '</b></p>'
    +     identStatus()
    +     end
    +   '</div>'
    + '</div>';
}

function identCard(large){
  /* La ligne dit la conséquence quand la licence manque, et non l'absence
     elle-même : l'entrée du profil la dit déjà. */
  var meta = hasLicence()
    ? 'Licence ' + licenceNumber() + ' &middot; ' + licenceClub()
    : 'Vos départs sont calculés au tarif visiteur';
  return ''
    + '<div class="ident' + (large ? ' is-large' : '') + '" data-role="ident">'
    +   accountAvatar(large ? 'big' : 'small')
    +   '<div class="ident-body">'
    +     '<p class="ident-name">' + accountName() + '</p>'
    +     identStatus()
    +     '<p class="ident-meta">' + meta + '</p>'
    +     (large ? '' : identEnd())
    +   '</div>'
    + '</div>';
}

/* Compte rendu du dernier geste. Il vit sous le contenu de l'écran qui l'a
   produit, et disparaît au geste suivant : deux comptes rendus à l'écran ne se
   rapportent plus à rien. */
function accountDoneLine(){
  if(!STATE.account.done) return '';
  return '<p class="done" data-role="account-done">' + icon('circle-check')
       + '<span>' + STATE.account.done + '</span></p>';
}

/* --- La racine du profil --------------------------------------------------

   Une entrée par rubrique du brief, chacune portant sa valeur courante : la
   valeur évite d'ouvrir l'écran pour savoir ce qu'il contient. Les rubriques
   sont rangées en deux temps — ce que le club sait de vous, puis ce que vous
   réglez. */

function accountPick(entry){
  return ''
    + '<button type="button" class="pick" '
    +   (entry.tab ? 'data-tab="' + entry.tab + '" ' : 'data-nav="' + entry.to + '" ')
    +   'data-role="account-pick" data-entry="' + entry.id + '">'
    +   '<span class="pick-mark">' + icon(entry.icon) + '</span>'
    +   '<span class="pick-body">'
    +     '<span class="pick-title">' + entry.title + '</span>'
    +     '<span class="pick-text">' + entry.text + '</span>'
    +   '</span>'
    +   (entry.flag ? '<span class="pick-flag" data-role="pick-flag"></span>' : '')
    +   (entry.value
       ? '<span class="pick-value">' + entry.value + '</span>'
       : '')
    +   '<i class="ti ti-chevron-right pick-chevron" aria-hidden="true"></i>'
    + '</button>';
}

/* Lot 9d : la rubrique devient « Statut et tarifs », comme l'onglet du
   booking engine v3. Sa valeur ne répète pas l'échéance, désormais écrite en
   tête du profil ; la pastille d'alerte reste, et suit aussi la licence. */
function membershipPick(){
  if(isPassion()){
    return { id:'membership', to:'/profile/membership', icon:'infinity',
             title:'Statut et tarifs',
             text:'Cotisation, licence, grille des tarifs',
             value:null,
             flag:membershipSoon() || licenceSoon() };
  }
  return { id:'membership', to:'/profile/membership', icon:'infinity',
           title:'Statut et tarifs',
           text:'Licence, grille des tarifs, abonnement',
           value:'Sans abonnement', flag:licenceSoon() };
}

/* Lot 11 (retour du 22/10) : la carte membre seule en tête (l'en-tête
   « Mon espace » disparaît), puis le menu de « Mon espace » du booking
   engine v3, dans son ordre et avec ses libellés : Réservations, Carnets &
   avoirs, Statut & tarifs, Mes proches, Mes informations, Mon année. Les
   réglages propres à l'application suivent. */
var YEAR_NOW = 2026;
function screenProfile(){
  var card = mainCard();
  var relatives = STATE.account.relatives.length;
  var p = profile();
  var up = gfViews().length + tableItems().length;
  var lessons = lessonBookings();
  for(var u=0;u<lessons.length;u++){
    if(!lessonIsPast(lessons[u]) && !lessonIsCancelled(lessons[u])) up += 1;
  }
  var mem = membershipPick();
  mem.title = 'Statut &amp; tarifs';
  var espace = [
    { id:'bookings', tab:'bookings', icon:'calendar-event', title:'Réservations',
      text:'À venir et passées, listes d\'attente', value:up + ' à venir', flag:false },
    { id:'carnets', tab:'wallet', icon:'wallet', title:'Carnets &amp; avoirs',
      text:'E-wallets golf et restaurant, crédits, avoirs', value:euros(p.wallet || 0), flag:false },
    mem,
    { id:'relatives', to:'/profile/relatives', icon:'users', title:'Mes proches',
      text:'Proposés quand vous composez un départ',
      value:relatives + (relatives > 1 ? ' joueurs' : ' joueur'), flag:false },
    { id:'identity', to:'/profile/identity', icon:'user', title:'Mes informations',
      text:'Coordonnées, licence et index, documents',
      value:null, flag:!hasLicence() || medicalState() === 'expired' },
    { id:'year', to:'/profile/year', icon:'chart-bar', title:'Mon année ' + YEAR_NOW,
      text:'Vos parties, vos parcours, vos partenaires', value:null, flag:false }
  ];
  var settings = [
    { id:'cards', to:'/profile/cards', icon:'credit-card',
      title:'Moyens de paiement', text:'Vos cartes enregistrées',
      value:card ? '\u2022\u2022\u2022\u2022 ' + card.last4 : 'Aucune carte', flag:!card },
    { id:'consents', to:'/profile/consents', icon:'checkbox',
      title:'Consentements', text:'Communications et partage de données',
      value:consentsOnCount() + ' sur ' + CONSENTS.length, flag:false },
    { id:'site', to:'/profile/site', icon:'map-pin',
      title:'Site de rattachement', text:'Il ouvre votre accueil',
      value:currentSite().name, flag:false }
  ];
  var renew = (isPassion() && membershipSoon())
    ? '<button type="button" class="btn is-quiet mcard-renew space-renew" '
      + 'data-nav="/profile/membership">Renouveler ma cotisation</button>'
    : '';
  var html = '<div data-role="ident">' + memberCard('full') + '</div>' + renew
    + '<section class="section"><p class="eyebrow">Mon espace</p>';
  for(var i=0;i<espace.length;i++) html += accountPick(espace[i]);

/* QR de démonstration : 21 × 21 modules tirés du numéro de licence, avec
   les trois repères d'angle d'un vrai code. Il ne se lit pas : il montre la
   place et la taille du code présenté au starter, comme dans v3. */
function qrSvg(seed){
  var n = 21, cells = '', rnd = mulberry32(seedFrom('qr' + seed));
  function finder(x, y){
    return '<rect x="' + x + '" y="' + y + '" width="7" height="7"/>'
         + '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" class="qr-gap"/>'
         + '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>';
  }
  function inFinder(x, y){
    return (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
  }
  for(var y=0;y<n;y++){
    for(var x=0;x<n;x++){
      if(!inFinder(x, y) && rnd() < 0.48){
        cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
      }
    }
  }
  return '<svg class="qr" viewBox="0 0 ' + n + ' ' + n + '" aria-hidden="true" '
       + 'shape-rendering="crispEdges">' + finder(0, 0) + finder(n - 7, 0)
       + finder(0, n - 7) + cells + '</svg>';
}

/* Carte de membre — reprise de l'onglet « Statut & tarifs » du booking
   engine v3 (19/10/2026) : fond encre, logo, golf, nom, échéance, statut,
   licence et index, et un QR à présenter. L'échéance de la cotisation y est
   écrite, comme dans v3 ; le licencié externe y lit celle de sa licence.
   Sous l'en-tête du profil, qui porte déjà le statut et l'échéance, la carte
   ne les répète pas (`bare`) : une information à un seul endroit. */

  var end = isPassion()

       : '');
  /* Lot 11 (retour du 22/10) : sur le profil, la carte porte seule ce que
     disait l'en-tête « Mon espace » (statut, échéance de la cotisation). */
  if(bare === 'full'){
    var soon = isPassion() && membershipSoon();
    end = isPassion()
      ? '<p class="mcard-end' + (soon ? ' is-soon' : '') + '" data-role="cotis-end">'
        + 'Cotisation valable jusqu\'au <b>' + membershipEnd() + '</b>'
        + (soon ? ' &middot; expire dans ' + daysText(profile().membership.daysLeft) : '')
        + '</p>'
      : end;
    bare = false;
  }
  return ''
    + '<div class="mcard" data-role="member-card">'
    +   '<div class="mcard-top">' + brandLogo()
    +     '<span>' + currentSite().name + '</span></div>'
    +   '<p class="mcard-name">' + accountName() + '</p>'

    +   '<div class="mcard-foot">'
    +     '<p>' + (hasLicence()
            ? 'Licence n\u00b0 ' + licenceNumber() + '<br>Index ' + licenceIndex()
            : 'Vos départs sont calculés au tarif visiteur') + '</p>'
    /* Lot 12b (30/10) : le QR de la carte s'ouvre en plein écran, la même
       vue que depuis l'accueil (/qr). */
    +     '<button type="button" class="mcard-qr" data-nav="/qr" data-role="mcard-qr" '
    +       'aria-label="Afficher mon QR code">' + qrSvg(myQrSeed()) + '</button>'
    +   '</div>'
    + '</div>';
}

/* Grille des tarifs. Un tableau par saison, les saisons en segments ; la
   bascule semaine / week-end ; chaque parcours regroupe ses formules. Trois
   colonnes étroites, lisibles à 390 px sans défilement horizontal. */
function tariffGrid(){
  var t = STATE.account.tariff;
  var site = tariffSite();
  var season = tariffSeason();
  var now = seasonNow();
  var weekend = (t.day === 'weekend');

  var seasons = [];
  for(var s=0;s<SEASONS.length;s++) seasons.push([SEASONS[s].id, SEASONS[s].label]);

  var options = '';
  for(var o=0;o<SITES.length;o++){
    options += '<option value="' + SITES[o].code + '"'
             + (SITES[o].code === site.code ? ' selected' : '') + '>'
             + SITES[o].name + '</option>';
  }

  var rows = '';
  var anyOff = false;
  for(var ci=0;ci<site.courses.length;ci++){
    var course = site.courses[ci];
    rows += '<tr class="tgrid-course"><th colspan="3" scope="colgroup">'
          + course.name + '</th></tr>';
    var forms = courseFormulas(course);
    for(var k=0;k<forms.length;k++){
      var x = gridPrice(site, ci, forms[k], season, weekend);
      if(x.mine < x.pub) anyOff = true;
      rows += '<tr data-role="tariff-row" data-holes="' + forms[k] + '">'
            +   '<th scope="row" class="tgrid-f">' + forms[k] + ' trous</th>'
            +   '<td class="r" data-role="tariff-pub">' + (x.mine < x.pub
                  ? '<s>' + amount(x.pub) + '</s>' : amount(x.pub)) + '</td>'
            +   '<td class="r" data-role="tariff-mine"><b>' + (x.mine === 0
                  ? 'Inclus' : amount(x.mine)) + '</b></td>'
            + '</tr>';
    }
  }

  var note;
  if(passCoversSite(site)){
    note = 'Votre abonnement inclut les départs de ce golf, en toute saison.';
  } else if(isPassion()){
    note = 'Hors périmètre de votre abonnement : le tarif licencié s\'applique.';
  } else if(!hasLicence()){
    note = 'Sans licence au dossier, vous jouez au prix public. Le tarif '
         + 'licencié s\'applique dès que votre licence est reconnue.';
  } else {
    note = 'Votre prix en gras, prix public barré.';
  }

  return ''
    + '<section class="section" data-role="tariffs" data-season="' + season.id + '" '
    +   'data-day="' + t.day + '">'
    +   '<p class="eyebrow">Vos green-fees, par saison</p>'
    +   '<p class="tariff-rule" data-role="tariff-rule">Le tarif le plus avantageux '
    +     'est appliqué.</p>'
    +   '<div class="form-row">'
    +     '<label class="form-label" for="tariff-site">Golf</label>'
    +     '<select class="input" id="tariff-site" data-tsite="1">' + options + '</select>'
    +   '</div>'
    +   tariffTabs('tariff-season', seasons, season.id, 'Saison')
    +   tariffTabs('tariff-day', [['week', 'En semaine'], ['weekend', 'Le week-end']],
                   t.day, 'Jour de la semaine')
    +   '<p class="tariff-season" data-role="tariff-season">' + season.name
    +     (season.id === now.id ? ', en cours' : '') + ' &middot; ' + season.months + '</p>'
    +   '<div class="tcard"><table class="tgrid">'
    +     '<colgroup><col class="tgrid-c1"><col><col></colgroup>'
    +     '<thead><tr><th scope="col">Formule</th><th scope="col" class="r">Prix public</th>'
    +       '<th scope="col" class="r">Votre prix</th></tr></thead>'
    +     '<tbody>' + rows + '</tbody>'
    +   '</table></div>'
    +   '<p class="prefs-foot" data-role="tariff-note">' + note + '</p>'
    +   '<p class="prefs-foot">Prix de référence. Sur la feuille de départs, le prix '

/* --- Mon année — lot 11 ---------------------------------------------------

   Repris de « Mon année 2026 » du booking engine v3 (retour du 28/09,
   « façon récapitulatif annuel ») pour que le menu du profil soit celui de
   v3. Chiffres fictifs et déterministes, comme dans v3 : en production ils
   viennent de l'historique des réservations et de l'index FFGolf. */
var YEAR_SHORT = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct'];
var YEAR_MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.'];
function yearStats(){
  var passion = isPassion();
  var base = [5,4,6,8,9,11,12,10,9,7];
  var months = [];
  var n = 0;
  for(var i=0;i<base.length;i++){
    var v = Math.max(1, base[i] + Math.floor(draw('ym' + STATE.persona + i) * 5) - 2 - (passion ? 0 : 3));
    months.push(v); n += v;
  }
  var site = currentSite();
  var crs = [];
  var shares = [0.48, 0.34, 0.18];
  for(var c=0;c<site.courses.length && c<3;c++){
    crs.push({ name:site.courses[c].name, n:Math.round(n * shares[c]) });
  }
  crs.sort(function(a, b){ return b.n - a.n; });
  var rel = STATE.account.relatives;
  var mates = [];
  for(var r=0;r<rel.length && r<3;r++){
    mates.push({ name:playerName(rel[r]), ini:initials(rel[r]),
                 n:Math.max(2, Math.round(n * (0.42 - r * 0.11))) });
  }
  var nine = Math.round(n * 0.18);
  var idx = hasLicence() ? parseFloat(String(licenceIndex()).replace(',', '.')) : null;
  return {
    months:months, n:n, crs:crs, mates:mates,
    holes:(n - nine) * 18 + nine * 9,
    hours:Math.round((n - nine) * 4.3 + nine * 2.2),
    early:draw('ye' + STATE.persona) < 0.5 ? '8 h 10' : '9 h 20',
    idxFrom:idx === null ? null : Math.round((idx + 1.8) * 10) / 10,
    idxTo:idx,
    lessons:1 + Math.floor(draw('yl' + STATE.persona) * 4),
    saved:Math.round(n * (passion ? 78 : 26))
  };
}
function fidx(v){ return String(v).replace('.', ','); }
function screenYear(){

  }
  var top = y.crs[0];

    +     (top ? '<div><b>' + top.name + '</b><span>votre parcours préféré &middot; ' + top.n + ' parties</span></div>' : '')
    +     (y.idxTo !== null ? '<div><b>' + fidx(y.idxFrom) + ' &rarr; ' + fidx(y.idxTo) + '</b><span>votre index depuis janvier</span></div>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="ycard"><h3>Parties par mois</h3>'
    +   '<p>Votre record&nbsp;: ' + YEAR_MONTHS[best] + ', ' + max + ' parties.</p>'
    +   '<div class="ychart" role="img" aria-label="Parties jouées par mois">' + bars + '</div></div>'
    + (mates
       ? '<div class="ycard"><h3>Vos partenaires de jeu</h3>'
         + '<p>Vous avez partagé le plus de départs avec ' + escapeAttr(y.mates[0].name.split(' ')[0]) + '.</p>'
         + mates + '</div>'
       : '')
    + '<div class="ytiles">'
    +   '<div class="ytile"><b>' + y.early + '</b><span>votre heure de départ la plus fréquente</span></div>'
    +   '<div class="ytile"><b>' + y.lessons + '</b><span>cours avec un pro</span></div>'

    + '</div>';

  return null;

function compDate(cp){ return dateAt(cp.day); }
function compMinutes(cp){ return minutesOf(cp.h); }
function compFull(cp){ return cp.taken >= cp.cap; }

/* Âge le jour de l'épreuve. */
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function birthDate(text){
  if(!text) return null;
  var iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
  if(iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
  var p = String(text).toLowerCase().split(' ');
  var m = MOIS_FR.indexOf(p[1]);
  return m < 0 ? null : new Date(+p[2], m, +p[0]);
}
function compAge(birth, date){
  if(!birth) return null;
  var a = date.getFullYear() - birth.getFullYear();
  if(date.getMonth() < birth.getMonth()
     || (date.getMonth() === birth.getMonth() && date.getDate() < birth.getDate())) a -= 1;
  return a;
}

/* Prix : droit de jeu + green-fee du jour. L'abonné ne paie que le droit de
   jeu sur les parcours de son abonnement (booking engine v3). */
function compPrice(cp, partner){
  var site = siteByCode(cp.site);
  var pub = slotBasePrice(site, cp.ci, cp.day, compMinutes(cp), 'plein');
  var gf = partner ? pub : (passCoversSite(site) ? 0 : (hasLicence() ? pub : visitorPrice(pub)));
  return { dj:cp.dj, gf:gf, gfPub:pub, p:cp.dj + gf };
}

/* Conditions, vérifiées pour chaque joueur, comme dans v3 : licence,
   certificat médical valable le jour J, index, âge. Chaque refus dit
   pourquoi, et comment le lever quand c'est possible. */
function compChecks(cp, who){
  var date = compDate(cp);
  var self = !who;
  var lic = self ? hasLicence() : !!who.lic;
  var idx = self ? (hasLicence() ? parseFloat(String(licenceIndex()).replace(',', '.')) : null) : who.idx;
  var birth = self ? birthDate(profile().birth) : birthDate(who.birth);
  var out = [];
  out.push(lic
    ? { ok:true, n:'Licence FFGolf ' + YEAR_NOW + ' valide', d:'N° ' + (self ? licenceNumber() : who.lic) }
    : { ok:false, n:'Aucune licence FFGolf', d:'Une licence de l\'année est obligatoire pour toute compétition fédérale.',
        fix:self ? '/profile/licence' : null, fixN:'Ajouter ma licence' });
  if(lic && self){
    var ok = medicalState() !== 'expired' && medicalDays() >= cp.day;
    out.push(ok
      ? { ok:true, n:'Certificat médical valable le jour J', d:'Il couvre la date de l\'épreuve.' }
      : { ok:false, n:'Certificat médical à renouveler', d:'Il doit couvrir la date de la compétition (' + longDateOf(date) + ').',
          fix:'/profile/licence', fixN:'Déposer un certificat' });
  }
  if(idx !== null && idx !== undefined){
    out.push(idx <= cp.idxMax
      ? { ok:true, n:'Index ' + fmtIdx(idx) + ', limite ' + fmtIdx(cp.idxMax), d:'Index relevé à la FFGolf ce matin.' }
      : { ok:false, n:'Index ' + fmtIdx(idx) + ' supérieur à la limite de ' + fmtIdx(cp.idxMax),
          d:'L\'inscription n\'est pas possible. Elle le redeviendra si l\'index descend sous '
            + fmtIdx(cp.idxMax) + ' avant la clôture du ' + compCloseLabel(cp) + '.' });
  }
  var age = compAge(birth, date);
  if(cp.minAge && age !== null){
    out.push({ ok:age >= cp.minAge, n:'Réservée aux ' + cp.minAge + ' ans et plus', d:age + ' ans le jour de l\'épreuve.' });
  }
  if(cp.maxAge && age !== null){
    out.push({ ok:age <= cp.maxAge, n:'Réservée aux moins de ' + (cp.maxAge + 1) + ' ans', d:age + ' ans le jour de l\'épreuve.' });
  }
  return out;
}
function checksOk(list){ for(var i=0;i<list.length;i++){ if(!list[i].ok) return false; } return true; }
function firstKo(list){ for(var i=0;i<list.length;i++){ if(!list[i].ok) return list[i]; } return null; }

function compBooking(cp){
  var list = STATE.account.bookings;
  for(var i=0;i<list.length;i++){ if(list[i].kind === 'comp' && list[i].compId === cp.id) return list[i]; }
  return null;
}

function compList(){
  var c = compState();
  var home = currentSite();
  var out = [];
  for(var i=0;i<COMPS.length;i++){
    var cp = COMPS[i];
    var site = siteByCode(cp.site);
    if(c.scope === 'site' && cp.site !== home.code) continue;
    if(c.scope === 'region' && site.region !== home.region) continue;
    if(c.fk !== 'all' && cp.fk !== c.fk) continue;
    if(c.mine && !checksOk(compChecks(cp))) continue;
    out.push(cp);
  }
  out.sort(function(a, b){ return a.day - b.day; });
  return out;
}

function compCta(cp){

  if(compClosed(cp)) return '<span class="cmp-state is-off">Inscriptions closes</span>';
  var ko = firstKo(compChecks(cp));
  return '<button type="button" class="btn ' + (ko || compFull(cp) ? 'is-quiet' : 'is-primary') + '" '
       +   'data-act="comp-open" data-value="' + cp.id + '">'

function openComp(id){
  if(!compById(id)) return false;
  var c = compState();
  c.id = id; c.partner = null; c.solo = false; c.opts = {}; c.pref = 'indiff'; c.pay = null;
  c.msg = ''; c.searchError = null;
  var cur = currentEntry();
  if(cur && cur.path === '/book/comp/inscr') refresh();
  else navigate('/book/comp/inscr');
  return true;
}
function setCompFilter(key, value){
  var c = compState();
  if(key === 'mine') c.mine = !c.mine; else c[key] = value;
  refresh();
  return true;
}
function setCompField(key, value){
  var c = compState();
  if(key === 'solo'){ c.solo = (value === '1'); if(c.solo) c.partner = null; }
  else c[key] = value;
  refresh();
  return true;
}
function pickCompPartner(relId){
  var rel = relativeById(relId);
  if(!rel) return false;
  var c = compState();
  c.partner = partnerFromRel(rel);
  c.solo = false;
  refresh();
  return true;
}
function searchCompPartner(){
  var c = compState();
  var field = document.getElementById('compLic');
  var v = field ? String(field.value || '').replace(/\s+/g, '') : '';
  if(!/^\d{9}$/.test(v)){
    c.searchError = 'Une licence compte 9 chiffres.';
    refresh();
    return false;
  }
  var known = null;
  for(var i=0;i<FFG_DIRECTORY.length;i++){ if(FFG_DIRECTORY[i].licence === v) known = FFG_DIRECTORY[i]; }
  /* Démo du booking engine v3 : 123456789 donne un licencié d'index 38. */
  var name = known ? known.firstName + ' ' + known.lastName : (v === '123456789' ? 'Julien Morel' : 'Licencié·e n° ' + v);
  var info = COMP_PEOPLE[name] || {};
  c.partner = { name:name, ini:known ? (known.firstName.charAt(0) + known.lastName.charAt(0)) : (v === '123456789' ? 'JM' : 'FF'),
                lic:v, idx:info.idx !== undefined ? info.idx : (v === '123456789' ? 38 : 20),
                birth:info.birth || null, relation:null };
  c.searchError = null;
  refresh();
  return true;
}
function setCompOpt(id, delta){
  var c = compState();
  var op = null;
  for(var i=0;i<COMP_OPTS.length;i++){ if(COMP_OPTS[i].id === id) op = COMP_OPTS[i]; }
  if(!op) return false;
  var q = Math.max(0, Math.min(op.max || 1, (c.opts[id] || 0) + delta));
  c.opts[id] = q;
  refresh();
  return true;
}
function submitComp(){
  var c = compState();
  var cp = compById(c.id);
  if(!cp || compBooking(cp) || compClosed(cp)) return false;
  var full = compFull(cp);
  var msg = document.getElementById('compMsg');
  if(msg) c.msg = msg.value;
  STATE.account.seq += 1;
  var sum = compLines(cp);
  var pos = full ? (cp.wait || 0) + 1 : null;
  if(full) cp.wait = pos; else cp.taken += cp.team && c.partner ? 2 : 1;
  var item = { kind:'comp', id:'CMP-' + cp.site + '-' + (200 + STATE.account.seq), compId:cp.id,
               siteCode:cp.site, offset:cp.day, minutes:compMinutes(cp), wait:pos,
               amount:full ? 0 : sum.total, partner:c.partner ? c.partner.name : (c.solo ? 'attribué par le club' : null),
               pay:full ? null : c.pay };
  STATE.account.bookings.push(item);
  c.last = item.id;
  navigate('/book/comp/confirm');
  return true;
}

   courriel parmi les cibles, pour ne pas laisser croire à un ajout par

function systemShare(){
  var targets = [['messages', 'message-circle', 'Messages'],
                 ['whatsapp', 'brand-whatsapp', 'WhatsApp'],
                 ['copy', 'copy', 'Copier']];
  var apps = '';
  for(var i=0;i<targets.length;i++){
    apps += '<button type="button" class="sysshare-app" data-act="share-pick" '
          +   'data-value="' + targets[i][0] + '">'
          +   '<span class="sysshare-icon">' + icon(targets[i][1]) + '</span>'
          +   '<span>' + targets[i][2] + '</span></button>';
  }

   Six écrans navigables et non fonctionnels : e-shop, e-wallet, inscriptions

   un lecteur d'écran, sans quoi la ligne s'annoncerait sans sa colonne de

/* --- Listes d'attente green-fee -------------------------------------------

   Un départ complet reste affiché sur la feuille (point du 20/10) : il
   donne accès à la liste d'attente. Rien n'est réservé ni débité ; le
   joueur est prévenu si une place se libère, sur le canal qu'il a choisi. */
function gfWaitKey(siteCode, ci, offset, minutes){
  return siteCode + '|' + ci + '|' + offset + '|' + (minutes === null ? 'day' : minutes);
}
function gfWaitHas(key){ return !!STATE.account.gfWait[key]; }
function askGfWait(value){
  var d = STATE.draft;
  if(!d.siteCode || d.courseIndex === null || d.dayOffset === null) return false;
  var minutes = (value === 'day') ? null : parseInt(value, 10);
  if(value !== 'day' && isNaN(minutes)) return false;
  var key = gfWaitKey(d.siteCode, d.courseIndex, d.dayOffset, minutes);
  if(gfWaitHas(key)) return false;
  STATE.account.gfWait[key] = {
    siteCode:d.siteCode, courseIndex:d.courseIndex, offset:d.dayOffset,
    minutes:minutes, party:d.party
  };
  refresh();
  return true;
}
/* Lot 11 : la grille montre tous les parcours ; le créneau complet dit le
   sien. */
function askGfWaitCourse(value){
  var parts = String(value || '').split('|');
  var ci = parseInt(parts[0], 10);
  var site = draftSite();
  if(!site || isNaN(ci) || !site.courses[ci]) return false;
  STATE.draft.courseIndex = ci;
  return askGfWait(parts[1]);
}
function groupGo(){
  var d = STATE.draft;
  if(!isGroup() || placedCount() < d.party) return false;
  d.courseIndex = d.flights[0].ci;
  d.slotKey = d.flights[0].key;
  d.players = [];
  navigate('/book/gf/players');
  return true;
}
function toggleGfMore(ci){
  var d = STATE.draft;
  d.more = d.more || {};
  d.more[ci] = !d.more[ci];
  refresh();
  return true;
}
function quitGfWait(key){
  if(!gfWaitHas(key)) return false;
  delete STATE.account.gfWait[key];
  refresh();
  return true;
}
function gfWaitEntries(){
  var out = [];
  var w = STATE.account.gfWait;
  for(var key in w){
    if(!Object.prototype.hasOwnProperty.call(w, key) || !w[key]) continue;
    var e = w[key];
    var site = siteByCode(e.siteCode);
    if(!site) continue;
    out.push({ key:key, site:site, course:site.courses[e.courseIndex],
               offset:e.offset, minutes:e.minutes, party:e.party });
  }
  out.sort(function(a, b){
    return (a.offset - b.offset) || ((a.minutes || 0) - (b.minutes || 0));
  });
  return out;
}
function siteByCode(code){
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) return SITES[i]; }
  return null;
}

/* Le départ de démonstration (piloté par la barre de contrôle), les départs
   et les tables réservés pendant la démonstration, les cours. Une seule
   liste, triée par date. */
function demoGfView(){
  var b = nextBooking();
  if(!b) return null;
  var p = profile();
  var site = currentSite();
  var course = site.courses[p.booking.courseIndex] || site.courses[0];
  /* La date de la carte d'accueil porte l'heure courante : le tri et le
     détail prennent l'heure du départ. */
  var date = new Date(b.date.getTime());
  if(!b.soon) date.setHours(Math.floor(minutesOf(b.time) / 60), minutesOf(b.time) % 60, 0, 0);
  return {
    id:'demo', date:date, time:b.time, site:site, course:course,
    players:b.players + (b.players > 1 ? ' joueurs' : ' joueur'),
    count:b.players, payment:b.payment, options:null, table:null,
    others:null, ref:site.code + '-' + Math.floor(draw('demo-ref' + site.code) * 90000 + 10000),
    soon:b.soon, minutesAway:b.minutesAway
  };
}
function gfViewOf(item){
  var site = siteByCode(item.siteCode);
  var date = dateAt(item.offset);
  date.setHours(Math.floor(item.minutes / 60), item.minutes % 60, 0, 0);
  return {
    id:item.id, date:date, time:hhmm(item.minutes), site:site,
    course:site.courses[item.courseIndex], players:item.players.join(', '),
    count:item.players.length, payment:item.payment, options:item.options,
    table:item.table, others:item.others, link:item.link || null,
    lines:item.lines || null,
    ref:item.id, soon:false
  };
}
function gfViews(){
  var out = [];
  var demo = demoGfView();
  if(demo) out.push(demo);
  var list = STATE.account.bookings;
  for(var i=0;i<list.length;i++){
    if(list[i].kind === 'gf') out.push(gfViewOf(list[i]));
  }
  return out;
}
function gfViewById(id){
  var list = gfViews();
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}

  var tables = tableItems();
  for(var t=0;t<tables.length;t++){

    rows.push({ at:td.getTime(), html:tableRow(tables[t]) });
  }
  var bk = STATE.account.bookings;
  for(var cb=0;cb<bk.length;cb++){

    rows.push({ at:cd.getTime(), html:compRow(bk[cb]) });

  var lessons = lessonBookings();

    ld.setHours(Math.floor(b.minutes / 60), b.minutes % 60, 0, 0);

  rows.sort(function(a, b){ return a.at - b.at; });
  var upcoming = '';
  for(var r=0;r<rows.length;r++) upcoming += rows[r].html;

  /* Lot 11 (retour du 22/10) : onglets en tête, À venir et Passées, comme
     dans « Mon espace » du booking engine v3. */
  var tab = STATE.account.bookTab === 'past' ? 'past' : 'up';

           + '<p class="screen-text">Vos départs et vos cours joués se retrouveront ici, '
           +   'avec leur reçu.</p>'
           + '<button type="button" class="btn is-primary" data-act="gf-start">Réserver un départ</button>'
           + '</div>')

  var body = upcoming
    ? '<div class="blist" data-role="bookings">' + upcoming + '</div>'
    : '<div class="stepempty" data-role="bookings-empty">'
      +   '<h3 class="screen-title">Aucune réservation à venir</h3>'
      +   '<p class="screen-text">Réservez un départ, un cours ou une table&nbsp;: '
      +     'tout ce que vous réservez se retrouve ici.</p>'
      +   '<button type="button" class="btn is-primary" data-act="gf-start">'
      +     'Réserver un départ</button>'
      + '</div>';

  return tabs
    + waitBox(true)
    + '<section class="section">'

/* --- Gestion d'une réservation — lot 11 -----------------------------------

   Retour d'Alexie du 22/10 : la carte du prochain départ ouvre les infos de
   la réservation, sur le modèle du lien de paiement (paiement/index.html) :
   trois onglets, Paiement, Joueurs, La partie (lot 12 : Départ, Joueurs,
   Paiement).

   Chaque joueur porte son montant et son état : réglé, lien envoyé, à
   régler à l'accueil. Départ de Claire : celui du booking engine v3 (La
   Forêt, Paul Dumas a réglé 59 €, une voiturette avec l'abonnement).
   HYPOTHÈSE pour Sophie : ses deux partenaires au tarif licencié du
   créneau, Claire a réglé par le lien, Bernard pas encore. */
function hubLine(name, ini, me, sub, price, state, note){
  return { name:name, ini:ini, me:me, sub:sub, price:price, state:state, note:note };
}
function hubOf(v){
  var p = profile();
  var rel = STATE.account.relatives;
  var players = [];
  var options = v.options;
  if(v.id === 'demo'){
    if(isPassion()){
      players.push(hubLine(p.firstName + ' ' + p.lastName, initials(p), true,
                           statusLabels()[0], 0, 'ok', 'Inclus'));
      var mate = rel[0];
      if(mate && v.count > 1){
        players.push(hubLine(playerName(mate), initials(mate), false, relationOf(mate),
                             59, 'ok', 'Réglé par lien'));
      }
      options = '1 voiturette, avec votre abonnement';
    } else {
      var base = slotBasePrice(v.site, courseIndexOf(v), offsetOf(v.date),
                               minutesOf(v.time), 'plein');
      players.push(hubLine(p.firstName + ' ' + p.lastName, initials(p), true,
                           statusLabels()[0], base, 'ok', 'Réglé par carte'));
      for(var i=0;i<rel.length && players.length < v.count;i++){
        players.push(hubLine(playerName(rel[i]), initials(rel[i]), false, relationOf(rel[i]),
                             base, players.length === 1 ? 'ok' : 'due',
                             players.length === 1 ? 'Réglé par lien' : 'Lien envoyé'));
      }
    }
  } else {
    var lines = v.lines || [];
    for(var k=0;k<lines.length;k++){
      var l = lines[k];
      players.push(hubLine(l.name, l.ini, k === 0, l.sub, l.price,
        l.payer === 'link' ? 'due' : (l.payer === 'desk' ? 'desk' : 'ok'),
        l.payer === 'link' ? 'Lien envoyé'
          : (l.payer === 'desk' ? 'À l\'accueil' : (!l.price ? 'Inclus' : (k > 0 ? 'Réglé par vous' : 'Réglé')))));
    }
  }
  var extras = gfExtraLines(v.id);
  var total = 0, paid = 0;
  for(var j=0;j<players.length;j++){
    total += players[j].price;
    if(players[j].state === 'ok') paid += players[j].price;
  }
  for(var e=0;e<extras.length;e++) total += extras[e].price;
  return { players:players, options:options, extras:extras,
           total:total, paid:paid, due:total - paid };
}

/* Options ajoutées après la réservation : elles se règlent à l'accueil.
   HYPOTHÈSE : pas de paiement en ligne d'une option ajoutée après coup. */
function gfExtraLines(id){
  var x = STATE.account.gfExtras[id] || {};
  var out = [];
  for(var i=0;i<GF_OPTIONS.length;i++){
    var o = GF_OPTIONS[i];
    if(x[o.id]) out.push({ option:o, qty:x[o.id], price:x[o.id] * o.price });
  }
  return out;
}
function addGfExtra(optId){
  var id = STATE.account.openGf;

  for(var i=0;i<GF_OPTIONS.length;i++){ if(GF_OPTIONS[i].id === optId) known = true; }
  if(!known) return false;
  var x = STATE.account.gfExtras[id] || (STATE.account.gfExtras[id] = {});
  x[optId] = (x[optId] || 0) + 1;
  STATE.account.done = 'Option ajoutée à votre départ, à régler à l\'accueil.';
  refresh();
  return true;

function tableDateField(){
  var t = STATE.table;
  return '<div class="sbar" data-role="table-date">'
       +   '<button type="button" class="sbar-row" data-act="table-cal" data-role="table-date-field" '

             + '<p class="datepanel-foot"><span>Réservation jusqu\'à deux mois à l\'avance</span>'
             + '<button type="button" class="linkbtn" data-act="table-cal">Fermer</button></p></div>' : '')
       + '</div>';
}
function tableMonth(){
  var t = STATE.table;
  var shift = t.calShift || 0;
  var base = startOfToday();
  var first = new Date(base.getFullYear(), base.getMonth() + shift, 1);
  var lead = (first.getDay() + 6) % 7;
  var count = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  var html = '<div class="month"><div class="month-head">'
    + '<button type="button" class="month-nav" data-act="table-month" data-value="-1"' + (shift <= 0 ? ' disabled' : '')
    +   ' aria-label="Mois précédent">' + icon('chevron-left') + '</button>'
    + '<p class="month-title">' + capitalize(MOIS[first.getMonth()].toLowerCase()) + ' ' + first.getFullYear() + '</p>'
    + '<button type="button" class="month-nav" data-act="table-month" data-value="1"' + (shift >= 2 ? ' disabled' : '')
    +   ' aria-label="Mois suivant">' + icon('chevron-right') + '</button>'
    + '</div><div class="month-grid">';
  for(var w=0;w<7;w++) html += '<span class="month-dow">' + DOW_LUNDI[w] + '</span>';
  for(var v=0;v<lead;v++) html += '<span class="month-cell is-void"></span>';
  for(var n=1;n<=count;n++){
    var o = offsetOf(new Date(first.getFullYear(), first.getMonth(), n));
    var ok = o >= 0 && o < TABLE_DAYS;
    html += '<button type="button" class="month-cell' + (t.offset === o ? ' is-selected' : '') + '" '
          +   'data-act="table-day" data-value="' + o + '" role="radio" aria-checked="' + (t.offset === o) + '"'
          +   (ok ? '' : ' disabled aria-disabled="true"') + ' aria-label="' + longDate(o) + '">' + n + '</button>';
  }
  return html + '</div></div>';
}
function toggleTableCal(){ STATE.table.calOpen = !STATE.table.calOpen; refresh(); return true; }
function shiftTableMonth(n){
  var t = STATE.table;
  t.calShift = Math.max(0, Math.min(2, (t.calShift || 0) + parseInt(n, 10)));
  refresh();
  return true;
}

function setTableValue(kind, value){
  var t = STATE.table;
  if(kind === 'day'){
    var o = parseInt(value, 10);
    if(isNaN(o) || o < 0 || o >= TABLE_DAYS) return false;
    t.offset = o;
    t.calOpen = false;
  } else if(kind === 'seats'){
    var n = parseInt(value, 10);
    if(isNaN(n) || n < 1 || n > TABLE_SEATS_MAX) return false;
    t.seats = n;
  } else if(kind === 'time'){
    if(!/^\d\d:\d\d$/.test(String(value))) return false;
    t.time = value;
  } else return false;
  refresh();
  return true;
}
function minutesOf(hm){
  var p = String(hm).split(':');
  return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
}
function bookTable(){
  var t = STATE.table;
  if(!t.time) return false;
  var site = currentSite();
  var a = STATE.account;
  a.seq += 1;
  var id = 'TBL-' + site.code + '-' + (100 + a.seq);
  a.bookings.push({ kind:'table', id:id, siteCode:site.code, offset:t.offset,
                    minutes:minutesOf(t.time), seats:t.seats, pending:false });
  t.done = id;
  refresh();
  return true;
}

/* Résumé du brouillon de réservation, pour le lecteur d'état et les tests. */
function draftReadout(){
  var d = STATE.draft;
  if(!d.siteCode) return 'vide';
  var site = draftSite();
  var out = site ? site.code : '-';
  if(d.courseIndex !== null && site) out += ' / ' + site.courses[d.courseIndex].name;
  if(d.dayOffset !== null) out += ' / J+' + d.dayOffset;
  if(d.slotKey) out += ' / ' + d.slotKey;
  if(d.players.length) out += ' / ' + d.players.length + 'j';
  if(d.payment) out += ' / ' + d.payment;
  if(d.reference) out += ' / ' + d.reference;
  return out;
}

/* Résumé du brouillon de cours, pour le lecteur d'état et les tests. */
function lessonReadout(){
  var l = STATE.lesson;
  if(!l.mode) return 'vide';
  var out = l.mode;
  if(l.proId) out += ' / ' + l.proId;
  if(l.mode === 'solo') out += ' / ' + durationById(l.durationId).label;
  if(l.dayOffset !== null) out += ' / J+' + l.dayOffset;
  if(l.slotKey) out += ' / ' + l.slotKey;
  if(l.sessionId) out += ' / ' + l.sessionId;
  if(l.payment) out += ' / ' + l.payment;
  if(l.reference) out += ' / ' + l.reference;
  return out;
}

/* Soldes des compteurs visibles et brouillon d'achat, pour le lecteur d'état
   et les tests. */
function walletReadout(){
  var list = visiblePots();
  var out = [];
  for(var i=0;i<list.length;i++){
    out.push(list[i].id + ' ' + potShort(list[i].id, potValue(list[i].id)));
  }
  var w = STATE.wallet;
  if(w.buyPotId){
    var pack = pickedPack();
    out.push('achat ' + w.buyPotId + (pack ? ' / ' + pack.size : ''));
  }
  if(w.reference) out.push(w.reference);
  return out.join(' &middot; ');
}

/* Toute bascule de la barre de contrôle réinitialise l'état applicatif
   et ramène à l'accueil, sans recharger la page. Le brouillon du tunnel en
   fait partie : un départ retenu sous un persona n'a pas de sens sous
   l'autre, les tarifs et le périmètre ne sont pas les mêmes. */
function resetApp(){
  STATE.resets += 1;
  clearDraft();
  clearLesson();
  clearWallet();
  clearNotifs();
  clearAccount();
  setRoot('/home');
  renderPanel();
}

  if(id !== 'passion' && id !== 'externe') return false;
  if(STATE.persona === id) return false;
  STATE.persona = id;

}

function setPassionScope(scope){
  if(scope !== 'mono' && scope !== 'region') return false;
  if(!isPassion()) return false;

  STATE.version = v;

function setSite(code){

  STATE.siteCode = code;

  if(!Object.prototype.hasOwnProperty.call(GF_CREDIT_DEMO, v)) return false;
  if(isPassion()) return false;
  if(STATE.demoCredits === v) return false;
  STATE.demoCredits = v;
  resetApp();
  return true;
}

/* Solde du carnet de cours. Contrairement aux crédits green-fee, il vaut pour
   les deux personas : le membre Passion a lui aussi un carnet de cours. */
function setDemoLessons(v){
  if(!Object.prototype.hasOwnProperty.call(LESSON_CREDIT_DEMO, v)) return false;
  if(STATE.demoLessons === v) return false;
  STATE.demoLessons = v;
  resetApp();
  return true;
}

/* Certificat médical. Comme les autres réglages, il vaut pour les deux
   personas : un licencié externe joue les compétitions au même titre qu'un
   membre. */
function setDemoMedical(v){
  if(!Object.prototype.hasOwnProperty.call(MED_DEMO, v)) return false;
  if(STATE.demoMedical === v) return false;

}

/* Échéance de la licence, lot 9d. Comme le certificat, elle vaut pour les
   deux personas, dès que la licence est au dossier. */
function setDemoLicenceEnd(v){
  if(v !== 'valid' && v !== 'soon') return false;
  if(STATE.demoLicenceEnd === v) return false;

}

function setDemoMembershipEnd(v){
  if(v !== 'valid' && v !== 'soon') return false;
  if(!isPassion()) return false;
  if(STATE.demoMembershipEnd === v) return false;
  STATE.demoMembershipEnd = v;
  resetApp();
  return true;
}

/* Autorisation système. Comme les autres réglages de la barre de contrôle,
   la changer réinitialise l'état applicatif : les lectures et les choix de
   notification appartiennent au compte, pas à l'appareil. */
function setPushState(v){
  if(v !== 'ask' && v !== 'on' && v !== 'off') return false;
  if(STATE.pushState === v) return false;
  STATE.pushState = v;
  resetApp();
  return true;
}

function setDemoNotifs(v){
  if(v !== 'real' && v !== 'none') return false;

  return true;
}

function setLicenceOnFile(v){
  if(v !== 'on' && v !== 'off') return false;
  if(isPassion()) return false;
  var next = (v === 'on');
  if(STATE.licenceOnFile === next) return false;
  STATE.licenceOnFile = next;
  resetApp();
  return true;
}

function resetData(){
  STATE.demoBooking = 'later';
  STATE.licenceOnFile = true;
  STATE.demoCredits = 'full';
  STATE.demoLessons = 'profile';
  STATE.demoMedical = 'valid';
  STATE.demoLicenceEnd = 'valid';
  STATE.demoMembershipEnd = 'valid';
  STATE.pushState = 'ask';
  STATE.demoNotifs = 'real';
  resetApp();
  return true;
}

    /* 29/10 : montant personnalisé de la recharge. */
    if(e.target.getAttribute('data-topup')){ setTopupCustom(e.target.value, e.target); return; }
    /* Lot 12 : code de carte cadeau, sans rendu à la frappe. */
    if(e.target.getAttribute('data-gift')){ setGiftCode(e.target.value); return; }
    var field = e.target.getAttribute('data-field');
    if(field){ setGuestField(field, e.target.value); return; }
    /* Les champs du profil (lot 6) n'entraînent pas de rendu : redessiner à
       chaque frappe ferait perdre le curseur. */
    var afield = e.target.getAttribute('data-afield');
    if(afield) setAccountField(afield, e.target.value);
    /* Lot 9e : changer d'indicatif change l'exemple du numéro. Une liste ne
       porte pas de curseur, elle peut se redessiner. */
    if(afield === 'cc') refresh();
  });

     suivre la liste des indicatifs (booking engine v3, bindTel). */
  device.addEventListener('change', function(e){

/* Retour par balayage depuis le bord gauche — convention native (brief §2). */
function bindSwipeBack(device){
  if(typeof window.PointerEvent !== 'function') return;
  var dragging = false;
  var startX = 0;
  var top = null;
  var below = null;

  device.addEventListener('pointerdown', function(e){
    if(e.clientX === undefined) return;
    var rect = device.getBoundingClientRect();
    if(e.clientX - rect.left > 24) return;
    if(STATE.stack.length < 2) return;
    var here = currentEntry();
    if(here && here.route.terminal) return;
    dragging = true;
    startX = e.clientX;
    top = currentEntry().el;
    below = STATE.stack[STATE.stack.length - 2].el;
    below.hidden = false;
    applyScroll(below, STATE.stack[STATE.stack.length - 2].scroll);
    top.classList.add('is-dragging');
    below.classList.add('is-dragging', 'is-behind');
  });

  device.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = Math.max(0, e.clientX - startX);
    var ratio = Math.min(1, dx / 260);
    top.style.transform = 'translateX(' + dx + 'px)';
    below.style.transform = 'translateX(' + (-24 + 24 * ratio) + '%)';
    below.style.opacity = String(0.55 + 0.45 * ratio);
  });

  var end = function(e){
    if(!dragging) return;
    dragging = false;
    var dx = Math.max(0, (e.clientX || 0) - startX);
    top.classList.remove('is-dragging');
    below.classList.remove('is-dragging');
    top.style.transform = '';
    below.style.transform = '';
    below.style.opacity = '';
    if(dx > 80){ back(); }
    else { below.classList.remove('is-behind'); below.hidden = true; }
  };

  device.addEventListener('pointerup', end);
  device.addEventListener('pointercancel', end);
}

function bindPanel(){
  var panel = node('panel');

  panel.addEventListener('click', function(e){
    var target = e.target;
    if(!target || typeof target.closest !== 'function') return;
    var btn = target.closest('[data-control]');
    if(!btn || btn.disabled || btn.tagName === 'SELECT') return;
    var control = btn.getAttribute('data-control');
    var value = btn.getAttribute('data-value');
    if(control === 'persona') setPersona(value);
    else if(control === 'scope') setPassionScope(value);
    else if(control === 'version') setVersion(value);
    else if(control === 'booking') setDemoBooking(value);
    else if(control === 'licence') setLicenceOnFile(value);
    else if(control === 'credits') setDemoCredits(value);
    else if(control === 'lessons') setDemoLessons(value);
    else if(control === 'medical') setDemoMedical(value);
    else if(control === 'licend') setDemoLicenceEnd(value);
    else if(control === 'cotisend') setDemoMembershipEnd(value);
    else if(control === 'push') setPushState(value);
    else if(control === 'notifs') setDemoNotifs(value);
    else if(control === 'pushopen') openFromPush();
    else if(control === 'reset') resetData();
  });

  panel.addEventListener('change', function(e){
    if(e.target && e.target.getAttribute && e.target.getAttribute('data-control') === 'site'){
      setSite(e.target.value);
    }
  });
}

/* =========================================================================
   9. Amorçage
   ========================================================================= */

function boot(){
  /* Le compte part du référentiel avant le premier rendu : `resetApp()` le
     refait à chaque bascule, mais l'amorçage ne passe pas par lui. */
  clearAccount();
  renderPanel();
  bindDevice();
  bindPanel();
  window.addEventListener('hashchange', onHashChange);

  var start = pathFromHash();
  if(!ROUTES[start]) start = '/home';
  setRoot(start);
  renderPanel();
}

boot();
