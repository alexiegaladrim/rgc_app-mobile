<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance Golf Collection — Prototype application client</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
/* =========================================================================
   1. Tokens — seul bloc du fichier autorisé à contenir des valeurs
      hexadécimales. Toute couleur ailleurs passe par var(--token).
   ========================================================================= */
:root{
  /* Couleurs de marque et d'interface. Alignées le 19/10/2026 sur le booking
     engine v3 (repris du booking engine v3, retours du 28/09 : « très pâle, peu
     lisible ») à la demande d'Alexie — ce qui tranche le conflit 4 du lot 9.
     Valeurs du brief §3 avant alignement : or #d6a644, gris #8f8d86.
     Contrastes sur blanc : --ink-2 11,7:1, --ink-3 8:1 (7,5:1 sur --canvas),
     --gold-dark 6,8:1, blanc sur --gold 4,6:1, blanc sur --ink 18:1. */
  --gold:#8e7128;
  --gold-dark:#6f5820;
  --gold-light:#f0e4c6;
  --gold-soft:#faf3e2;
  --ink:#1a140e;
  --ink-2:#3f372e;
  --ink-3:#574f45;
  --line:#d9d1c2;
  --line-2:#c4b9a6;
  --surface:#ffffff;
  --canvas:#faf7f1;
  --sand:#efe8da;
  --positive:#3f6b3b;
  --attention:#9a4f2a;
  --negative:#b3352e;

  /* Logo Resonance Golf Collection : ses deux couleurs exactes, reprises du
     fichier du booking engine v3. Elles ne servent qu'au logo. */
  --logo-ink:#181d27;
  --logo-gold:#d5a644;

  /* Chrome du prototype, hors device */
  --proto-bg:#e9e7e1;
  --proto-line:#d8d4ca;
  --proto-ink:#3a3935;
  --proto-ink-2:#77746c;
  --bezel:#12120f;

  /* Voiles et ombres — dérivés des couleurs ci-dessus */
  --scrim:rgba(26,20,14,.06);
  --scrim-strong:rgba(26,20,14,.12);
  /* Voile de la boite de dialogue du systeme, lot 5. Plus dense que celui des
     feuilles de l'application : ce qui s'affiche par-dessus n'appartient plus
     a l'application, et doit se lire comme tel. */
  --scrim-system:rgba(26,20,14,.32);
  --tint-gold:rgba(142,113,40,.14);
  --shadow-card:0 1px 2px rgba(34,28,21,.04),0 8px 24px rgba(34,28,21,.06);
  --shadow-device:0 24px 64px rgba(0,0,0,.20);

  /* Lot 11 (22/10/2026) : accueil immersif, carte e-wallet, onglets.
     Voile des photos : sombre en haut sous la barre d'état, transparent au
     milieu, dense en bas sous le texte. Textes sur fond sombre en blanc
     atténué. Carte e-wallet : encre chaude et reflet doré. */
  --photo-shade:linear-gradient(180deg,rgba(26,20,14,.55) 0%,rgba(26,20,14,0) 26%,rgba(26,20,14,0) 42%,rgba(26,20,14,.82) 100%);
  --photo-shade-soft:linear-gradient(180deg,rgba(26,20,14,0) 30%,rgba(26,20,14,.72) 100%);
  --photo-base:linear-gradient(160deg,#4a5a3c 0%,#2c3a26 55%,#1a140e 100%);
  --logo-ink-dark:#181d27;
  --on-dark:#ffffff;
  --on-dark-2:rgba(255,255,255,.78);
  --glass:rgba(255,255,255,.16);
  --glass-line:rgba(255,255,255,.30);
  /* Lot 12b (30/10) : voile du bon cadeau au modèle « Links » (photo du
     parcours), repris du prototype des bons cadeaux. */
  --gbon-shade:linear-gradient(180deg,rgba(26,20,14,.42) 0%,rgba(26,20,14,.88) 100%);
  --wcard-bg:linear-gradient(135deg,#2b2218 0%,#1a140e 48%,#3b2d13 100%);
  --wcard-sheen:radial-gradient(120% 90% at 100% 0%,rgba(213,166,68,.38) 0%,rgba(213,166,68,0) 55%);
  --wcard-line:rgba(213,166,68,.45);
  /* 29/10/2026 : seconde carte, l'e-wallet restaurant, encre bordeaux. */
  --wcard-resto-bg:linear-gradient(135deg,#3d1c22 0%,#24100f 48%,#4a2a1c 100%);
  --shadow-lift:0 2px 6px rgba(34,28,21,.06),0 18px 40px rgba(34,28,21,.14);

  /* Échelle typographique 28/22/17/15/13/11 */
  --t-28:28px;
  --t-22:22px;
  --t-17:17px;
  --t-15:15.5px; /* 15,5 px, corps du booking engine v3 */
  --t-13:13px;
  --t-11:11px;
  --w-light:300;   /* grand titre seulement, comme le booking engine v3 */
  --w-regular:400;
  --w-medium:500;
  --w-semi:500;    /* Jost : le gras du booking engine v3 est à 500 */
  --w-bold:600;    /* chiffres clés */

  /* Rayons */
  --r-card:16px;
  --r-btn:12px;
  --r-device:44px;
  --r-pill:999px;

  /* Écrans conçus pour la V2 (lot 7). Le brief demande une opacité
     légèrement réduite : assez pour que l'écran se lise comme une intention,
     pas assez pour qu'il devienne illisible ou que ses cibles tactiles
     disparaissent. */
  --v2-dim:.74;

  /* Gabarit device (brief lot 0) */
  --device-w:390px;
  --device-h:844px;
  --safe-top:44px;
  --safe-bottom:34px;
  --header-h:52px;
  --tabbar-h:56px;

  /* Mouvement */
  --dur-push:220ms;
  --ease-push:cubic-bezier(.32,.72,0,1);

  /* Familles */
  --font:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-push:0ms; }
}

/* =========================================================================
   2. Plan de travail — hors device
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  padding:40px 32px;
  min-height:100vh;
  background:var(--proto-bg);
  font-family:var(--font);
  color:var(--proto-ink);
  -webkit-font-smoothing:antialiased;
}

.proto{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

/* =========================================================================
   3. Frame device 390 x 844
   ========================================================================= */
.device{
  flex:0 0 auto;
  padding:12px;
  background:var(--bezel);
  border-radius:calc(var(--r-device) + 12px);
  box-shadow:var(--shadow-device);
}

.device-screen{
  position:relative;
  width:var(--device-w);
  height:var(--device-h);
  border-radius:var(--r-device);
  overflow:hidden;
  background:var(--canvas);
  display:flex;
  flex-direction:column;
  color:var(--ink);
  font-size:var(--t-15);
  line-height:1.4;
}

/* --- Safe area haute et en-tête --- */
.top{
  flex:0 0 auto;
  position:relative;
  z-index:2;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
/* En-tête blanc sur fond crème, comme le booking engine v3 (19/10/2026).
   La classe reste : elle porte le grand titre de l'accueil. */
.top.is-brand{ background:var(--surface); }

.statusbar{
  height:var(--safe-top);
  padding:0 26px 0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:var(--t-13);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.statusbar-icons{ display:flex; align-items:center; gap:5px; font-size:15px; }

.appbar{
  height:var(--header-h);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 52px;
}
.appbar-title{
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.appbar-slot{
  position:absolute;
  top:0;
  bottom:0;
  display:flex;
  align-items:center;
}
.appbar-slot.is-left{ left:4px; }
.brand-logo{ display:block; width:58px; height:34px; margin-left:12px; }
.appbar-slot.is-right{ right:4px; }

.icon-btn{
  width:44px;
  height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:none;
  color:var(--ink);
  font-size:22px;
  border-radius:var(--r-pill);
  cursor:pointer;
  font-family:inherit;
}
.icon-btn:active{ background:var(--scrim); }

/* --- Viewport et pile de navigation --- */
/* Le bloc conteneur des feuilles modales est ici, et non sur .screen.
   Defaut trouve au lot 3 : une feuille en position:fixed prend pour reference
   le premier ascendant transforme. Tant que c'etait .screen — qui est aussi
   le conteneur de defilement — la feuille suivait le contenu et sortait du
   cadre des qu'on l'ouvrait depuis le bas d'un ecran long. .viewport ne
   defile pas : la feuille reste calee sur la zone visible du device. */
.viewport{
  position:relative;
  flex:1 1 auto;
  overflow:hidden;
  will-change:transform;
}

.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--canvas);
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{ width:0; height:0; }
.screen[hidden]{ display:none; }
.screen.is-animated{
  transition:transform var(--dur-push) var(--ease-push),
             opacity var(--dur-push) var(--ease-push);
}
.screen.is-offstage{ transform:translateX(100%); }
.screen.is-behind{ transform:translateX(-24%); opacity:.55; }
.screen.is-dragging{ transition:none; }

.screen-inner{ padding:20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

/* --- Safe area basse et barre d'onglets --- */
.bottom{
  flex:0 0 auto;
  position:relative;
  z-index:2;
  background:var(--surface);
  border-top:1px solid var(--line);
}

.tabbar{
  height:var(--tabbar-h);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.tab{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  min-height:44px;
  padding:6px 2px 4px;
  border:0;
  background:none;
  cursor:pointer;
  font-family:inherit;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  color:var(--ink-3);
}
.tab.is-active{ color:var(--gold-dark); }
.tab[disabled]{ opacity:.38; cursor:default; }
.tab-icon{ position:relative; display:block; font-size:24px; line-height:1; }
/* Libellés en capitales espacées, comme les onglets du booking engine v3. */
.tab-label{ display:block; letter-spacing:.07em; text-transform:uppercase; font-size:10.5px; }
.tab-badge{
  position:absolute;
  top:-4px;
  left:100%;
  margin-left:-6px;
  padding:0 4px;
  border-radius:var(--r-pill);
  background:var(--ink-3);
  color:var(--surface);
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  line-height:14px;
}
.tab.is-active .tab-badge{ background:var(--gold); }

.home-indicator{
  height:var(--safe-bottom);
  display:flex;
  align-items:center;
  justify-content:center;
}
.home-indicator span{
  display:block;
  width:134px;
  height:5px;
  border-radius:var(--r-pill);
  background:var(--ink);
  opacity:.85;
}

/* =========================================================================
   4. Composants d'écran
   ========================================================================= */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  padding:20px 18px;
}
.card + .card{ margin-top:12px; }

.card-mark{
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--gold-light);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:14px;
}
.card-mark.is-alert{ background:var(--surface); color:var(--negative); border:1px solid var(--line); }

.screen-title{
  margin:0 0 6px;
  font-size:var(--t-22);
  font-weight:var(--w-medium);
  color:var(--ink);
  letter-spacing:.01em;
  line-height:1.25;
}
.screen-text{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-regular);
  color:var(--ink-2);
}
.screen-text + .screen-text{ margin-top:8px; }

.eyebrow{
  margin:0 0 10px;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-dark);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:48px;
  margin-top:16px;
  padding:0 18px;
  border:1.5px solid transparent;
  border-radius:var(--r-pill);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  letter-spacing:.12em;
  text-transform:uppercase;
  line-height:1.25;
  text-align:center;
  cursor:pointer;
}
.btn .ti{ font-size:18px; }
.btn.is-primary{ background:var(--ink); color:var(--surface); }
.btn.is-primary:active{ background:var(--gold-dark); }
.btn.is-quiet{ background:var(--surface); color:var(--ink); border-color:var(--line-2); }
.btn.is-quiet:active{ background:var(--canvas); }

.spec{
  margin:14px 0 0;
  padding:0;
  list-style:none;
  border-top:1px solid var(--line);
}
.spec li{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-3);
}
.spec b{
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  text-align:right;
}

.ghosts{ margin-top:20px; }
.ghost{
  height:72px;
  margin-bottom:10px;
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* =========================================================================
   4b. Accueil — lot 1
   ========================================================================= */

/* Fond de marque pour les surfaces editoriales. Porte par un attribut et non
   par une classe : le lot 0 verifie que className vaut exactement "screen".
   Fond crème depuis l'alignement sur le booking engine v3 (19/10/2026). */
.screen[data-tone="brand"]{ background:var(--canvas); }

/* Sur l'accueil le titre est porte par le contenu (grand titre iOS).
   Le titre d'en-tete reste dans le DOM pour les technologies d'assistance. */
.top.is-brand .appbar-title{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  white-space:nowrap;
  clip-path:inset(50%);
}

.section{ margin-top:22px; }

/* --- En-tete d'accueil --- */
.hero{ margin:-2px 0 4px; }
.hero-hello{
  margin:0 0 2px;
  font-size:32px;
  font-weight:var(--w-light);
  letter-spacing:.01em;
  line-height:1.15;
  color:var(--ink);
}
.hero-hello b{ font-weight:var(--w-medium); }
.hero-site{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:44px;
  margin-left:-8px;
  padding:0 8px;
  border:0;
  border-radius:var(--r-btn);
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.hero-site:active{ background:var(--scrim); }
.hero-site .ti{ font-size:18px; }
.hero-site .is-chevron{ color:var(--ink-3); }

/* --- Prochaine reservation --- */
.booking{
  display:block;
  width:100%;
  padding:16px 18px 18px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.booking:active{ background:var(--canvas); }
.waitbox{
  margin-top:22px;
  padding:16px;
  border:1.5px dashed var(--line-2);
  border-radius:18px;
  background:var(--sand);
}
.waitbox-head{ display:flex; align-items:center; gap:12px; }
.waitbox-mark{
  display:flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:10px;
  background:var(--ink); color:var(--surface); font-size:18px;
}
.waitbox-title{ margin:0; font-size:var(--t-17); font-weight:var(--w-medium); color:var(--ink); }
.waitbox-n{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:22px; margin-left:4px; padding:0 6px;
  border-radius:var(--r-pill); background:var(--ink); color:var(--surface);
  font-size:var(--t-13); vertical-align:2px;
}
.waitbox-text{ margin:10px 0 0; font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.wrow{
  margin-top:12px; padding:14px;
  border-radius:var(--r-card); background:var(--surface);
}
.wrow-title{ margin:8px 0 0; font-size:var(--t-15); font-weight:var(--w-medium); color:var(--ink); }
.wrow-meta{ margin:2px 0 0; font-size:var(--t-13); color:var(--ink-2); }
.wrow-quit{ margin-top:12px; min-height:44px; }
.visually-hidden{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.booking.has-date{ display:flex; align-items:flex-start; gap:14px; }
.booking-info{ display:block; min-width:0; flex:1 1 auto; }
.booking.is-soon{ border-color:var(--gold); }
.booking-day{
  margin:0 0 8px;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  letter-spacing:.16em;
  color:var(--gold-dark);
}
.booking-main{
  margin:0;
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 10px;
}
.booking-time{
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:-.01em;
}
.booking-course{
  font-size:var(--t-17);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.booking-meta{
  margin:8px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.booking-meta b{ font-weight:var(--w-medium); color:var(--positive); }
.booking-flag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:6px 11px;
  border-radius:var(--r-pill);
  background:var(--gold);
  color:var(--surface);
  font-size:var(--t-13);
  font-weight:var(--w-semi);
}

/* --- Etat vide : aucun depart a venir --- */
.empty{ padding:0; overflow:hidden; }
.empty-body{ padding:18px; }
.empty .screen-title{ margin-bottom:6px; }
.photo{
  display:block;
  width:100%;
  height:148px;
}
.photo .sky{ stop-color:var(--gold-soft); }
.photo .dusk{ stop-color:var(--gold); }
.photo .fairway{ fill:var(--positive); opacity:.34; }
.photo .green{ fill:var(--positive); opacity:.58; }
.photo .ridge{ fill:var(--ink-3); opacity:.22; }

/* --- Raccourcis --- */
.shortcuts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.shortcuts.is-single{ grid-template-columns:1fr; }
.shortcuts.is-single .shortcut{
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  min-height:64px;
}
.shortcut{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  min-height:96px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  text-align:left;
  cursor:pointer;
}
.shortcut:active{ background:var(--canvas); }
.shortcut-mark{
  width:34px;
  height:34px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* --- Bande credits --- */
.credits{
  display:block;
  width:100%;
  padding:14px 16px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.credits:active{ background:var(--canvas); }
.credits-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.credit{
  min-width:0;
  padding-left:11px;
  border-left:2px solid var(--line);
}
.credit-value{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.credit-label{
  margin:2px 0 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.credit.is-open{ border-left-color:var(--gold); }
.credit.is-zero{ border-left-color:var(--attention); }
.credit.is-zero .credit-value{ color:var(--attention); }
.credits-notes{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin:14px 0 0;
  padding-top:11px;
  border-top:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.credits-notes b{ font-weight:var(--w-medium); color:var(--ink-2); }
.credits-nudge{
  margin:12px 0 0;
  padding-top:11px;
  border-top:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.credits-nudge span{ color:var(--gold-dark); font-weight:var(--w-medium); }

/* --- Encart de profil incomplet --- */
.notice{
  padding:16px 18px 18px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.notice-head{ display:flex; align-items:flex-start; gap:12px; }
.notice-icon{
  flex:0 0 auto;
  width:32px;
  height:32px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}
.notice-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.notice-text{
  margin:5px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.notice .btn{ margin-top:14px; min-height:44px; font-size:var(--t-15); }

/* --- Alertes contextuelles --- */
.alert{
  padding:14px 16px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.alert + .alert{ margin-top:10px; }
.alert-head{ display:flex; align-items:flex-start; gap:12px; }
.alert-icon{
  flex:0 0 auto;
  width:28px;
  height:28px;
  border-radius:var(--r-pill);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  background:var(--canvas);
  color:var(--ink-2);
}
.alert.is-attention .alert-icon{ background:var(--gold-soft); color:var(--attention); }
.alert-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.alert.is-attention .alert-title{ color:var(--attention); }
.alert-text{
  margin:4px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.alert .btn{ margin-top:12px; min-height:44px; font-size:var(--t-15); }


/* =========================================================================
   4c. Tunnel de reservation green-fee - lot 2, etapes 1 a 4
   ========================================================================= */

/* --- Entree de l'onglet Reserver --- */
.pick{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:16px 16px 16px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  color:var(--ink);
  cursor:pointer;
}
.pick + .pick{ margin-top:10px; }
.pick:active{ background:var(--canvas); }
.pick-mark{
  flex:0 0 auto;
  width:44px;
  height:44px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}
/* Defaut trouve a l'oeil au lot 3 : les deux lignes d'une entree de choix
   etaient des span inline, donc collees l'une a l'autre (« Un departGreen-fee
   sur les huit parcours »). Le corps devient une colonne, comme celui des
   autres composants du fichier. */
.pick-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.pick-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.pick-text{
  margin:3px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.pick-chevron{ flex:0 0 auto; color:var(--ink-3); font-size:20px; }

/* --- Fil des choix deja faits, chaque maillon ramene a son etape --- */
.crumbs{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin:0 0 16px;
}
.crumb{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:32px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.crumb:active{ background:var(--canvas); }
.crumb .ti{ font-size:15px; color:var(--ink-3); }

/* --- Liste des sites, etape 1 --- */
.site{
  display:flex;
  align-items:stretch;
  gap:0;
  width:100%;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.site + .site{ margin-top:10px; }
.site:active{ background:var(--canvas); }
.site.is-home{ border-color:var(--gold); }
.site-body{
  flex:1 1 auto;
  min-width:0;
  padding:13px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px;
}
.site-name{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.site-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.site-far{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* --- Cartes de parcours, etape 2 --- */
.course{
  display:block;
  width:100%;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.course + .course{ margin-top:12px; }
.course:active{ background:var(--canvas); }
.course.is-selected{ border-color:var(--gold); }
.course-body{ padding:14px 16px 16px; }
.course-name{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.course-facts{
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  margin:7px 0 0;
  padding:0;
  list-style:none;
}
.course-facts li{
  font-size:var(--t-13);
  color:var(--ink-2);
}
.course-facts b{ font-weight:var(--w-medium); color:var(--ink); }
.course-closed{
  margin:9px 0 0;
  font-size:var(--t-13);
  color:var(--attention);
}

/* --- Bande de quatorze jours, etape 3 --- */
.daystrip{
  display:flex;
  gap:8px;
  margin:0 -16px;
  padding:2px 16px 4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.daystrip::-webkit-scrollbar{ width:0; height:0; }
.day{
  flex:0 0 auto;
  width:58px;
  min-height:72px;
  padding:9px 0 10px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  cursor:pointer;
  text-align:center;
}
.day-name{
  display:block;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-3);
}
.day-num{
  display:block;
  margin-top:3px;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:-.01em;
}
.day-month{
  display:block;
  margin-top:1px;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.day.is-selected{ border-color:var(--ink); background:var(--ink); }
.day.is-selected .day-num,
.day.is-selected .day-name,
.day.is-selected .day-month{ color:var(--surface); }
.day[disabled]{ cursor:default; background:var(--canvas); }
.day[disabled] .day-num{ color:var(--ink-3); text-decoration:line-through; }
.day[disabled] .day-name,
.day[disabled] .day-month{ color:var(--ink-3); }

.daystrip-note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:12px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.daystrip-note .ti{ flex:0 0 auto; font-size:17px; color:var(--attention); }

/* --- Calendrier mensuel, etape 3 --- */
.month{
  margin-top:14px;
  padding:14px 14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.month-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.month-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.month-nav{
  width:44px;
  height:44px;
  border:0;
  border-radius:var(--r-pill);
  background:none;
  color:var(--ink);
  font-size:20px;
  cursor:pointer;
  font-family:inherit;
}
.month-nav[disabled]{ color:var(--ink-3); cursor:default; }
.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
}
.month-dow{
  padding:2px 0 6px;
  text-align:center;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-3);
}
.month-cell{
  min-height:40px;
  border:0;
  border-radius:10px;
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  cursor:pointer;
}
.month-cell.is-void{ cursor:default; }
.month-cell[disabled]{ color:var(--ink-3); cursor:default; }
.month-cell.is-closed{ text-decoration:line-through; }
.month-cell.is-selected{ background:var(--ink); color:var(--surface); font-weight:var(--w-semi); }

/* --- Liste des departs, etape 4 --- */

/* La mention de tete change de contenu selon le persona, jamais de place. */
.slots-lead{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin:0 0 16px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.slots-lead .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.slots-lead b{ font-weight:var(--w-semi); color:var(--ink); }

.slot-group + .slot-group{ margin-top:18px; }
.slot-group-head{
  position:sticky;
  top:0;
  z-index:1;
  margin:0;
  padding:8px 2px 8px;
  background:var(--canvas);
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* Pistes fixes, jamais auto : chaque ligne est une grille independante, des
   pistes dimensionnees au contenu ne s'aligneraient pas d'une ligne a l'autre.
   Le gabarit est porte par la liste et non par la ligne, pour que la colonne
   de prix apparaisse ou disparaisse pour toutes les lignes a la fois. */
.slots{
  --slot-time:56px;
  --slot-left:74px;
  --slot-price:0px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.slots.has-price{ --slot-price:62px; }

.slot{
  display:grid;
  grid-template-columns:var(--slot-time) 1fr var(--slot-left) var(--slot-price);
  align-items:center;
  column-gap:0;
  row-gap:0;
  width:100%;
  min-height:52px;
  padding:8px 14px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.slot:first-child{ border-top-color:transparent; }
.slot:active{ background:var(--canvas); }
.slot.is-selected{ background:var(--gold-soft); }
.slot[disabled]{ cursor:default; }

.slot-time{
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.slot-tags{
  min-width:0;
  min-height:24px;
  display:flex;
  align-items:center;
  gap:6px;
  padding-right:10px;
  overflow:hidden;
}
.slot-left{
  padding-left:10px;
  text-align:right;
  font-size:var(--t-13);
  color:var(--ink-2);
  white-space:nowrap;
}
.slot-price{
  padding-left:10px;
  text-align:right;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* Le libellé de hors-périmètre ne tient pas dans la colonne des variantes à
   côté d'un badge Twilight : il prend sa propre ligne, sous toute la largeur.
   Toutes les lignes de la liste sont concernées en même temps, la hauteur
   reste donc uniforme et les colonnes ne bougent pas. */
.slot-note{
  grid-column:1 / -1;
  padding-top:4px;
  font-size:var(--t-13);
  color:var(--attention);
}
.slot-note:empty{ display:none; }
/* Sans colonne de prix la piste vaut 0 : la cellule doit disparaitre avec
   elle, sans quoi elle rouvrirait une gouttiere a droite. */
.slots:not(.has-price) .slot-price{ display:none; }

.slot.is-full .slot-time{ color:var(--ink-3); }
.slot.is-full .slot-left{ color:var(--ink-3); }

.chip{
  display:inline-flex;
  align-items:center;
  padding:0 9px;
  min-height:22px;
  border-radius:var(--r-pill);
  background:var(--sand);
  border:1px solid transparent;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-2);
  white-space:nowrap;
}
.chip.is-gold{ background:var(--gold-light); border-color:transparent; color:var(--gold-dark); }

.slots-foot{
  margin:12px 0 0;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* --- Vignette de parcours, variante reduite du placeholder du lot 1 --- */
.photo.is-thumb{ width:96px; height:auto; min-height:78px; flex:0 0 auto; }
.photo.is-card{ height:120px; }

/* --- Etat vide d'une etape --- */
.stepempty{
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.stepempty .screen-title{ font-size:var(--t-17); }
.stepempty .btn{ min-height:44px; font-size:var(--t-15); }


/* =========================================================================
   4d. Tunnel de reservation green-fee - lot 2, etapes 5 a 8
   ========================================================================= */

/* --- Gabarit des etapes a total : le pied reste visible en permanence.
       Le brief demande un total lisible sans defilement (etape 5). Le pied
       est colle en bas du cadre quand la page defile, et pousse en bas de
       colonne quand le contenu est court : sans cette seconde regle, un
       ecran peu rempli laisserait le total flotter au milieu du vide. --- */
.screen[data-path="/book/gf/players"] .screen-inner,
.screen[data-path="/book/gf/options"] .screen-inner,
.screen[data-path="/book/gf/pay"] .screen-inner,
.screen[data-path="/book/lessons/pay"] .screen-inner,
.screen[data-path="/wallet/buy"] .screen-inner,
.screen[data-path="/wallet/buy/pay"] .screen-inner,
.screen[data-path="/wallet/topup"] .screen-inner{
  display:flex;
  flex-direction:column;
  min-height:100%;
  padding-bottom:0;
}
.stepbody{ flex:1 1 auto; }
.stepfoot{
  position:sticky;
  bottom:0;
  z-index:1;
  flex:0 0 auto;
  margin:20px -16px 0;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background:var(--surface);
  border-top:1px solid var(--line);
}

/* --- Total permanent --- */
.total{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
}
.total-label{ font-size:var(--t-13); color:var(--ink-2); }
.total-value{
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.total-note{
  margin:4px 0 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.stepfoot .btn{ margin-top:10px; }

/* --- Etape 5 : la liste des joueurs --- */
.players{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.player{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:14px;
  border-top:1px solid var(--line);
}
.player.is-guest{ padding-right:8px; }
.player:first-child{ border-top-color:transparent; }
.player-rank{
  flex:0 0 auto;
  width:26px;
  height:26px;
  margin-top:1px;
  border-radius:var(--r-pill);
  background:var(--canvas);
  color:var(--ink-3);
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  display:flex;
  align-items:center;
  justify-content:center;
}
.player.is-holder .player-rank{ background:var(--gold-soft); color:var(--gold-dark); }
.player-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.player-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.player-why{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.player-warn{
  margin:2px 0 0;
  font-size:var(--t-13);
  color:var(--attention);
}
.player-side{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
}
.player-price{
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.player-price.is-free{ color:var(--positive); font-weight:var(--w-medium); }
.player-drop{
  width:44px;
  height:44px;
  margin:-10px -10px -10px 0;
  border:0;
  background:none;
  color:var(--ink-3);
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.player-drop:active{ color:var(--negative); }

/* --- Decompte des invitations, membre Passion --- */
.quota{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0 0;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.quota .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.quota b{ font-weight:var(--w-semi); color:var(--ink); }
.quota.is-spent{ background:var(--surface); }
.quota.is-spent .ti{ color:var(--attention); }

/* --- Ajout d'un joueur --- */
.addbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:48px;
  margin-top:12px;
  padding:0 16px;
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  cursor:pointer;
}
.addbtn:active{ background:var(--canvas); }
.addbtn[disabled]{ cursor:default; color:var(--ink-3); }
.addbtn .ti{ font-size:19px; color:var(--gold-dark); }
.addbtn[disabled] .ti{ color:var(--ink-3); }
.addnote{
  margin:8px 0 0;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* --- Feuille d'ajout : elle se pose sur l'ecran, sans quitter l'etape.
       Sortir de l'etape pour saisir un nom ferait perdre le fil du total. --- */
.sheet{
  position:fixed;
  inset:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:var(--scrim-strong);
}
.sheet-card{
  max-height:82%;
  overflow-y:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius:var(--r-card) var(--r-card) 0 0;
  background:var(--surface);
  scrollbar-width:none;
}
.sheet-card::-webkit-scrollbar{ width:0; height:0; }
.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.sheet-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.sheet-close{
  width:44px;
  height:44px;
  margin:-10px -10px -10px 0;
  border:0;
  background:none;
  color:var(--ink-2);
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.sheet-lead{
  margin:0 0 12px;
  font-size:var(--t-13);
  color:var(--ink-2);
}

.rel{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:56px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.rel + .rel{ margin-top:8px; }
.rel:active{ background:var(--canvas); }
.rel[disabled]{ cursor:default; background:var(--canvas); }
.rel-mark{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:var(--r-pill);
  background:var(--gold-soft);
  color:var(--gold-dark);
  font-size:var(--t-13);
  font-weight:var(--w-semi);
  display:flex;
  align-items:center;
  justify-content:center;
}
.rel[disabled] .rel-mark{ background:var(--canvas); color:var(--ink-3); }
.rel-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.rel-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.rel-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.rel-side{ flex:0 0 auto; font-size:var(--t-13); color:var(--ink-3); }
.rel[disabled] .rel-name{ color:var(--ink-3); }

/* =========================================================================
   Lot 9e — proches : recherche par licence, profil rattaché, lien
   d'invitation, « Mes proches sur le parcours ». Repris du booking engine
   v3, retours du 24/09, décliné dans les composants de l'application.
   ========================================================================= */
.sheet-sect{
  margin:4px 0 8px;
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-3);
}
.sheet-sect + .sheet-lead{ margin-top:-2px; }
.rel.is-static{ cursor:default; }
.rel.is-static:active{ background:var(--surface); }

.findbox{ display:flex; gap:8px; align-items:stretch; }
.findbox .input{ flex:1 1 auto; min-width:0; }
.btn.findbox-btn{
  flex:0 0 auto;
  width:auto;
  min-height:48px;
  margin-top:0;
  padding:0 14px;
  font-size:var(--t-15);
}
.findbox + .rel, .findbox + .form-error{ margin-top:10px; }

.form-warn{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:12px 0 0;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.form-warn > .ti{ flex:0 0 auto; font-size:17px; color:var(--gold-dark); }
.form-warn-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.form-warn-head{ margin:0; font-weight:var(--w-semi); color:var(--ink); }
.form-warn-text{ margin:2px 0 0; }
.form-warn .btn{ margin-top:10px; min-height:44px; font-size:var(--t-15); }

.form-req{ margin:0 0 10px; font-size:var(--t-11); color:var(--ink-3); }
.req{ color:var(--negative); font-weight:var(--w-semi); }

.telrow{ display:flex; gap:8px; }
.telrow .input{ flex:1 1 auto; min-width:0; }
.input.telrow-cc{ flex:0 0 104px; padding:0 10px; }

.relchips{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 4px; }
.relchip{
  min-height:44px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-15);
  color:var(--ink-2);
  cursor:pointer;
}
.relchip.is-on{
  border-color:var(--gold);
  background:var(--gold-soft);
  color:var(--ink);
  font-weight:var(--w-medium);
}
.sheet-card .sheet-sect{ margin-top:14px; }
.sheet-card .sheet-sect:first-child{ margin-top:0; }

.segtabs{
  display:flex;
  gap:4px;
  margin:0 0 14px;
  padding:3px;
  border-radius:var(--r-btn);
  background:var(--canvas);
}
.segtab{
  flex:1 1 0;
  min-height:44px;
  padding:0 6px;
  border:0;
  border-radius:calc(var(--r-btn) - 3px);
  background:none;
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.segtab.is-on{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card); }

.linkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--canvas);
  font-size:var(--t-15);
  color:var(--ink);
  word-break:break-all;
}
.linkbox .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }

.relcard{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.relcard + .relcard{ margin-top:10px; }
.relcard .rel{ border:0; border-radius:0; box-shadow:none; }
.relcard-book{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  min-height:44px;
  padding:0 12px 0 58px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  text-align:left;
  cursor:pointer;
}
.relcard-book .ti{ font-size:18px; color:var(--gold-dark); }
.relcard-book:active{ background:var(--canvas); }
.relcard + .addbtn{ margin-top:12px; }
.rel-share{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:2px;
  font-size:var(--t-13);
  color:var(--positive);
}
.rel-share .ti{ font-size:15px; }

/* Interrupteur : une ligne entière, la pastille ne fait qu'indiquer l'état. */
.switchrow{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:56px;
  margin-top:12px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.switchrow.is-card{ margin-top:0; box-shadow:var(--shadow-card); }
.switchrow-mark{ flex:0 0 auto; font-size:20px; color:var(--gold-dark); }
.switchrow-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.switchrow-title{ font-size:var(--t-15); font-weight:var(--w-medium); color:var(--ink); }
.switchrow-text{ font-size:var(--t-13); color:var(--ink-2); }
.switch{
  position:relative;
  flex:0 0 auto;
  width:44px;
  height:26px;
  border-radius:var(--r-pill);
  background:var(--line);
  transition:background-color var(--dur-push) ease;
}
.switch-knob{
  position:absolute;
  top:3px;
  left:3px;
  width:20px;
  height:20px;
  border-radius:var(--r-pill);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform var(--dur-push) var(--ease-push);
}
.switch.is-on{ background:var(--gold); }
.switch.is-on .switch-knob{ transform:translateX(18px); }

.day{ position:relative; }
.day-dot{
  position:absolute;
  left:50%;
  bottom:5px;
  width:5px;
  height:5px;
  margin-left:-2.5px;
  border-radius:var(--r-pill);
  background:var(--gold-dark);
}

.prox{
  margin:12px 0 4px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
}
.prox .eyebrow{ margin:0 0 2px; }
.prox-title{
  margin:0 0 6px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.prox-text{ margin:10px 0 0; font-size:var(--t-13); color:var(--ink-2); }
.prox-title + .prox-text{ margin-top:0; }
.prox-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
.prox-row .rel-mark{ background:var(--surface); }
.prox-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.prox-name{ font-size:var(--t-15); font-weight:var(--w-medium); color:var(--ink); }
.prox-meta{ font-size:var(--t-13); color:var(--ink-2); }
.btn.prox-join{ margin-top:8px; min-height:44px; font-size:var(--t-15); }
.prox-note{
  display:flex;
  align-items:center;
  gap:6px;
  margin:6px 0 0 46px;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.prox-note.is-on{ color:var(--positive); }
.slot-tags .chip .ti{ font-size:13px; margin-right:3px; }

/* Feuille de partage du téléphone, simulée : elle appartient au système. */
.sysshare{
  position:fixed;
  inset:0;
  z-index:4;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:8px;
  padding:0 8px calc(8px + var(--safe-bottom));
  background:var(--scrim-system);
}
.sysshare-card{
  border-radius:var(--r-card);
  background:var(--surface);
  padding:14px 12px 12px;
}
.sysshare-title{
  margin:0 0 12px;
  font-size:var(--t-13);
  color:var(--ink-2);
  text-align:center;
  word-break:break-all;
}
.sysshare-apps{ display:flex; justify-content:space-around; gap:8px; }
.sysshare-app{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  min-width:72px;
  min-height:44px;
  padding:4px;
  border:0;
  background:none;
  font-family:inherit;
  font-size:var(--t-11);
  color:var(--ink);
  cursor:pointer;
}
.sysshare-icon{
  width:52px;
  height:52px;
  border-radius:var(--r-card);
  background:var(--canvas);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:var(--ink);
}
.sysshare-cancel{
  min-height:52px;
  border:0;
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  cursor:pointer;
}

.sheet-sep{
  margin:16px 0 12px;
  border:0;
  border-top:1px solid var(--line);
}

/* --- Saisie d'un invite --- */
.form-row{ margin-bottom:12px; }
.form-label{
  display:block;
  margin-bottom:6px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.input{
  display:block;
  width:100%;
  min-height:48px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-15);
  color:var(--ink);
}
.input:focus{ outline:2px solid var(--gold); outline-offset:-2px; }
.form-hint{
  margin:6px 0 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.form-error{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:12px 0 0;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--canvas);
  font-size:var(--t-13);
  color:var(--negative);
}
.form-error .ti{ flex:0 0 auto; font-size:17px; }

/* --- Etape 6 : les options --- */
.opts{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.opt{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-top:1px solid var(--line);
}
.opt:first-child{ border-top-color:transparent; }
.opt-mark{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  font-size:21px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.opt-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.opt-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.opt-price{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.opt-price.is-included{ color:var(--positive); }
.opt-note{
  margin:0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.stepper{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:2px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
}
.stepper button{
  width:40px;
  height:40px;
  border:0;
  background:none;
  border-radius:var(--r-pill);
  color:var(--ink);
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.stepper button:active{ background:var(--canvas); }
.stepper button[disabled]{ cursor:default; color:var(--ink-3); }
.stepper-val{
  min-width:22px;
  text-align:center;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}

/* --- Etape 7 : le paiement. Aucune option n'est preselectionnee. --- */
.payopt{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:15px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.payopt + .payopt{ margin-top:10px; }
.payopt:active{ background:var(--canvas); }
.payopt.is-selected{ border-color:var(--gold); background:var(--gold-soft); }
.payopt-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  margin-top:1px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--surface);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.payopt.is-selected .payopt-mark{
  border-color:var(--gold-dark);
  background:var(--gold-dark);
  color:var(--surface);
}
.payopt-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px; }
.payopt-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.payopt-line{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.payopt-line b{ font-weight:var(--w-medium); color:var(--ink); }
.paylead{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:0 0 14px;
  padding:12px 14px;
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.paylead .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.paylead b{ font-weight:var(--w-semi); color:var(--ink); }

.btn[disabled]{ cursor:default; background:var(--line); color:var(--ink-3); }
.btn.is-busy{ cursor:progress; }
.btn.is-busy .ti{ animation:spin 900ms linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){
  .btn.is-busy .ti{ animation:none; }
}

/* --- Etape 8 : la confirmation --- */
.confirm-mark{
  width:56px;
  height:56px;
  margin:8px auto 14px;
  border-radius:var(--r-pill);
  background:var(--gold-soft);
  color:var(--positive);
  font-size:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.confirm-title{
  margin:0;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  text-align:center;
}
.confirm-ref{
  margin:6px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
  text-align:center;
}
.confirm-ref b{
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:.04em;
}
.confirm-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.confirm-actions .btn{ margin-top:0; font-size:var(--t-15); }
.done{
  display:flex;
  align-items:center;
  gap:7px;
  margin:10px 0 0;
  font-size:var(--t-13);
  color:var(--positive);
}
.done .ti{ font-size:17px; }
.cancelnote{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:16px 0 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.cancelnote .ti{ flex:0 0 auto; font-size:18px; color:var(--ink-3); }


/* --- Site retenu d'avance, etape 1 --- */
.site.is-selected{ border-color:var(--gold); background:var(--gold-soft); }
.site-mark{
  flex:0 0 auto;
  align-self:center;
  width:26px;
  height:26px;
  margin-right:14px;
  border-radius:var(--r-pill);
  background:var(--gold-dark);
  color:var(--surface);
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* --- Acces au calendrier mensuel : action secondaire de l'etape 3 --- */
.daymore{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:44px;
  margin-top:4px;
  padding:0 14px 0 10px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.daymore:active{ background:var(--canvas); }
.daymore .ti{ font-size:18px; color:var(--ink-3); }

/* --- Feuille de departs sous la bande de jours, etape 3 --- */
.tee-head{
  margin:22px 0 12px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.party{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.party-label{ font-size:var(--t-13); color:var(--ink-2); }
.party-choices{
  display:flex;
  gap:0;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  overflow:hidden;
}
.party-choice{
  width:44px;
  height:44px;
  border:0;
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.party-choice.is-on{
  background:var(--ink);
  color:var(--surface);
  font-weight:var(--w-semi);
}

/* --- Reglage d'un joueur : invitation et paiement, etape 5 --- */
.player-open{
  display:flex;
  align-items:flex-start;
  gap:12px;
  flex:1 1 auto;
  min-width:0;
  padding:0;
  border:0;
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.player-chevron{ flex:0 0 auto; color:var(--ink-3); font-size:18px; }
.player-price.is-other{ color:var(--ink-3); font-weight:var(--w-medium); }
.player-pay{
  display:flex;
  align-items:flex-start;
  gap:5px;
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-3);
}
.player-pay .ti{ flex:0 0 auto; font-size:15px; margin-top:1px; }

.hint{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:0 0 4px;
  padding:11px 14px;
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.hint .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.hint b{ font-weight:var(--w-semi); color:var(--ink); }

.addbtn.is-quiet{ border-style:solid; }
.addbtn.is-quiet .ti{ color:var(--ink-2); }

.choicegroup{ margin-bottom:18px; }
.choicegroup-head{
  margin:0 0 8px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.choice{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.choice + .choice{ margin-top:8px; }
.choice:active{ background:var(--canvas); }
.choice.is-on{ border-color:var(--gold); background:var(--gold-soft); }
.choice[disabled]{ cursor:default; background:var(--canvas); }
.choice-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  margin-top:1px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--surface);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.choice.is-on .choice-mark{
  border-color:var(--gold-dark);
  background:var(--gold-dark);
  color:var(--surface);
}
.choice-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.choice-title{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.choice[disabled] .choice-title{ color:var(--ink-3); }
.choice-text{ font-size:var(--t-13); color:var(--ink-2); }


/* =========================================================================
   4e. Reservation de cours - lot 3
   ========================================================================= */

/* --- Cartes de pro, etape 1 du cours particulier ---
       Le brief demande photo, specialites et court descriptif : les trois
       tiennent sur une carte, la photo en vignette portrait a gauche. --- */
.pro{
  display:flex;
  align-items:stretch;
  width:100%;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.pro + .pro{ margin-top:12px; }
.pro:active{ background:var(--canvas); }
.pro.is-selected{ border-color:var(--gold); }
.pro-body{
  flex:1 1 auto;
  min-width:0;
  padding:13px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.pro-name{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
/* Pas de capitales ici : « PGA France · 22 ans d'enseignement » passe alors
   sur deux lignes dans une carte de 238 px. */
.pro-role{
  margin:0;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  color:var(--ink-3);
}
.pro-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:3px 0 0;
}
.pro-blurb{
  margin:4px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.pro-rate{
  margin:6px 0 0;
  font-size:var(--t-13);
  color:var(--ink);
  font-weight:var(--w-medium);
}

/* Vignette portrait : meme placeholder que les parcours, autre gabarit. */
.photo.is-pro{
  width:92px;
  height:auto;
  min-height:120px;
  flex:0 0 auto;
}
.photo .figure{ fill:var(--ink-3); opacity:.26; }

/* --- Choix de la duree : la duree et le tarif viennent du catalogue --- */
.durations{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.duration{
  min-height:66px;
  padding:12px 10px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:center;
  cursor:pointer;
}
.duration:active{ background:var(--canvas); }
.duration.is-on{ border-color:var(--gold); background:var(--gold-soft); }
.duration-label{
  display:block;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.duration-price{
  display:block;
  margin-top:3px;
  font-size:var(--t-13);
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

/* --- Pastille des jours qui portent une seance, dans le calendrier --- */
.month-cell{ position:relative; }
.month-dot{
  position:absolute;
  left:50%;
  bottom:5px;
  width:4px;
  height:4px;
  margin-left:-2px;
  border-radius:var(--r-pill);
  background:var(--gold-dark);
}
.month-cell.is-selected .month-dot{ background:var(--ink); }
.month-cell[disabled] .month-dot{ background:var(--ink-3); }

/* --- Filtres du cours collectif : chaque pastille ouvre sa feuille --- */
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:0 0 14px;
}
.filter{
  display:inline-flex;
  align-items:center;
  gap:6px;
  /* 44 px : c'est une commande de tri, pas un fil de navigation. Le .crumb
     du lot 2a se contente de 32 px parce qu'il ne fait que revenir en
     arriere ; un filtre se manipule. */
  min-height:44px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.filter:active{ background:var(--canvas); }
.filter.is-on{ border-color:var(--gold); background:var(--gold-soft); color:var(--ink); }
.filter .ti{ font-size:15px; color:var(--ink-3); }
.filter.is-on .ti{ color:var(--gold-dark); }

/* --- Liste des seances du jour ---
       Regle RGPD retenue : places restantes uniquement, jamais les noms des
       inscrits. Aucune colonne de la ligne ne porte de nom de joueur. --- */
.sessions{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.sess{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.sess:first-child{ border-top-color:transparent; }
.sess:active{ background:var(--canvas); }
.sess.is-full{ cursor:default; display:block; }
.sess-time{
  flex:0 0 auto;
  width:52px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.sess-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.sess-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.sess-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.sess-side{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}
.sess-price{
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sess-seats{
  font-size:var(--t-13);
  color:var(--ink-2);
  white-space:nowrap;
}
.sess-head{ display:flex; align-items:flex-start; gap:12px; }
.sess.is-full .sess-time,
.sess.is-full .sess-name,
.sess.is-full .sess-price{ color:var(--ink-3); }
.sess.is-full .sess-seats{ color:var(--attention); }
.sess-wait{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  width:100%;
  min-height:44px;
  margin-top:10px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink);
  cursor:pointer;
}
.sess-wait:active{ background:var(--canvas); }
.sess-wait[disabled]{ cursor:default; color:var(--positive); }
.sess-wait .ti{ font-size:17px; color:var(--ink-3); }
.sess-wait[disabled] .ti{ color:var(--positive); }

/* --- Vos cours : la liste des seances reservees --- */
.lessons{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.lesson{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:13px 14px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.lesson:first-child{ border-top-color:transparent; }
.lesson:active{ background:var(--canvas); }
/* Bloc de date sur fond encre, comme les réservations de « Mon espace » du
   booking engine v3 (19/10/2026). Partagé avec la carte du prochain départ. */
.lesson-date,
.cdate{
  flex:0 0 auto;
  width:50px;
  padding:7px 0 8px;
  border-radius:12px;
  background:var(--ink);
  color:var(--surface);
  text-align:center;
}
.lesson-day,
.cdate-day{
  display:block;
  font-size:var(--t-22);
  font-weight:var(--w-light);
  line-height:1.1;
  color:var(--surface);
}
.lesson-month,
.cdate-dow,
.cdate-month{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--gold-light);
}
.lesson-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.lesson-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.lesson-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.lesson-side{ flex:0 0 auto; display:flex; align-items:center; gap:4px; }
.lesson-chevron{ color:var(--ink-3); font-size:18px; }
.chip.is-quiet{ color:var(--ink-3); }
.chip.is-void{ border-color:var(--negative); color:var(--negative); }

/* --- Debrief du pro : lecture seule, alimente par le back-office --- */
.debrief{
  margin-top:20px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
}
.debrief-head{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.debrief-head .ti{ font-size:20px; color:var(--gold-dark); }
.debrief-who{
  margin:0 0 12px;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.debrief-text{
  margin:0;
  font-size:var(--t-15);
  color:var(--ink-2);
}
.debrief-list{
  margin:12px 0 0;
  padding:0;
  list-style:none;
}
.debrief-list li{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.debrief-list .ti{ flex:0 0 auto; font-size:16px; color:var(--gold-dark); margin-top:1px; }

/* --- Cours annule : l'etat remplace l'action, il ne s'y ajoute pas --- */
.voided{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:18px 0 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.voided .ti{ flex:0 0 auto; font-size:18px; color:var(--negative); }
.voided b{ font-weight:var(--w-semi); color:var(--ink); }

.btn.is-danger{
  margin-top:14px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--negative);
}
.btn.is-danger:active{ background:var(--canvas); }

/* Une seule action principale par ecran : sur le detail d'un cours, c'est
   l'annulation, et le rappel du delai la precede. */
.lessonfoot{ margin-top:4px; }


/* =========================================================================
   4f. Portefeuille - lot 4
   ========================================================================= */

/* --- Mention de tete. Le solde est global au groupe (decision 4 du brief) :
       elle le dit sur l'ecran principal, et le detail d'un compteur la
       reprend la ou le code du site pourrait laisser croire le contraire. --- */
.wallet-lead{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:0 0 16px;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.wallet-lead .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }

/* --- Bandeau d'acces illimite, membre Passion. Non actionnable : ce n'est
       pas un compteur, c'est un droit attache a la cotisation. --- */
.unlimited{
  background:var(--gold-soft);
  border:1px solid var(--gold);
  border-radius:var(--r-card);
  padding:16px;
}
.unlimited-head{ display:flex; align-items:flex-start; gap:12px; }
.unlimited-mark{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--surface);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}
.unlimited-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.unlimited-text{
  margin:4px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.unlimited .spec{ margin-top:12px; }

/* --- Carte de compteur. Structure du brief lot 4 : solde, expiration, deux
       actions. Le corps ouvre l'historique, les deux actions restent en
       dehors du bouton pour ne pas imbriquer deux cibles tactiles. --- */
.pot{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.pot + .pot,
.unlimited + .pot{ margin-top:12px; }
.unlimited + .pot{ margin-top:14px; }

.pot-top,
.pot-open{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:16px 16px 12px;
  text-align:left;
}
.pot-open{
  background:none;
  border:0;
  font-family:inherit;
  cursor:pointer;
}
.pot-open:active{ background:var(--canvas); }
.pot-mark{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}
.pot-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.pot-head{ display:flex; align-items:center; gap:8px; }
.pot-label{
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
/* Jauge du carnet, e-wallet et avoir — repris du booking engine v3. */
.pot-gauge{ display:block; padding:0 18px 14px; }
button.pot.is-tap{ display:block; width:100%; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; -webkit-appearance:none; appearance:none; }
button.pot.is-tap .pot-open{ display:flex; }
button.pot.is-tap:active{ background:var(--canvas); }
button.pot.is-tap .pot-nudge{ display:block; }
.gauge{ display:flex; gap:4px; }
.gauge i{ flex:1 1 0; height:6px; border-radius:var(--r-pill); background:var(--sand); }
.gauge i.is-on{ background:var(--gold); }
.gauge.is-dense{ gap:3px; }
.pot-gauge-text{ display:block; margin-top:7px; font-size:var(--t-13); color:var(--ink-2); }
.money{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:16px 18px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.money + .money{ margin-top:12px; }
.money-body{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; }
.money-text{ font-size:var(--t-13); color:var(--ink-2); line-height:1.45; }
.money-check{ margin-top:4px; }
.money-empty{ margin:12px 0 0; font-size:var(--t-13); color:var(--ink-2); }
.pot-value{
  font-size:var(--t-28);
  font-weight:var(--w-semi);
  line-height:1.15;
  letter-spacing:-.02em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.pot-expiry{ font-size:var(--t-13); color:var(--ink-3); }
.pot-expiry.is-soon{ color:var(--attention); }
.pot-text{ font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.pot-chevron{ flex:0 0 auto; color:var(--ink-3); font-size:18px; margin-top:2px; }

.pot-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 16px 16px;
}
.pot-actions.is-single{ grid-template-columns:1fr; }
.pot-actions .btn{ margin-top:0; min-height:44px; font-size:var(--t-15); }
.pot-note{
  margin:-4px 16px 14px;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.pot-nudge{
  margin:0 16px 14px;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.pot-nudge span{ color:var(--gold-dark); font-weight:var(--w-medium); }

/* --- Emplacement V2. Le brief demande une carte distincte, jamais un
       quatrieme compteur : elle est grisee, sans solde et sans action. --- */
.pot.is-v2{
  margin-top:22px;
  background:var(--canvas);
  box-shadow:none;
  border-style:dashed;
}
.pot.is-v2 .pot-mark{ background:var(--surface); color:var(--ink-3); }
.pot.is-v2 .pot-label{ color:var(--ink-2); font-size:var(--t-17); font-weight:var(--w-semi); }
.pot.is-v2 .pot-text{ color:var(--ink-3); }
.chip.is-v2{ background:var(--surface); border-color:var(--line); color:var(--ink-3); }

/* --- Historique d'un compteur. Un seul fil chronologique : aucune ligne de
       regroupement, aucun en-tete de site. --- */
.moves{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  padding:0 14px;
}
.move{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 0;
  border-top:1px solid var(--line);
}
.move:first-child{ border-top-color:transparent; }
.move-date{
  flex:0 0 66px;
  padding-top:2px;
  font-size:var(--t-13);
  color:var(--ink-3);
}
.move-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.move-kind{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.move-site{ font-size:var(--t-13); color:var(--ink-3); }
.move-side{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:2px;
}
.move-delta{
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.move-delta.is-plus{ color:var(--positive); }
.move-delta.is-void{ color:var(--negative); }
.move-after{
  font-size:var(--t-11);
  color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.moves-foot{
  margin:10px 2px 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.moves-empty{
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  padding:20px 18px;
  text-align:center;
}
.moves-empty .ti{ font-size:26px; color:var(--ink-3); }
.moves-empty-title{
  margin:8px 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.moves-empty-text{
  margin:0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}

/* --- Choix du carnet. L'economie realisee par rapport au tarif unitaire est
       une demande explicite du brief : elle vit sur la ligne. --- */
.packs{ margin-top:4px; }
.pack{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:44px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.pack + .pack{ margin-top:10px; }
.pack:active{ background:var(--canvas); }
.pack.is-on{ border-color:var(--gold); background:var(--gold-soft); }
.pack-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  border-radius:var(--r-pill);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}
.pack.is-on .pack-mark{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--surface);
}
.pack-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pack-title{
  font-size:var(--t-17);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.pack-save{ font-size:var(--t-13); color:var(--positive); }
.pack-price{
  flex:0 0 auto;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}

/* --- Moyen de paiement. Un seul mode ici, donc aucun choix a faire : la
       carte enregistree s'annonce, elle ne se selectionne pas. --- */
.paycard{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-top:18px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
}
.paycard .ti{ flex:0 0 auto; font-size:20px; color:var(--ink-2); margin-top:1px; }
.paycard-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.paycard-title{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.paycard-text{ font-size:var(--t-13); line-height:1.4; color:var(--ink-3); }

/* =========================================================================
   4g. Notifications — lot 5
   ========================================================================= */

/* --- Pastille du compteur de non-lues, posée sur la cloche de l'en-tête.
       Elle ne dépend pas de l'autorisation système : le centre continue de
       recevoir quand le téléphone ne sonne plus, c'est justement ce que le
       bandeau explique. --- */
.icon-btn{ position:relative; }
.bell-badge{
  position:absolute;
  top:5px;
  right:4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:var(--r-pill);
  background:var(--gold);
  color:var(--surface);
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  line-height:17px;
  text-align:center;
}

/* --- Bandeau d'état système. Deux cas : la permission n'a jamais été
       demandée, ou elle est coupée au niveau du téléphone. Le second est le
       seul que l'application ne peut pas résoudre elle-même : il envoie aux
       réglages, il ne propose pas un bouton qui ne ferait rien. --- */
.sysbanner{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
}
.sysbanner.is-off{ border-color:var(--attention); }
.sysbanner .ti{ flex:0 0 auto; font-size:20px; color:var(--ink-3); margin-top:1px; }
.sysbanner.is-off .ti{ color:var(--attention); }
.sysbanner-body{ flex:1 1 auto; min-width:0; }
.sysbanner-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.sysbanner-text{
  margin:4px 0 0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.sysbanner .btn{ margin-top:12px; min-height:44px; font-size:var(--t-15); }
.sysbanner{ align-items:center; padding:10px 10px 10px 12px; gap:10px; }
.sysbanner-ic{ flex:0 0 auto; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:12px; background:var(--gold-light); }
.sysbanner-ic .ti{ margin:0; font-size:18px; color:var(--gold-dark); }
.sysbanner.is-off .sysbanner-ic{ background:var(--sand); }
.sysbanner .sysbanner-title{ font-size:var(--t-13); }
.sysbanner .sysbanner-text{ margin-top:1px; font-size:12px; }
.sysbanner-btn{ flex:0 0 auto; min-height:36px; padding:0 14px; border:0; border-radius:var(--r-pill);
  background:var(--ink); color:var(--on-dark); font-family:inherit; font-size:12px; font-weight:var(--w-medium);
  letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
.sysbanner.is-off .sysbanner-btn{ background:var(--surface); color:var(--ink); border:1px solid var(--line-2); }

/* --- Une notification. La ligne entière est la cible : le brief demande
       qu'elle ouvre l'écran concerné, pas qu'elle porte un bouton de plus.
       Non lue : titre en 600 et pastille or sur la vignette. --- */
.notifs{ display:flex; flex-direction:column; gap:10px; }
.notif{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  min-height:44px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.notif:active{ background:var(--canvas); }
.notif.is-unread{ background:var(--gold-soft); border-color:var(--gold); }
.notif-mark{
  position:relative;
  flex:0 0 auto;
  width:36px;
  height:36px;
  border-radius:var(--r-btn);
  background:var(--canvas);
  color:var(--ink-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.notif.is-unread .notif-mark{ background:var(--surface); color:var(--gold-dark); }
.notif-dot{
  position:absolute;
  top:-3px;
  right:-3px;
  width:10px;
  height:10px;
  border-radius:var(--r-pill);
  background:var(--gold);
  border:2px solid var(--surface);
}
.notif.is-unread .notif-dot{ border-color:var(--gold-soft); }
.notif-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.notif-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.notif-title{
  font-size:var(--t-15);
  font-weight:var(--w-regular);
  color:var(--ink);
}
.notif.is-unread .notif-title{ font-weight:var(--w-semi); }
.notif-when{
  flex:0 0 auto;
  font-size:var(--t-11);
  color:var(--ink-3);
  white-space:nowrap;
}
