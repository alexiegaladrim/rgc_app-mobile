/* --- Le détail d'une réservation de cours -------------------------------- */

/* Le bloc de debrief est en lecture seule côté joueur : il est alimenté par
   le back-office, l'application ne fait que l'afficher. Il n'apparaît qu'une
   fois la séance passée — avant, il n'a rien à dire. */
function debriefBlock(booking){
  var points = '';
  for(var i=0;i<booking.debrief.points.length;i++){
    points += '<li>' + icon('point') + '<span>'
            + booking.debrief.points[i] + '</span></li>';
  }
  return '<section class="debrief" data-role="debrief">'
       +   '<h3 class="debrief-head">' + icon('notebook')
       +     '<span>Le debrief de votre pro</span></h3>'
       +   '<p class="debrief-who">Écrit par ' + proName(booking.pro)
       +     ' après la séance du ' + longDate(booking.offset) + '.</p>'
       +   '<p class="debrief-text">' + booking.debrief.intro + '</p>'
       +   '<ul class="debrief-list">' + points + '</ul>'
       + '</section>';
}

function screenLessonDetail(){
  var booking = lessonBookingById(STATE.lesson.openId);
  if(!booking) return screenNotFound();

  var cancelled = lessonIsCancelled(booking);
  var past = lessonIsPast(booking);
  var paid = booking.paidWith === 'credits'
    ? minutesLabel(booking.duration) + ' de votre carnet'
    : amount(booking.price) + ' par carte';

  var tail = '';
  if(cancelled){
    tail = '<p class="voided" data-role="lesson-voided">' + icon('circle-x')
         + '<span><b>Cours annulé.</b> ' + lessonRefundText(booking) + '</span></p>';
  } else if(!past){
    var window_ = lessonCancelWindow(booking.offset);
    var text = window_ && window_.free
      ? 'Annulation gratuite jusqu\'au ' + window_.label + ' à 18 h. Passé ce '
        + 'délai, la séance reste due.'
      : 'Ce cours a lieu aujourd\'hui : le délai d\'annulation gratuite est '
        + 'passé, la séance reste due.';
    tail = '<p class="cancelnote" data-role="lesson-delay">' + icon('clock-hour-4')
         +   '<span>' + text + '</span></p>'
         + '<div class="lessonfoot">'
         +   '<button type="button" class="btn is-danger" data-act="lesson-cancel-open">'
         +     'Annuler ce cours</button>'
         + '</div>';
  }

  return ''
    + '<h2 class="screen-title">' + booking.title + '</h2>'
    + '<p class="screen-text">' + (booking.kind === 'group'
        ? 'Cours collectif, ' + minutesLabel(booking.duration) + '.'
        : 'Séance en tête-à-tête, ' + minutesLabel(booking.duration) + '.') + '</p>'
    + '<ul class="spec" data-role="lesson-detail-spec">'
    /* Le thème est le titre de l'écran : le répéter en première ligne de
       fiche serait le doublon de libellé qui revient à chaque lot. */
    +   '<li>Pro <b>' + proName(booking.pro) + '</b></li>'
    +   '<li>Lieu <b>' + lessonPlace(booking.site, booking.theme) + '</b></li>'
    +   '<li>Date <b>' + capitalize(longDate(booking.offset)) + '</b></li>'
    +   '<li>Horaire <b>' + hhmm(booking.minutes) + '</b></li>'
    +   '<li>Paiement <b>' + (cancelled ? 'Annulé' : 'Réglé, ' + paid) + '</b></li>'
    + '</ul>'
    + tail
    + (past && booking.debrief && !cancelled ? debriefBlock(booking) : '')
    + lessonSheet();
}

/* --- Sélections et actions du tunnel de cours ---------------------------- */

/* Entrer par l'une des deux portes repart d'un brouillon vide : un cours
   collectif retenu n'a rien à faire dans un cours particulier. */
function startLessonSolo(){
  clearLesson();
  STATE.lesson.mode = 'solo';
  navigate('/book/lessons/pro');
  return true;
}
function startLessonGroup(){
  clearLesson();
  STATE.lesson.mode = 'group';
  navigate('/book/lessons/group');
  return true;
}

function pickPro(id){
  var pro = proById(id);
  if(!pro) return false;
  var l = STATE.lesson;
  if(l.proId !== id){
    l.proId = id;
    l.dayOffset = null;
    l.slotKey = null;
    l.monthShift = 0;
  }
  navigate('/book/lessons/when');
  return true;
}

/* Changer de durée refait le planning en place : une heure et une demi-heure
   n'ouvrent pas les mêmes créneaux. Un créneau retenu qui ne tient plus dans
   la nouvelle durée est relâché plutôt que gardé en contradiction. */
function setLessonDuration(id){
  var l = STATE.lesson;
  var dur = durationById(id);
  if(!dur || l.durationId === dur.id) return false;
  l.durationId = dur.id;
  l.payment = null;
  var pro = proById(l.proId);
  if(l.slotKey){
    var still = false;
    var slots = proSlots(pro, l.dayOffset, l.durationId);
    for(var i=0;i<slots.length;i++){ if(slots[i].key === l.slotKey) still = true; }
    if(!still) l.slotKey = null;
  }
  if(l.dayOffset === null || !proDayHasSlots(pro, l.dayOffset, l.durationId)){
    l.dayOffset = firstProDay(pro, l.durationId);
    l.slotKey = null;
  }
  refresh();
  return true;
}

/* Changer de jour ne quitte pas l'écran, comme à l'étape 3 du green-fee. */
function pickLessonDay(offset){
  offset = parseInt(offset, 10);
  if(isNaN(offset)) return false;
  var l = STATE.lesson;
  if(l.dayOffset === offset) return false;
  l.dayOffset = offset;
  l.slotKey = null;
  l.sessionId = null;
  l.payment = null;
  refresh();
  return true;
}
function shiftLessonMonth(delta){
  var next = STATE.lesson.monthShift + delta;
  if(next < 0 || next > 3) return false;
  STATE.lesson.monthShift = next;
  refresh();
  return true;
}

function pickLessonSlot(key){
  var l = STATE.lesson;
  if(!l.proId || l.dayOffset === null) return false;
  l.slotKey = key;
  l.payment = null;
  navigate('/book/lessons/pay');
  return true;
}

function pickSession(id){
  var l = STATE.lesson;
  var session = groupSessionById(currentSite(), l.dayOffset, id);
  if(!session || session.seats === 0) return false;
  l.sessionId = id;
  l.payment = null;
  navigate('/book/lessons/pay');
  return true;
}

/* La mécanique de liste d'attente n'est pas spécifiée : le prototype
   enregistre la demande et en rend compte, il ne promet rien d'autre. */
function askWaitlist(id){
  var l = STATE.lesson;
  if(l.waitlist[id]) return false;
  l.waitlist[id] = true;
  refresh();
  return true;
}

function openLessonSheet(kind){
  STATE.lesson.sheet = kind;
  refresh();
  return true;
}
function closeLessonSheet(){
  STATE.lesson.sheet = null;
  refresh();
  return true;
}

function setLessonFilter(kind, value){
  var l = STATE.lesson;
  if(kind === 'pro') l.filterPro = value;
  else if(kind === 'theme') l.filterTheme = value;
  else if(kind === 'when') l.filterWhen = value;
  else return false;
  /* Un cours retenu que le filtre ne laisse plus voir serait retenu sans
     être lisible : il est relâché. */
  if(l.sessionId){
    var kept = false;
    var list = filteredSessions(currentSite(), l.dayOffset);
    for(var i=0;i<list.length;i++){ if(list[i].id === l.sessionId) kept = true; }
    if(!kept) l.sessionId = null;
  }
  refresh();
  return true;
}
function clearLessonFilters(){
  var l = STATE.lesson;
  l.filterPro = 'all';
  l.filterTheme = 'all';
  l.filterWhen = 'all';
  refresh();
  return true;
}

function chooseLessonPayment(id){
  var list = lessonPaymentChoices();
  for(var i=0;i<list.length;i++){
    if(list[i].id !== id) continue;
    STATE.lesson.payment = id;
    refresh();
    return true;
  }
  return false;
}

/* Même état d'attente qu'au green-fee : un règlement instantané ne montre
   pas l'état de chargement que le lot doit couvrir. */
function bookLesson(){
  var l = STATE.lesson;
  if(l.paying) return false;
  if(!l.payment) return false;
  l.paying = true;
  refresh();
  window.setTimeout(function(){
    l.paying = false;
    l.reference = makeLessonReference();
    navigate('/book/lessons/confirm');
  }, PAY_DELAY);
  return true;
}

function addLessonToCalendar(){
  STATE.lesson.calendarAdded = true;
  refresh();
  return true;
}
function shareLesson(){
  STATE.lesson.shared = true;
  refresh();
  return true;
}
function finishLesson(){
  clearLesson();
  selectTab('home');
  return true;
}

/* Ouvrir une réservation de cours depuis « Vos cours ». */
function openLessonBooking(id){
  if(!lessonBookingById(id)) return false;
  STATE.lesson.openId = id;
  STATE.lesson.sheet = null;
  navigate('/book/lessons/detail');
  return true;
}

/* L'annulation se confirme dans une feuille, avec le sort du montant écrit
   avant le geste — décision 5 du brief. */
function cancelLessonBooking(){
  var l = STATE.lesson;
  var booking = lessonBookingById(l.openId);
  if(!booking) return false;
  l.cancelled[booking.id] = true;
  l.sheet = null;
  refresh();
  return true;
}


/* =========================================================================
   6f. Portefeuille — lot 4
   ========================================================================= */

/* Le solde est global au groupe. La mention est en tête de l'écran principal,
   et reprise sur le détail d'un compteur où le code du site pourrait laisser
   croire à un cloisonnement. Les deux formulations ne se recouvrent pas : la
   première dit où les crédits valent, la seconde ce que le code du site est. */
function walletLead(){
  return '<p class="wallet-lead" data-role="wallet-lead">' + icon('map-pin')
       + '<span>Vos crédits sont valables dans les ' + SITES.length
       + ' golfs de la collection, quel que soit celui où vous les avez '
       + 'achetés.</span></p>';
}

/* Membre Passion : le compteur green-fee est remplacé par un bandeau. Il n'est
   pas actionnable — ce n'est pas un solde, c'est un droit attaché à la
   cotisation. Les invitations y figurent pour la même raison : elles se
   décomptent à l'année, comme la cotisation, et non au geste comme un crédit.
   C'est la matière de la question 3 du §7 du brief, à trancher en revue. */
function unlimitedBanner(){
  var p = profile();
  return ''
    + '<div class="unlimited" data-role="unlimited">'
    +   '<div class="unlimited-head">'
    +     '<span class="unlimited-mark">' + icon('infinity') + '</span>'
    +     '<div>'
    +       '<p class="unlimited-title">Accès illimité</p>'
    +       '<p class="unlimited-text">Vos green-fees sont inclus, sans compteur '
    +         'ni carnet à recharger.</p>'
    +     '</div>'
    +   '</div>'
    +   '<ul class="spec">'
    +     '<li>Abonnement <b>' + membershipLabel() + '</b></li>'
    +     '<li>Périmètre <b>' + accessScope() + '</b></li>'
    +     '<li>Jusqu\'au <b>' + p.membership.endsOn + '</b></li>'
    +     '<li>Invitations <b>' + (p.invitations.total - p.invitations.used)
    +       ' sur ' + p.invitations.total + '</b></li>'
    +   '</ul>'
    + '</div>';
}

/* Les deux actions du brief. « Utiliser » ouvre le tunnel où ce crédit se
   dépense ; sans tunnel, elle reste affichée et désactivée avec son motif —
   une action qui disparaît laisse croire qu'elle n'existe pas.
   Un compteur vide n'a rien à utiliser : il ne porte plus qu'une action. */
function potActions(pot){
  var value = potValue(pot.id);
  if(value === 0){
    return '<div class="pot-actions is-single">'
         +   '<button type="button" class="btn is-quiet" data-act="pot-buy" '
         +     'data-value="' + pot.id + '">Acheter un carnet</button>'
         + '</div>';
  }
  var html = '<div class="pot-actions">'
    + '<button type="button" class="btn is-quiet"'
    +   (pot.use
       ? ' data-act="pot-use" data-value="' + pot.id + '"'
       : ' disabled aria-disabled="true"')
    + '>Utiliser</button>'
    + '<button type="button" class="btn is-quiet" data-act="pot-buy" '
    +   'data-value="' + pot.id + '">Acheter</button>'
    + '</div>';
  if(!pot.use) html += '<p class="pot-note">' + pot.useNote + '</p>';
  return html;
}

function potExpiry(pot){
  return '<span class="pot-expiry' + (expirySoon(pot.id) ? ' is-soon' : '') + '">'
       + 'Expire le ' + dmy(POT_EXPIRY[pot.id]) + '</span>';
}

/* Corps commun à la carte de l'écran principal et à l'en-tête du détail :
   label, solde en 28/600, expiration. Le brief le décrit une fois, il ne
   s'écrit donc qu'une fois. */
function potHeadBody(pot){
  var value = potValue(pot.id);
  return ''
    + '<span class="pot-mark">' + icon(pot.icon) + '</span>'
    + '<span class="pot-body">'
    +   '<span class="pot-label">' + pot.label + '</span>'
    +   '<span class="pot-value">' + potValueLabel(pot.id, value) + '</span>'
    +   (value === 0 ? '' : potExpiry(pot))
    + '</span>';
}

function potCard(pot){
  var value = potValue(pot.id);
  return ''
    + '<div class="pot" data-role="pot" data-pot="' + pot.id + '">'
    +   '<button type="button" class="pot-open" data-act="pot-open" '
    +     'data-value="' + pot.id + '" aria-label="' + pot.label
    +     ', voir l\'historique">'
    +     potHeadBody(pot)
    +     '<span class="pot-chevron">' + icon('chevron-right') + '</span>'
    +   '</button>'
    +   (value === 0 ? '<p class="pot-nudge">' + pot.empty + '</p>' : '')
    +   potActions(pot)
    + '</div>';
}

/* Emplacement V2. Le brief l'exige distinct des compteurs, et jamais comme un
   quatrième compteur : ni solde, ni action, ni chevron. */
function cagnotteCard(){
  if(!showsV2()) return '';
  return ''
    + '<div class="pot is-v2" data-role="cagnotte">'
    +   '<div class="pot-top">'
    +     '<span class="pot-mark">' + icon('coin') + '</span>'
    +     '<span class="pot-body">'
    +       '<span class="pot-head">'
    +         '<span class="pot-label">Cagnotte</span>'
    +         '<span class="chip is-v2">V2</span>'
    +       '</span>'
    +       '<span class="pot-text">Votre solde en euros, pour la boutique et '
    +         'les services du club. Conçue, développée en V2.</span>'
    +     '</span>'
    +   '</div>'
    + '</div>';
}

function screenWallet(){
  var list = visiblePots();
  var cards = '';
  for(var i=0;i<list.length;i++) cards += potCard(list[i]);
  return walletLead()
       + (isPassion() ? unlimitedBanner() : '')
       + cards
       + cagnotteCard();
}

/* --- Le détail d'un compteur --------------------------------------------- */

function moveRow(id, m){
  var plus = (m.delta > 0);
  var tone = plus ? ' is-plus' : (m.kind === 'expiration' ? ' is-void' : '');
  var sign = plus ? '+' : '\u2212';
  return ''
    + '<div class="move" data-role="move" data-kind="' + m.kind + '">'
    +   '<span class="move-date">' + moveDate(m.offset) + '</span>'
    +   '<span class="move-body">'
    +     '<span class="move-kind">' + moveLabel(id, m) + '</span>'
    +     (m.site
       ? '<span class="move-site">' + m.site.name + ' &middot; ' + m.site.code + '</span>'
       : '')
    +   '</span>'
    +   '<span class="move-side">'
    +     '<span class="move-delta' + tone + '">' + sign
    +       potShort(id, Math.abs(m.delta)) + '</span>'
    +     '<span class="move-after">Solde ' + potShort(id, m.after) + '</span>'
    +   '</span>'
    + '</div>';
}

function screenWalletPot(){
  var pot = potById(STATE.wallet.potId);
  if(!pot) return screenNotFound();
  var moves = potHistory(pot.id);

  var body;
  if(moves.length){
    var rows = '';
    for(var i=0;i<moves.length;i++) rows += moveRow(pot.id, moves[i]);
    body = '<div class="moves" data-role="moves">' + rows + '</div>'
         + '<p class="moves-foot">Les mouvements plus anciens ne sont pas repris ici.</p>';
  } else {
    body = '<div class="moves-empty" data-role="moves-empty">'
         +   icon('history')
         +   '<p class="moves-empty-title">Aucun mouvement</p>'
         +   '<p class="moves-empty-text">Ce compteur n\'a pas encore servi.</p>'
         + '</div>';
  }

  return ''
    + '<div class="pot is-detail" data-role="pot-head" data-pot="' + pot.id + '">'
    +   '<div class="pot-top">' + potHeadBody(pot) + '</div>'
    +   potActions(pot)
    + '</div>'
    + '<p class="wallet-lead" data-role="pot-lead">' + icon('info-circle')
    +   '<span>Le code du site rappelle où chaque crédit a été acheté ou '
    +   'utilisé. Il ne restreint pas son usage : votre solde reste le '
    +   'même partout.</span></p>'
    + '<section class="section">'
    +   '<p class="eyebrow">Historique</p>'
    +   body
    + '</section>';
}

/* --- Le tunnel d'achat ---------------------------------------------------- */

/* Pied des deux étapes d'achat. Le montant vient de packTotal() : aucune étape
   ne compose le sien, même règle qu'au green-fee et au cours. */
function walletFoot(note, button){
  var total = packTotal();
  return ''
    + '<div class="stepfoot" data-role="stepfoot">'
    +   '<p class="total">'
    +     '<span class="total-label">Total</span>'
    +     '<span class="total-value" data-role="total">'
    +       (total > 0 ? amount(total) : '\u2014')
    +     '</span>'
    +   '</p>'
    +   (note ? '<p class="total-note">' + note + '</p>' : '')
    +   button
    + '</div>';
}

function packRow(id, rank){
  var pack = packAt(id, rank);
  var on = (STATE.wallet.packIndex === rank);
  return ''
    + '<button type="button" class="pack' + (on ? ' is-on' : '') + '" '
    +   'data-act="pack-pick" data-value="' + rank + '" '
    +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '">'
    +   '<span class="pack-mark">' + icon('check') + '</span>'
    +   '<span class="pack-body">'
    +     '<span class="pack-title">' + potAmountLabel(id, pack.size) + '</span>'

/* --- Sélections du portefeuille ------------------------------------------ */

function openPot(id){
  if(!potAvailable(id)) return false;
  STATE.wallet.potId = id;
  navigate('/wallet/pot');
  return true;
}

/* « Utiliser » ouvre le tunnel où ce crédit se dépense. Le portefeuille reste
   dans la pile : le retour y ramène. */
function usePot(id){
  var pot = potById(id);
  if(!pot || !pot.use) return false;
  if(pot.use === '/book/gf') return startGreenfee();
  navigate(pot.use);
  return true;
}

/* Entrer dans le tunnel d'achat repart d'un carnet non retenu : un choix fait
   sur un autre compteur n'a pas de sens ici. */
function startBuy(id){
  if(!potAvailable(id)) return false;
  clearWalletDraft();
  STATE.wallet.buyPotId = id;
  navigate('/wallet/buy');
  return true;
}

function pickPack(rank){
  var n = parseInt(rank, 10);
  if(!packAt(STATE.wallet.buyPotId, n)) return false;
  STATE.wallet.packIndex = n;
  refresh();
  return true;
}

/* Même état d'attente qu'au règlement d'un départ ou d'un cours : un paiement
   instantané ne montre pas l'état de chargement que le lot doit couvrir. */
function buyPack(){
  var w = STATE.wallet;
  if(w.paying) return false;
  var pack = pickedPack();
  if(!pack) return false;
  w.paying = true;
  refresh();
  window.setTimeout(function(){
    w.paying = false;
    w.moves.push({ pot:w.buyPotId, delta:pack.size, site:currentSite() });
    w.reference = makePurchaseReference();
    navigate('/wallet/buy/confirm');
  }, PAY_DELAY);
  return true;
}

/* Sortir du tunnel : le carnet est acheté, le brouillon n'a plus lieu d'être.
   Le solde, lui, reste — c'est tout l'objet de l'achat. */
function finishPurchase(){
  clearWalletDraft();
  setRoot('/wallet');
  return true;
}

/* =========================================================================
   6g. Notifications — lot 5
   ========================================================================= */

/* --- Bandeau d'état système ----------------------------------------------

   Deux cas, et un seul bandeau. La permission jamais demandée est une
   invitation ; la permission coupée est une panne que l'application ne peut
   pas réparer — elle dit où aller, elle ne propose pas un interrupteur
   qu'elle n'a pas. Le centre continue de recevoir dans les deux cas : ce qui
   manque, c'est l'annonce sur le téléphone, pas le message. */
function pushBanner(){
  if(pushGranted()) return '';

  if(pushBlocked()){
    return ''
      + '<div class="sysbanner is-off" data-role="sysbanner" data-state="off">'
      +   icon('bell-off')
      +   '<div class="sysbanner-body">'
      +     '<p class="sysbanner-title">Les notifications sont coupées sur cet '
      +       'appareil</p>'
      +     '<p class="sysbanner-text">Vos messages continuent d\'arriver ici, mais '
      +       'votre téléphone ne les annonce plus. Cela se rétablit dans ses '
      +       'réglages.</p>'
      +     '<button type="button" class="btn is-quiet" '
      +       'data-nav="/notifications/system">Voir la marche à suivre</button>'
      +   '</div>'
      + '</div>';
  }

  return ''
    + '<div class="sysbanner" data-role="sysbanner" data-state="ask">'
    +   icon('bell')
    +   '<div class="sysbanner-body">'
    +     '<p class="sysbanner-title">Recevez vos rappels sur cet appareil</p>'
    +     '<p class="sysbanner-text">Les notifications ne sont pas encore activées. '
    +       'Vos rappels de départ et vos alertes de crédits n\'arriveront pas sur '
    +       'votre écran.</p>'
    +     '<button type="button" class="btn is-quiet" '
    +       'data-nav="/notifications/optin">Voir ce que vous recevrez</button>'
    +   '</div>'
    + '</div>';
}

/* --- Le centre ------------------------------------------------------------

   Liste chronologique, non lues en gras avec pastille or, groupées par
   « Cette semaine » et « Plus tôt ». La ligne entière est la cible : le brief
   demande qu'elle ouvre l'écran concerné, l'action proposée s'y lit en pied
   de ligne plutôt que dans un bouton de plus. */

function notifRow(n){
  var unread = notifIsUnread(n);
  return ''
    + '<button type="button" class="notif' + (unread ? ' is-unread' : '') + '" '
    +   'data-act="notif-open" data-value="' + n.id + '" '
    +   'data-type="' + n.type + '" data-role="notif" '
    +   'aria-label="' + escapeAttr(n.title) + (unread ? ', non lue' : '') + '">'
    +   '<span class="notif-mark">' + icon(n.icon)
    +     (unread ? '<span class="notif-dot" data-role="notif-dot"></span>' : '')
    +   '</span>'
    +   '<span class="notif-body">'
    +     '<span class="notif-head">'
    +       '<span class="notif-title">' + n.title + '</span>'
    +       '<span class="notif-when">' + notifWhen(n) + '</span>'
    +     '</span>'
    +     '<span class="notif-text">' + n.text + '</span>'
    +     '<span class="notif-cta">' + n.cta + icon('chevron-right') + '</span>'
    +   '</span>'
    + '</button>';
}

/* Boîte vide : une invitation à agir, pas un constat (brief §3). Ce qu'il y a
   à faire ici n'est pas de recevoir un message, c'est de choisir lesquels. */
function notifEmpty(){
  return ''
    + '<div class="notif-empty" data-role="notif-empty">'
    +   icon('bell')
    +   '<p class="notif-empty-title">Rien de neuf</p>'
    +   '<p class="notif-empty-text">Vos rappels de départ, vos alertes de crédits '
    +     'et les travaux annoncés sur vos parcours arriveront ici.</p>'
    +   '<button type="button" class="btn is-quiet" data-nav="/notifications/prefs">'
    +     'Choisir vos notifications</button>'
    + '</div>';
}

function screenNotifs(){
  var groups = notifGroups();
  if(!groups.length) return pushBanner() + notifEmpty();

  var html = pushBanner();
  for(var g=0;g<groups.length;g++){
    var group = groups[g];
    var rows = '';
    for(var i=0;i<group.items.length;i++) rows += notifRow(group.items[i]);
    html += '<section class="section" data-role="notif-group" '
          +   'data-group="' + group.id + '">'
          +   '<p class="eyebrow">' + group.label + '</p>'
          +   '<div class="notifs">' + rows + '</div>'
          + '</section>';
  }
  return html;
}

/* --- Les préférences ------------------------------------------------------

   Opt-in par type et par canal (RGPD, brief lot 5). Une cellule par
   croisement : trois colonnes de 44 px, la cible tactile fixe la largeur
   avant le confort de lecture. Le SMS n'est ouvert que sur les deux rappels
   de dernière minute ; ailleurs la cellule porte un tiret, et le pied de
   liste dit pourquoi. */

function prefCell(type, channel){
  if(!channelOpen(type, channel)){
    return '<span class="pref-void" data-role="pref-void" aria-hidden="true">'
         + '\u2014</span>';
  }
  var on = notifPrefOn(type.id, channel);
  var editable = channelEditable(type, channel);
  return ''
    + '<button type="button" class="pref-box' + (on ? ' is-on' : '') + '" '
    +   'data-act="pref" data-value="' + type.id + ':' + channel + '" '
    +   'data-role="pref-box" role="checkbox" aria-checked="' + (on ? 'true' : 'false') + '" '
    +   (editable ? '' : 'disabled aria-disabled="true" ')
    +   'aria-label="' + escapeAttr(type.label) + ', ' + channelLabel(channel) + '">'
    +   '<span>' + icon('check') + '</span>'
    + '</button>';
}

function channelLabel(id){
  for(var i=0;i<NOTIF_CHANNELS.length;i++){
    if(NOTIF_CHANNELS[i].id === id) return NOTIF_CHANNELS[i].label;
  }
  return id;
}

function screenNotifPrefs(){
  var head = '<div class="pref-head"><span>Message</span>';
  for(var c=0;c<NOTIF_CHANNELS.length;c++){
    head += '<span>' + NOTIF_CHANNELS[c].label + '</span>';
  }
  head += '</div>';

  var rows = '';
  for(var i=0;i<NOTIF_TYPES.length;i++){
    var type = NOTIF_TYPES[i];
    var cells = '';
    for(var k=0;k<NOTIF_CHANNELS.length;k++){
      cells += prefCell(type, NOTIF_CHANNELS[k].id);
    }
    rows += '<div class="pref-row" data-role="pref-row" data-type="' + type.id + '">'
          +   '<span class="pref-label">'
          +     '<span class="pref-name">' + type.label + '</span>'
          +     '<span class="pref-when">' + type.when + '</span>'
          +   '</span>'
          +   cells
          + '</div>';
  }

  return ''
    + '<h2 class="screen-title">Ce que vous recevez</h2>'
    + '<p class="screen-text">Chaque type de message se règle canal par canal. '
    +   'Rien n\'est envoyé sur un canal que vous n\'avez pas ouvert.</p>'
    + '<section class="section">' + pushBanner() + '</section>'
    + '<div class="prefs" data-role="prefs" role="group" '
    +   'aria-label="Vos notifications, par type et par canal">'
    +   head + rows
    + '</div>'
    + '<p class="prefs-foot" data-role="sms-note">Le SMS est réservé aux rappels '
    +   'de dernière minute : la veille d\'un départ ou d\'une séance. Les autres '
    +   'messages ne l\'empruntent jamais.</p>'
    + '<p class="prefs-foot">Vous pouvez revenir sur ces choix à tout moment. '
    +   'Ils valent pour tous les golfs de la collection.</p>';
}

/* --- Amorce de permission -------------------------------------------------

   Elle passe avant la demande du système : demander à froid fait chuter le
   taux d'acceptation (brief lot 5). L'écran dit ce que le joueur va recevoir,
   avec les mêmes mots que les messages eux-mêmes, puis ouvre la boîte de
   dialogue du téléphone.

   Il reste atteignable une fois la réponse donnée : il dit alors ce qu'il en
   est, et où aller ensuite. Un écran qui disparaît après usage laisse le
   joueur sans explication s'il y revient. */

function primerItems(){
  var items = [
    { icon:'golf',        text:'Votre départ de demain, la veille au soir.' },
    { icon:'clock-hour-4', text:'Votre cours de demain, avec le téléphone du pro.' },
    { icon:'ticket',      text:'Vos crédits quand ils arrivent au bout ou qu\'ils expirent.' },
    { icon:'traffic-cone', text:'Les travaux annoncés sur les parcours du groupe.' }
  ];
  var html = '<ul class="primer-list" data-role="primer-list">';
  for(var i=0;i<items.length;i++){
    html += '<li>' + icon(items[i].icon) + '<span>' + items[i].text + '</span></li>';
  }
  return html + '</ul>';
}

/* Boîte de dialogue du système. Elle n'appartient pas à l'application : pas de
   marque, pas de fermeture au voile, deux réponses définitives. C'est la seule
   feuille du prototype qui ne se referme pas d'un toucher à côté. */
function systemDialog(){
  if(!STATE.notifs.dialog) return '';
  return ''
    + '<div class="sysalert" data-role="sysalert">'
    +   '<div class="sysalert-card" role="alertdialog" aria-modal="true" '
    +     'aria-label="Demande d\'autorisation du système">'

    +     '</div>'
    +     '<div class="sysalert-actions">'
    +       '<button type="button" class="sysalert-btn" data-act="push-refuse">'
    +         'Ne pas autoriser</button>'
    +       '<button type="button" class="sysalert-btn is-strong" data-act="push-allow">'
    +         'Autoriser</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';
}

function screenPushPrimer(){
  if(pushGranted()){
    return ''
      + '<div class="card">'

/* --- Notifications coupées au niveau du système ---------------------------

   Le seul écran du prototype dont l'action sort de l'application. Le bouton

   calendrier » et « Partager » au lot 2b : un bouton sans effet visible se lit

function screenSystemOff(){

/* --- Actions du lot ------------------------------------------------------- */

/* « Plus tard » referme l'amorce. Ouverte depuis le centre, elle se referme
   par le retour ; ouverte à la racine — une adresse tapée à la main — il n'y a
   rien derrière, et le bouton mène au centre plutôt que de ne rien faire. */
function pushLater(){
  if(stackDepth() > 1) return back();
  return navigate('/notifications');
}

function openPhoneSettings(){

}

function togglePref(value){

  if(parts.length !== 2) return false;
  if(!toggleNotifPref(parts[0], parts[1])) return false;
  refresh();
  return true;
}

    +   (isPassion()
        ? '<p class="field-help">Sans objet pour un membre Passion.</p>'
        : '<p class="field-help">Incomplète : l\'accueil affiche l\'encart de relance '
          + 'vers le profil.</p>')
    + '</div>'

    + '<div class="field' + (isPassion() ? ' is-muted' : '') + '">'
    +   '<span class="field-label">Crédits green-fee</span>'
    +   seg('credits', [
          { value:'full', label:'8' },
          { value:'low',  label:'1' },
          { value:'none', label:'Aucun' }
        ], STATE.demoCredits, isPassion())
    +   (isPassion()
        ? '<p class="field-help">Sans objet : l\'accès du membre Passion est '
          + 'illimité, il n\'a pas de compteur green-fee.</p>'
        : '<p class="field-help">« 1 » montre le paiement mixte crédits et carte '
          + 'à l\'étape 7.</p>')
    + '</div>'

    + '<div class="field">'
    +   '<span class="field-label">Carnet de cours</span>'
    +   seg('lessons', [
          { value:'profile', label:'Du profil' },
          { value:'low',     label:'30 min' },
          { value:'none',    label:'Aucun' }
        ], STATE.demoLessons, false)
    +   '<p class="field-help">« Du profil » reprend le jeu de données du brief : '
    +     '4 h en Passion, aucun crédit en licencié externe. « 30 min » montre '
    +     'le carnet qui ne couvre pas une séance d\'une heure.</p>'
    + '</div>'

    + '<div class="field">'
    +   '<span class="field-label">Notifications système</span>'
    +   seg('push', [
          { value:'ask', label:'À demander' },
          { value:'on',  label:'Autorisées' },
          { value:'off', label:'Coupées' }
        ], STATE.pushState, false)
    +   '<p class="field-help">« À demander » ouvre l\'amorce de permission avant '
    +     'la boîte de dialogue du système. « Coupées » montre le bandeau qui '
    +     'renvoie aux réglages du téléphone.</p>'
    + '</div>'

    + '<div class="field">'
    +   '<span class="field-label">Centre de notifications</span>'
    +   seg('notifs', [
          { value:'real', label:'Déduites de l\'état' },
          { value:'none', label:'Aucune' }
        ], STATE.demoNotifs, false)
    +   '<p class="field-help">Les messages se déduisent de l\'état : cotisation, '
    +     'soldes, travaux, réservations du jour. Les sept types ne se rencontrent '
    +     'jamais ensemble — la fin de cotisation est propre au membre Passion. '
    +     '« Aucune » montre la boîte vide.</p>'
    + '</div>'

    + '<button type="button" class="panel-action" data-control="pushopen">'
    +   'Ouvrir depuis une notification</button>'

    + '<button type="button" class="panel-action" data-control="reset">'
    +   'Réinitialiser les données</button>'

    + '<div class="readout" data-role="readout"></div>';

  renderReadout();
}

function renderReadout(){
  var out = node('readout');
  if(!out) return;
  var entry = currentEntry();
  out.innerHTML = '<dl>'
    + '<div><dt>Adresse</dt><dd>' + (entry ? entry.path : '-') + '</dd></div>'
    + '<div><dt>Pile</dt><dd>' + STATE.stack.length + '</dd></div>'
    + '<div><dt>Onglet</dt><dd>' + (entry ? entry.tab : '-') + '</dd></div>'
    + '<div><dt>isPassion</dt><dd>' + isPassion() + '</dd></div>'
    + '<div><dt>Prochain départ</dt><dd>' + STATE.demoBooking + '</dd></div>'
    + '<div><dt>Licence au dossier</dt><dd>' + hasLicence() + '</dd></div>'
    + '<div><dt>Crédits green-fee</dt><dd>' + gfCreditBalance() + '</dd></div>'
    + '<div><dt>Carnet de cours</dt><dd>' + hoursLabel(lessonCreditBalance())
    +   '</dd></div>'
    + '<div><dt>Total du départ</dt><dd>' + grandTotal() + '</dd></div>'
    + '<div><dt>Autorisation push</dt><dd>' + STATE.pushState + '</dd></div>'
    + '<div><dt>Notifications</dt><dd>' + unreadCount() + ' non lues sur '
    +   notifications().length + '</dd></div>'
    + '<div><dt>Réinitialisations</dt><dd>' + STATE.resets + '</dd></div>'
    + '<div><dt>Brouillon</dt><dd>' + draftReadout() + '</dd></div>'
    + '<div><dt>Cours</dt><dd>' + lessonReadout() + '</dd></div>'
    + '<div><dt>Portefeuille</dt><dd>' + walletReadout() + '</dd></div>'
    + '</dl>';
}

/* Résumé du brouillon de réservation, pour le lecteur d'état et les tests. */
function draftReadout(){
  var d = STATE.draft;
  if(!d.siteCode) return 'vide';
  var site = draftSite();
  var out = site ? site.code : '-';
  if(d.courseIndex !== null && site) out += ' / ' + site.courses[d.courseIndex].name;
  if(d.dayOffset !== null) out += ' / J+' + d.dayOffset;
  if(d.slotKey) out += ' / ' + d.slotKey;
  if(d.players.length) out += ' / ' + d.players.length + 'j';
  if(d.payment) out += ' / ' + d.payment;
  if(d.reference) out += ' / ' + d.reference;
  return out;
}

/* Résumé du brouillon de cours, pour le lecteur d'état et les tests. */
function lessonReadout(){
  var l = STATE.lesson;
  if(!l.mode) return 'vide';
  var out = l.mode;
  if(l.proId) out += ' / ' + l.proId;
  if(l.mode === 'solo') out += ' / ' + durationById(l.durationId).label;
  if(l.dayOffset !== null) out += ' / J+' + l.dayOffset;
  if(l.slotKey) out += ' / ' + l.slotKey;
  if(l.sessionId) out += ' / ' + l.sessionId;
  if(l.payment) out += ' / ' + l.payment;
  if(l.reference) out += ' / ' + l.reference;
  return out;
}

/* Soldes des compteurs visibles et brouillon d'achat, pour le lecteur d'état
   et les tests. */
function walletReadout(){
  var list = visiblePots();
  var out = [];
  for(var i=0;i<list.length;i++){
    out.push(list[i].id + ' ' + potShort(list[i].id, potValue(list[i].id)));
  }
  var w = STATE.wallet;
  if(w.buyPotId){
    var pack = pickedPack();
    out.push('achat ' + w.buyPotId + (pack ? ' / ' + pack.size : ''));
  }
  if(w.reference) out.push(w.reference);
  return out.join(' &middot; ');
}

/* Toute bascule de la barre de contrôle réinitialise l'état applicatif
   et ramène à l'accueil, sans recharger la page. Le brouillon du tunnel en
   fait partie : un départ retenu sous un persona n'a pas de sens sous
   l'autre, les tarifs et le périmètre ne sont pas les mêmes. */
function resetApp(){
  STATE.resets += 1;
  clearDraft();
  clearLesson();
  clearWallet();
  clearNotifs();
  setRoot('/home');
  renderPanel();
}

function setPersona(id){
  if(id !== 'passion' && id !== 'externe') return false;
  if(STATE.persona === id) return false;
  STATE.persona = id;
  resetApp();
  return true;
}

function setPassionScope(scope){
  if(scope !== 'mono' && scope !== 'region') return false;
  if(!isPassion()) return false;
  if(STATE.passionScope === scope) return false;
  STATE.passionScope = scope;
  resetApp();
  return true;
}

function setVersion(v){
  if(v !== 'v1' && v !== 'v1v2') return false;
  if(STATE.version === v) return false;
  STATE.version = v;
  resetApp();
  return true;
}

function setSite(code){
  var known = false;
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) known = true; }
  if(!known || STATE.siteCode === code) return false;
  STATE.siteCode = code;
  resetApp();
  return true;
}

function setDemoBooking(v){
  if(v !== 'soon' && v !== 'later' && v !== 'none') return false;
  if(STATE.demoBooking === v) return false;
  STATE.demoBooking = v;
  resetApp();
  return true;
}

function setDemoCredits(v){
  if(!Object.prototype.hasOwnProperty.call(GF_CREDIT_DEMO, v)) return false;
  if(isPassion()) return false;
  if(STATE.demoCredits === v) return false;
  STATE.demoCredits = v;
  resetApp();
  return true;
}

/* Solde du carnet de cours. Contrairement aux crédits green-fee, il vaut pour
   les deux personas : le membre Passion a lui aussi un carnet de cours. */
function setDemoLessons(v){
  if(!Object.prototype.hasOwnProperty.call(LESSON_CREDIT_DEMO, v)) return false;
  if(STATE.demoLessons === v) return false;
  STATE.demoLessons = v;
  resetApp();
  return true;
}

/* Autorisation système. Comme les autres réglages de la barre de contrôle,
   la changer réinitialise l'état applicatif : les lectures et les choix de
   notification appartiennent au compte, pas à l'appareil. */
function setPushState(v){
  if(v !== 'ask' && v !== 'on' && v !== 'off') return false;
  if(STATE.pushState === v) return false;
  STATE.pushState = v;
  resetApp();
  return true;
}

function setDemoNotifs(v){
  if(v !== 'real' && v !== 'none') return false;
  if(STATE.demoNotifs === v) return false;
  STATE.demoNotifs = v;
  resetApp();
  return true;
}

function setLicenceOnFile(v){
  if(v !== 'on' && v !== 'off') return false;
  if(isPassion()) return false;
  var next = (v === 'on');
  if(STATE.licenceOnFile === next) return false;
  STATE.licenceOnFile = next;
  resetApp();
  return true;
}

function resetData(){
  STATE.demoBooking = 'later';
  STATE.licenceOnFile = true;
  STATE.demoCredits = 'full';
  STATE.demoLessons = 'profile';
  STATE.pushState = 'ask';
  STATE.demoNotifs = 'real';
  resetApp();
  return true;
}

/* =========================================================================
   8. Interactions
   ========================================================================= */

function bindDevice(){
  var device = node('device');

  device.addEventListener('click', function(e){
    var target = e.target;
    if(!target || typeof target.closest !== 'function') return;

    var nav = target.closest('[data-nav]');
    if(nav){ navigate(nav.getAttribute('data-nav')); return; }

    var backBtn = target.closest('[data-role="back"]');
    if(backBtn){ back(); return; }

    var homeBtn = target.closest('[data-role="home"]');
    if(homeBtn){ selectTab('home'); return; }

    var backTarget = target.closest('[data-backto]');
    if(backTarget){ backTo(backTarget.getAttribute('data-backto')); return; }

    if(target.getAttribute && target.getAttribute('data-role') === 'sheet'){
      /* Deux tunnels posent des feuilles : le voile ferme celle qui est
         ouverte, jamais l'autre. */
      if(STATE.lesson.sheet) closeLessonSheet();
      else closeSheet();
      return;
    }

    var pick = target.closest('[data-pick]');
    if(pick && !pick.disabled){
      var what = pick.getAttribute('data-pick');
      var value = pick.getAttribute('data-value');
      if(what === 'site') pickSite(value);
      else if(what === 'course') pickCourse(value);
      else if(what === 'day') pickDay(value);
      else if(what === 'slot') pickSlot(value);
      else if(what === 'pro') pickPro(value);
      else if(what === 'lday') pickLessonDay(value);
      else if(what === 'lslot') pickLessonSlot(value);
      else if(what === 'session') pickSession(value);
      return;
    }

    var act = target.closest('[data-act]');
    if(act && !act.disabled){
      var name = act.getAttribute('data-act');
      var value = act.getAttribute('data-value');
      if(name === 'gf-start') startGreenfee();
      else if(name === 'month-toggle') toggleMonth();
      else if(name === 'month-prev') shiftMonth(-1);
      else if(name === 'month-next') shiftMonth(1);
      else if(name === 'party') setParty(value);
      else if(name === 'to-options') navigate('/book/gf/options');
      else if(name === 'to-pay') navigate('/book/gf/pay');
      else if(name === 'sheet-open') openSheet('relatives');
      else if(name === 'sheet-guest') openSheet('guest');
      else if(name === 'sheet-close') closeSheet();
      else if(name === 'relative-add') addRelative(value);
      else if(name === 'guest-add') addGuest();
      else if(name === 'player-drop') dropPlayer(value);
      else if(name === 'player-terms') openTerms(value);
      else if(name === 'invite') setInvite(value);
      else if(name === 'payer') setPayer(value);
      else if(name === 'pay-all') payForAll();
      else if(name === 'opt-more') setOption(value, 1);
      else if(name === 'opt-less') setOption(value, -1);
      else if(name === 'pay-pick') choosePayment(value);
      else if(name === 'book-now') bookNow();
      else if(name === 'add-calendar') addToCalendar();
      else if(name === 'share-booking') shareBooking();
      else if(name === 'finish') finishBooking();
      else if(name === 'lesson-solo') startLessonSolo();
      else if(name === 'lesson-group') startLessonGroup();
      else if(name === 'duration') setLessonDuration(value);
      else if(name === 'lmonth-prev') shiftLessonMonth(-1);
      else if(name === 'lmonth-next') shiftLessonMonth(1);
      else if(name === 'filter-open') openLessonSheet(value);
      else if(name === 'filter-pro') setLessonFilter('pro', value);
      else if(name === 'filter-theme') setLessonFilter('theme', value);
      else if(name === 'filter-when') setLessonFilter('when', value);
      else if(name === 'filters-clear') clearLessonFilters();
      else if(name === 'waitlist') askWaitlist(value);
      else if(name === 'lesson-sheet-close') closeLessonSheet();
      else if(name === 'lesson-pay-pick') chooseLessonPayment(value);
      else if(name === 'lesson-book') bookLesson();
      else if(name === 'lesson-calendar') addLessonToCalendar();
      else if(name === 'lesson-share') shareLesson();
      else if(name === 'lesson-finish') finishLesson();
      else if(name === 'lesson-open') openLessonBooking(value);
      else if(name === 'lesson-cancel-open') openLessonSheet('cancel');
      else if(name === 'lesson-cancel') cancelLessonBooking();
      else if(name === 'pot-open') openPot(value);
      else if(name === 'pot-use') usePot(value);
      else if(name === 'pot-buy') startBuy(value);
      else if(name === 'pack-pick') pickPack(value);
      else if(name === 'to-wallet-pay') navigate('/wallet/buy/pay');
      else if(name === 'wallet-pay') buyPack();
      else if(name === 'wallet-finish') finishPurchase();
      else if(name === 'notif-open') openNotification(value);
      else if(name === 'pref') togglePref(value);
      else if(name === 'push-ask') askPush();
      else if(name === 'push-allow') answerPush(true);
      else if(name === 'push-refuse') answerPush(false);
      else if(name === 'push-later') pushLater();
      else if(name === 'open-settings') openPhoneSettings();
      else if(name === 'works-dates') openWorksDates();
      return;
    }

    var tab = target.closest('[data-tab]');
    if(tab && !tab.disabled){ selectTab(tab.getAttribute('data-tab')); return; }
  });

  device.addEventListener('input', function(e){
    var field = e.target && e.target.getAttribute
      ? e.target.getAttribute('data-field') : null;
    if(field) setGuestField(field, e.target.value);
  });

  bindSwipeBack(device);
}

/* Retour par balayage depuis le bord gauche — convention native (brief §2). */
function bindSwipeBack(device){
  if(typeof window.PointerEvent !== 'function') return;
  var dragging = false;
  var startX = 0;
  var top = null;
  var below = null;

  device.addEventListener('pointerdown', function(e){
    if(e.clientX === undefined) return;
    var rect = device.getBoundingClientRect();
    if(e.clientX - rect.left > 24) return;
    if(STATE.stack.length < 2) return;
    var here = currentEntry();
    if(here && here.route.terminal) return;
    dragging = true;
    startX = e.clientX;
    top = currentEntry().el;
    below = STATE.stack[STATE.stack.length - 2].el;
    below.hidden = false;
    applyScroll(below, STATE.stack[STATE.stack.length - 2].scroll);
    top.classList.add('is-dragging');
    below.classList.add('is-dragging', 'is-behind');
  });

  device.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = Math.max(0, e.clientX - startX);
    var ratio = Math.min(1, dx / 260);
    top.style.transform = 'translateX(' + dx + 'px)';
    below.style.transform = 'translateX(' + (-24 + 24 * ratio) + '%)';
    below.style.opacity = String(0.55 + 0.45 * ratio);
  });

  var end = function(e){
    if(!dragging) return;
    dragging = false;
    var dx = Math.max(0, (e.clientX || 0) - startX);
    top.classList.remove('is-dragging');
    below.classList.remove('is-dragging');
    top.style.transform = '';
    below.style.transform = '';
    below.style.opacity = '';
    if(dx > 80){ back(); }
    else { below.classList.remove('is-behind'); below.hidden = true; }
  };

  device.addEventListener('pointerup', end);
  device.addEventListener('pointercancel', end);
}

function bindPanel(){
  var panel = node('panel');

  panel.addEventListener('click', function(e){
    var target = e.target;
    if(!target || typeof target.closest !== 'function') return;
    var btn = target.closest('[data-control]');
    if(!btn || btn.disabled || btn.tagName === 'SELECT') return;
    var control = btn.getAttribute('data-control');
    var value = btn.getAttribute('data-value');
    if(control === 'persona') setPersona(value);
    else if(control === 'scope') setPassionScope(value);
    else if(control === 'version') setVersion(value);
    else if(control === 'booking') setDemoBooking(value);
    else if(control === 'licence') setLicenceOnFile(value);
    else if(control === 'credits') setDemoCredits(value);
    else if(control === 'lessons') setDemoLessons(value);
    else if(control === 'push') setPushState(value);
    else if(control === 'notifs') setDemoNotifs(value);
    else if(control === 'pushopen') openFromPush();
    else if(control === 'reset') resetData();
  });

  panel.addEventListener('change', function(e){
    if(e.target && e.target.getAttribute && e.target.getAttribute('data-control') === 'site'){
      setSite(e.target.value);
    }
  });
}

/* =========================================================================
   9. Amorçage
   ========================================================================= */

function boot(){
  renderPanel();
  bindDevice();
  bindPanel();
  window.addEventListener('hashchange', onHashChange);

  var start = pathFromHash();
  if(!ROUTES[start]) start = '/home';
  setRoot(start);
  renderPanel();
}

boot();
