<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance Golf Collection — Prototype application client</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
/* =========================================================================
   1. Tokens — seul bloc du fichier autorisé à contenir des valeurs
      hexadécimales. Toute couleur ailleurs passe par var(--token).
   ========================================================================= */
:root{
  /* Couleurs de marque et d'interface (brief §3) */
  --gold:#d6a644;
  --gold-dark:#b08833;
  --gold-soft:#faf7ec;
  --ink:#1a1a18;
  --ink-2:#5c5b56;
  --ink-3:#8f8d86;
  --line:#e6e3db;
  --surface:#ffffff;
  --canvas:#f7f6f2;
  --positive:#2f7d55;
  --attention:#c1642a;
  --negative:#b3352e;

  /* Chrome du prototype, hors device */
  --proto-bg:#e9e7e1;
  --proto-line:#d8d4ca;
  --proto-ink:#3a3935;
  --proto-ink-2:#77746c;
  --bezel:#12120f;

  /* Voiles et ombres — dérivés des couleurs ci-dessus */
  --scrim:rgba(26,26,24,.06);
  --scrim-strong:rgba(26,26,24,.12);
  /* Voile de la boite de dialogue du systeme, lot 5. Plus dense que celui des
     feuilles de l'application : ce qui s'affiche par-dessus n'appartient plus
     a l'application, et doit se lire comme tel. */
  --scrim-system:rgba(26,26,24,.32);
  --tint-gold:rgba(214,166,68,.14);
  --shadow-card:0 1px 2px rgba(0,0,0,.04);
  --shadow-device:0 24px 64px rgba(0,0,0,.20);

  /* Échelle typographique 28/22/17/15/13/11 */
  --t-28:28px;
  --t-22:22px;
  --t-17:17px;
  --t-15:15px;
  --t-13:13px;
  --t-11:11px;
  --w-regular:400;
  --w-medium:500;
  --w-semi:600;

  /* Rayons */
  --r-card:14px;
  --r-btn:12px;
  --r-device:44px;
  --r-pill:999px;

  /* Gabarit device (brief lot 0) */
  --device-w:390px;
  --device-h:844px;
  --safe-top:44px;
  --safe-bottom:34px;
  --header-h:52px;
  --tabbar-h:56px;

  /* Mouvement */
  --dur-push:220ms;
  --ease-push:cubic-bezier(.32,.72,0,1);

  /* Familles */
  --font:"Inter","Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-push:0ms; }
}

/* =========================================================================
   2. Plan de travail — hors device
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  padding:40px 32px;
  min-height:100vh;
  background:var(--proto-bg);
  font-family:var(--font);
  color:var(--proto-ink);
  -webkit-font-smoothing:antialiased;
}

.proto{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

/* =========================================================================
   3. Frame device 390 x 844
   ========================================================================= */
.device{
  flex:0 0 auto;
  padding:12px;
  background:var(--bezel);
  border-radius:calc(var(--r-device) + 12px);
  box-shadow:var(--shadow-device);
}

.device-screen{
  position:relative;
  width:var(--device-w);
  height:var(--device-h);
  border-radius:var(--r-device);
  overflow:hidden;
  background:var(--canvas);
  display:flex;
  flex-direction:column;
  color:var(--ink);
  font-size:var(--t-15);
  line-height:1.4;
}

/* --- Safe area haute et en-tête --- */
.top{
  flex:0 0 auto;
  position:relative;
  z-index:2;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.top.is-brand{ background:var(--gold-soft); }

.statusbar{
  height:var(--safe-top);
  padding:0 26px 0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:var(--t-13);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.statusbar-icons{ display:flex; align-items:center; gap:5px; font-size:15px; }

.appbar{
  height:var(--header-h);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 52px;
}
.appbar-title{
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.appbar-slot{
  position:absolute;
  top:0;
  bottom:0;
  display:flex;
  align-items:center;
}
.appbar-slot.is-left{ left:4px; }
.appbar-slot.is-right{ right:4px; }

.icon-btn{
  width:44px;
  height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:none;
  color:var(--ink);
  font-size:22px;
  border-radius:var(--r-pill);
  cursor:pointer;
  font-family:inherit;
}
.icon-btn:active{ background:var(--scrim); }

/* --- Viewport et pile de navigation --- */
/* Le bloc conteneur des feuilles modales est ici, et non sur .screen.
   Defaut trouve au lot 3 : une feuille en position:fixed prend pour reference
   le premier ascendant transforme. Tant que c'etait .screen — qui est aussi
   le conteneur de defilement — la feuille suivait le contenu et sortait du
   cadre des qu'on l'ouvrait depuis le bas d'un ecran long. .viewport ne
   defile pas : la feuille reste calee sur la zone visible du device. */
.viewport{
  position:relative;
  flex:1 1 auto;
  overflow:hidden;
  will-change:transform;
}

.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--canvas);
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{ width:0; height:0; }
.screen[hidden]{ display:none; }
.screen.is-animated{
  transition:transform var(--dur-push) var(--ease-push),
             opacity var(--dur-push) var(--ease-push);
}
.screen.is-offstage{ transform:translateX(100%); }
.screen.is-behind{ transform:translateX(-24%); opacity:.55; }
.screen.is-dragging{ transition:none; }

.screen-inner{ padding:20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

/* --- Safe area basse et barre d'onglets --- */
.bottom{
  flex:0 0 auto;
  position:relative;
  z-index:2;
  background:var(--surface);
  border-top:1px solid var(--line);
}

.tabbar{
  height:var(--tabbar-h);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.tab{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  min-height:44px;
  padding:6px 2px 4px;
  border:0;
  background:none;
  cursor:pointer;
  font-family:inherit;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  color:var(--ink-3);
}
.tab.is-active{ color:var(--gold); }
.tab[disabled]{ opacity:.38; cursor:default; }
.tab-icon{ position:relative; display:block; font-size:24px; line-height:1; }
.tab-label{ display:block; letter-spacing:.01em; }
.tab-badge{
  position:absolute;
  top:-4px;
  left:100%;
  margin-left:-6px;
  padding:0 4px;
  border-radius:var(--r-pill);
  background:var(--ink-3);
  color:var(--surface);
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  line-height:14px;
}
.tab.is-active .tab-badge{ background:var(--gold); }

.home-indicator{
  height:var(--safe-bottom);
  display:flex;
  align-items:center;
  justify-content:center;
}
.home-indicator span{
  display:block;
  width:134px;
  height:5px;
  border-radius:var(--r-pill);
  background:var(--ink);
  opacity:.85;
}

/* =========================================================================
   4. Composants d'écran
   ========================================================================= */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  padding:20px 18px;
}
.card + .card{ margin-top:12px; }

.card-mark{
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:14px;
}
.card-mark.is-alert{ background:var(--surface); color:var(--negative); border:1px solid var(--line); }

.screen-title{
  margin:0 0 6px;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:-.01em;
}
.screen-text{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-regular);
  color:var(--ink-2);
}
.screen-text + .screen-text{ margin-top:8px; }

.eyebrow{
  margin:0 0 10px;
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-3);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:48px;
  margin-top:16px;
  padding:0 18px;
  border:1px solid transparent;
  border-radius:var(--r-btn);
  font-family:inherit;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  cursor:pointer;
}
.btn.is-primary{ background:var(--gold); color:var(--ink); }
.btn.is-primary:active{ background:var(--gold-dark); }
.btn.is-quiet{ background:var(--surface); color:var(--ink); border-color:var(--line); }
.btn.is-quiet:active{ background:var(--canvas); }

.spec{
  margin:14px 0 0;
  padding:0;
  list-style:none;
  border-top:1px solid var(--line);
}
.spec li{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-3);
}
.spec b{
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  text-align:right;
}

.ghosts{ margin-top:20px; }
.ghost{
  height:72px;
  margin-bottom:10px;
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* =========================================================================
   4b. Accueil — lot 1
   ========================================================================= */

/* Fond de marque pour les surfaces editoriales. Porte par un attribut et non
   par une classe : le lot 0 verifie que className vaut exactement "screen". */
.screen[data-tone="brand"]{ background:var(--gold-soft); }

/* Sur l'accueil le titre est porte par le contenu (grand titre iOS).
   Le titre d'en-tete reste dans le DOM pour les technologies d'assistance. */
.top.is-brand .appbar-title{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  white-space:nowrap;
  clip-path:inset(50%);
}

.section{ margin-top:22px; }

/* --- En-tete d'accueil --- */
.hero{ margin:-2px 0 4px; }
.hero-hello{
  margin:0 0 2px;
  font-size:var(--t-28);
  font-weight:var(--w-semi);
  letter-spacing:-.02em;
  color:var(--ink);
}
.hero-site{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:44px;
  margin-left:-8px;
  padding:0 8px;
  border:0;
  border-radius:var(--r-btn);
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.hero-site:active{ background:var(--scrim); }
.hero-site .ti{ font-size:18px; }
.hero-site .is-chevron{ color:var(--ink-3); }

/* --- Prochaine reservation --- */
.booking{
  display:block;
  width:100%;
  padding:16px 18px 18px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.booking:active{ background:var(--canvas); }
.booking.is-soon{ border-color:var(--gold); }
.booking-day{
  margin:0 0 8px;
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  color:var(--ink-3);
}
.booking-main{
  margin:0;
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 10px;
}
.booking-time{
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:-.01em;
}
.booking-course{
  font-size:var(--t-17);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.booking-meta{
  margin:8px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.booking-meta b{ font-weight:var(--w-medium); color:var(--positive); }
.booking-flag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:6px 11px;
  border-radius:var(--r-pill);
  background:var(--gold);
  color:var(--ink);
  font-size:var(--t-13);
  font-weight:var(--w-semi);
}

/* --- Etat vide : aucun depart a venir --- */
.empty{ padding:0; overflow:hidden; }
.empty-body{ padding:18px; }
.empty .screen-title{ margin-bottom:6px; }
.photo{
  display:block;
  width:100%;
  height:148px;
}
.photo .sky{ stop-color:var(--gold-soft); }
.photo .dusk{ stop-color:var(--gold); }
.photo .fairway{ fill:var(--positive); opacity:.34; }
.photo .green{ fill:var(--positive); opacity:.58; }
.photo .ridge{ fill:var(--ink-3); opacity:.22; }

/* --- Raccourcis --- */
.shortcuts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.shortcuts.is-single{ grid-template-columns:1fr; }
.shortcuts.is-single .shortcut{
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  min-height:64px;
}
.shortcut{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  min-height:96px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  text-align:left;
  cursor:pointer;
}
.shortcut:active{ background:var(--canvas); }
.shortcut-mark{
  width:34px;
  height:34px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* --- Bande credits --- */
.credits{
  display:block;
  width:100%;
  padding:14px 16px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.credits:active{ background:var(--canvas); }
.credits-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.credit{
  min-width:0;
  padding-left:11px;
  border-left:2px solid var(--line);
}
.credit-value{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.credit-label{
  margin:2px 0 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.credit.is-open{ border-left-color:var(--gold); }
.credit.is-zero{ border-left-color:var(--attention); }
.credit.is-zero .credit-value{ color:var(--attention); }
.credits-notes{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin:14px 0 0;
  padding-top:11px;
  border-top:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.credits-notes b{ font-weight:var(--w-medium); color:var(--ink-2); }
.credits-nudge{
  margin:12px 0 0;
  padding-top:11px;
  border-top:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.credits-nudge span{ color:var(--gold-dark); font-weight:var(--w-medium); }

/* --- Encart de profil incomplet --- */
.notice{
  padding:16px 18px 18px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.notice-head{ display:flex; align-items:flex-start; gap:12px; }
.notice-icon{
  flex:0 0 auto;
  width:32px;
  height:32px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}
.notice-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.notice-text{
  margin:5px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.notice .btn{ margin-top:14px; min-height:44px; font-size:var(--t-15); }

/* --- Alertes contextuelles --- */
.alert{
  padding:14px 16px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.alert + .alert{ margin-top:10px; }
.alert-head{ display:flex; align-items:flex-start; gap:12px; }
.alert-icon{
  flex:0 0 auto;
  width:28px;
  height:28px;
  border-radius:var(--r-pill);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  background:var(--canvas);
  color:var(--ink-2);
}
.alert.is-attention .alert-icon{ background:var(--gold-soft); color:var(--attention); }
.alert-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.alert.is-attention .alert-title{ color:var(--attention); }
.alert-text{
  margin:4px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.alert .btn{ margin-top:12px; min-height:44px; font-size:var(--t-15); }


/* =========================================================================
   4c. Tunnel de reservation green-fee - lot 2, etapes 1 a 4
   ========================================================================= */

/* --- Entree de l'onglet Reserver --- */
.pick{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:16px 16px 16px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  color:var(--ink);
  cursor:pointer;
}
.pick + .pick{ margin-top:10px; }
.pick:active{ background:var(--canvas); }
.pick-mark{
  flex:0 0 auto;
  width:44px;
  height:44px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}
/* Defaut trouve a l'oeil au lot 3 : les deux lignes d'une entree de choix
   etaient des span inline, donc collees l'une a l'autre (« Un departGreen-fee
   sur les huit parcours »). Le corps devient une colonne, comme celui des
   autres composants du fichier. */
.pick-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.pick-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.pick-text{
  margin:3px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.pick-chevron{ flex:0 0 auto; color:var(--ink-3); font-size:20px; }

/* --- Fil des choix deja faits, chaque maillon ramene a son etape --- */
.crumbs{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin:0 0 16px;
}
.crumb{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:32px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.crumb:active{ background:var(--canvas); }
.crumb .ti{ font-size:15px; color:var(--ink-3); }

/* --- Liste des sites, etape 1 --- */
.site{
  display:flex;
  align-items:stretch;
  gap:0;
  width:100%;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.site + .site{ margin-top:10px; }
.site:active{ background:var(--canvas); }
.site.is-home{ border-color:var(--gold); }
.site-body{
  flex:1 1 auto;
  min-width:0;
  padding:13px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px;
}
.site-name{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.site-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.site-far{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* --- Cartes de parcours, etape 2 --- */
.course{
  display:block;
  width:100%;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.course + .course{ margin-top:12px; }
.course:active{ background:var(--canvas); }
.course.is-selected{ border-color:var(--gold); }
.course-body{ padding:14px 16px 16px; }
.course-name{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.course-facts{
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  margin:7px 0 0;
  padding:0;
  list-style:none;
}
.course-facts li{
  font-size:var(--t-13);
  color:var(--ink-2);
}
.course-facts b{ font-weight:var(--w-medium); color:var(--ink); }
.course-closed{
  margin:9px 0 0;
  font-size:var(--t-13);
  color:var(--attention);
}

/* --- Bande de quatorze jours, etape 3 --- */
.daystrip{
  display:flex;
  gap:8px;
  margin:0 -16px;
  padding:2px 16px 4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.daystrip::-webkit-scrollbar{ width:0; height:0; }
.day{
  flex:0 0 auto;
  width:58px;
  min-height:72px;
  padding:9px 0 10px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  cursor:pointer;
  text-align:center;
}
.day-name{
  display:block;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-3);
}
.day-num{
  display:block;
  margin-top:3px;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:-.01em;
}
.day-month{
  display:block;
  margin-top:1px;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.day.is-selected{ border-color:var(--gold); background:var(--gold-soft); }
.day.is-selected .day-num{ color:var(--ink); }
.day[disabled]{ cursor:default; background:var(--canvas); }
.day[disabled] .day-num{ color:var(--ink-3); text-decoration:line-through; }
.day[disabled] .day-name,
.day[disabled] .day-month{ color:var(--ink-3); }

.daystrip-note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:12px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.daystrip-note .ti{ flex:0 0 auto; font-size:17px; color:var(--attention); }

/* --- Calendrier mensuel, etape 3 --- */
.month{
  margin-top:14px;
  padding:14px 14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.month-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.month-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.month-nav{
  width:44px;
  height:44px;
  border:0;
  border-radius:var(--r-pill);
  background:none;
  color:var(--ink);
  font-size:20px;
  cursor:pointer;
  font-family:inherit;
}
.month-nav[disabled]{ color:var(--ink-3); cursor:default; }
.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
}
.month-dow{
  padding:2px 0 6px;
  text-align:center;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-3);
}
.month-cell{
  min-height:40px;
  border:0;
  border-radius:10px;
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  cursor:pointer;
}
.month-cell.is-void{ cursor:default; }
.month-cell[disabled]{ color:var(--ink-3); cursor:default; }
.month-cell.is-closed{ text-decoration:line-through; }
.month-cell.is-selected{ background:var(--gold); color:var(--ink); font-weight:var(--w-semi); }

/* --- Liste des departs, etape 4 --- */

/* La mention de tete change de contenu selon le persona, jamais de place. */
.slots-lead{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin:0 0 16px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.slots-lead .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.slots-lead b{ font-weight:var(--w-semi); color:var(--ink); }

.slot-group + .slot-group{ margin-top:18px; }
.slot-group-head{
  position:sticky;
  top:0;
  z-index:1;
  margin:0;
  padding:8px 2px 8px;
  background:var(--canvas);
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* Pistes fixes, jamais auto : chaque ligne est une grille independante, des
   pistes dimensionnees au contenu ne s'aligneraient pas d'une ligne a l'autre.
   Le gabarit est porte par la liste et non par la ligne, pour que la colonne
   de prix apparaisse ou disparaisse pour toutes les lignes a la fois. */
.slots{
  --slot-time:56px;
  --slot-left:74px;
  --slot-price:0px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.slots.has-price{ --slot-price:62px; }

.slot{
  display:grid;
  grid-template-columns:var(--slot-time) 1fr var(--slot-left) var(--slot-price);
  align-items:center;
  column-gap:0;
  row-gap:0;
  width:100%;
  min-height:52px;
  padding:8px 14px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.slot:first-child{ border-top-color:transparent; }
.slot:active{ background:var(--canvas); }
.slot.is-selected{ background:var(--gold-soft); }
.slot[disabled]{ cursor:default; }

.slot-time{
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.slot-tags{
  min-width:0;
  min-height:24px;
  display:flex;
  align-items:center;
  gap:6px;
  padding-right:10px;
  overflow:hidden;
}
.slot-left{
  padding-left:10px;
  text-align:right;
  font-size:var(--t-13);
  color:var(--ink-2);
  white-space:nowrap;
}
.slot-price{
  padding-left:10px;
  text-align:right;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* Le libellé de hors-périmètre ne tient pas dans la colonne des variantes à
   côté d'un badge Twilight : il prend sa propre ligne, sous toute la largeur.
   Toutes les lignes de la liste sont concernées en même temps, la hauteur
   reste donc uniforme et les colonnes ne bougent pas. */
.slot-note{
  grid-column:1 / -1;
  padding-top:4px;
  font-size:var(--t-13);
  color:var(--attention);
}
.slot-note:empty{ display:none; }
/* Sans colonne de prix la piste vaut 0 : la cellule doit disparaitre avec
   elle, sans quoi elle rouvrirait une gouttiere a droite. */
.slots:not(.has-price) .slot-price{ display:none; }

.slot.is-full .slot-time{ color:var(--ink-3); }
.slot.is-full .slot-left{ color:var(--ink-3); }

.chip{
  display:inline-flex;
  align-items:center;
  padding:0 8px;
  min-height:22px;
  border-radius:var(--r-pill);
  background:var(--canvas);
  border:1px solid var(--line);
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  white-space:nowrap;
}
.chip.is-gold{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold-dark); }

.slots-foot{
  margin:12px 0 0;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* --- Vignette de parcours, variante reduite du placeholder du lot 1 --- */
.photo.is-thumb{ width:96px; height:auto; min-height:78px; flex:0 0 auto; }
.photo.is-card{ height:120px; }

/* --- Etat vide d'une etape --- */
.stepempty{
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.stepempty .screen-title{ font-size:var(--t-17); }
.stepempty .btn{ min-height:44px; font-size:var(--t-15); }


/* =========================================================================
   4d. Tunnel de reservation green-fee - lot 2, etapes 5 a 8
   ========================================================================= */

/* --- Gabarit des etapes a total : le pied reste visible en permanence.
       Le brief demande un total lisible sans defilement (etape 5). Le pied
       est colle en bas du cadre quand la page defile, et pousse en bas de
       colonne quand le contenu est court : sans cette seconde regle, un
       ecran peu rempli laisserait le total flotter au milieu du vide. --- */
.screen[data-path="/book/gf/players"] .screen-inner,
.screen[data-path="/book/gf/options"] .screen-inner,
.screen[data-path="/book/gf/pay"] .screen-inner,
.screen[data-path="/book/lessons/pay"] .screen-inner,
.screen[data-path="/wallet/buy"] .screen-inner,
.screen[data-path="/wallet/buy/pay"] .screen-inner{
  display:flex;
  flex-direction:column;
  min-height:100%;
  padding-bottom:0;
}
.stepbody{ flex:1 1 auto; }
.stepfoot{
  position:sticky;
  bottom:0;
  z-index:1;
  flex:0 0 auto;
  margin:20px -16px 0;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background:var(--surface);
  border-top:1px solid var(--line);
}

/* --- Total permanent --- */
.total{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
}
.total-label{ font-size:var(--t-13); color:var(--ink-2); }
.total-value{
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.total-note{
  margin:4px 0 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.stepfoot .btn{ margin-top:10px; }

/* --- Etape 5 : la liste des joueurs --- */
.players{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.player{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:14px;
  border-top:1px solid var(--line);
}
.player.is-guest{ padding-right:8px; }
.player:first-child{ border-top-color:transparent; }
.player-rank{
  flex:0 0 auto;
  width:26px;
  height:26px;
  margin-top:1px;
  border-radius:var(--r-pill);
  background:var(--canvas);
  color:var(--ink-3);
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  display:flex;
  align-items:center;
  justify-content:center;
}
.player.is-holder .player-rank{ background:var(--gold-soft); color:var(--gold-dark); }
.player-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.player-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.player-why{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.player-warn{
  margin:2px 0 0;
  font-size:var(--t-13);
  color:var(--attention);
}
.player-side{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
}
.player-price{
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.player-price.is-free{ color:var(--positive); font-weight:var(--w-medium); }
.player-drop{
  width:44px;
  height:44px;
  margin:-10px -10px -10px 0;
  border:0;
  background:none;
  color:var(--ink-3);
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.player-drop:active{ color:var(--negative); }

/* --- Decompte des invitations, membre Passion --- */
.quota{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0 0;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.quota .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.quota b{ font-weight:var(--w-semi); color:var(--ink); }
.quota.is-spent{ background:var(--surface); }
.quota.is-spent .ti{ color:var(--attention); }

/* --- Ajout d'un joueur --- */
.addbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:48px;
  margin-top:12px;
  padding:0 16px;
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
  cursor:pointer;
}
.addbtn:active{ background:var(--canvas); }
.addbtn[disabled]{ cursor:default; color:var(--ink-3); }
.addbtn .ti{ font-size:19px; color:var(--gold-dark); }
.addbtn[disabled] .ti{ color:var(--ink-3); }
.addnote{
  margin:8px 0 0;
  font-size:var(--t-13);
  color:var(--ink-3);
}

/* --- Feuille d'ajout : elle se pose sur l'ecran, sans quitter l'etape.
       Sortir de l'etape pour saisir un nom ferait perdre le fil du total. --- */
.sheet{
  position:fixed;
  inset:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:var(--scrim-strong);
}
.sheet-card{
  max-height:82%;
  overflow-y:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius:var(--r-card) var(--r-card) 0 0;
  background:var(--surface);
  scrollbar-width:none;
}
.sheet-card::-webkit-scrollbar{ width:0; height:0; }
.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.sheet-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.sheet-close{
  width:44px;
  height:44px;
  margin:-10px -10px -10px 0;
  border:0;
  background:none;
  color:var(--ink-2);
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.sheet-lead{
  margin:0 0 12px;
  font-size:var(--t-13);
  color:var(--ink-2);
}

.rel{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:56px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.rel + .rel{ margin-top:8px; }
.rel:active{ background:var(--canvas); }
.rel[disabled]{ cursor:default; background:var(--canvas); }
.rel-mark{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:var(--r-pill);
  background:var(--gold-soft);
  color:var(--gold-dark);
  font-size:var(--t-13);
  font-weight:var(--w-semi);
  display:flex;
  align-items:center;
  justify-content:center;
}
.rel[disabled] .rel-mark{ background:var(--canvas); color:var(--ink-3); }
.rel-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.rel-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.rel-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.rel-side{ flex:0 0 auto; font-size:var(--t-13); color:var(--ink-3); }
.rel[disabled] .rel-name{ color:var(--ink-3); }

.sheet-sep{
  margin:16px 0 12px;
  border:0;
  border-top:1px solid var(--line);
}

/* --- Saisie d'un invite --- */
.form-row{ margin-bottom:12px; }
.form-label{
  display:block;
  margin-bottom:6px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.input{
  display:block;
  width:100%;
  min-height:48px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-15);
  color:var(--ink);
}
.input:focus{ outline:2px solid var(--gold); outline-offset:-2px; }
.form-hint{
  margin:6px 0 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.form-error{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:12px 0 0;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--canvas);
  font-size:var(--t-13);
  color:var(--negative);
}
.form-error .ti{ flex:0 0 auto; font-size:17px; }

/* --- Etape 6 : les options --- */
.opts{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.opt{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-top:1px solid var(--line);
}
.opt:first-child{ border-top-color:transparent; }
.opt-mark{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  font-size:21px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.opt-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.opt-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.opt-price{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.opt-price.is-included{ color:var(--positive); }
.opt-note{
  margin:0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.stepper{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:2px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
}
.stepper button{
  width:40px;
  height:40px;
  border:0;
  background:none;
  border-radius:var(--r-pill);
  color:var(--ink);
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.stepper button:active{ background:var(--canvas); }
.stepper button[disabled]{ cursor:default; color:var(--ink-3); }
.stepper-val{
  min-width:22px;
  text-align:center;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}

/* --- Etape 7 : le paiement. Aucune option n'est preselectionnee. --- */
.payopt{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:15px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.payopt + .payopt{ margin-top:10px; }
.payopt:active{ background:var(--canvas); }
.payopt.is-selected{ border-color:var(--gold); background:var(--gold-soft); }
.payopt-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  margin-top:1px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--surface);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.payopt.is-selected .payopt-mark{
  border-color:var(--gold-dark);
  background:var(--gold-dark);
  color:var(--surface);
}
.payopt-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px; }
.payopt-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.payopt-line{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.payopt-line b{ font-weight:var(--w-medium); color:var(--ink); }
.paylead{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:0 0 14px;
  padding:12px 14px;
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.paylead .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.paylead b{ font-weight:var(--w-semi); color:var(--ink); }

.btn[disabled]{ cursor:default; background:var(--line); color:var(--ink-3); }
.btn.is-busy{ cursor:progress; }
.btn.is-busy .ti{ animation:spin 900ms linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){
  .btn.is-busy .ti{ animation:none; }
}

/* --- Etape 8 : la confirmation --- */
.confirm-mark{
  width:56px;
  height:56px;
  margin:8px auto 14px;
  border-radius:var(--r-pill);
  background:var(--gold-soft);
  color:var(--positive);
  font-size:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.confirm-title{
  margin:0;
  font-size:var(--t-22);
  font-weight:var(--w-semi);
  color:var(--ink);
  text-align:center;
}
.confirm-ref{
  margin:6px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
  text-align:center;
}
.confirm-ref b{
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:.04em;
}
.confirm-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.confirm-actions .btn{ margin-top:0; font-size:var(--t-15); }
.done{
  display:flex;
  align-items:center;
  gap:7px;
  margin:10px 0 0;
  font-size:var(--t-13);
  color:var(--positive);
}
.done .ti{ font-size:17px; }
.cancelnote{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:16px 0 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.cancelnote .ti{ flex:0 0 auto; font-size:18px; color:var(--ink-3); }


/* --- Site retenu d'avance, etape 1 --- */
.site.is-selected{ border-color:var(--gold); background:var(--gold-soft); }
.site-mark{
  flex:0 0 auto;
  align-self:center;
  width:26px;
  height:26px;
  margin-right:14px;
  border-radius:var(--r-pill);
  background:var(--gold-dark);
  color:var(--surface);
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* --- Acces au calendrier mensuel : action secondaire de l'etape 3 --- */
.daymore{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:44px;
  margin-top:4px;
  padding:0 14px 0 10px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.daymore:active{ background:var(--canvas); }
.daymore .ti{ font-size:18px; color:var(--ink-3); }

/* --- Feuille de departs sous la bande de jours, etape 3 --- */
.tee-head{
  margin:22px 0 12px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.party{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.party-label{ font-size:var(--t-13); color:var(--ink-2); }
.party-choices{
  display:flex;
  gap:0;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  overflow:hidden;
}
.party-choice{
  width:44px;
  height:44px;
  border:0;
  background:none;
  font-family:inherit;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.party-choice.is-on{
  background:var(--gold);
  color:var(--ink);
  font-weight:var(--w-semi);
}

/* --- Reglage d'un joueur : invitation et paiement, etape 5 --- */
.player-open{
  display:flex;
  align-items:flex-start;
  gap:12px;
  flex:1 1 auto;
  min-width:0;
  padding:0;
  border:0;
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.player-chevron{ flex:0 0 auto; color:var(--ink-3); font-size:18px; }
.player-price.is-other{ color:var(--ink-3); font-weight:var(--w-medium); }
.player-pay{
  display:flex;
  align-items:flex-start;
  gap:5px;
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-3);
}
.player-pay .ti{ flex:0 0 auto; font-size:15px; margin-top:1px; }

.hint{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:0 0 4px;
  padding:11px 14px;
  border-radius:var(--r-card);
  background:var(--gold-soft);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.hint .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }
.hint b{ font-weight:var(--w-semi); color:var(--ink); }

.addbtn.is-quiet{ border-style:solid; }
.addbtn.is-quiet .ti{ color:var(--ink-2); }

.choicegroup{ margin-bottom:18px; }
.choicegroup-head{
  margin:0 0 8px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.choice{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.choice + .choice{ margin-top:8px; }
.choice:active{ background:var(--canvas); }
.choice.is-on{ border-color:var(--gold); background:var(--gold-soft); }
.choice[disabled]{ cursor:default; background:var(--canvas); }
.choice-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  margin-top:1px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--surface);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.choice.is-on .choice-mark{
  border-color:var(--gold-dark);
  background:var(--gold-dark);
  color:var(--surface);
}
.choice-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.choice-title{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.choice[disabled] .choice-title{ color:var(--ink-3); }
.choice-text{ font-size:var(--t-13); color:var(--ink-2); }


/* =========================================================================
   4e. Reservation de cours - lot 3
   ========================================================================= */

/* --- Cartes de pro, etape 1 du cours particulier ---
       Le brief demande photo, specialites et court descriptif : les trois
       tiennent sur une carte, la photo en vignette portrait a gauche. --- */
.pro{
  display:flex;
  align-items:stretch;
  width:100%;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.pro + .pro{ margin-top:12px; }
.pro:active{ background:var(--canvas); }
.pro.is-selected{ border-color:var(--gold); }
.pro-body{
  flex:1 1 auto;
  min-width:0;
  padding:13px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.pro-name{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
/* Pas de capitales ici : « PGA France · 22 ans d'enseignement » passe alors
   sur deux lignes dans une carte de 238 px. */
.pro-role{
  margin:0;
  font-size:var(--t-11);
  font-weight:var(--w-medium);
  color:var(--ink-3);
}
.pro-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:3px 0 0;
}
.pro-blurb{
  margin:4px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.pro-rate{
  margin:6px 0 0;
  font-size:var(--t-13);
  color:var(--ink);
  font-weight:var(--w-medium);
}

/* Vignette portrait : meme placeholder que les parcours, autre gabarit. */
.photo.is-pro{
  width:92px;
  height:auto;
  min-height:120px;
  flex:0 0 auto;
}
.photo .figure{ fill:var(--ink-3); opacity:.26; }

/* --- Choix de la duree : la duree et le tarif viennent du catalogue --- */
.durations{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.duration{
  min-height:66px;
  padding:12px 10px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-family:inherit;
  text-align:center;
  cursor:pointer;
}
.duration:active{ background:var(--canvas); }
.duration.is-on{ border-color:var(--gold); background:var(--gold-soft); }
.duration-label{
  display:block;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.duration-price{
  display:block;
  margin-top:3px;
  font-size:var(--t-13);
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

/* --- Pastille des jours qui portent une seance, dans le calendrier --- */
.month-cell{ position:relative; }
.month-dot{
  position:absolute;
  left:50%;
  bottom:5px;
  width:4px;
  height:4px;
  margin-left:-2px;
  border-radius:var(--r-pill);
  background:var(--gold-dark);
}
.month-cell.is-selected .month-dot{ background:var(--ink); }
.month-cell[disabled] .month-dot{ background:var(--ink-3); }

/* --- Filtres du cours collectif : chaque pastille ouvre sa feuille --- */
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:0 0 14px;
}
.filter{
  display:inline-flex;
  align-items:center;
  gap:6px;
  /* 44 px : c'est une commande de tri, pas un fil de navigation. Le .crumb
     du lot 2a se contente de 32 px parce qu'il ne fait que revenir en
     arriere ; un filtre se manipule. */
  min-height:44px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
  cursor:pointer;
}
.filter:active{ background:var(--canvas); }
.filter.is-on{ border-color:var(--gold); background:var(--gold-soft); color:var(--ink); }
.filter .ti{ font-size:15px; color:var(--ink-3); }
.filter.is-on .ti{ color:var(--gold-dark); }

/* --- Liste des seances du jour ---
       Regle RGPD retenue : places restantes uniquement, jamais les noms des
       inscrits. Aucune colonne de la ligne ne porte de nom de joueur. --- */
.sessions{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.sess{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.sess:first-child{ border-top-color:transparent; }
.sess:active{ background:var(--canvas); }
.sess.is-full{ cursor:default; display:block; }
.sess-time{
  flex:0 0 auto;
  width:52px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.sess-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.sess-name{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.sess-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.sess-side{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}
.sess-price{
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sess-seats{
  font-size:var(--t-13);
  color:var(--ink-2);
  white-space:nowrap;
}
.sess-head{ display:flex; align-items:flex-start; gap:12px; }
.sess.is-full .sess-time,
.sess.is-full .sess-name,
.sess.is-full .sess-price{ color:var(--ink-3); }
.sess.is-full .sess-seats{ color:var(--attention); }
.sess-wait{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  width:100%;
  min-height:44px;
  margin-top:10px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink);
  cursor:pointer;
}
.sess-wait:active{ background:var(--canvas); }
.sess-wait[disabled]{ cursor:default; color:var(--positive); }
.sess-wait .ti{ font-size:17px; color:var(--ink-3); }
.sess-wait[disabled] .ti{ color:var(--positive); }

/* --- Vos cours : la liste des seances reservees --- */
.lessons{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.lesson{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:13px 14px;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.lesson:first-child{ border-top-color:transparent; }
.lesson:active{ background:var(--canvas); }
.lesson-date{
  flex:0 0 auto;
  width:46px;
  padding:6px 0;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  text-align:center;
}
.lesson-day{
  display:block;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  letter-spacing:-.01em;
}
.lesson-month{
  display:block;
  font-size:var(--t-11);
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-3);
}
.lesson-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.lesson-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.lesson-meta{
  margin:0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.lesson-side{ flex:0 0 auto; display:flex; align-items:center; gap:4px; }
.lesson-chevron{ color:var(--ink-3); font-size:18px; }
.chip.is-quiet{ color:var(--ink-3); }
.chip.is-void{ border-color:var(--negative); color:var(--negative); }

/* --- Debrief du pro : lecture seule, alimente par le back-office --- */
.debrief{
  margin-top:20px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--gold-soft);
}
.debrief-head{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.debrief-head .ti{ font-size:20px; color:var(--gold-dark); }
.debrief-who{
  margin:0 0 12px;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.debrief-text{
  margin:0;
  font-size:var(--t-15);
  color:var(--ink-2);
}
.debrief-list{
  margin:12px 0 0;
  padding:0;
  list-style:none;
}
.debrief-list li{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.debrief-list .ti{ flex:0 0 auto; font-size:16px; color:var(--gold-dark); margin-top:1px; }

/* --- Cours annule : l'etat remplace l'action, il ne s'y ajoute pas --- */
.voided{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:18px 0 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-size:var(--t-13);
  color:var(--ink-2);
}
.voided .ti{ flex:0 0 auto; font-size:18px; color:var(--negative); }
.voided b{ font-weight:var(--w-semi); color:var(--ink); }

.btn.is-danger{
  margin-top:14px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--negative);
}
.btn.is-danger:active{ background:var(--canvas); }

/* Une seule action principale par ecran : sur le detail d'un cours, c'est
   l'annulation, et le rappel du delai la precede. */
.lessonfoot{ margin-top:4px; }


/* =========================================================================
   4f. Portefeuille - lot 4
   ========================================================================= */

/* --- Mention de tete. Le solde est global au groupe (decision 4 du brief) :
       elle le dit sur l'ecran principal, et le detail d'un compteur la
       reprend la ou le code du site pourrait laisser croire le contraire. --- */
.wallet-lead{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:0 0 16px;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.wallet-lead .ti{ flex:0 0 auto; font-size:18px; color:var(--gold-dark); }

/* --- Bandeau d'acces illimite, membre Passion. Non actionnable : ce n'est
       pas un compteur, c'est un droit attache a la cotisation. --- */
.unlimited{
  background:var(--gold-soft);
  border:1px solid var(--gold);
  border-radius:var(--r-card);
  padding:16px;
}
.unlimited-head{ display:flex; align-items:flex-start; gap:12px; }
.unlimited-mark{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--surface);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}
.unlimited-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.unlimited-text{
  margin:4px 0 0;
  font-size:var(--t-13);
  color:var(--ink-2);
}
.unlimited .spec{ margin-top:12px; }

/* --- Carte de compteur. Structure du brief lot 4 : solde, expiration, deux
       actions. Le corps ouvre l'historique, les deux actions restent en
       dehors du bouton pour ne pas imbriquer deux cibles tactiles. --- */
.pot{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.pot + .pot,
.unlimited + .pot{ margin-top:12px; }
.unlimited + .pot{ margin-top:14px; }

.pot-top,
.pot-open{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:16px 16px 12px;
  text-align:left;
}
.pot-open{
  background:none;
  border:0;
  font-family:inherit;
  cursor:pointer;
}
.pot-open:active{ background:var(--canvas); }
.pot-mark{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:var(--r-btn);
  background:var(--gold-soft);
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}
.pot-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.pot-head{ display:flex; align-items:center; gap:8px; }
.pot-label{
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--ink-2);
}
.pot-value{
  font-size:var(--t-28);
  font-weight:var(--w-semi);
  line-height:1.15;
  letter-spacing:-.02em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.pot-expiry{ font-size:var(--t-13); color:var(--ink-3); }
.pot-expiry.is-soon{ color:var(--attention); }
.pot-text{ font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.pot-chevron{ flex:0 0 auto; color:var(--ink-3); font-size:18px; margin-top:2px; }

.pot-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 16px 16px;
}
.pot-actions.is-single{ grid-template-columns:1fr; }
.pot-actions .btn{ margin-top:0; min-height:44px; font-size:var(--t-15); }
.pot-note{
  margin:-4px 16px 14px;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.pot-nudge{
  margin:0 16px 14px;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.pot-nudge span{ color:var(--gold-dark); font-weight:var(--w-medium); }

/* --- Emplacement V2. Le brief demande une carte distincte, jamais un
       quatrieme compteur : elle est grisee, sans solde et sans action. --- */
.pot.is-v2{
  margin-top:22px;
  background:var(--canvas);
  box-shadow:none;
  border-style:dashed;
}
.pot.is-v2 .pot-mark{ background:var(--surface); color:var(--ink-3); }
.pot.is-v2 .pot-label{ color:var(--ink-2); font-size:var(--t-17); font-weight:var(--w-semi); }
.pot.is-v2 .pot-text{ color:var(--ink-3); }
.chip.is-v2{ background:var(--surface); border-color:var(--line); color:var(--ink-3); }

/* --- Historique d'un compteur. Un seul fil chronologique : aucune ligne de
       regroupement, aucun en-tete de site. --- */
.moves{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  padding:0 14px;
}
.move{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 0;
  border-top:1px solid var(--line);
}
.move:first-child{ border-top-color:transparent; }
.move-date{
  flex:0 0 66px;
  padding-top:2px;
  font-size:var(--t-13);
  color:var(--ink-3);
}
.move-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.move-kind{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.move-site{ font-size:var(--t-13); color:var(--ink-3); }
.move-side{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:2px;
}
.move-delta{
  font-size:var(--t-15);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.move-delta.is-plus{ color:var(--positive); }
.move-delta.is-void{ color:var(--negative); }
.move-after{
  font-size:var(--t-11);
  color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.moves-foot{
  margin:10px 2px 0;
  font-size:var(--t-11);
  color:var(--ink-3);
}
.moves-empty{
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  padding:20px 18px;
  text-align:center;
}
.moves-empty .ti{ font-size:26px; color:var(--ink-3); }
.moves-empty-title{
  margin:8px 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.moves-empty-text{
  margin:0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}

/* --- Choix du carnet. L'economie realisee par rapport au tarif unitaire est
       une demande explicite du brief : elle vit sur la ligne. --- */
.packs{ margin-top:4px; }
.pack{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:44px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.pack + .pack{ margin-top:10px; }
.pack:active{ background:var(--canvas); }
.pack.is-on{ border-color:var(--gold); background:var(--gold-soft); }
.pack-mark{
  flex:0 0 auto;
  width:22px;
  height:22px;
  border-radius:var(--r-pill);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}
.pack.is-on .pack-mark{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--ink);
}
.pack-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pack-title{
  font-size:var(--t-17);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.pack-save{ font-size:var(--t-13); color:var(--positive); }
.pack-price{
  flex:0 0 auto;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}

/* --- Moyen de paiement. Un seul mode ici, donc aucun choix a faire : la
       carte enregistree s'annonce, elle ne se selectionne pas. --- */
.paycard{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-top:18px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
}
.paycard .ti{ flex:0 0 auto; font-size:20px; color:var(--ink-2); margin-top:1px; }
.paycard-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.paycard-title{
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.paycard-text{ font-size:var(--t-13); line-height:1.4; color:var(--ink-3); }

/* =========================================================================
   4g. Notifications — lot 5
   ========================================================================= */

/* --- Pastille du compteur de non-lues, posée sur la cloche de l'en-tête.
       Elle ne dépend pas de l'autorisation système : le centre continue de
       recevoir quand le téléphone ne sonne plus, c'est justement ce que le
       bandeau explique. --- */
.icon-btn{ position:relative; }
.bell-badge{
  position:absolute;
  top:5px;
  right:4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:var(--r-pill);
  background:var(--gold);
  color:var(--ink);
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  line-height:17px;
  text-align:center;
}

/* --- Bandeau d'état système. Deux cas : la permission n'a jamais été
       demandée, ou elle est coupée au niveau du téléphone. Le second est le
       seul que l'application ne peut pas résoudre elle-même : il envoie aux
       réglages, il ne propose pas un bouton qui ne ferait rien. --- */
.sysbanner{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
}
.sysbanner.is-off{ border-color:var(--attention); }
.sysbanner .ti{ flex:0 0 auto; font-size:20px; color:var(--ink-3); margin-top:1px; }
.sysbanner.is-off .ti{ color:var(--attention); }
.sysbanner-body{ flex:1 1 auto; min-width:0; }
.sysbanner-title{
  margin:0;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.sysbanner-text{
  margin:4px 0 0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.sysbanner .btn{ margin-top:12px; min-height:44px; font-size:var(--t-15); }

/* --- Une notification. La ligne entière est la cible : le brief demande
       qu'elle ouvre l'écran concerné, pas qu'elle porte un bouton de plus.
       Non lue : titre en 600 et pastille or sur la vignette. --- */
.notifs{ display:flex; flex-direction:column; gap:10px; }
.notif{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  min-height:44px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}
.notif:active{ background:var(--canvas); }
.notif.is-unread{ background:var(--gold-soft); border-color:var(--gold); }
.notif-mark{
  position:relative;
  flex:0 0 auto;
  width:36px;
  height:36px;
  border-radius:var(--r-btn);
  background:var(--canvas);
  color:var(--ink-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.notif.is-unread .notif-mark{ background:var(--surface); color:var(--gold-dark); }
.notif-dot{
  position:absolute;
  top:-3px;
  right:-3px;
  width:10px;
  height:10px;
  border-radius:var(--r-pill);
  background:var(--gold);
  border:2px solid var(--surface);
}
.notif.is-unread .notif-dot{ border-color:var(--gold-soft); }
.notif-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.notif-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.notif-title{
  font-size:var(--t-15);
  font-weight:var(--w-regular);
  color:var(--ink);
}
.notif.is-unread .notif-title{ font-weight:var(--w-semi); }
.notif-when{
  flex:0 0 auto;
  font-size:var(--t-11);
  color:var(--ink-3);
  white-space:nowrap;
}
.notif-text{ font-size:var(--t-13); line-height:1.45; color:var(--ink-2); }
.notif-cta{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:4px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--gold-dark);
}
.notif-cta .ti{ font-size:15px; }

/* --- Boîte vide. Une invitation à agir, pas un constat (brief §3). --- */
.notif-empty{
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  padding:24px 18px;
  text-align:center;
}
.notif-empty .ti{ font-size:26px; color:var(--ink-3); }
.notif-empty-title{
  margin:8px 0 4px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.notif-empty-text{
  margin:0;
  font-size:var(--t-13);
  line-height:1.45;
  color:var(--ink-2);
}
.notif-empty .btn{ max-width:260px; margin-left:auto; margin-right:auto; }

/* --- Préférences : une matrice type par canal, opt-in cellule par cellule
       (RGPD, brief lot 5). Trois colonnes de 44 px, la contrainte de cible
       tactile fixe la largeur avant le confort de lecture. --- */
.prefs{
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  overflow:hidden;
}
.pref-head,
.pref-row{
  display:grid;
  grid-template-columns:1fr 44px 44px 44px;
  align-items:center;
  gap:0;
}
.pref-head{
  padding:10px 14px 8px;
  border-bottom:1px solid var(--line);
  background:var(--canvas);
}
.pref-head span{
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-3);
  text-align:center;
}
.pref-head span:first-child{ text-align:left; letter-spacing:.08em; }
.pref-row{ padding:8px 14px; }
.pref-row + .pref-row{ border-top:1px solid var(--line); }
.pref-label{ min-width:0; padding-right:8px; }
.pref-name{
  display:block;
  font-size:var(--t-15);
  font-weight:var(--w-medium);
  color:var(--ink);
}
.pref-when{
  display:block;
  margin-top:2px;
  font-size:var(--t-11);
  line-height:1.35;
  color:var(--ink-3);
}
.pref-box{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:none;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink-3);
  font-size:15px;
}
.pref-box span{
  width:22px;
  height:22px;
  border-radius:6px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
}
.pref-box.is-on span{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
.pref-box[disabled]{ cursor:default; opacity:.45; }
.pref-void{
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--t-13);
  color:var(--ink-3);
}
.prefs-foot{
  margin:12px 2px 0;
  font-size:var(--t-11);
  line-height:1.45;
  color:var(--ink-3);
}
.prefs-foot + .prefs-foot{ margin-top:6px; }

/* --- Amorce de permission. Elle explique ce que le joueur va recevoir avant
       que le système ne le demande : demander à froid fait chuter le taux
       d'acceptation (brief lot 5). --- */
.primer-list{
  margin:18px 0 0;
  padding:0;
  list-style:none;
}
.primer-list li{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
  font-size:var(--t-15);
  color:var(--ink-2);
}
.primer-list li:last-child{ border-bottom:1px solid var(--line); }
.primer-list .ti{ flex:0 0 auto; font-size:20px; color:var(--gold-dark); margin-top:1px; }

/* --- Marche à suivre dans les réglages du téléphone. Numérotée : c'est un
       chemin à refaire de mémoire, hors de l'application. --- */
.steps{
  margin:18px 0 0;
  padding:0 0 0 22px;
}
.steps li{
  padding:6px 0;
  font-size:var(--t-15);
  line-height:1.45;
  color:var(--ink-2);
}
.steps b{ font-weight:var(--w-medium); color:var(--ink); }

/* --- Boîte de dialogue du système. Elle n'appartient pas à l'application :
       centrée, sans marque, boutons côte à côte, comme une alerte iOS. Le
       bloc conteneur est .viewport, comme les feuilles du lot 3. --- */
.sysalert{
  position:fixed;
  inset:0;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 48px;
  background:var(--scrim-system);
}
.sysalert-card{
  width:100%;
  max-width:270px;
  border-radius:var(--r-card);
  background:var(--surface);
  text-align:center;
  overflow:hidden;
}
.sysalert-body{ padding:18px 16px 16px; }
.sysalert-title{
  margin:0;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--ink);
}
.sysalert-text{
  margin:6px 0 0;
  font-size:var(--t-13);
  line-height:1.4;
  color:var(--ink-2);
}
.sysalert-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
}
.sysalert-btn{
  min-height:44px;
  padding:0 6px;
  border:0;
  background:none;
  font-family:inherit;
  /* 15 px et non 17 : « Ne pas autoriser » passe alors sur une seule ligne
     dans les 135 px d'une demi-alerte. iOS empilerait les deux boutons ; le
     prototype prefere les garder cote a cote. */
  font-size:var(--t-15);
  color:var(--ink);
  cursor:pointer;
}
.sysalert-btn + .sysalert-btn{ border-left:1px solid var(--line); }
.sysalert-btn.is-strong{ font-weight:var(--w-semi); }
.sysalert-btn:active{ background:var(--canvas); }

/* =========================================================================
   5. Barre de contrôle du prototype
   ========================================================================= */
.panel{
  flex:0 0 300px;
  max-width:300px;
  position:sticky;
  top:40px;
  padding:22px 20px 20px;
  background:var(--surface);
  border:1px solid var(--proto-line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.panel-kicker{
  margin:0;
  font-size:var(--t-11);
  font-weight:var(--w-semi);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--proto-ink-2);
}
.panel-title{
  margin:4px 0 18px;
  font-size:var(--t-17);
  font-weight:var(--w-semi);
  color:var(--proto-ink);
}
.field{ margin-bottom:16px; }
.field-label{
  display:block;
  margin-bottom:7px;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--proto-ink);
}
.field-help{
  margin:6px 0 0;
  font-size:var(--t-11);
  color:var(--proto-ink-2);
}
.field.is-muted{ opacity:.45; }

.seg{
  display:grid;
  gap:4px;
  padding:4px;
  border:1px solid var(--proto-line);
  border-radius:var(--r-btn);
  background:var(--canvas);
}
.seg.is-row{ grid-template-columns:1fr 1fr; }
.seg.is-three{ grid-template-columns:repeat(3,1fr); }
.seg button{
  min-height:34px;
  padding:0 10px;
  border:0;
  border-radius:9px;
  background:none;
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--proto-ink-2);
  cursor:pointer;
  text-align:center;
}
.seg button.is-on{
  background:var(--gold);
  color:var(--ink);
  font-weight:var(--w-semi);
}
.seg button[disabled]{ cursor:default; }

.select{
  width:100%;
  min-height:38px;
  padding:0 10px;
  border:1px solid var(--proto-line);
  border-radius:var(--r-btn);
  background:var(--surface);
  font-family:inherit;
  font-size:var(--t-13);
  color:var(--proto-ink);
}

.panel-action{
  width:100%;
  min-height:40px;
  margin-top:4px;
  border:1px solid var(--proto-line);
  border-radius:var(--r-btn);
  background:var(--canvas);
  font-family:inherit;
  font-size:var(--t-13);
  font-weight:var(--w-medium);
  color:var(--proto-ink);
  cursor:pointer;
}
.panel-action:active{ background:var(--proto-bg); }
.panel-action + .panel-action{ margin-top:8px; }

.readout{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--proto-line);
}
.readout dl{ margin:0; }
.readout div{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:4px 0;
  font-size:var(--t-11);
}
.readout dt{ color:var(--proto-ink-2); }
.readout dd{ margin:0; color:var(--proto-ink); font-weight:var(--w-medium); }
</style>
</head>
<body>

<div class="proto">

  <div class="device">
    <div class="device-screen" data-role="device">

      <div class="top" data-role="top">
        <div class="statusbar">
          <span data-role="clock">9:41</span>
          <span class="statusbar-icons">
            <i class="ti ti-antenna-bars-5" aria-hidden="true"></i>
            <i class="ti ti-wifi" aria-hidden="true"></i>
            <i class="ti ti-battery-3" aria-hidden="true"></i>
          </span>
        </div>
        <header class="appbar" data-role="appbar"></header>
      </div>

      <main class="viewport" data-role="viewport"></main>

      <div class="bottom">
        <nav class="tabbar" data-role="tabbar" aria-label="Navigation principale"></nav>
        <div class="home-indicator"><span></span></div>
      </div>

    </div>
  </div>

  <aside class="panel" data-role="panel" aria-label="Reglages du prototype"></aside>

</div>

<script>
'use strict';

/* =========================================================================
   1. Référentiel — brief §1. Rien d'autre que ce que le brief énonce.
   ========================================================================= */

/* Sites et parcours du brief §1. Le champ `region` n'est PAS au brief :

/* PRNG du brief §6. Annoncé au lot 0, introduit ici : le lot 1 n'avait aucune
   série à tirer. */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Graine dérivée d'une chaîne : le tirage est indexé par ce qu'il décrit
   (site, parcours, jour, minute), jamais par un compteur d'appel. */
function seedFrom(text){
  var h = 2166136261;
  for(var i=0;i<text.length;i++){
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function draw(text){ return mulberry32(seedFrom(text))(); }

/* --- Calendrier ---------------------------------------------------------- */

function startOfToday(){
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function dateAt(offset){
  var d = startOfToday();
  d.setDate(d.getDate() + offset);
  return d;
}
function offsetOf(date){
  var a = startOfToday().getTime();
  var b = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  return Math.round((b - a) / 86400000);
}
function isWeekend(offset){
  var g = dateAt(offset).getDay();
  return g === 0 || g === 6;
}

/* « samedi 30 août » — prose. La casse haute des tables est ramenée en bas de
   casse ici, les accents passent sans dommage. */
function longDate(offset){
  var d = dateAt(offset);
  return JOURS[d.getDay()].toLowerCase() + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()].toLowerCase();
}
function shortDate(offset){
  var d = dateAt(offset);
  return d.getDate() + ' ' + MOIS_COURT[d.getMonth()];
}
function hhmm(minutes){
  return pad2(Math.floor(minutes / 60)) + ':' + pad2(minutes % 60);
}

/* --- Fermetures de parcours ---------------------------------------------- */

function closureFor(site, courseIndex, offset){
  var list = site.closures || [];
  for(var i=0;i<list.length;i++){
    var c = list[i];
    if(c.course === courseIndex && offset >= c.from && offset <= c.to) return c;
  }
  return null;
}
function closuresOfCourse(site, courseIndex){
  var list = site.closures || [];
  var out = [];
  for(var i=0;i<list.length;i++){ if(list[i].course === courseIndex) out.push(list[i]); }
  return out;
}
function dayIsOpen(site, courseIndex, offset){
  if(offset < 0 || offset > BOOK_HORIZON) return false;
  return !closureFor(site, courseIndex, offset);
}

/* Premier jour jouable, pour que l'étape 3 s'ouvre déjà sur une feuille de
   départs. Un écran qui demande de choisir un jour avant de montrer quoi que
   ce soit fait payer un geste pour rien : le cas courant est « aujourd'hui ». */
function firstOpenDay(site, courseIndex){
  for(var i=0;i<=BOOK_HORIZON;i++){
    if(dayIsOpen(site, courseIndex, i)) return i;
  }
  return null;
}

/* Motif d'une fermeture, en une phrase. « du 7 au 14 septembre », ou
   « jusqu'au 5 septembre » quand la fermeture a déjà commencé. */
function closureText(site, closure){
  var course = site.courses[closure.course];
  var when = closure.from <= 0
    ? 'jusqu\'au ' + dateAt(closure.to).getDate() + ' ' + MOIS[dateAt(closure.to).getMonth()].toLowerCase()
    : 'du ' + dateAt(closure.from).getDate() + ' au ' + dateAt(closure.to).getDate()
      + ' ' + MOIS[dateAt(closure.to).getMonth()].toLowerCase();
  return closure.reason + ' sur ' + course.name + ', ' + when + '.';
}

/* Texte de l'alerte de travaux de l'accueil — dérivé des fermetures depuis le
   lot 2, pour que l'accueil et l'étape 3 ne puissent pas se contredire. */
function worksText(site){
  var list = site.closures || [];
  if(!list.length) return null;
  return closureText(site, list[0]);
}

/* --- Distance simulée ----------------------------------------------------- */

/* Géolocalisation simulée : le joueur est supposé à son site de rattachement.
   HYPOTHÈSE — les distances ne sont pas des distances routières réelles, elles
   sont tirées de façon déterministe dans une fourchette cohérente avec le
   découpage régional. Elles servent à ordonner la liste, pas à informer. */
function siteDistance(site){
  var home = currentSite();
  if(site.code === home.code) return 0;
  var r = draw('dist' + home.code + site.code);
  if(site.region === home.region) return Math.round(12 + r * 48);
  return Math.round(180 + r * 720);
}
function distanceLabel(site){
  var km = siteDistance(site);
  return km === 0 ? 'Votre site' : km + ' km';
}
