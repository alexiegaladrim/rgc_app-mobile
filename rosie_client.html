   ========================================================================= */

/* Espace insécable devant l'unité : dans un cadre de 390 px, « 95 » et « € »
   séparés par un retour à la ligne est un défaut visible. */
function amount(value){ return grouped(value) + '&nbsp;€'; }

/* Tarif unitaire ramene d'un carnet. Sous dix euros, l'arrondi a l'euro ecrase
   l'ecart entre les trois carnets — « soit 6 € le seau » trois fois de suite
   n'apprend rien au joueur. On garde alors une decimale. */
function unitAmount(value, reference){
  if(reference >= 10) return amount(Math.round(value));
  return String(Math.round(value * 10) / 10).replace('.', ',') + '&nbsp;€';
}

/* Espace insecable de groupement des milliers, typographie francaise. */
function grouped(value){
  var text = String(value);
  var out = '';
  for(var i=0;i<text.length;i++){
    var left = text.length - i;
    if(i > 0 && left % 3 === 0) out += '\u00a0';
    out += text.charAt(i);
  }
  return out;
}
function metres(value){
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '&nbsp;') + '&nbsp;m';
}
function seatsLabel(seats){
  if(seats === 0) return 'Complet';
  return seats + (seats > 1 ? ' places' : ' place');
}
function capitalize(text){ return text.charAt(0).toUpperCase() + text.slice(1); }

/* « à Le Touquet » est la faute que le lot 1 avait rencontrée sur les noms de
   sites, et que l'alerte de travaux portait depuis. Comme dePrenom() au lot 3,
   la forme correcte se calcule une fois plutôt que de se recopier dans chaque
   libellé. Seuls les noms à article défini pluriel ou masculin la demandent :
   « au Touquet », « aux Yvelines », et « à La Grande Bastide » sans changement. */
function atSite(site){
  var name = site.name;
  if(name.indexOf('Les ') === 0) return 'aux ' + name.slice(4);
  if(name.indexOf('Le ') === 0) return 'au ' + name.slice(3);
  return 'à ' + name;
}

/* Fil des choix déjà faits. Chaque maillon ramène à son étape ; l'étape sautée
   d'un site mono-parcours n'est pas un bouton, il n'y a rien à y choisir. */
function crumbs(step){
  var d = STATE.draft;
  var site = draftSite();
  if(!site) return '';

  var links = [{ label:site.name, to:'/book/gf/site', icon:'map-pin' }];

  var afterCourse = (step !== 'course');
  var afterSlot = (step === 'players' || step === 'options' || step === 'pay');
  var afterDate = afterSlot;

  if(afterCourse){
    var course = draftCourse();
    if(course){
      links.push({
        label:course.name,
        to:site.courses.length > 1 ? '/book/gf/course' : null,
        icon:'flag'
      });
    }
  }
  if(afterDate && d.dayOffset !== null){
    links.push({ label:shortDate(d.dayOffset), to:'/book/gf/date', icon:'calendar' });
  }
  if(afterSlot && d.slotKey){
    var picked = draftSlot();
    if(picked) links.push({ label:picked.time, to:'/book/gf/date', icon:'clock' });
  }

  var html = '<nav class="crumbs" data-role="crumbs" aria-label="Vos choix">';
  for(var i=0;i<links.length;i++){
    var l = links[i];
    html += l.to
      ? '<button type="button" class="crumb" data-backto="' + l.to + '" '
        + 'aria-label="Revenir au choix : ' + l.label + '">'
        + icon(l.icon) + '<span>' + l.label + '</span></button>'
      : '<span class="crumb">' + icon(l.icon) + '<span>' + l.label + '</span></span>';
  }
  return html + '</nav>';
}

          +   '<span class="site-body">'
          +     '<span class="site-name">' + s.name + '</span>'
          +     '<span class="site-meta">' + count + (count > 1 ? ' parcours' : ' parcours')
          +       ' &middot; ' + s.region + '</span>'
          +     '<span class="site-far">' + distanceLabel(s) + '</span>'
          +   '</span>'
          +   (picked
             ? '<span class="site-mark">' + icon('check') + '</span>'
             : '')
          + '</button>';
  }
  return html + '</section>';
}

/* --- Étape 2 : le parcours ----------------------------------------------- */

/* Bloquante sur un site multi-parcours : la sélection déclenche le bon tarif
   et la bonne feuille de départs. Sur un site mono-parcours, la garde du
   tunnel saute l'étape avant même de construire cet écran. */
function screenGfCourse(){
  var site = draftSite();
  var d = STATE.draft;
  var html = ''
    + crumbs('course')
    + '<h2 class="screen-title">Quel parcours ?</h2>'
    + '<p class="screen-text">Le parcours détermine le tarif et la feuille de départs. '
    +   'Il ne peut pas être changé après le choix du créneau.</p>'
    + '<section class="section" data-role="course-list">';

  for(var i=0;i<site.courses.length;i++){
    var c = site.courses[i];
    var closures = closuresOfCourse(site, i);
    var note = closures.length
      ? '<p class="course-closed">' + icon('traffic-cone') + ' ' + closureText(site, closures[0]) + '</p>'
      : '';
    html += '<button type="button" class="course' + (d.courseIndex === i ? ' is-selected' : '') + '" '
          +   'data-pick="course" data-value="' + i + '" '
          +   'aria-label="' + c.name + ', ' + c.holes + ' trous, par ' + c.par + '">'
          +   coursePhoto('course-' + site.code + '-' + i, 'is-card')
          +   '<span class="course-body">'
          +     '<span class="course-name">' + c.name + '</span>'
          +     '<ul class="course-facts">'
          +       '<li><b>' + c.holes + '</b> trous</li>'
          +       '<li>par <b>' + c.par + '</b></li>'
          +       '<li><b>' + metres(c.metres) + '</b></li>'
          +     '</ul>'
          +     note
          +   '</span>'
          + '</button>';
  }
  return html + '</section>';
}

/* --- Étape 3 : la date --------------------------------------------------- */

function dayButton(site, ci, offset, selected){
  var date = dateAt(offset);
  var open = dayIsOpen(site, ci, offset);
  return '<button type="button" class="day'
       +   (selected ? ' is-selected' : '') + '" '
       +   'data-pick="day" data-value="' + offset + '"'
       +   (open ? '' : ' disabled aria-disabled="true"')
       +   ' aria-label="' + longDate(offset) + (open ? '' : ', fermé') + '">'
       +   '<span class="day-name">' + JOURS[date.getDay()].toLowerCase().slice(0, 3) + '</span>'
       +   '<span class="day-num">' + date.getDate() + '</span>'
       +   '<span class="day-month">' + MOIS_COURT[date.getMonth()] + '</span>'
       + '</button>';
}

function monthGrid(site, ci){
  var d = STATE.draft;
  var base = startOfToday();
  var first = new Date(base.getFullYear(), base.getMonth() + d.monthShift, 1);
  var lead = (first.getDay() + 6) % 7;
  var count = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();

  var html = '<div class="month" data-role="month">'
    + '<div class="month-head">'
    +   '<button type="button" class="month-nav" data-act="month-prev"'
    +     (d.monthShift <= 0 ? ' disabled' : '') + ' aria-label="Mois précédent">'
    +     icon('chevron-left') + '</button>'
    +   '<p class="month-title">' + capitalize(MOIS[first.getMonth()].toLowerCase())
    +     ' ' + first.getFullYear() + '</p>'
    +   '<button type="button" class="month-nav" data-act="month-next"'
    +     (d.monthShift >= 3 ? ' disabled' : '') + ' aria-label="Mois suivant">'
    +     icon('chevron-right') + '</button>'
    + '</div>'
    + '<div class="month-grid">';

  for(var w=0;w<7;w++){ html += '<span class="month-dow">' + DOW_LUNDI[w] + '</span>'; }
  for(var v=0;v<lead;v++){ html += '<span class="month-cell is-void"></span>'; }

  for(var n=1;n<=count;n++){
    var date = new Date(first.getFullYear(), first.getMonth(), n);
    var offset = offsetOf(date);
    var open = dayIsOpen(site, ci, offset);
    var closed = (offset >= 0 && offset <= BOOK_HORIZON && !open);
    html += '<button type="button" class="month-cell'
          +   (closed ? ' is-closed' : '')
          +   (d.dayOffset === offset ? ' is-selected' : '') + '" '
          +   'data-pick="day" data-value="' + offset + '"'
          +   (open ? '' : ' disabled aria-disabled="true"')
          +   ' aria-label="' + longDate(offset) + (open ? '' : ', fermé') + '">'
          +   n + '</button>';
  }
  return html + '</div></div>';
}

function screenGfDate(){
  var site = draftSite();
  var ci = STATE.draft.courseIndex;
  var d = STATE.draft;

  var strip = '';
  var openInStrip = 0;
  for(var i=0;i<STRIP_DAYS;i++){
    if(dayIsOpen(site, ci, i)) openInStrip += 1;
    strip += dayButton(site, ci, i, d.dayOffset === i);
  }

  var closures = closuresOfCourse(site, ci);
  var note = '';
  for(var k=0;k<closures.length;k++){
    if(closures[k].from <= STRIP_DAYS - 1){
      note = '<p class="daystrip-note">' + icon('traffic-cone')
           + '<span>' + closureText(site, closures[k]) + '</span></p>';
      break;
    }
  }

  /* Aucun jour ouvert sur la bande : l'écran invite à ouvrir le mois plutôt
     que de laisser une rangée de jours barrés sans issue. */
  var empty = '';
  if(openInStrip === 0){
    empty = '<div class="stepempty" data-role="date-empty">'
          +   '<h3 class="screen-title">Aucune date sur les quinze prochains jours</h3>'
          +   '<p class="screen-text">' + draftCourse().name + ' rouvre plus tard. '
          +     'Ouvrez le calendrier pour voir les dates suivantes.</p>'
          +   (d.monthOpen ? ''
             : '<button type="button" class="btn is-primary" data-act="month-toggle">'
               + 'Ouvrir le calendrier</button>')
          + '</div>';
  }

  return ''
    + crumbs('date')
    + '<h2 class="screen-title">Quel départ ?</h2>'
    + '<section class="section">'
    +   '<div class="daystrip" data-role="daystrip">' + strip + '</div>'
    +   note
    +   (empty ? '<div class="section">' + empty + '</div>' : '')
    +   '<button type="button" class="daymore" data-act="month-toggle">'
    +     icon('calendar-month')
    +     '<span>' + (d.monthOpen ? 'Masquer le calendrier' : 'Voir tout le calendrier')
    +     '</span>'
    +   '</button>'
    +   (d.monthOpen ? monthGrid(site, ci) : '')
    + '</section>'
    + teeSheet();
}

/* --- Nombre de joueurs recherché ----------------------------------------- */

/* Le filtre du haut de la feuille. Il ne masque pas une information utile : un
   départ qui n'a plus assez de places pour le groupe n'est pas une option, et
   le faire lire pour rien à chaque ligne coûte plus qu'il ne renseigne. */
function partyPicker(){
  var d = STATE.draft;
  var html = '<div class="party" data-role="party">'
           + '<span class="party-label">Combien de joueurs&nbsp;?</span>'
           + '<div class="party-choices" role="radiogroup" '
           +   'aria-label="Nombre de joueurs">';
  for(var n=1;n<=PARTY_MAX;n++){
    var on = (d.party === n);
    html += '<button type="button" class="party-choice' + (on ? ' is-on' : '') + '" '
          +   'data-act="party" data-value="' + n + '" '
          +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '" '
          +   'aria-label="' + n + (n > 1 ? ' joueurs' : ' joueur') + '">'
          +   n
          + '</button>';
  }
  return html + '</div></div>';
}

/* --- Feuille de départs, sous la bande de jours -------------------------- */

/* Les départs qui n'ont plus assez de places pour le groupe recherché ne sont
   pas affichés. Décision d'Alexie du 28/08, elle revient sur la règle du brief
   qui gardait les départs complets à l'écran. */
function teeSheet(){
  var site = draftSite();
  var d = STATE.draft;
  if(d.dayOffset === null) return '';

  var showPrice = slotsShowPrice(site);
  var outside = isPassion() && !passCoversSite(site);

  var groups = '';
  var shown = 0;
  for(var b=0;b<TEE_BLOCKS.length;b++){
    var block = TEE_BLOCKS[b];
    var slots = slotsOfBlock(site, d.courseIndex, d.dayOffset, block);
    var rows = '';
    var count = 0;
    for(var i=0;i<slots.length;i++){
      if(slots[i].seats < d.party) continue;
      rows += slotRow(site, slots[i], showPrice, outside, d.slotKey === slots[i].key);
      count += 1;
    }
    if(!count) continue;
    shown += count;
    groups += '<section class="slot-group" data-role="slot-group">'
            +   '<h3 class="slot-group-head">' + block.label + '</h3>'
            +   '<div class="slots' + (showPrice ? ' has-price' : '') + '" data-role="slots">'
            +     rows
            +   '</div>'
            + '</section>';
  }

  var body;
  if(shown){
    body = slotsLead(site)
         + groups
         + '<p class="slots-foot">Départs toutes les neuf minutes. '
         +   'Seuls les départs qui ont encore la place sont affichés.</p>';
  } else {
    body = '<div class="stepempty" data-role="tee-empty">'
         +   '<h3 class="screen-title">Aucun départ pour '
         +     (d.party > 1 ? d.party + ' joueurs' : 'un joueur')
         +     ' ce jour-là</h3>'
         +   '<p class="screen-text">Essayez un autre jour, ou cherchez un départ '
         +     'pour un groupe plus petit.</p>'
         +   (d.party > 1
            ? '<button type="button" class="btn is-primary" data-act="party" '
              + 'data-value="' + (d.party - 1) + '">Chercher pour '
              + (d.party - 1 > 1 ? (d.party - 1) + ' joueurs' : 'un joueur')
              + '</button>'
            : '')
         + '</div>';
  }

  return '<section class="section" data-role="tee">'
       +   '<h3 class="tee-head">' + capitalize(longDate(d.dayOffset)) + '</h3>'
       +   partyPicker()
       +   body
       + '</section>';
}

/* --- Étape 4 : le créneau ------------------------------------------------ */

/* La mention de tête est la seule à dire, en une phrase, ce que la colonne de
   droite signifie. Elle change de contenu selon le persona et le périmètre,
   jamais de place. */
function slotsLead(site){
  if(isPassion()){
    if(passCoversSite(site)){
      return '<p class="slots-lead" data-role="slots-lead">' + icon('infinity')
           + '<span>Vos départs sont inclus dans votre abonnement.</span></p>';
    }
    return '<p class="slots-lead" data-role="slots-lead">' + icon('map-pin-off')
         + '<span><b>Hors périmètre de votre abonnement.</b> '
         + 'Le tarif applicable s\'affiche sur chaque départ.</span></p>';
  }
  if(!hasLicence()){
    return '<p class="slots-lead" data-role="slots-lead">' + icon('id-badge-2')
         + '<span><b>Tarifs visiteurs.</b> Renseignez votre licence dans votre profil '
         + 'pour obtenir le tarif licencié.</span></p>';
  }
  return '<p class="slots-lead" data-role="slots-lead">' + icon('tag')
       + '<span>Tarifs licenciés. Ils varient selon l\'heure du départ.</span></p>';
}

function slotRow(site, slot, showPrice, outside, selected){
  var full = (slot.seats === 0);
  var tags = (slot.badge && !full)
    ? '<span class="chip is-gold">' + slot.badge + '</span>'
    : '';

  var label = slot.time + ', ' + seatsLabel(slot.seats)
            + (showPrice && !full ? ', ' + slot.price + ' euros' : '')
            + (outside ? ', hors périmètre de votre abonnement' : '');

  return '<button type="button" class="slot'
       +   (full ? ' is-full' : '')
       +   (selected ? ' is-selected' : '') + '" '
       +   'data-pick="slot" data-value="' + slot.key + '"'
       +   (full ? ' disabled aria-disabled="true"' : '')
       +   ' aria-label="' + label + '">'
       +   '<span class="slot-time">' + slot.time + '</span>'
       +   '<span class="slot-tags">' + tags + '</span>'
       +   '<span class="slot-left">' + seatsLabel(slot.seats) + '</span>'
       +   '<span class="slot-price">'
       +     (showPrice && !full ? amount(slot.price) : '')
       +   '</span>'
       +   '<span class="slot-note">'
       +     (outside ? 'Hors périmètre de votre abonnement' : '')
       +   '</span>'
       + '</button>';
}


/* =========================================================================
   6d. Tunnel de réservation green-fee — lot 2, étapes 5 à 8
   ========================================================================= */

/* Pied permanent des étapes à total. Le montant y est toujours celui de
   grandTotal() : aucune étape ne compose le sien. */
function stepFoot(label, note, button){
  var total = grandTotal();
  return '<div class="stepfoot" data-role="stepfoot">'
       +   '<p class="total">'
       +     '<span class="total-label">' + label + '</span>'
       +     '<span class="total-value" data-role="total">'
       +       (total === 0 ? 'Rien à payer' : amount(total))
       +     '</span>'
       +   '</p>'
       +   (note ? '<p class="total-note">' + note + '</p>' : '')
       +   button
       + '</div>';
}

function primaryButton(act, label, disabled, busy){
  return '<button type="button" class="btn is-primary' + (busy ? ' is-busy' : '') + '" '
       +   'data-act="' + act + '"'
       +   (disabled || busy ? ' disabled aria-disabled="true"' : '')
       +   (busy ? ' aria-busy="true"' : '')
       +   '>'
       +   (busy ? icon('loader-2') + '<span>Traitement en cours</span>' : label)
       + '</button>';
}

/* --- Étape 5 : les joueurs ----------------------------------------------- */

function playerRow(line){
  var p = line.player;
  var holder = (p.kind === 'holder');
  var price = line.price === 0
    ? '<span class="player-price is-free">Inclus</span>'
    : '<span class="player-price' + (line.byHolder ? '' : ' is-other')
      + '">' + amount(line.price) + '</span>';
  var who = payerText(line);

  var body = '<span class="player-body">'
           +   '<span class="player-name">' + playerName(p) + '</span>'
           +   '<span class="player-why">' + line.why + '</span>'
           +   (who ? '<span class="player-pay">' + icon(line.byHolder ? 'wallet'
                      : (p.member ? 'bell' : 'building-store'))
                    + '<span>' + who + '</span></span>' : '')
           +   (line.warn ? '<span class="player-warn">' + line.warn + '</span>' : '')
           + '</span>';

  /* Le titulaire n'a rien à régler sur lui-même : sa ligne n'est pas
     actionnable. Celle d'un joueur ajouté ouvre son réglage. */
  if(holder){
    return '<div class="player is-holder" data-role="player">'
         +   '<span class="player-rank">1</span>'
         +   body
         +   '<span class="player-side">' + price + '</span>'
         + '</div>';
  }

  return '<div class="player is-guest" data-role="player">'
       +   '<button type="button" class="player-open" data-act="player-terms" '
       +     'data-value="' + line.index + '" '
       +     'aria-label="Régler l\'invitation et le paiement de ' + playerName(p) + '">'
       +     '<span class="player-rank">' + (line.index + 1) + '</span>'
       +     body
       +     '<span class="player-side">' + price
       +       '<i class="ti ti-chevron-right player-chevron" aria-hidden="true"></i>'
       +     '</span>'
       +   '</button>'
       +   '<button type="button" class="player-drop" data-act="player-drop" '
       +     'data-value="' + line.index + '" '
       +     'aria-label="Retirer ' + playerName(p) + ' de ce départ">'
       +     icon('x') + '</button>'
       + '</div>';
}

/* Décompte des invitations, membre Passion seulement. Il montre le solde tel
   qu'il sera après cette réservation : c'est ce que le joueur veut savoir. */
function inviteQuotaLine(){
  var q = inviteQuota();
  if(!q) return '';
  var left = invitesLeftAfter();
  if(left === 0){
    return '<p class="quota is-spent" data-role="quota">' + icon('ticket-off')
         + '<span><b>Aucune invitation</b> restante sur ' + q.total
         + ' cette année.</span></p>';
  }
  return '<p class="quota" data-role="quota">' + icon('ticket')
       + '<span><b>' + left + (left > 1 ? ' invitations' : ' invitation')
       + '</b> sur ' + q.total + ' encore disponibles cette année.</span></p>';
}

function addPlayerBlock(){
  var max = partyMax();
  var full = partyFull();
  var note = '';
  if(full){
    note = (max < PARTY_MAX)
      ? 'Ce départ ne compte plus que ' + max + (max > 1 ? ' places.' : ' place.')
      : 'Un départ accueille au maximum ' + PARTY_MAX + ' joueurs.';
  }
  return '<button type="button" class="addbtn" data-act="sheet-open"'
       +   (full ? ' disabled aria-disabled="true"' : '') + '>'
       +   icon('user-plus') + '<span>Ajouter un joueur</span>'
       + '</button>'
       + (note ? '<p class="addnote">' + note + '</p>' : '');
}

function relativeRow(rel){
  var added = relativeAdded(rel.id);
  var meta = rel.licence
    ? 'Licence ' + rel.licence
    : 'Sans licence, tarif visiteur';
  return '<button type="button" class="rel" data-act="relative-add" '
       +   'data-value="' + rel.id + '"'
       +   (added ? ' disabled aria-disabled="true"' : '') + '>'
       +   '<span class="rel-mark">' + initials(rel) + '</span>'
       +   '<span class="rel-body">'
       +     '<span class="rel-name">' + playerName(rel) + '</span>'
       +     '<span class="rel-meta">' + meta + '</span>'
       +   '</span>'
       +   '<span class="rel-side">' + (added ? 'Déjà au départ' : 'Ajouter') + '</span>'
       + '</button>';
}

function sheetRelatives(){
  var list = relativesOf();
  var body = '';
  if(!list.length){
    body = '<p class="sheet-lead">Aucun proche enregistré pour l\'instant. '
         + 'Invitez un joueur pour ce départ, il sera proposé la prochaine fois.</p>';
  } else if(relativesLeft() === 0){
    body = '<p class="sheet-lead">Tous vos proches sont déjà à ce départ.</p>';
    for(var i=0;i<list.length;i++) body += relativeRow(list[i]);
  } else {
    body = '<p class="sheet-lead">Vos proches enregistrés, ou un joueur que vous '
         + 'invitez pour ce départ.</p>';
    for(var j=0;j<list.length;j++) body += relativeRow(list[j]);
  }

  return sheetShell('Ajouter un joueur',
      body
    + '<hr class="sheet-sep">'
    + '<button type="button" class="addbtn" data-act="sheet-guest">'
    +   icon('user-question') + '<span>Inviter un joueur</span>'
    + '</button>');
}

function sheetGuest(){
  var g = STATE.draft.guest;
  var err = STATE.draft.guestError;
  return sheetShell('Inviter un joueur',
      '<p class="sheet-lead">La licence est facultative. Sans elle, ce joueur '
    + 'paie le tarif visiteur — le montant s\'affiche avant de valider.</p>'
    + '<div class="form-row">'
    +   '<label class="form-label" for="guest-first">Prénom</label>'
    +   '<input class="input" id="guest-first" type="text" data-field="firstName" '
    +     'autocomplete="off" value="' + escapeAttr(g.firstName) + '">'
    + '</div>'
    + '<div class="form-row">'
    +   '<label class="form-label" for="guest-last">Nom</label>'
    +   '<input class="input" id="guest-last" type="text" data-field="lastName" '
    +     'autocomplete="off" value="' + escapeAttr(g.lastName) + '">'
    + '</div>'
    + '<div class="form-row">'
    +   '<label class="form-label" for="guest-lic">Numéro de licence</label>'
    +   '<input class="input" id="guest-lic" type="text" data-field="licence" '
    +     'autocomplete="off" value="' + escapeAttr(g.licence) + '">'
    +   '<p class="form-hint">Facultatif.</p>'
    + '</div>'
    + (err
       ? '<p class="form-error" data-role="guest-error">' + icon('alert-circle')
         + '<span>' + err + '</span></p>'
       : '')
    + '<button type="button" class="btn is-primary" data-act="guest-add">'
    +   'Ajouter ce joueur</button>');
}

/* Réglage d'un joueur : son invitation et qui paie sa place. Les deux
   décisions se prennent au même endroit parce qu'elles portent sur la même
   ligne et se lisent ensemble — une invitation que le joueur règle lui-même
   n'aurait pas de sens à découvrir sur deux écrans. */
function sheetTerms(){
  var d = STATE.draft;
  var index = d.termsIndex;
  var p = d.players[index];
  if(!p) return '';

  var lines = playerLines();
  var line = null;
  for(var i=0;i<lines.length;i++){ if(lines[i].index === index) line = lines[i]; }
  if(!line) return '';

  var body = '<p class="sheet-lead">' + line.why + '.</p>';

  if(isPassion()){
    var canInvite = inviteAvailableFor(index);
    body += '<div class="choicegroup" role="radiogroup" '
          +   'aria-label="Invitation">'
          +   '<p class="choicegroup-head">Votre invitation</p>'
          +   choiceRow('invite', 'on', p.invited,
                'Utiliser une invitation',
                canInvite || p.invited
                  ? 'Remise sur sa place. Il vous en resterait '
                    + (invitesLeftBefore() - invitesUsedInDraft()
                       - (p.invited ? 0 : 1)) + ' sur ' + inviteQuota().total + '.'
                  : 'Vos ' + inviteQuota().total + ' invitations de l\'année sont utilisées.',
                !canInvite && !p.invited)
          +   choiceRow('invite', 'off', !p.invited,
                'Sans invitation', 'Tarif applicable, sans remise.', false)
          + '</div>';
  }

  body += '<div class="choicegroup" role="radiogroup" aria-label="Qui règle sa place">'
        +   '<p class="choicegroup-head">Qui règle sa place&nbsp;?</p>'
        +   choiceRow('payer', 'holder', p.payer !== 'self',
              'Vous réglez sa place',
              'Elle s\'ajoute à votre total.', false)
        +   choiceRow('payer', 'self', p.payer === 'self',
              p.member
                ? 'Ce joueur règle depuis l\'application'
                : 'Ce joueur règle à l\'accueil',
              p.member
                ? 'Une invitation à payer lui est envoyée. Sa place est retenue '
                  + 'en attendant.'
                : 'Sa place est retenue, elle se règle en arrivant au golf.',
              false)
        + '</div>';

  body += '<button type="button" class="btn is-primary" data-act="sheet-close">'
        +   'Terminer</button>';

  return sheetShell(playerName(p), body);
}

function choiceRow(control, value, on, title, text, disabled){
  return '<button type="button" class="choice' + (on ? ' is-on' : '') + '" '
       +   'data-act="' + control + '" data-value="' + value + '" '
       +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '"'
       +   (disabled ? ' disabled aria-disabled="true"' : '') + '>'
       +   '<span class="choice-mark">' + icon('check') + '</span>'
       +   '<span class="choice-body">'
       +     '<span class="choice-title">' + title + '</span>'
       +     '<span class="choice-text">' + text + '</span>'
       +   '</span>'
       + '</button>';
}

function sheetShell(title, body){
  return '<div class="sheet" data-role="sheet">'
       +   '<div class="sheet-card" role="dialog" aria-modal="true" '
       +     'aria-label="' + title + '">'
       +     '<div class="sheet-head">'
       +       '<h3 class="sheet-title">' + title + '</h3>'
       +       '<button type="button" class="sheet-close" data-act="sheet-close" '
       +         'aria-label="Fermer">' + icon('x') + '</button>'
       +     '</div>'
       +     body
       +   '</div>'
       + '</div>';
}

function screenGfPlayers(){
  ensurePlayers();
  var lines = playerLines();
  var rows = '';
  for(var i=0;i<lines.length;i++) rows += playerRow(lines[i]);

  var sheet = '';
  if(STATE.draft.sheet === 'relatives') sheet = sheetRelatives();
  else if(STATE.draft.sheet === 'guest') sheet = sheetGuest();
  else if(STATE.draft.sheet === 'terms') sheet = sheetTerms();

  var note;
  if(anySelfPaid()){
    note = othersTotal() > 0
      ? 'Vos partenaires règlent ' + amount(othersTotal()) + ' de leur côté.'
      : null;
  } else if(isPassion() && playersTotal() === 0 && optionsTotal() === 0){
    note = 'Votre départ est inclus dans votre abonnement.';
  } else {
    note = 'Chaque joueur porte son propre tarif, la raison est indiquée sous son nom.';
  }

  return ''
    + '<div class="stepbody">'
    +   crumbs('players')
    +   '<h2 class="screen-title">Qui joue ?</h2>'
    +   '<p class="screen-text">Vous êtes joueur 1. Ajoutez vos partenaires depuis '
    +     'vos proches, ou invitez quelqu\'un pour ce départ.</p>'
    +   partyHint()
    +   '<section class="section">'
    +     '<div class="players" data-role="players">' + rows + '</div>'
    +     inviteQuotaLine()
    +     payAllBlock()
    +     addPlayerBlock()
    +   '</section>'
    + '</div>'
    + stepFoot('Votre total', note,
        primaryButton('to-options', 'Choisir les options', false, false))
    + sheet;
}

/* Le nombre de joueurs cherché à l'étape 3 vaut engagement : le rappeler ici
   évite de réserver un départ à quatre places pour un joueur seul. */
function partyHint(){
  var d = STATE.draft;
  var missing = d.party - d.players.length;
  if(missing <= 0) return '';
  return '<p class="hint" data-role="party-hint">' + icon('users')
       + '<span>Vous cherchiez un départ pour <b>' + d.party + ' joueurs</b>. '
       + 'Il en manque ' + (missing > 1 ? missing : 'un') + '.</span></p>';
}

/* Raccourci de reprise en main : il n'apparaît que s'il a un effet, c'est-à-dire
   si au moins un joueur règle sa place lui-même. */
function payAllBlock(){
  if(!anySelfPaid()) return '';
  return '<button type="button" class="addbtn is-quiet" data-act="pay-all">'
       +   icon('wallet') + '<span>Régler pour tout le monde</span>'
       + '</button>';
}

/* --- Étape 6 : les options ----------------------------------------------- */

function optionRow(opt){
  var qty = optionQty(opt.id);
  var included = optionIncluded(opt);
  var max = optionMax();
  var price = included
    ? '<span class="opt-price is-included">Inclus dans votre abonnement</span>'
    : '<span class="opt-price">' + amount(opt.price) + ' par unité</span>';

  return '<div class="opt" data-role="option" data-option="' + opt.id + '">'
       +   '<span class="opt-mark">' + icon(opt.icon) + '</span>'
       +   '<span class="opt-body">'
       +     '<span class="opt-name">' + opt.label + '</span>'
       +     price
       +     '<span class="opt-note">' + opt.note + '</span>'
       +   '</span>'
       +   '<span class="stepper">'
       +     '<button type="button" data-act="opt-less" data-value="' + opt.id + '"'
       +       (qty === 0 ? ' disabled aria-disabled="true"' : '')
       +       ' aria-label="Retirer un ' + opt.label + '">' + icon('minus') + '</button>'
       +     '<span class="stepper-val" data-role="qty">' + qty + '</span>'
       +     '<button type="button" data-act="opt-more" data-value="' + opt.id + '"'
       +       (qty >= max ? ' disabled aria-disabled="true"' : '')
       +       ' aria-label="Ajouter un ' + opt.label + '">' + icon('plus') + '</button>'
       +   '</span>'
       + '</div>';
}

function screenGfOptions(){
  ensurePlayers();
  var rows = '';
  for(var i=0;i<GF_OPTIONS.length;i++) rows += optionRow(GF_OPTIONS[i]);

  var needs = paymentNeeded();
  var button = needs
    ? primaryButton('to-pay', 'Aller au paiement', false, false)
    : primaryButton('book-now', 'Réserver ce départ', false, STATE.draft.paying);

  var note = needs
    ? null
    : 'Votre départ est inclus dans votre abonnement, il n\'y a rien à payer.';

  return ''
    + '<div class="stepbody">'
    +   crumbs('options')
    +   '<h2 class="screen-title">Une option pour ce départ ?</h2>'
    +   '<p class="screen-text">Rien n\'est obligatoire. Ce que vous réservez ici '
    +     'vous attend à l\'accueil du golf.</p>'
    +   '<section class="section">'
    +     '<div class="opts" data-role="options">' + rows + '</div>'
    +   '</section>'
    + '</div>'
    + stepFoot('Total', note, button);
}

/* --- Étape 7 : le paiement ----------------------------------------------- */

/* La mention de tête dit ce qui a déjà été réglé autrement, ou pourquoi le
   solde de crédits ne suffit pas. Elle ne remplace jamais le choix : les deux
   options restent également offertes, aucune n'est présélectionnée. */
function payLead(){
  var plan = creditPlan();
  if(anySelfPaid()){
    var n = selfPaidLines().length;
    return '<p class="paylead" data-role="paylead">' + icon('users')
         + '<span><b>Vous ne réglez pas tout le départ.</b> '
         + (n > 1
            ? n + ' joueurs règlent leur place de leur côté.'
            : 'Un joueur règle sa place de son côté.')
         + '</span></p>';
  }
  if(isPassion()){
    return '<p class="paylead" data-role="paylead">' + icon('infinity')
         + '<span><b>Votre départ est inclus dans votre abonnement.</b> '
         + 'Le reste à payer ne porte que sur vos invités et vos options.</span></p>';
  }
  if(plan.mixed){
    return '<p class="paylead" data-role="paylead">' + icon('ticket')
         + '<span><b>Votre solde ne couvre pas tous les joueurs.</b> '
         + 'Vous pouvez utiliser vos crédits et régler la différence par carte.</span></p>';
  }
  if(plan.balance === 0){
    return '<p class="paylead" data-role="paylead">' + icon('ticket-off')
         + '<span><b>Aucun crédit green-fee disponible.</b> '
         + 'Vous pourrez acheter un carnet depuis votre portefeuille.</span></p>';
  }
  return '';
}

function payChoiceRow(choice){
  var selected = (STATE.draft.payment === choice.id);
  var lines = '';
  if(choice.balanceFrom !== null){
    lines += '<span class="payopt-line">Solde de crédits <b>' + choice.balanceFrom
           + '</b> puis <b>' + choice.balanceTo + '</b> après ce départ.</span>';
  }
  if(choice.id === 'card'){
    lines += '<span class="payopt-line">Carte enregistrée dans votre profil.</span>';
  }

  return '<button type="button" class="payopt' + (selected ? ' is-selected' : '') + '" '
       +   'data-act="pay-pick" data-value="' + choice.id + '" '
       +   'role="radio" aria-checked="' + (selected ? 'true' : 'false') + '">'
       +   '<span class="payopt-mark">' + icon('check') + '</span>'
       +   '<span class="payopt-body">'
       +     '<span class="payopt-title">' + choice.title + '</span>'
       +     lines
       +   '</span>'
       + '</button>';
}

function screenGfPay(){
  var choices = paymentChoices();
  var rows = '';
  for(var i=0;i<choices.length;i++) rows += payChoiceRow(choices[i]);

  var chosen = chosenPayment();
  var note = chosen
    ? null
    : 'Choisissez un mode de règlement pour continuer.';

  return ''
    + '<div class="stepbody">'
    +   crumbs('pay')
    +   '<h2 class="screen-title">Comment souhaitez-vous payer ?</h2>'
    +   payLead()
    +   '<section class="section" data-role="payopts" role="radiogroup" '
    +     'aria-label="Mode de règlement">' + rows + '</section>'
    + '</div>'
    + stepFoot('Total', note,
        primaryButton('book-now', 'Réserver ce départ', !chosen, STATE.draft.paying));
}

/* --- Étape 8 : la confirmation ------------------------------------------- */

function paymentSummary(){
  var choice = chosenPayment();
  if(!choice) return 'Inclus dans votre abonnement';
  if(choice.id === 'card') return amount(choice.cash) + ' par carte';
  if(choice.mixed){
    return creditsLabel(creditPlan().use) + ' et ' + amount(choice.cash) + ' par carte';
  }
  return capitalize(creditsLabel(creditPlan().use));
}

function confirmPlayersLine(){
  var lines = playerLines();
  var names = [];
  for(var i=0;i<lines.length;i++) names.push(playerName(lines[i].player));
  return names.join(', ');
}

/* Les places que le titulaire n'a pas prises en charge. Les taire laisserait
   croire que tout est réglé, et c'est exactement le litige que l'écran doit
   éviter. */
function confirmOthersLine(){
  var lines = selfPaidLines();
  if(!lines.length) return null;
  var out = [];
  for(var i=0;i<lines.length;i++){
    var l = lines[i];
    out.push(playerName(l.player) + ' &middot; ' + amount(l.price)
             + (l.player.member ? ', par notification' : ', à l\'accueil'));
  }
  return out.join('<br>');
}

function confirmOptionsLine(){
  var lines = optionLines();
  if(!lines.length) return 'Aucune';
  var out = [];
  for(var i=0;i<lines.length;i++){
    out.push(lines[i].qty + ' ' + lines[i].option.label.toLowerCase());
  }
  return out.join(', ');
}

function cancelLine(){
  var limit = cancelDeadline();
  if(!limit) return '';
  var text = limit.sameDay
    ? 'Ce départ a lieu aujourd\'hui : l\'annulation en ligne n\'est plus gratuite. '
      + 'Le montant vous serait rendu en crédit.'
    : 'Annulation gratuite jusqu\'au ' + limit.label + ' à 18 h. '
      + 'Passé ce délai, le montant vous est rendu en crédit.';
  return '<p class="cancelnote" data-role="cancel">' + icon('clock-hour-4')
       + '<span>' + text + '</span></p>';
}

function screenGfConfirm(){
  var slot = draftSlot();
  var d = STATE.draft;
  if(!slot) return screenNotFound();

  var done = '';
  if(d.calendarAdded){
    done += '<p class="done">' + icon('calendar-check')
          + '<span>Départ ajouté à votre calendrier.</span></p>';
  }
  if(d.shared){
    done += '<p class="done">' + icon('send')
          + '<span>Récapitulatif envoyé aux joueurs de ce départ.</span></p>';
  }

  return ''
    + '<div class="confirm-mark">' + icon('circle-check') + '</div>'
    + '<h2 class="confirm-title">Réservation confirmée</h2>'
    + '<p class="confirm-ref">Numéro <b>' + (d.reference || makeReference()) + '</b></p>'
    + '<ul class="spec" data-role="confirm-spec">'
    +   '<li>Parcours <b>' + slot.course.name + ', ' + slot.site.name + '</b></li>'
    +   '<li>Date <b>' + capitalize(longDate(d.dayOffset)) + '</b></li>'
    +   '<li>Départ <b>' + slot.time + '</b></li>'
    +   '<li>Joueurs <b>' + confirmPlayersLine() + '</b></li>'
    +   '<li>Options <b>' + confirmOptionsLine() + '</b></li>'
    +   '<li>Vous réglez <b>' + paymentSummary() + '</b></li>'
    +   (confirmOthersLine()
       ? '<li>À régler par eux <b>' + confirmOthersLine() + '</b></li>'
       : '')
    + '</ul>'
    + '<div class="confirm-actions">'
    +   '<button type="button" class="btn is-quiet" data-act="add-calendar">'
    +     icon('calendar-plus') + '<span>Au calendrier</span></button>'
    +   '<button type="button" class="btn is-quiet" data-act="share-booking">'
    +     icon('share') + '<span>Partager</span></button>'
    + '</div>'
    + done
    + cancelLine()
    + '<button type="button" class="btn is-primary" data-act="finish">'
    +   'Revenir à l\'accueil</button>';
}

/* --- Sélections des étapes 5 à 8 ----------------------------------------- */

function openSheet(kind){
  var d = STATE.draft;
  if(kind === 'relatives' && partyFull()) return false;
  d.sheet = kind;
  d.guestError = null;
  refresh();
  return true;
}
function closeSheet(){
  STATE.draft.sheet = null;
  STATE.draft.guestError = null;
  refresh();
  return true;
}

function addRelative(id){
  var d = STATE.draft;
  if(partyFull()) return false;
  if(relativeAdded(id)) return false;
  var list = relativesOf();
  for(var i=0;i<list.length;i++){
    if(list[i].id !== id) continue;
    d.players.push({
      id:list[i].id,
      kind:'relative',
      firstName:list[i].firstName,
      lastName:list[i].lastName,
      licence:!!list[i].licence,
      member:!!list[i].member,
      /* Par défaut on invite tant que le quota le permet, et le titulaire
         règle : c'est le geste le plus courant. Les deux se corrigent d'un
         toucher sur la ligne. */
      invited:inviteAvailableFor(d.players.length),
      payer:'holder'
    });
    d.sheet = null;
    trimOptions();
    refresh();
    return true;
  }
  return false;
}

function setGuestField(name, value){
  if(name !== 'firstName' && name !== 'lastName' && name !== 'licence') return false;
  STATE.draft.guest[name] = value;
  return true;
}

/* Un joueur sans nom ne peut pas être inscrit sur une feuille de départs :
   l'erreur dit quoi corriger, elle ne s'excuse pas. */
function addGuest(){
  var d = STATE.draft;
  var g = d.guest;
  var last = (g.lastName || '').replace(/^\s+|\s+$/g, '');
  var first = (g.firstName || '').replace(/^\s+|\s+$/g, '');
  var lic = (g.licence || '').replace(/^\s+|\s+$/g, '');

  if(!last){
    d.guestError = 'Indiquez le nom de ce joueur : il figure sur la feuille de départs.';
    refresh();
    return false;
  }
  if(partyFull()){
    d.guestError = 'Ce départ est complet. Retirez un joueur pour en ajouter un autre.';
    refresh();
    return false;
  }

  d.players.push({
    id:'guest-' + d.players.length,
    kind:'guest',
    firstName:first || 'Invité',
    lastName:last,
    licence:lic.length > 0,
    /* Un joueur saisi à la main n'a pas de compte au club : il réglera à
       l'accueil s'il règle lui-même. */
    member:false,
    invited:inviteAvailableFor(d.players.length),
    payer:'holder'
  });
  d.guest = { firstName:'', lastName:'', licence:'' };
  d.guestError = null;
  d.sheet = null;
  trimOptions();
  refresh();
  return true;
}

/* Ouvre le réglage d'un joueur : son invitation et qui règle sa place. */
function openTerms(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  if(isNaN(index) || index < 1 || index >= d.players.length) return false;
  d.termsIndex = index;
  d.sheet = 'terms';
  refresh();
  return true;
}

function setInvite(value){
  var d = STATE.draft;
  var p = d.players[d.termsIndex];
  if(!p || !isPassion()) return false;
  var want = (value === 'on');
  if(want && !inviteAvailableFor(d.termsIndex)) return false;
  if(p.invited === want) return false;
  p.invited = want;
  d.payment = null;
  refresh();
  return true;
}

function setPayer(value){
  var d = STATE.draft;
  var p = d.players[d.termsIndex];
  if(!p) return false;
  if(value !== 'holder' && value !== 'self') return false;
  if(p.payer === value) return false;
  p.payer = value;
  d.payment = null;
  refresh();
  return true;
}

/* Reprendre à sa charge toutes les places d'un coup. */
function payForAll(){
  var d = STATE.draft;
  var changed = false;
  for(var i=1;i<d.players.length;i++){
    if(d.players[i].payer === 'self'){ d.players[i].payer = 'holder'; changed = true; }
  }
  if(!changed) return false;
  d.payment = null;
  refresh();
  return true;
}

function dropPlayer(index){
  var d = STATE.draft;
  index = parseInt(index, 10);
  if(isNaN(index) || index < 1 || index >= d.players.length) return false;
  d.players.splice(index, 1);
  trimOptions();
  refresh();
  return true;
}

/* Une quantité d'option ne survit pas au départ du joueur qui la justifiait. */
function trimOptions(){
  var d = STATE.draft;
  var max = optionMax();
  for(var id in d.options){
    if(!Object.prototype.hasOwnProperty.call(d.options, id)) continue;
    if(d.options[id] > max) d.options[id] = max;
  }
  /* Un changement de total invalide un mode de règlement déjà choisi : le
     choix doit rester explicite sur le montant réellement dû. */
  d.payment = null;
}

function setOption(id, delta){
  var d = STATE.draft;
  var known = null;
  for(var i=0;i<GF_OPTIONS.length;i++){ if(GF_OPTIONS[i].id === id) known = GF_OPTIONS[i]; }
  if(!known) return false;
  var next = optionQty(id) + delta;
  if(next < 0 || next > optionMax()) return false;
  d.options[id] = next;
  d.payment = null;
  refresh();
  return true;
}

function choosePayment(id){
  var list = paymentChoices();
  for(var i=0;i<list.length;i++){
    if(list[i].id !== id) continue;
    STATE.draft.payment = id;
    refresh();
    return true;
  }
  return false;
}

/* Le règlement passe par un état d'attente : un paiement instantané ne
   ressemble à rien et masque l'état de chargement que le lot doit couvrir. */
function bookNow(){
  var d = STATE.draft;
  if(d.paying) return false;
  if(paymentNeeded() && !d.payment) return false;
  d.paying = true;
  refresh();
  window.setTimeout(function(){
    d.paying = false;
    d.reference = makeReference();
    navigate('/book/gf/confirm');
  }, PAY_DELAY);
  return true;
}

/* Les deux actions de l'étape 8 n'ont pas de cible dans un prototype. Elles
   rendent compte de ce qu'elles font plutôt que de ne rien faire : un bouton
   sans effet visible se lit comme une panne. */
function addToCalendar(){
  STATE.draft.calendarAdded = true;
  refresh();
  return true;
}
function shareBooking(){
  STATE.draft.shared = true;
  refresh();
  return true;
}

/* Sortir du tunnel : la réservation est faite, le brouillon n'a plus lieu
   d'être. */
function finishBooking(){
  clearDraft();
  selectTab('home');
  return true;
}

/* --- Sélections du tunnel ------------------------------------------------ */

/* Entrer dans le tunnel repart d'un brouillon vide. Le retour arrière, lui,
   conserve les saisies : c'est un critère d'acceptation du brief. */
/* Le site de rattachement est retenu d'avance : c'est le cas courant, et un
   choix déjà fait se corrige plus vite qu'un choix à faire. L'étape 1 reste
   affichée, avec ce site marqué comme retenu — la sauter empêcherait de jouer
   ailleurs, ce que le brief demande précisément de rendre possible. */
/* « Voir les dates » — depuis l'alerte de l'accueil comme depuis la
   notification de travaux. L'écran concerné se pose sur la pile courante : le
   retour ramène d'où l'on vient. */
function openWorksDates(){
  var site = currentSite();
  var closures = site.closures || [];
  if(!closures.length) return false;
  prepareWorks(site, closures[0]);
  navigate('/book/gf/date');
  return true;
}

function startGreenfee(){
  clearDraft();
  STATE.draft.siteCode = STATE.siteCode;
  navigate('/book/gf/site');
  return true;
}

function pickSite(code){
  var known = false;
  for(var i=0;i<SITES.length;i++){ if(SITES[i].code === code) known = true; }
  if(!known) return false;
  var d = STATE.draft;
  if(d.siteCode !== code){
    d.siteCode = code;
    d.courseIndex = null;
    d.dayOffset = null;
    d.slotKey = null;
    d.monthOpen = false;
    d.monthShift = 0;
  }
  navigate('/book/gf/course');
  return true;
}

function pickCourse(index){
  var site = draftSite();
  index = parseInt(index, 10);
  if(!site || isNaN(index) || !site.courses[index]) return false;
  var d = STATE.draft;
  if(d.courseIndex !== index){
    d.courseIndex = index;
    d.dayOffset = null;
    d.slotKey = null;
  }
  navigate('/book/gf/date');
  return true;
}

/* Changer de jour ne quitte pas l'écran : la feuille de départs se refait en
   place, sous la bande de jours. */
function pickDay(offset){
  var site = draftSite();
  offset = parseInt(offset, 10);
  if(!site || isNaN(offset)) return false;
  if(!dayIsOpen(site, STATE.draft.courseIndex, offset)) return false;
  var d = STATE.draft;
  if(d.dayOffset !== offset){
    d.dayOffset = offset;
    d.slotKey = null;
  }
  d.monthOpen = false;
  refresh();
  return true;
}

/* Nombre de joueurs recherché : il filtre la feuille de départs. Un départ
   déjà retenu qui n'a plus assez de places est relâché plutôt que conservé
   en contradiction avec le filtre. */
function setParty(n){
  n = parseInt(n, 10);
  if(isNaN(n) || n < 1 || n > PARTY_MAX) return false;
  var d = STATE.draft;
  if(d.party === n) return false;
  d.party = n;
  if(d.slotKey){
    var slot = draftSlot();
    if(!slot || slot.seats < n) d.slotKey = null;
  }
  refresh();
  return true;
}

function pickSlot(key){
  var d = STATE.draft;
  if(d.siteCode === null || d.courseIndex === null || d.dayOffset === null) return false;
  d.slotKey = key;
  navigate('/book/gf/players');
  return true;
}

function toggleMonth(){
  STATE.draft.monthOpen = !STATE.draft.monthOpen;
  refresh();
  return STATE.draft.monthOpen;
}
function shiftMonth(delta){
  var next = STATE.draft.monthShift + delta;
  if(next < 0 || next > 3) return false;
  STATE.draft.monthShift = next;
  refresh();
  return true;
}

function tabIcon(id){
  for(var i=0;i<TABS.length;i++){ if(TABS[i].id === id) return TABS[i].icon; }
  return 'home';
}
function tabRoot(id){
  for(var i=0;i<TABS.length;i++){ if(TABS[i].id === id) return TABS[i].root; }
  return '/home';
}

/* =========================================================================
   6e. Réservation de cours — lot 3
   ========================================================================= */

/* Élision devant un prénom : « le planning de Élise » est une faute que le
   lot 1 avait déjà rencontrée sur les noms de sites. La forme correcte se
   calcule, elle ne se recopie pas dans chaque libellé. */
function dePrenom(name){
  return /^[aeiouyàâäéèêëîïôöûü]/i.test(name.charAt(0))
    ? 'd\'' + name
    : 'de ' + name;
}

/* Portrait de pro : même principe que le placeholder de parcours du lot 1 —
   dégradé sourd aux couleurs des tokens, aucune image externe. La silhouette
   reste abstraite, elle ne prétend pas être une photo. */
function proPhoto(key){
  var lift = 6 + Math.floor(draw('face' + key) * 10);
  return ''
    + '<svg class="photo is-pro" viewBox="0 0 92 120" preserveAspectRatio="none" '
    +   'role="img" aria-label="Portrait stylisé">'
    +   '<defs><linearGradient id="pro-sky-' + key + '" x1="0" y1="0" x2="0" y2="1">'
    +     '<stop offset="0" class="sky"></stop><stop offset="1" class="dusk"></stop>'
    +   '</linearGradient></defs>'
    +   '<rect width="92" height="120" fill="url(#pro-sky-' + key + ')"></rect>'
    +   '<circle class="figure" cx="46" cy="' + (44 + lift) + '" r="17"></circle>'
    +   '<path class="figure" d="M46 ' + (68 + lift)
    +     ' C 22 ' + (68 + lift) + ', 12 ' + (92 + lift) + ', 10 120 L82 120 '
    +     'C 80 ' + (92 + lift) + ', 70 ' + (68 + lift) + ', 46 ' + (68 + lift) + ' Z">'
    +   '</path>'
    + '</svg>';
}

/* Fil des choix du tunnel de cours. Mêmes règles qu'au green-fee : un maillon
   qui n'a rien à rouvrir n'est pas un bouton. */
function lessonCrumbs(step){
  var l = STATE.lesson;
  var links = [];

  if(l.mode === 'solo'){
    var pro = proById(l.proId);
    if(pro) links.push({ label:proName(pro), to:'/book/lessons/pro', icon:'user-check' });
    if(step !== 'when' && l.slotKey){
      links.push({ label:shortDate(l.dayOffset), to:'/book/lessons/when', icon:'calendar' });
      links.push({ label:hhmm(parseInt(l.slotKey.split('-')[1], 10)),
                   to:'/book/lessons/when', icon:'clock' });
    }
  } else if(l.mode === 'group'){
    var picked = pickedLesson();
    links.push({ label:'Cours collectif', to:'/book/lessons/group', icon:'users' });
    if(picked){
      links.push({ label:picked.title, to:'/book/lessons/group', icon:'target' });
      links.push({ label:picked.time || hhmm(picked.minutes),
                   to:'/book/lessons/group', icon:'clock' });
    }
  }
  if(!links.length) return '';

  var html = '<nav class="crumbs" data-role="lesson-crumbs" aria-label="Vos choix">';
  for(var i=0;i<links.length;i++){
    var c = links[i];
    html += '<button type="button" class="crumb" data-backto="' + c.to + '" '
          + 'aria-label="Revenir au choix : ' + c.label + '">'
          + icon(c.icon) + '<span>' + c.label + '</span></button>';
  }
  return html + '</nav>';
}

/* --- Entrée : les deux portes du lot 3 ----------------------------------- */

function lessonRow(booking){
  var date = dateAt(booking.offset);
  var cancelled = lessonIsCancelled(booking);
  var past = lessonIsPast(booking);

  var chip;
  if(cancelled) chip = '<span class="chip is-void">Annulé</span>';
  else if(past && booking.debrief) chip = '<span class="chip is-gold">Debrief</span>';
  else if(past) chip = '<span class="chip is-quiet">Terminé</span>';
  else chip = '<span class="chip is-gold">À venir</span>';

  return '<button type="button" class="lesson" data-act="lesson-open" '
       +   'data-value="' + booking.id + '" '
       +   'aria-label="' + booking.title + ', ' + longDate(booking.offset)
       +   ', ' + hhmm(booking.minutes) + '">'
       +   '<span class="lesson-date">'
       +     '<span class="lesson-day">' + date.getDate() + '</span>'
       +     '<span class="lesson-month">' + MOIS_COURT[date.getMonth()] + '</span>'
       +   '</span>'
       +   '<span class="lesson-body">'
       +     '<span class="lesson-title">' + booking.title + '</span>'
       +     '<span class="lesson-meta">' + hhmm(booking.minutes) + ' &middot; '
       +       minutesLabel(booking.duration) + ' &middot; ' + proName(booking.pro)
       +     '</span>'
       +   '</span>'
       +   '<span class="lesson-side">' + chip
       +     '<i class="ti ti-chevron-right lesson-chevron" aria-hidden="true"></i>'
       +   '</span>'
       + '</button>';
}

    +     '<span class="pick-body">'
    +       '<span class="pick-title">Un cours collectif</span>'

/* --- Cours particulier, étape 1 : le pro --------------------------------- */

function proCard(pro, selected){

function screenLessonPro(){

/* --- Calendrier des cours ------------------------------------------------ */

/* Le brief demande le planning du pro « en vue calendrier, pas en liste ».
   La grille est donc toujours ouverte, et les jours qui ont encore quelque
   chose à proposer portent une pastille. `hasDay` dit ce qu'une pastille
   signifie : un créneau libre pour un pro, une séance pour un collectif. */
function lessonMonth(hasDay){
  var l = STATE.lesson;
  var base = startOfToday();
  var first = new Date(base.getFullYear(), base.getMonth() + l.monthShift, 1);
  var lead = (first.getDay() + 6) % 7;
  var count = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();

  var html = '<div class="month" data-role="lesson-month">'
    + '<div class="month-head">'
    +   '<button type="button" class="month-nav" data-act="lmonth-prev"'
    +     (l.monthShift <= 0 ? ' disabled' : '') + ' aria-label="Mois précédent">'
    +     icon('chevron-left') + '</button>'
    +   '<p class="month-title">' + capitalize(MOIS[first.getMonth()].toLowerCase())
    +     ' ' + first.getFullYear() + '</p>'
    +   '<button type="button" class="month-nav" data-act="lmonth-next"'
    +     (l.monthShift >= 3 ? ' disabled' : '') + ' aria-label="Mois suivant">'
    +     icon('chevron-right') + '</button>'
    + '</div>'
    + '<div class="month-grid">';

  for(var w=0;w<7;w++){ html += '<span class="month-dow">' + DOW_LUNDI[w] + '</span>'; }
  for(var v=0;v<lead;v++){ html += '<span class="month-cell is-void"></span>'; }

  for(var n=1;n<=count;n++){
    var date = new Date(first.getFullYear(), first.getMonth(), n);
    var offset = offsetOf(date);
    var open = hasDay(offset);
    html += '<button type="button" class="month-cell'
          +   (l.dayOffset === offset ? ' is-selected' : '') + '" '
          +   'data-pick="lday" data-value="' + offset + '"'
          +   (open ? '' : ' disabled aria-disabled="true"')
          +   ' aria-label="' + longDate(offset)
          +   (open ? ', des séances ce jour-là' : ', aucune séance') + '">'
          +   n
          +   (open ? '<span class="month-dot"></span>' : '')
          + '</button>';
  }
  return html + '</div></div>';
}

/* --- Cours particulier, étape 2 : la durée et le planning ---------------- */

/* La durée se choisit avant le créneau, et non après comme le laisse lire
   l'ordre du brief : c'est elle qui détermine ce que le planning peut
   proposer. Une heure demande deux demi-heures contiguës — présenter des
   créneaux avant de savoir la durée les rendrait faux. */
function durationPicker(pro){
  var l = STATE.lesson;
  var html = '<div class="durations" role="radiogroup" aria-label="Durée du cours">';
  for(var i=0;i<LESSON_DURATIONS.length;i++){
    var dur = LESSON_DURATIONS[i];
    var on = (l.durationId === dur.id);
    html += '<button type="button" class="duration' + (on ? ' is-on' : '') + '" '
          +   'data-act="duration" data-value="' + dur.id + '" '
          +   'role="radio" aria-checked="' + (on ? 'true' : 'false') + '" '
          +   'aria-label="' + dur.label + ', ' + proRate(pro, dur.id) + ' euros">'
          +   '<span class="duration-label">' + dur.label + '</span>'
          +   '<span class="duration-price">' + amount(proRate(pro, dur.id)) + '</span>'
          + '</button>';
  }
  return html + '</div>';
}

function lessonSlotRow(slot, dur, selected){
  return '<button type="button" class="slot' + (selected ? ' is-selected' : '') + '" '
       +   'data-pick="lslot" data-value="' + slot.key + '" '
       +   'aria-label="' + slot.time + ', ' + dur.label + '">'
       +   '<span class="slot-time">' + slot.time + '</span>'
       +   '<span class="slot-tags"></span>'
       +   '<span class="slot-left">jusqu\'à '
       +     hhmm(slot.minutes + dur.minutes) + '</span>'
       + '</button>';
}

function screenLessonWhen(){
  var l = STATE.lesson;
  var pro = proById(l.proId);
  var dur = durationById(l.durationId);
  if(!pro) return screenNotFound();

  var slots = proSlots(pro, l.dayOffset, l.durationId);
  var groups = '';
  for(var b=0;b<LESSON_BLOCKS.length;b++){
    var block = LESSON_BLOCKS[b];
    var rows = '';
    for(var i=0;i<slots.length;i++){
      if(slots[i].block !== block.id) continue;
      rows += lessonSlotRow(slots[i], dur, l.slotKey === slots[i].key);
    }
    if(!rows) continue;
    groups += '<section class="slot-group" data-role="lesson-slot-group">'
            +   '<h3 class="slot-group-head">' + block.label + '</h3>'
            +   '<div class="slots" data-role="lesson-slots">' + rows + '</div>'
            + '</section>';
  }

  var body = groups
    ? groups + '<p class="slots-foot">Le tarif ne dépend pas de l\'heure : '
      + 'il est celui de la durée choisie.</p>'
    : '<div class="stepempty" data-role="when-empty">'
      +   '<h3 class="screen-title">Aucun créneau ce jour-là</h3>'
      +   '<p class="screen-text">Le planning ' + dePrenom(pro.firstName)
      +     ' est pris pour ' + dur.label + '. Les jours marqués d\'une pastille '
      +     'ont encore des créneaux.</p>'
      + '</div>';

  return ''
    + lessonCrumbs('when')
    + '<h2 class="screen-title">Quand souhaitez-vous ce cours ?</h2>'
    + '<section class="section">'
    +   '<p class="eyebrow">Durée</p>'
    +   durationPicker(pro)
    + '</section>'
    + '<section class="section">'
    +   '<p class="eyebrow">Le planning ' + dePrenom(pro.firstName) + '</p>'
    +   lessonMonth(function(offset){ return proDayHasSlots(pro, offset, l.durationId); })
    + '</section>'
    + '<section class="section" data-role="lesson-tee">'
    +   '<h3 class="tee-head">' + capitalize(longDate(l.dayOffset)) + '</h3>'
    +   body
    + '</section>';
}

/* --- Cours collectif : calendrier, filtres, liste du jour ---------------- */

function filterPill(kind, label, on, iconName){
  return '<button type="button" class="filter' + (on ? ' is-on' : '') + '" '
       +   'data-act="filter-open" data-value="' + kind + '" '
       +   'aria-label="Filtre : ' + label + '">'
       +   icon(iconName) + '<span>' + label + '</span>'
       + '</button>';
}

function filterBar(){
  var l = STATE.lesson;
  var site = currentSite();
  var proLabel = 'Tous les pros';
  if(l.filterPro !== 'all'){
    var pro = proById(l.filterPro);
    if(pro) proLabel = proName(pro);
  }
  var themeLabel = 'Tous les thèmes';
  if(l.filterTheme !== 'all'){
    for(var i=0;i<GROUP_THEMES.length;i++){
      if(GROUP_THEMES[i].id === l.filterTheme) themeLabel = GROUP_THEMES[i].label;
    }
  }
  var whenLabel = 'Toute la journée';
  if(l.filterWhen === 'am') whenLabel = 'Matin';
  if(l.filterWhen === 'pm') whenLabel = 'Après-midi';

  return '<div class="filters" data-role="filters">'
       +   filterPill('pro', proLabel, l.filterPro !== 'all', 'user-check')
       +   filterPill('theme', themeLabel, l.filterTheme !== 'all', 'target')
       +   filterPill('when', whenLabel, l.filterWhen !== 'all', 'clock')
       + '</div>';
}

/* Une séance complète reste visible et grisée, comme le demande le brief.
   Elle n'est plus réservable, mais elle porte une demande d'alerte : la
   mécanique de liste d'attente n'est pas spécifiée, le prototype se borne à
   enregistrer la demande et à en rendre compte. */
function sessionRow(session, selected){
  var meta = minutesLabel(session.theme.minutes) + ' &middot; ' + proName(session.pro);
  var side = '<span class="sess-side">'
           +   '<span class="sess-price">' + amount(session.price) + '</span>'
           +   '<span class="sess-seats">' + groupSeatsLabel(session.seats) + '</span>'
           + '</span>';
  var body = '<span class="sess-body">'
           +   '<span class="sess-name">' + session.theme.label + '</span>'
           +   '<span class="sess-meta">' + meta + '</span>'
           + '</span>';

  if(session.seats === 0){
    var asked = !!STATE.lesson.waitlist[session.id];
    return '<div class="sess is-full" data-role="session" '
         +   'data-value="' + session.id + '">'
         +   '<div class="sess-head">'
         +     '<span class="sess-time">' + session.time + '</span>'
         +     body
         +     side
         +   '</div>'
         +   '<button type="button" class="sess-wait" data-act="waitlist" '
         +     'data-value="' + session.id + '"'
         +     (asked ? ' disabled aria-disabled="true"' : '') + '>'
         +     icon(asked ? 'check' : 'bell')
         +     '<span>' + (asked
                ? 'Vous serez prévenu si une place se libère'
                : 'Prévenez-moi si une place se libère') + '</span>'
         +   '</button>'
         + '</div>';
  }

  return '<button type="button" class="sess' + (selected ? ' is-selected' : '') + '" '
       +   'data-pick="session" data-value="' + session.id + '" '
       +   'data-role="session" '
       +   'aria-label="' + session.theme.label + ', ' + session.time + ', '
       +   groupSeatsLabel(session.seats) + ', ' + session.price + ' euros">'
       +   '<span class="sess-time">' + session.time + '</span>'
       +   body
       +   side
       + '</button>';
}

function screenLessonGroup(){
  var l = STATE.lesson;
  var site = currentSite();
  var list = filteredSessions(site, l.dayOffset);

  var rows = '';
  for(var i=0;i<list.length;i++){
    rows += sessionRow(list[i], l.sessionId === list[i].id);
  }

  var body;
  if(rows){
    body = '<div class="sessions" data-role="sessions">' + rows + '</div>'
         + '<p class="slots-foot">Le nombre de places restantes est indiqué, '
         +   'jamais les noms des inscrits.</p>';
  } else if(anyFilterOn()){
    body = '<div class="stepempty" data-role="group-empty">'
         +   '<h3 class="screen-title">Aucun cours ne correspond</h3>'
         +   '<p class="screen-text">Vos filtres ne laissent rien passer ce '
         +     'jour-là. Retirez-en un pour voir le reste de la journée.</p>'
         +   '<button type="button" class="btn is-primary" data-act="filters-clear">'
         +     'Retirer les filtres</button>'
         + '</div>';
  } else {
    body = '<div class="stepempty" data-role="group-empty">'
         +   '<h3 class="screen-title">Aucun cours ce jour-là</h3>'
         +   '<p class="screen-text">Les jours marqués d\'une pastille portent '
         +     'des séances collectives.</p>'
         + '</div>';
  }

  return ''
    + '<h2 class="screen-title">Les cours collectifs</h2>'
    + '<p class="screen-text">Des séances à thème, en petit groupe, encadrées '
    +   'par les pros du golf.</p>'
    + '<section class="section">'
    +   lessonMonth(function(offset){ return dayHasGroup(site, offset); })
    + '</section>'
    + '<section class="section" data-role="group-day">'
    +   '<h3 class="tee-head">' + capitalize(longDate(l.dayOffset)) + '</h3>'
    +   filterBar()
    +   body
    + '</section>'
    + lessonSheet();

/* --- Feuilles de filtre et d'annulation ---------------------------------- */

function filterSheet(kind){
  var l = STATE.lesson;
  var site = currentSite();
  var body = '';
  var title = '';
  var i;

  if(kind === 'pro'){
    title = 'Filtrer par pro';
    var team = prosOfSite(site);
    body += choiceRow('filter-pro', 'all', l.filterPro === 'all',
              'Tous les pros', 'Aucun filtre sur l\'encadrement.', false);
    for(i=0;i<team.length;i++){
      body += choiceRow('filter-pro', team[i].id, l.filterPro === team[i].id,
                proName(team[i]), team[i].tags.join(', '), false);
    }
  } else if(kind === 'theme'){
    title = 'Filtrer par thème';
    body += choiceRow('filter-theme', 'all', l.filterTheme === 'all',
              'Tous les thèmes', 'Aucun filtre sur le contenu.', false);
    for(i=0;i<GROUP_THEMES.length;i++){
      body += choiceRow('filter-theme', GROUP_THEMES[i].id,
                l.filterTheme === GROUP_THEMES[i].id,
                GROUP_THEMES[i].label,
                minutesLabel(GROUP_THEMES[i].minutes) + ', '
                  + amount(GROUP_THEMES[i].price), false);
    }
  } else {
    title = 'Filtrer par période';
    body += choiceRow('filter-when', 'all', l.filterWhen === 'all',
              'Toute la journée', 'Aucun filtre sur l\'horaire.', false);
    body += choiceRow('filter-when', 'am', l.filterWhen === 'am',
              'Matin', 'Les séances qui commencent avant 13 h.', false);
    body += choiceRow('filter-when', 'pm', l.filterWhen === 'pm',
              'Après-midi', 'Les séances qui commencent après 13 h.', false);
  }

  return sheetShell(title,
      '<div class="choicegroup" role="radiogroup" aria-label="' + title + '">'
    +   body
    + '</div>'
    + '<button type="button" class="btn is-primary" data-act="lesson-sheet-close">'
    +   'Terminer</button>');
}

/* La feuille ne redit pas le délai : le rappel est écrit juste au-dessus,
   sur l'écran. Elle dit ce que le geste produit, c'est-à-dire le sort du
   montant — décision 5 du brief. */
function cancelSheet(booking){
  return sheetShell('Annuler ce cours',
      '<p class="sheet-lead">' + lessonRefundText(booking) + '</p>'
    + '<button type="button" class="btn is-primary" data-act="lesson-sheet-close">'
    +   'Garder ce cours</button>'
    + '<button type="button" class="btn is-danger" data-act="lesson-cancel">'
    +   'Annuler ce cours</button>');
}

function lessonSheet(){
  var l = STATE.lesson;
  if(l.sheet === 'pro' || l.sheet === 'theme' || l.sheet === 'when'){
    return filterSheet(l.sheet);
  }
  if(l.sheet === 'cancel'){
    var booking = lessonBookingById(l.openId);
    return booking ? cancelSheet(booking) : '';
  }
  return '';
}

/* --- Le paiement --------------------------------------------------------- */

/* Même pied que les étapes à total du green-fee, sur le montant du cours.
   Aucun écran ne compose son propre total : il vient de lessonTotal(). */
function lessonFoot(note, button){
  var total = lessonTotal();
  return '<div class="stepfoot" data-role="stepfoot">'
       +   '<p class="total">'
       +     '<span class="total-label">Total</span>'
       +     '<span class="total-value" data-role="total">' + amount(total) + '</span>'
       +   '</p>'
       +   (note ? '<p class="total-note">' + note + '</p>' : '')
       +   button
       + '</div>';
}

/* La mention de tête dit pourquoi le carnet n'est pas proposé, quand il ne
   l'est pas. Elle ne remplace jamais un choix : la carte reste offerte, et
   rien n'est présélectionné. */
function lessonPayLead(){
  var plan = lessonCreditPlan();
  if(plan.covers) return '';
  if(plan.balance <= 0){
    return '<p class="paylead" data-role="lesson-paylead">' + icon('ticket-off')
         + '<span><b>Aucun crédit de cours disponible.</b> '
         + 'Vous pourrez acheter un carnet depuis votre portefeuille.</span></p>';
  }
  return '<p class="paylead" data-role="lesson-paylead">' + icon('ticket')
       + '<span><b>Votre carnet ne couvre pas cette séance.</b> '
       + 'Il vous reste ' + hoursLabel(plan.balance) + ', cette séance en demande '
       + hoursLabel(plan.need) + '.</span></p>';
}

function lessonPayRow(choice){
  var selected = (STATE.lesson.payment === choice.id);
  var lines = '';
  if(choice.balanceFrom !== null){
    lines += '<span class="payopt-line">Carnet de cours <b>'
           + hoursLabel(choice.balanceFrom) + '</b> puis <b>'
           + hoursLabel(choice.balanceTo) + '</b> après cette séance.</span>';
  } else {
    lines += '<span class="payopt-line">Carte enregistrée dans votre profil.</span>';
  }
  return '<button type="button" class="payopt' + (selected ? ' is-selected' : '') + '" '
       +   'data-act="lesson-pay-pick" data-value="' + choice.id + '" '
       +   'role="radio" aria-checked="' + (selected ? 'true' : 'false') + '">'
       +   '<span class="payopt-mark">' + icon('check') + '</span>'
       +   '<span class="payopt-body">'
       +     '<span class="payopt-title">' + choice.title + '</span>'
       +     lines
       +   '</span>'
       + '</button>';
}

function screenLessonPay(){
  var choices = lessonPaymentChoices();
  var rows = '';
  for(var i=0;i<choices.length;i++) rows += lessonPayRow(choices[i]);

  var chosen = chosenLessonPayment();
  var note = chosen ? null : 'Choisissez un mode de règlement pour continuer.';

  return ''
    + '<div class="stepbody">'
    +   lessonCrumbs('pay')
    +   '<h2 class="screen-title">Comment souhaitez-vous payer ?</h2>'
    +   lessonPayLead()
    +   '<section class="section" data-role="lesson-payopts" role="radiogroup" '
    +     'aria-label="Mode de règlement">' + rows + '</section>'
    + '</div>'
    + lessonFoot(note,
        '<button type="button" class="btn is-primary'
        + (STATE.lesson.paying ? ' is-busy' : '') + '" data-act="lesson-book"'
        + ((!chosen || STATE.lesson.paying) ? ' disabled aria-disabled="true"' : '')
        + (STATE.lesson.paying ? ' aria-busy="true"' : '') + '>'
        + (STATE.lesson.paying
           ? icon('loader-2') + '<span>Traitement en cours</span>'
           : 'Réserver ce cours')
        + '</button>');
}

/* --- La confirmation ----------------------------------------------------- */

  var done = '';

    +   (l.reference || makeLessonReference()) + '</b></p>'
    + '<ul class="spec" data-role="lesson-confirm-spec">'
    +   '<li>Cours <b>' + picked.title + '</b></li>'
    +   '<li>Pro <b>' + proName(picked.pro) + '</b></li>'
    +   '<li>Lieu <b>' + lessonPlace(picked.site, picked.theme) + '</b></li>'
    +   '<li>Date <b>' + capitalize(longDate(picked.offset)) + '</b></li>'
    +   '<li>Horaire <b>' + hhmm(picked.minutes) + '</b></li>'
    +   '<li>Durée <b>' + minutesLabel(picked.duration) + '</b></li>'
    +   '<li>Vous réglez <b>' + lessonPaymentSummary() + '</b></li>'
    + '</ul>'
    + '<div class="confirm-actions">'
    +   '<button type="button" class="btn is-quiet" data-act="lesson-calendar">'
    +     icon('calendar-plus') + '<span>Au calendrier</span></button>'
    +   '<button type="button" class="btn is-quiet" data-act="lesson-share">'
    +     icon('share') + '<span>Partager</span></button>'
    + '</div>'

    + '<p class="cancelnote" data-role="lesson-cancelnote">' + icon('clock-hour-4')

    + '<button type="button" class="btn is-primary" data-act="lesson-finish">'
